olor":"w","pct":4},{"name":"Black varieties","color":"r","pct":1}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["North-west coast of Spain; maritime, warm summers, mild winters, very high rainfall ~1,700 mm.","Altitude 100–300 m; free-draining granitic soils with sand and alluvial topsoils.","Hazards: fungal disease and rain before harvest. Five subzones (e.g. Val do Salnés — coolest/wettest; O Rosal & Condado do Tea — warmer)."],"kkps":[{"id":"RIAS-BAIXAS-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Albariño (>95%) — its thick skins resist rot in the humid, rainy Atlantic conditions."},{"id":"RIAS-BAIXAS-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"It lifts the canopy high off the ground to improve air circulation and reduce fungal disease in the wet climate; granite posts support it."},{"id":"RIAS-BAIXAS-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"About 1,700 mm a year — fungal disease and rain before harvest are the key threats."}],"checks":[{"kp":"RIAS-BAIXAS-F01","type":"flash","question":"What grape dominates Rías Baixas and why does it suit the damp climate?","answer":"Albariño (>95%) — its thick skins resist rot in the humid, rainy Atlantic conditions."},{"kp":"RIAS-BAIXAS-F02","type":"flash","question":"Why is the pergola (parral) used in Rías Baixas?","answer":"It lifts the canopy high off the ground to improve air circulation and reduce fungal disease in the wet climate; granite posts support it."},{"kp":"RIAS-BAIXAS-F03","type":"flash","question":"How much rain does Rías Baixas receive and what is the main hazard?","answer":"About 1,700 mm a year — fungal disease and rain before harvest are the key threats."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Albariño (>95%): thick-skinned (resists rot), high acidity, citrus/stone fruit/peach, often floral; usually single-varietal with an affinity for lees.","Blending grapes: Loureira (aromatic, high acid), Treixadura (apple/peach, low acid), Caiño Blanco (high acid).","'Smells like Viognier, tastes like Sauvignon Blanc.'"],"kkps":[{"id":"RIAS-BAIXAS-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Valdeorras (Godello) and Ribeira Sacra (Mencía)."},{"id":"RIAS-BAIXAS-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Cool, wet Atlantic maritime climate → thick-skinned Albariño ripens while resisting rot and keeping high acidity → fresh, aromatic, saline whites of stone fruit and citrus.","chain":{"factor":"Cool, wet Atlantic maritime","mechanism":"Thick skins resist rot; acidity kept","effect":"High acidity, aromatic","style":"Fresh, saline Albariño"}}],"checks":[{"kp":"RIAS-BAIXAS-F04","type":"flash","question":"Name two Galician DOs known for Godello and Mencía respectively.","answer":"Valdeorras (Godello) and Ribeira Sacra (Mencía)."},{"kp":"RIAS-BAIXAS-CG1","type":"explain","prompt":"Explain how the climate of Rías Baixas shapes the characteristics of its signature grape(s).","requiredPoints":["Cool, wet Atlantic maritime","Thick skins resist rot; acidity kept","High acidity, aromatic","Fresh, saline Albariño"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Traditional pergola (parral) with granite posts lifts the canopy for air circulation in the humid climate.","Larger growers increasingly use VSP for mechanisation.","Yield ~53 hL/ha.","Protective winemaking to keep fresh fruit; brief maceration for flavour/texture; cool ferment in steel.","Lees ageing 1–2 years for premium wines (unstirred, to avoid oxygen) adds body and light creaminess.","A few producers ferment top wines in oak; partial MLF only in cool years/coolest subzones."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Rías Baixas DO is Galicia's largest; co-ops important (Martín Códax the biggest).","Other Galician DOs: Ribeiro (Treixadura), Ribeira Sacra (Mencía), Valdeorras (Godello), Monterrei.","Indigenous-variety incentives in the 1970s–80s transformed quality from high-yield Palomino."],"kkps":[],"checks":[]}],"blind":[{"id":"RIA-BLIND","tastingProfile":"Pale lemon. Pronounced peach, apricot, citrus, white blossom, saline. Dry, high acidity, medium alcohol, medium body, unoaked.","deduce":["Grape: Albariño","Climate: cool, wet maritime","Region: Rías Baixas"],"justifyWith":["Stone fruit + saline + high acid + body → Albariño","Cool wet Atlantic, unoaked, fresh → Rías Baixas (Green Spain)","More body/texture than Sauvignon, no green/grassy → Albariño not SB"]}],"quiz":[{"id":"rias-baixas-Q1","kp":"RIAS-BAIXAS-F01","question":"Which grape makes up over 95% of plantings in Rías Baixas?","correctAnswer":"Albariño","distractors":["Godello","Verdejo","Mencía"]},{"id":"rias-baixas-Q2","kp":"RIAS-BAIXAS-F02","question":"Why is the pergola (parra) vine-training system used in Rías Baixas?","correctAnswer":"It lifts the canopy high to improve air circulation and reduce fungal disease in the wet climate","distractors":["It concentrates heat at ground level to ripen grapes faster","It restricts yields on poor slate soils","It protects buds from spring frost"]},{"id":"rias-baixas-Q3","kp":"RIAS-BAIXAS-CG1","question":"What style of wine does Rías Baixas' cool, wet Atlantic climate produce?","correctAnswer":"Fresh, aromatic, saline whites of stone fruit and citrus with high acidity","distractors":["Full-bodied, oaky reds with high tannin","Sweet, botrytised dessert wines","Oxidative, nutty whites aged under flor"]},{"id":"rias-baixas-Q4","kp":"RIAS-BAIXAS-F04","question":"Which neighbouring Galician region is known for Mencía?","correctAnswer":"Ribeira Sacra","distractors":["Rueda","Toro","Priorat"]}]},{"id":"priorat","title":"Priorat","alt":"DOQ · Llicorella slate","country":"Spain","flag":"🇪🇸","blurb":"Catalan amphitheatre of steep costers and black-red llicorella slate. Old-vine Garnacha and Cariñena giving concentrated, age-worthy reds.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Warm continental + Mediterranean","scores":{"warmth":4,"sun":4,"rain":2,"diurnal":4,"risk":3}},"style":{"red":93,"white":5,"rose":2},"grapes":[{"name":"Garnacha","color":"r","pct":37},{"name":"Cariñena","color":"r","pct":27},{"name":"Cabernet Sauvignon / Syrah / Merlot","color":"r","pct":29},{"name":"Garnacha Blanca / Macabeo","color":"w","pct":7}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Inland Catalunya; warm continental with Mediterranean influence, hot dry summers, cold winters, big diurnal range.","Altitude 100–750 m; sheltered by Serra de Montsant (north) and Serra de Llaberia (south).","Steep slopes (costers) 5–60% gradient; soil is llicorella — heat-reflective red-black slate with quartzite, low in nutrients."],"kkps":[{"id":"PRIORAT-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"A red-black slate with quartzite — heat-reflective and heat-retentive but low in nutrients; it forces low yields and helps ripen Garnacha and Cariñena."},{"id":"PRIORAT-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Often just 5–6 hL/ha — steep, poor, dry slate slopes with old bush vines and little water severely limit production."}],"checks":[{"kp":"PRIORAT-F01","type":"flash","question":"What is llicorella and why does it matter in Priorat?","answer":"A red-black slate with quartzite — heat-reflective and heat-retentive but low in nutrients; it forces low yields and helps ripen Garnacha and Cariñena."},{"kp":"PRIORAT-F02","type":"flash","question":"Roughly what yields does Priorat achieve and why so low?","answer":"Often just 5–6 hL/ha — steep, poor, dry slate slopes with old bush vines and little water severely limit production."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Garnacha (37%) and Cariñena (27%) — both suited to hot, dry conditions; old vines give concentration.","Cabernet Sauvignon, Syrah and Merlot make up much of the rest (trend now falling).","Whites (Garnacha Blanca, Macabeo) are a small share."],"kkps":[{"id":"PRIORAT-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Garnacha (~37%) and Cariñena (~27%), largely from old vines."},{"id":"PRIORAT-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Hot, dry climate with heat-radiating llicorella slate → deep-rooted old-vine Garnacha and Cariñena ripen to high sugar → concentrated, powerful, mineral reds with high alcohol.","chain":{"factor":"Hot, dry; llicorella slate","mechanism":"High sugar; deep roots find water","effect":"High alcohol, concentration","style":"Powerful, mineral old-vine reds"}}],"checks":[{"kp":"PRIORAT-F03","type":"flash","question":"Which two grapes form the backbone of Priorat?","answer":"Garnacha (~37%) and Cariñena (~27%), largely from old vines."},{"kp":"PRIORAT-CG1","type":"explain","prompt":"Explain how the climate of Priorat shapes the characteristics of its signature grape(s).","requiredPoints":["Hot, dry; llicorella slate","High sugar; deep roots find water","High alcohol, concentration","Powerful, mineral old-vine reds"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Low-density bush vines; new plots VSP where terrain allows; terracing reduces erosion.","Tiny yields — averages of 5–6 hL/ha (max 39 hL/ha); irrigation only in driest years/new vines.","Revived from the 1990s by René Barbier's group blending French varieties with local Garnacha/Cariñena.","Ranges from very traditional (basket presses, large oak) to modern (optical sorting, steel).","Maturation typically in French oak for 1–2 years.","Alcohol often 14.5%+; in top wines balanced by concentrated, ripe (not jammy) fruit with medium+ acidity."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Promoted from DO to DOQ in 2009 (one of two top-tier regions with Rioja).","Quality pyramid: Vi de Vila (12 subzones) → Vi de Paratge (named site) → Vinya Classificada → Gran Vinya Classificada.","Classified wines require ≥7 yrs ownership and meet minimum Garnacha/Cariñena %, vine age and yields."],"kkps":[{"id":"PRIORAT-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Vi de Vila → Vi de Paratge → Vinya Classificada → Gran Vinya Classificada."},{"id":"PRIORAT-R05","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Quality pyramid: Vi de Vila (12 subzones) → Vi de Paratge (named site) → Vinya Classificada → Gran Vinya Classificada."}],"checks":[{"kp":"PRIORAT-F04","type":"flash","question":"Name the four-tier classification of Priorat from broad to top.","answer":"Vi de Vila → Vi de Paratge → Vinya Classificada → Gran Vinya Classificada."},{"kp":"PRIORAT-R05","type":"explain","prompt":"Starting from “Quality pyramid: Vi de Vila (12 subzones)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Vi de Paratge (named site)","Vinya Classificada","Gran Vinya Classificada"]}]}],"blind":[{"id":"PRI-BLIND","tastingProfile":"Deep ruby-black. Pronounced black fruit, liquorice, mineral/crushed rock, dark chocolate, oak. Dry, medium(+) acidity, high firm tannin, high alcohol (~15%), full body.","deduce":["Grapes: Garnacha & Cariñena","Soil: llicorella slate","Region: Priorat"],"justifyWith":["Powerful black fruit + crushed-rock minerality → old-vine Garnacha/Cariñena on llicorella","Very high alcohol, concentration, low yields → Priorat's steep schist terraces","Firm tannin + oak → age-worthy Priorat, not light Garnacha"]}],"quiz":[{"id":"priorat-Q1","kp":"PRIORAT-F01","question":"What is llicorella, the signature soil of Priorat?","correctAnswer":"A red-black slate with quartzite — heat-retentive but low in nutrients","distractors":["Brilliant-white chalk (albariza)","Large rounded galets pebbles","Volcanic basalt"]},{"id":"priorat-Q2","kp":"PRIORAT-F03","question":"Which two grapes, largely from old vines, form the backbone of traditional Priorat reds?","correctAnswer":"Garnacha and Cariñena","distractors":["Tempranillo and Graciano","Monastrell and Bobal","Cabernet Sauvignon and Merlot"]},{"id":"priorat-Q3","kp":"PRIORAT-F02","question":"Why are Priorat yields often extremely low, around just 5–6 hL/ha?","correctAnswer":"Steep, poor, dry slate slopes with old bush vines and little water","distractors":["Strict appellation yield caps below other regions","Heavy reliance on green harvesting for quality","Frequent frost destroying much of the crop"]},{"id":"priorat-Q4","kp":"PRIORAT-R05","question":"Which tier sits at the top of Priorat's geographic quality pyramid?","correctAnswer":"Gran Vinya Classificada","distractors":["Vi de Vila","Vi de Paratge","Gran Reserva"]}]},{"id":"penedes-cava","title":"Penedès & Cava","alt":"Catalan sparkling & modern whites","country":"Spain","flag":"🇪🇸","blurb":"West of Barcelona: Spain's traditional-method sparkling heartland (Cava) plus modern, international-styled still wines pioneered by Torres.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Warm Mediterranean","scores":{"warmth":3,"sun":4,"rain":2,"diurnal":3,"risk":2}},"style":{"sparkling":55,"white":30,"red":15},"grapes":[{"name":"Macabeo","color":"w","pct":30},{"name":"Xarel-lo","color":"w","pct":25},{"name":"Parellada","color":"w","pct":20},{"name":"Chardonnay","color":"w","pct":10},{"name":"Merlot / CS / Tempranillo","color":"r","pct":15}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Penedès lies west of Barcelona, from the Mediterranean coast inland to the mountains; warm, dry Mediterranean climate.","Three climatic zones by altitude: Marítim (warm, low), Central (plains to ~500 m), Superior (500–800 m, cool, spring frost).","Cava is a Spain-wide DO (not regional) but ~95% is made in Catalunya, much of it here."],"kkps":[],"checks":[]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Traditional Cava trio: Macabeo, Xarel-lo, Parellada; Chardonnay and Pinot Noir also permitted.","Still whites: Xarel-lo, Macabeo, Parellada plus Chardonnay, SB, Riesling, Gewurztraminer.","Reds: Merlot (most planted), Cabernet Sauvignon, Tempranillo, Syrah, Pinot Noir."],"kkps":[{"id":"PENEDES-CAVA-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Macabeo (fruit/body), Xarel-lo (structure and earthy character) and Parellada (delicacy, acidity, floral notes)."},{"id":"PENEDES-CAVA-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Miguel Torres, from the 1960s–70s, introducing temperature-controlled, international-styled clean, fruity whites and reds."},{"id":"PENEDES-CAVA-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Mediterranean climate moderated by altitude in higher vineyards → Macabeo, Xarel·lo and Parellada ripen to moderate sugar while keeping acidity → neutral, fresh, high-acid base wine well suited to traditional-method sparkling.","chain":{"factor":"Mediterranean, cooler at altitude","mechanism":"Moderate ripeness, acidity retained","effect":"Neutral, high-acid base wine","style":"Crisp traditional-method Cava base"}}],"checks":[{"kp":"PENEDES-CAVA-F01","type":"flash","question":"Name the three traditional grapes of Cava and their roles.","answer":"Macabeo (fruit/body), Xarel-lo (structure and earthy character) and Parellada (delicacy, acidity, floral notes)."},{"kp":"PENEDES-CAVA-F02","type":"flash","question":"Who modernised Penedès still wines and when?","answer":"Miguel Torres, from the 1960s–70s, introducing temperature-controlled, international-styled clean, fruity whites and reds."},{"kp":"PENEDES-CAVA-CG1","type":"explain","prompt":"Explain how the climate of Penedès & Cava shapes the characteristics of its signature grape(s).","requiredPoints":["Mediterranean, cooler at altitude","Moderate ripeness, acidity retained","Neutral, high-acid base wine","Crisp traditional-method Cava base"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Large region with much mechanisation; many bush-vine plots remain.","Higher Penedès Superior sites grow Chardonnay, Sauvignon Blanc and cool-climate varieties.","A major centre for organic viticulture; irrigation allowed.","Cava: traditional method (second fermentation in bottle), aged on lees; ageing tiers from Cava de Guarda to Guarda Superior (Reserva/Gran Reserva).","Still wines modernised from the 1960s–70s by Miguel Torres — clean, fruity, aromatic whites and fruity reds.","Premium reds and some Cava (Chardonnay/Pinot) matured in French oak."],"kkps":[{"id":"PENEDES-CAVA-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"By the traditional method — a second fermentation in bottle followed by lees ageing — like Champagne."}],"checks":[{"kp":"PENEDES-CAVA-F03","type":"flash","question":"How is Cava made?","answer":"By the traditional method — a second fermentation in bottle followed by lees ageing — like Champagne."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Cava DO defines permitted zones and ageing; Corpinnat and Clàssic Penedès are alternative quality sparkling labels some producers use.","Penedès DO covers a range of styles; Vi de Finca is a single-estate top category in Catalunya.","Catalunya DO allows grapes from anywhere in the region for broader commercial wines."],"kkps":[{"id":"PENEDES-CAVA-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"No — Cava is a Spain-wide DO, though around 95% is produced in Catalunya, much of it in Penedès."}],"checks":[{"kp":"PENEDES-CAVA-F04","type":"flash","question":"Is Cava a regional appellation?","answer":"No — Cava is a Spain-wide DO, though around 95% is produced in Catalunya, much of it in Penedès."}]}],"blind":[{"id":"PENEDES-BLIND-1","tastingProfile":"Sparkling white wine. Pale lemon, fine persistent mousse. Medium intensity green apple, lemon, pear with earthy, slightly nutty and light bready autolytic notes. Dry (Brut), high acidity, medium alcohol, light-to-medium body, medium finish.","deduce":["Grape: Macabeo, Xarel·lo and Parellada blend","Climate: warm","Region: Penedès / Cava (Spain)"],"justifyWith":["Traditional-method autolytic notes on a neutral, high-acid base → Cava","Earthy, slightly nutty character → Xarel·lo in the blend","Ripe yet neutral fruit + high acid → warm Mediterranean base wine, not Champagne"]}],"quiz":[{"id":"penedes-cava-Q1","kp":"PENEDES-CAVA-F01","question":"Which three local grapes form the traditional base of Cava?","correctAnswer":"Macabeo, Xarel·lo and Parellada","distractors":["Chardonnay, Pinot Noir and Pinot Meunier","Airén, Palomino and Pedro Ximénez","Albariño, Treixadura and Loureiro"]},{"id":"penedes-cava-Q2","kp":"PENEDES-CAVA-F03","question":"By which method is Cava made?","correctAnswer":"The traditional method — second fermentation in bottle followed by lees ageing","distractors":["The tank (Charmat) method","The ancestral method","Carbonation by injection"]},{"id":"penedes-cava-Q3","kp":"PENEDES-CAVA-F04","question":"Is Cava a DO restricted to Penedès?","correctAnswer":"No — Cava is a Spain-wide DO, though around 95% is produced in Catalunya","distractors":["Yes — Cava can only be made within Penedès","Yes — Cava is restricted to the Rioja region","No — Cava may be made anywhere in the EU"]},{"id":"penedes-cava-Q4","kp":"PENEDES-CAVA-F02","question":"Who pioneered modern, international-styled still wines in Penedès?","correctAnswer":"Miguel Torres, from the 1960s–70s, with temperature-controlled, clean, fruity wines","distractors":["Josep Raventós in the 1870s with the first Cava","Marqués de Riscal with aged Tempranillo","The Symington family with port-style reds"]}]},{"id":"sherry","title":"Jerez / Sherry","alt":"Andalucía · flor & solera","country":"Spain","flag":"🇪🇸","blurb":"Fortified wine from the chalk-white albariza of Andalucía. Palomino under a veil of flor, aged through the solera — from bone-dry Fino to luscious PX. (Fortified, D5.)","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Hot maritime Mediterranean","scores":{"warmth":5,"sun":5,"rain":2,"diurnal":2,"risk":2}},"style":{"sweet":20,"white":80},"grapes":[{"name":"Palomino","color":"w","pct":90},{"name":"Pedro Ximénez","color":"w","pct":7},{"name":"Moscatel","color":"w","pct":3}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["South-west Andalucía around Jerez de la Frontera; hot, with the cool damp poniente wind off the Atlantic and the hot dry levante.","The prized soil is albariza — brilliant-white, chalky, water-retentive, helping vines through the dry summer.","The 'Sherry Triangle': Jerez, Sanlúcar de Barrameda and El Puerto de Santa María."],"kkps":[{"id":"SHERRY-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"A brilliant-white chalky soil that retains winter rainfall, sustaining the vines through Andalucía's hot, dry summer."}],"checks":[{"kp":"SHERRY-F01","type":"flash","question":"What is albariza and why is it ideal for Sherry?","answer":"A brilliant-white chalky soil that retains winter rainfall, sustaining the vines through Andalucía's hot, dry summer."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Palomino: neutral, the base for almost all dry Sherry.","Pedro Ximénez (PX): sun-dried for intensely sweet, dark wines.","Moscatel: for sweet Moscatel Sherry."],"kkps":[{"id":"SHERRY-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Pedro Ximénez (PX) — sun-dried to concentrate sugar into intensely sweet, dark wine."},{"id":"SHERRY-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Hot climate with moisture-retaining albariza soils → Palomino ripens to fairly neutral grapes with moderate sugar and low acidity → a relatively neutral base wine ideal for fortification and biological/oxidative ageing.","chain":{"factor":"Hot climate + water-holding albariza","mechanism":"Steady ripening to neutral, moderate-sugar fruit","effect":"Neutral, low-acid base wine","style":"Blank canvas for fortified Sherry ageing"}}],"checks":[{"kp":"SHERRY-F02","type":"flash","question":"Which grape makes the sweetest Sherry and how?","answer":"Pedro Ximénez (PX) — sun-dried to concentrate sugar into intensely sweet, dark wine."},{"kp":"SHERRY-CG1","type":"explain","prompt":"Explain how the climate of Jerez / Sherry shapes the characteristics of its signature grape(s).","requiredPoints":["Hot climate + water-holding albariza","Steady ripening to neutral, moderate-sugar fruit","Neutral, low-acid base wine","Blank canvas for fortified Sherry ageing"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Albariza's high chalk content stores winter rain for the dry growing season.","Heat and sunshine ripen Palomino to a neutral, fortifiable base wine.","Grapes for PX/Moscatel are dried (soleo) to concentrate sugar.","Base wine is fortified; biological ageing under flor (a yeast veil) gives Fino/Manzanilla — pale, dry, tangy.","Oxidative ageing (no flor, higher fortification) gives Oloroso — dark, nutty, rich; Amontillado is flor-then-oxidative.","Fractional blending through the solera system maintains a consistent house style.","Sweet styles (PX, Moscatel, Cream) blend in sweet wine."],"kkps":[{"id":"SHERRY-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"A film of yeast that forms on the wine's surface (biological ageing), protecting it from oxygen and producing pale, dry, tangy Fino and Manzanilla."},{"id":"SHERRY-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Oloroso is fortified higher so flor cannot survive, then aged oxidatively — giving dark, nutty, rich wines. Fino ages biologically under flor."},{"id":"SHERRY-F05","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"A fractional-blending method: wine is drawn from the oldest barrels and topped up from younger ones, maintaining a consistent style over time."}],"checks":[{"kp":"SHERRY-F03","type":"flash","question":"What is flor and which Sherries does it create?","answer":"A film of yeast that forms on the wine's surface (biological ageing), protecting it from oxygen and producing pale, dry, tangy Fino and Manzanilla."},{"kp":"SHERRY-F04","type":"flash","question":"How does Oloroso differ from Fino in production?","answer":"Oloroso is fortified higher so flor cannot survive, then aged oxidatively — giving dark, nutty, rich wines. Fino ages biologically under flor."},{"kp":"SHERRY-F05","type":"flash","question":"What is the solera system?","answer":"A fractional-blending method: wine is drawn from the oldest barrels and topped up from younger ones, maintaining a consistent style over time."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["DO Jerez-Xérès-Sherry; Manzanilla has its own DO (Sanlúcar de Barrameda).","Styles: Fino, Manzanilla, Amontillado, Oloroso, Palo Cortado, Pale Cream, Cream, PX, Moscatel.","Age-dated categories VOS (20 yrs) and VORS (30 yrs) certify older soleras."],"kkps":[],"checks":[]}],"blind":[{"id":"SHERRY-BLIND-1","tastingProfile":"White fortified wine. Pale lemon. Pronounced almond, bruised apple, chamomile, bread dough and a saline, tangy note. Bone dry, high acidity, medium(+) alcohol, light-to-medium body, medium finish.","deduce":["Grape: Palomino","Climate: hot","Region: Jerez / Sherry (Andalucía, Spain)"],"justifyWith":["Bread-dough/almond/saline tang with bone-dry palate → biological ageing under flor (Fino)","Neutral fruit base + fortified medium(+) alcohol → Palomino base wine fortified for flor ageing","Hot maritime origin with low-acid neutral grape → Jerez Palomino, not a cool-climate dry white"]}],"quiz":[{"id":"sherry-Q1","kp":"SHERRY-F03","question":"What is flor in sherry production?","correctAnswer":"A film of yeast on the wine's surface that protects it from oxygen, giving pale, dry, tangy Fino and Manzanilla","distractors":["A chalky white soil that retains rainfall","A fractional-blending system of stacked barrels","A mould on the grapes that concentrates sugar"]},{"id":"sherry-Q2","kp":"SHERRY-F01","question":"What is albariza?","correctAnswer":"A brilliant-white chalky soil that retains winter rainfall through the hot, dry summer","distractors":["Iron-rich red soil over limestone","Dark slate that radiates stored heat at night","Free-draining ponca marl"]},{"id":"sherry-Q3","kp":"SHERRY-F04","question":"How does Oloroso differ from Fino in its ageing?","correctAnswer":"Oloroso is fortified higher so flor cannot survive and ages oxidatively; Fino ages biologically under flor","distractors":["Oloroso ages under flor while Fino ages oxidatively","Both age under flor but Oloroso is sweetened with PX","Oloroso is frozen on the vine before pressing"]},{"id":"sherry-Q4","kp":"SHERRY-F05","question":"What is the solera system?","correctAnswer":"A fractional-blending method drawing from the oldest barrels and topping up from younger ones to keep a consistent style","distractors":["A yeast film that ages wine biologically","Sun-drying grapes to concentrate their sugar","Freezing grapes on the vine before pressing"]},{"id":"sherry-Q5","kp":"SHERRY-F02","question":"Which grape is sun-dried to make intensely sweet, dark sherry?","correctAnswer":"Pedro Ximénez","distractors":["Palomino","Moscatel","Viura"]}]},{"id":"vinho-verde","title":"Vinho Verde","alt":"Minho · Monção e Melgaço","country":"Portugal","flag":"🇵🇹","blurb":"Cool, wet, granitic north-west: high-acid whites led by Alvarinho and Loureiro, plus the inky red Vinhão.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Cool, very wet maritime","scores":{"warmth":2,"sun":2,"rain":5,"diurnal":2,"risk":3}},"style":{"white":82,"red":13,"rose":3,"sparkling":2},"grapes":[{"name":"Loureiro","color":"w","pct":26},{"name":"Alvarinho","color":"w","pct":22},{"name":"Arinto (Pedernã)","color":"w","pct":14},{"name":"Trajadura","color":"w","pct":12},{"name":"Avesso","color":"w","pct":10},{"name":"Vinhão","color":"r","pct":16}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Portugal's far north-west (Minho), between the Douro river and the Spanish border.","Atlantic and abundant rain (~1,500 mm) make it green and lush — hence 'vinho verde' (green/young wine).","Granite bedrock dominates; soils are sandy and acidic. Highest-quality sub-region is Monção e Melgaço."],"kkps":[{"id":"VINHO-VERDE-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"'Green/young wine' — the region is in the far NW (Minho) with a cool, very wet Atlantic climate (~1,500 mm rain) on granite, making it lush and green."},{"id":"VINHO-VERDE-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"To combat humidity/fungal disease and to free land below for other crops (the pergola/'enforcado' system)."}],"checks":[{"kp":"VINHO-VERDE-F01","type":"flash","question":"What does 'Vinho Verde' mean and why is the region so green?","answer":"'Green/young wine' — the region is in the far NW (Minho) with a cool, very wet Atlantic climate (~1,500 mm rain) on granite, making it lush and green."},{"kp":"VINHO-VERDE-F02","type":"flash","question":"Why were Vinho Verde vines traditionally trained high off the ground?","answer":"To combat humidity/fungal disease and to free land below for other crops (the pergola/'enforcado' system)."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Alvarinho (= Albariño): the star — stone fruit, citrus, body and structure; best in Monção e Melgaço.","Loureiro: aromatic, floral and high-acid; the most planted white.","Arinto (Pedernã) and Trajadura: blending whites for acidity and body; Avesso fuller in the warmer south.","Vinhão (Sousão): deeply coloured, high-acid red used for the traditional purple, tart red wine."],"kkps":[{"id":"VINHO-VERDE-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Alvarinho (= Albariño) — stone fruit, citrus and structure, best in the Monção e Melgaço sub-region."},{"id":"VINHO-VERDE-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Vinhão (Sousão) — deeply coloured and very high-acid, made into a tart purple red."},{"id":"VINHO-VERDE-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Cool, wet, green Atlantic climate → Alvarinho and Loureiro ripen while retaining very high acidity → light-bodied, fresh, sometimes spritzy low-alcohol whites.","chain":{"factor":"Cool, wet Atlantic","mechanism":"High acidity retention","effect":"High acidity, low alcohol","style":"Light, fresh, spritzy whites"}}],"checks":[{"kp":"VINHO-VERDE-F03","type":"flash","question":"Which grape is the star of Vinho Verde and where is it best?","answer":"Alvarinho (= Albariño) — stone fruit, citrus and structure, best in the Monção e Melgaço sub-region."},{"kp":"VINHO-VERDE-F04","type":"flash","question":"Name the traditional dark red grape of Vinho Verde and its style.","answer":"Vinhão (Sousão) — deeply coloured and very high-acid, made into a tart purple red."},{"kp":"VINHO-VERDE-CG1","type":"explain","prompt":"Explain how the climate of Vinho Verde shapes the characteristics of its signature grape(s).","requiredPoints":["Cool, wet Atlantic","High acidity retention","High acidity, low alcohol","Light, fresh, spritzy whites"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Historically vines were trained very high (pergola/'enforcado') up trees and posts to fight humidity and free land for other crops.","Modern quality vineyards use lower cordon/VSP training for better ripeness and disease control.","High rainfall and humidity bring fungal disease pressure (downy/powdery mildew, rot).","Most wine is dry, light-bodied, high-acid white, often with a slight spritz from a touch of CO₂.","A spritz was historically from malolactic in bottle; today it is usually added at bottling.","Top Alvarinho (Monção e Melgaço) is fuller, sometimes oaked/lees-aged and can age. Vinhão made as a tart, deeply coloured red."],"kkps":[{"id":"VINHO-VERDE-F05","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Historically from malolactic fermentation in bottle; today it is usually a small amount of CO₂ added at bottling."}],"checks":[{"kp":"VINHO-VERDE-F05","type":"flash","question":"Where does the slight spritz in Vinho Verde come from today?","answer":"Historically from malolactic fermentation in bottle; today it is usually a small amount of CO₂ added at bottling."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Vinho Verde DOC covers nine sub-regions; Monção e Melgaço is the benchmark for Alvarinho.","Varietal Alvarinho historically had to come from Monção e Melgaço (rules have since broadened).","Minho is the Vinho Regional (IGP) used for wines outside DOC rules."],"kkps":[],"checks":[]}],"blind":[{"id":"VV-BLIND","tastingProfile":"Pale lemon, slight spritz. Green apple, citrus, white peach, floral. Dry, high acidity, low(-medium) alcohol, light body, unoaked.","deduce":["Grapes: Alvarinho/Loureiro","Climate: cool, wet maritime","Region: Vinho Verde"],"justifyWith":["Light body, low alcohol, slight spritz, very fresh → Vinho Verde","High acid + green apple/floral on granite → Loureiro/Alvarinho","Spritz + youthful zip → northern Portugal Atlantic style"]}],"quiz":[{"id":"vinho-verde-Q1","kp":"VINHO-VERDE-F03","question":"Which grape, identical to Spain's Albariño, excels in the Monção e Melgaço sub-region?","correctAnswer":"Alvarinho","distractors":["Loureiro","Arinto","Trajadura"]},{"id":"vinho-verde-Q2","kp":"VINHO-VERDE-F01","question":"Which conditions define Vinho Verde in the far north-west Minho?","correctAnswer":"A cool, very wet Atlantic climate (~1,500 mm rain) on granite","distractors":["A hot, arid continental climate on limestone","A warm Mediterranean climate on slate","A high-altitude desert climate on volcanic soil"]},{"id":"vinho-verde-Q3","kp":"VINHO-VERDE-F05","question":"What is the source of the slight spritz in modern Vinho Verde?","correctAnswer":"A small amount of CO2 added at bottling","distractors":["A full second fermentation in bottle","Carbonic maceration of whole bunches","Extended lees autolysis under pressure"]},{"id":"vinho-verde-Q4","kp":"VINHO-VERDE-F04","question":"Which grape gives Vinho Verde's deeply coloured, very high-acid tart red?","correctAnswer":"Vinhão (Sousão)","distractors":["Touriga Nacional","Baga","Tinta Roriz"]},{"id":"vinho-verde-Q5","kp":"VINHO-VERDE-F02","question":"Why was vine training traditionally raised high on pergolas (the 'enforcado' system)?","correctAnswer":"To combat humidity and fungal disease and free the land below for other crops","distractors":["To maximise heat retention from the soil","To allow mechanical harvesting","To shelter fruit from extreme sun and wind"]}]},{"id":"douro-port","title":"Douro & Port","alt":"Baixo Corgo · Cima Corgo · Douro Superior","country":"Portugal","flag":"🇵🇹","blurb":"Steep schist terraces on the Douro: home of Port and increasingly serious dry reds from Touriga Nacional and Touriga Franca.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Warm continental, sheltered","scores":{"warmth":4,"sun":4,"rain":2,"diurnal":4,"risk":3}},"style":{"red":78,"white":12,"rose":3,"sparkling":2,"sweet":5},"grapes":[{"name":"Touriga Franca","color":"r","pct":28},{"name":"Touriga Nacional","color":"r","pct":22},{"name":"Tinta Roriz (Aragonez)","color":"r","pct":18},{"name":"Tinta Barroca","color":"r","pct":10},{"name":"Tinto Cão","color":"r","pct":7},{"name":"Viosinho / white","color":"w","pct":15}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["The Douro valley in NE Portugal, sheltered from the Atlantic by the Marão mountains — warm, dry and continental.","Soil is schist (slate), which fractures vertically and lets roots dig deep for water on steep slopes.","Three sub-regions get progressively warmer/drier east: Baixo Corgo (~900 mm, coolest/wettest), Cima Corgo (~700 mm, the heart of quality Port), Douro Superior (~450 mm, hottest/driest, near Spain)."],"kkps":[{"id":"DOURO-PORT-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Baixo Corgo (~900 mm), Cima Corgo (~700 mm, heart of quality Port), Douro Superior (~450 mm, hottest and driest)."},{"id":"DOURO-PORT-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"It fractures vertically so vine roots can penetrate deep to find water on the steep, dry, terraced slopes."},{"id":"DOURO-PORT-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Socalcos (traditional stone-walled terraces), patamares (mechanisable bench terraces), and vinha ao alto (vertical rows running up the slope)."}],"checks":[{"kp":"DOURO-PORT-F01","type":"flash","question":"Name the Douro's three sub-regions from coolest/wettest to hottest/driest.","answer":"Baixo Corgo (~900 mm), Cima Corgo (~700 mm, heart of quality Port), Douro Superior (~450 mm, hottest and driest)."},{"kp":"DOURO-PORT-F02","type":"flash","question":"Why is schist soil important in the Douro?","answer":"It fractures vertically so vine roots can penetrate deep to find water on the steep, dry, terraced slopes."},{"kp":"DOURO-PORT-F03","type":"flash","question":"What are the three modern Douro vineyard layouts?","answer":"Socalcos (traditional stone-walled terraces), patamares (mechanisable bench terraces), and vinha ao alto (vertical rows running up the slope)."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Touriga Nacional: small berries, deep colour, firm tannin and floral perfume — the quality benchmark.","Touriga Franca: the most planted; fruit, floral lift and structure.","Tinta Roriz (= Aragonez/Tempranillo), Tinta Barroca and Tinto Cão complete the classic red blend.","Whites such as Viosinho, Gouveio, Rabigato and Malvasia Fina for white Port and dry whites."],"kkps":[{"id":"DOURO-PORT-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Touriga Nacional — small berries give deep colour, firm tannin and intense floral perfume."},{"id":"DOURO-PORT-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Hot, dry continental climate sheltered by mountains → Touriga Nacional, Touriga Franca and Tinta Roriz reach very high sugar with thick skins → small, concentrated berries giving deep colour, high tannin and intense black fruit, ideal for fortified Port.","chain":{"factor":"Hot, dry, mountain-sheltered continental","mechanism":"Thick skins, high sugar, small berries","effect":"Deep colour, high tannin, concentration","style":"Rich base for Vintage/LBV Port"}}],"checks":[{"kp":"DOURO-PORT-F04","type":"flash","question":"Which grape is the Douro quality benchmark and why?","answer":"Touriga Nacional — small berries give deep colour, firm tannin and intense floral perfume."},{"kp":"DOURO-PORT-CG1","type":"explain","prompt":"Explain how the climate of Douro & Port shapes the characteristics of its signature grape(s).","requiredPoints":["Hot, dry, mountain-sheltered continental","Thick skins, high sugar, small berries","Deep colour, high tannin, concentration","Rich base for Vintage/LBV Port"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Famously steep — three vineyard layouts: socalcos (traditional walled terraces), patamares (mechanisable bench terraces), and vinha ao alto (vertical up-slope rows).","Vineyards are classified A–F by the cadastro (altitude, aspect, soil, yield, grapes) which sets how much Port a plot may make.","Heat and drought stress are the main hazards; old mixed field blends still exist.","Port: fermentation is stopped by adding grape spirit (aguardente) at ~7% abv, leaving sweetness and fortifying to ~19–22% abv.","Extraction is rapid (foot-treading in lagares or robotic lagares/autovinifiers) because skin contact time is short.","Styles: Ruby/Reserve, LBV, Vintage (declared in best years, ages in bottle); Tawny (oxidative cask ageing, 10/20/30/40-year), White and Rosé Port.","Dry Douro reds use the same grapes, fully fermented and often oak-aged — now a major category."],"kkps":[{"id":"DOURO-PORT-F05","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Fermentation is arrested by adding neutral grape spirit (aguardente) at about 7% abv — this kills the yeast, leaving residual sugar and raising alcohol to ~19–22%."},{"id":"DOURO-PORT-F06","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Vintage is from a single declared year, bottled young and aged reductively in bottle (fruit-driven); Tawny is aged oxidatively in cask (nutty, dried-fruit) with age indicators 10/20/30/40."}],"checks":[{"kp":"DOURO-PORT-F05","type":"flash","question":"How is Port made sweet and fortified?","answer":"Fermentation is arrested by adding neutral grape spirit (aguardente) at about 7% abv — this kills the yeast, leaving residual sugar and raising alcohol to ~19–22%."},{"kp":"DOURO-PORT-F06","type":"flash","question":"Distinguish Vintage Port from Tawny Port.","answer":"Vintage is from a single declared year, bottled young and aged reductively in bottle (fruit-driven); Tawny is aged oxidatively in cask (nutty, dried-fruit) with age indicators 10/20/30/40."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Demarcated in 1756 — one of the world's oldest appellations. DOC Porto (fortified) and DOC Douro (unfortified) overlap the same area.","The 'benefício' system sets an annual quota of how much must may be fortified into Port.","Tawny age indicators (10/20/30/40) are average ages; Colheita is a single-vintage tawny."],"kkps":[],"checks":[]}],"blind":[{"id":"DOU-BLIND","tastingProfile":"Deep ruby-purple, opaque. Pronounced blackberry, black cherry, violet, fig, warm spice; sweet. Medium(+) acidity, high tannin, fortified (~20% alcohol), full body.","deduce":["Style: Port (Vintage/LBV)","Grapes: Touriga Nacional/Franca blend","Region: Douro"],"justifyWith":["Sweet + ~20% alcohol + spirit warmth → fortified Port","Floral blackberry + high tannin → Touriga Nacional-led Douro blend","Opaque youthful purple + concentration → Vintage/LBV style"]}],"quiz":[{"id":"douro-port-Q1","kp":"DOURO-PORT-F05","question":"How is fermentation arrested when making Port?","correctAnswer":"By adding neutral grape spirit (aguardente) at about 7% abv, leaving residual sugar","distractors":["By chilling the must to stop the yeast","By adding sulphur dioxide to kill the yeast","By drying the grapes to concentrate sugar"]},{"id":"douro-port-Q2","kp":"DOURO-PORT-F02","question":"Why is schist important on the Douro's steep, dry slopes?","correctAnswer":"It fractures vertically so vine roots can penetrate deep to find water","distractors":["It reflects heat to ripen the grapes faster","It retains winter rain like a sponge near the surface","It is rich in nutrients, boosting vine vigour"]},{"id":"douro-port-Q3","kp":"DOURO-PORT-F06","question":"How does Vintage Port differ from Tawny Port?","correctAnswer":"Vintage is from a single declared year, bottled young and aged reductively; Tawny is aged oxidatively in cask","distractors":["Vintage is aged oxidatively in cask; Tawny is bottled young","Vintage is white; Tawny is red","Vintage is unfortified; Tawny is fortified"]},{"id":"douro-port-Q4","kp":"DOURO-PORT-F04","question":"What does Touriga Nacional contribute to Douro/Port blends?","correctAnswer":"Small berries giving deep colour, firm tannin and intense floral perfume","distractors":["Pale colour and oxidative, nutty character","High yields of neutral, low-tannin wine","Very high acidity with green-apple fruit"]},{"id":"douro-port-Q5","kp":"DOURO-PORT-F01","question":"Which Douro sub-region is the hottest and driest?","correctAnswer":"Douro Superior (~450 mm rain)","distractors":["Baixo Corgo (~900 mm rain)","Cima Corgo (~700 mm rain)","Vinho Verde (Minho)"]}]},{"id":"dao","title":"Dão","alt":"Serra da Estrela · granite plateau","country":"Portugal","flag":"🇵🇹","blurb":"Sheltered granite plateau ringed by mountains: elegant, structured Touriga Nacional reds and fresh Encruzado whites.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Moderate continental, sheltered","scores":{"warmth":3,"sun":3,"rain":3,"diurnal":3,"risk":2}},"style":{"red":72,"white":24,"rose":2,"sparkling":2},"grapes":[{"name":"Touriga Nacional","color":"r","pct":28},{"name":"Tinta Roriz (Aragonez)","color":"r","pct":18},{"name":"Jaen (Mencía)","color":"r","pct":14},{"name":"Alfrocheiro","color":"r","pct":10},{"name":"Encruzado","color":"w","pct":18},{"name":"Other white","color":"w","pct":12}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A high granite plateau (~400–800 m) in north-central Portugal, ringed and protected by mountains (incl. Serra da Estrela).","Mountains shelter it from Atlantic and continental extremes, giving a moderate climate and good diurnal range.","Sandy, granitic, free-draining and low-fertility soils that keep yields naturally low."],"kkps":[{"id":"DAO-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Surrounding mountains (incl. Serra da Estrela) shelter the granite plateau, giving a moderate climate with good diurnal range — wines are more elegant and fresh than the Douro's."},{"id":"DAO-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Granite — free-draining and low in fertility, naturally limiting yields and preserving acidity."}],"checks":[{"kp":"DAO-F01","type":"flash","question":"What protects Dão's vineyards and how does that shape its wines?","answer":"Surrounding mountains (incl. Serra da Estrela) shelter the granite plateau, giving a moderate climate with good diurnal range — wines are more elegant and fresh than the Douro's."},{"kp":"DAO-F02","type":"flash","question":"What soil dominates Dão and why does it matter?","answer":"Granite — free-draining and low in fertility, naturally limiting yields and preserving acidity."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Touriga Nacional: structured, perfumed and age-worthy — Dão is a classic home for it.","Tinta Roriz, Jaen (= Mencía) and Alfrocheiro add fruit, colour and spice to red blends.","Encruzado: Portugal's finest white grape for dry wine — citrus, mineral, can be oak-aged and ages well."],"kkps":[{"id":"DAO-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Touriga Nacional — structured, perfumed and age-worthy, often showing more finesse than in the hotter Douro."},{"id":"DAO-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Moderate climate sheltered by mountains on granite → Touriga Nacional ripens evenly and elegantly → perfumed, structured medium-to-full reds with fresh acidity and fine tannins.","chain":{"factor":"Mountain-sheltered, granite","mechanism":"Even, elegant ripening","effect":"Fresh acidity, fine tannins","style":"Perfumed, structured reds"}}],"checks":[{"kp":"DAO-F03","type":"flash","question":"Name Dão's signature red grape and its character here.","answer":"Touriga Nacional — structured, perfumed and age-worthy, often showing more finesse than in the hotter Douro."},{"kp":"DAO-CG1","type":"explain","prompt":"Explain how the climate of Dão shapes the characteristics of its signature grape(s).","requiredPoints":["Mountain-sheltered, granite","Even, elegant ripening","Fresh acidity, fine tannins","Perfumed, structured reds"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Small, fragmented holdings; bush vines and old field blends are common.","Altitude and granite preserve acidity and aromatic finesse compared with the warmer Douro.","Spring frost and some disease pressure where it is cooler/wetter.","Reds are typically blended, with rising single-varietal Touriga Nacional; oak-aged for structure and elegance.","Encruzado made both fresh/unoaked and barrel-fermented/lees-aged for serious, age-worthy whites.","Historically co-op dominated and rustic; modern estates focus on finesse over power."],"kkps":[{"id":"DAO-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Encruzado — citrus and mineral, capable of barrel-ageing and developing well with age."}],"checks":[{"kp":"DAO-F04","type":"flash","question":"Which white grape is Dão (and Portugal's) finest for dry wine?","answer":"Encruzado — citrus and mineral, capable of barrel-ageing and developing well with age."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Dão DOC with the Serra da Estrela sub-region (Lafões IGP also lies nearby).","Reds must be blends or can be varietal; Touriga Nacional and Encruzado are the flag-bearers.","Vinho Regional Terras do Dão for wines outside DOC rules."],"kkps":[],"checks":[]}],"blind":[{"id":"DAO-BLIND-1","tastingProfile":"Red wine. Medium-deep ruby. Pronounced violet/floral perfume, blackberry, black plum and subtle cedar oak. Dry, medium-plus acidity, medium-plus fine-grained tannin, medium alcohol, medium-full body, medium-plus finish.","deduce":["Grape: Touriga Nacional (-led blend)","Climate: moderate","Region: Dão (Portugal)"],"justifyWith":["Floral perfume + structured fine tannin → Touriga Nacional","Fresh medium-plus acidity and elegance → moderate, mountain-sheltered climate","Restrained, not jammy or overripe → cooler than the Douro, on granite"]}],"quiz":[{"id":"dao-Q1","kp":"DAO-F01","question":"How do the mountains surrounding Dão influence its wine style?","correctAnswer":"They shelter the granite plateau, giving a moderate climate with good diurnal range and more elegant, fresh wines than the Douro's","distractors":["They trap heat, making Dão hotter than the Douro","They block all rainfall, forcing widespread irrigation","They funnel ocean fog inland to cool the vineyards"]},{"id":"dao-Q2","kp":"DAO-F02","question":"What is the dominant soil of Dão and its effect?","correctAnswer":"Granite — free-draining and low in fertility, naturally limiting yields and preserving acidity","distractors":["Schist — heat-retentive, raising alcohol and yields","Limestone — adding minerality and high pH","Alluvial clay — fertile and water-retentive, boosting yields"]},{"id":"dao-Q3","kp":"DAO-F03","question":"How does Touriga Nacional in Dão compare with the Douro?","correctAnswer":"It is structured, perfumed and age-worthy, often showing more finesse than in the hotter Douro","distractors":["It is jammier and higher in alcohol than in the Douro","It is pale and light, used mainly for rosé","It is rarely planted and used only for fortified wine"]},{"id":"dao-Q4","kp":"DAO-F04","question":"Which white grape is Dão's flagship?","correctAnswer":"Encruzado — citrus and mineral, capable of barrel-ageing and developing well with age","distractors":["Alvarinho — saline and aromatic from coastal granite","Arinto — high-acid and used mainly in sparkling","Fernão Pires — floral and aromatic, best drunk young"]}]},{"id":"bairrada","title":"Bairrada","alt":"Atlantic · clay-limestone · Baga","country":"Portugal","flag":"🇵🇹","blurb":"Cool, damp Atlantic region on clay-limestone: high-acid, tannic Baga reds and a serious traditional-method sparkling industry.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Cool, damp maritime","scores":{"warmth":2,"sun":2,"rain":4,"diurnal":2,"risk":4}},"style":{"red":58,"white":18,"rose":2,"sparkling":22},"grapes":[{"name":"Baga","color":"r","pct":40},{"name":"Touriga Nacional","color":"r","pct":12},{"name":"Castelão","color":"r","pct":8},{"name":"Maria Gomes (Fernão Pires)","color":"w","pct":16},{"name":"Bical","color":"w","pct":12},{"name":"Arinto","color":"w","pct":12}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A coastal region between Coimbra and the Atlantic — cool, damp and Atlantic-influenced, with significant rain and harvest-time risk.","Clay-limestone soils (heavier and water-retentive) are a key distinction from granitic Dão next door.","Maritime cloud and rain make ripening Baga a challenge and vintages variable."],"kkps":[{"id":"BAIRRADA-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"It ripens late in a cool, wet, Atlantic climate, so harvest-time rain and fungal disease threaten full tannin ripeness and make vintages variable."}],"checks":[{"kp":"BAIRRADA-F01","type":"flash","question":"Why is ripening Baga risky in Bairrada?","answer":"It ripens late in a cool, wet, Atlantic climate, so harvest-time rain and fungal disease threaten full tannin ripeness and make vintages variable."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Baga: thick-skinned, late-ripening, very high acid and tannin — can be austere young, rewarding with age.","Maria Gomes (= Fernão Pires) and Bical: the main whites, used for still and sparkling.","Touriga Nacional and Castelão appear in red blends; Arinto adds acidity."],"kkps":[{"id":"BAIRRADA-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Baga — thick-skinned and late-ripening with very high acidity and tannin, often austere young but age-worthy."},{"id":"BAIRRADA-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Cool, damp Atlantic climate on clay-limestone → thick-skinned, late-ripening Baga keeps high acidity and firm tannin → austere, structured, age-worthy reds of sour cherry and tobacco.","chain":{"factor":"Cool, damp Atlantic; clay-limestone","mechanism":"Late ripening; high acid and tannin","effect":"High acidity, firm tannin","style":"Austere, age-worthy Baga"}}],"checks":[{"kp":"BAIRRADA-F02","type":"flash","question":"What is Bairrada's defining red grape and its hallmark structure?","answer":"Baga — thick-skinned and late-ripening with very high acidity and tannin, often austere young but age-worthy."},{"kp":"BAIRRADA-CG1","type":"explain","prompt":"Explain how the climate of Bairrada shapes the characteristics of its signature grape(s).","requiredPoints":["Cool, damp Atlantic; clay-limestone","Late ripening; high acid and tannin","High acidity, firm tannin","Austere, age-worthy Baga"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Cool, wet maritime climate makes fungal disease and harvest rain serious hazards.","Late-ripening Baga needs warm sites and good vintages to ripen its tannins fully.","Older bush vines persist; clay-limestone holds water for dry summers.","Bairrada is a major source of traditional-method sparkling (espumante) using Maria Gomes, Bical, Arinto (and others).","Modern Baga winemaking softens extraction/tannins; some producers destem and age in oak for approachability.","Whites range from fresh, unoaked styles to richer barrel-aged wines."],"kkps":[{"id":"BAIRRADA-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"It's a leading source of Portuguese traditional-method sparkling (espumante), often from Maria Gomes, Bical and Arinto."}],"checks":[{"kp":"BAIRRADA-F03","type":"flash","question":"What sparkling-wine reputation does Bairrada hold?","answer":"It's a leading source of Portuguese traditional-method sparkling (espumante), often from Maria Gomes, Bical and Arinto."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Bairrada DOC; Vinho Regional Beira Atlântico for wines outside DOC rules.","Baga is the defining red grape, though blends and varietal labelling both occur.","A recognised hub for quality Portuguese traditional-method sparkling wine."],"kkps":[{"id":"BAIRRADA-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Bairrada is cooler, damper and Atlantic-influenced on clay-limestone (water-retentive), whereas Dão is a sheltered granite plateau."}],"checks":[{"kp":"BAIRRADA-F04","type":"flash","question":"How do Bairrada's soils and climate differ from neighbouring Dão?","answer":"Bairrada is cooler, damper and Atlantic-influenced on clay-limestone (water-retentive), whereas Dão is a sheltered granite plateau."}]}],"blind":[{"id":"BAI-BLIND","tastingProfile":"Medium ruby with garnet. Red plum, sour cherry, tobacco, earth, oak. Dry, high acidity, high firm tannin, medium alcohol, medium(+) body.","deduce":["Grape: Baga","Climate: cool, damp Atlantic","Region: Bairrada"],"justifyWith":["High acid + high firm tannin + red fruit → thick-skinned Baga","Cool Atlantic, savoury/earthy, age-worthy → Bairrada","Austere structure, not jammy → late-ripening Baga on clay-limestone"]}],"quiz":[{"id":"bairrada-Q1","kp":"BAIRRADA-F02","question":"What are the key characteristics of the Baga grape?","correctAnswer":"Thick-skinned and late-ripening with very high acidity and tannin","distractors":["Early-ripening with soft tannins and low acidity","Thin-skinned and aromatic with floral notes","Pale and delicate with low tannin"]},{"id":"bairrada-Q2","kp":"BAIRRADA-F03","question":"For which wine style other than red is Bairrada a leading source?","correctAnswer":"Traditional-method sparkling (espumante)","distractors":["Fortified Vin Doux Naturel","Botrytised sweet white","Oxidative Vin Jaune"]},{"id":"bairrada-Q3","kp":"BAIRRADA-F04","question":"How does Bairrada differ climatically and geologically from neighbouring Dão?","correctAnswer":"Bairrada is cooler, damper and Atlantic-influenced on clay-limestone, whereas Dão is a sheltered granite plateau","distractors":["Bairrada is a hot inland plateau, while Dão is cool and coastal","Both sit on identical granite soils with the same climate","Bairrada is granite-based, while Dão is clay-limestone and Atlantic"]},{"id":"bairrada-Q4","kp":"BAIRRADA-CG1","question":"What style of red does Bairrada's cool, damp climate and Baga grape produce?","correctAnswer":"Austere, structured, age-worthy reds of sour cherry and tobacco","distractors":["Soft, jammy, high-alcohol reds for early drinking","Light, pale reds with low tannin and high alcohol","Sweet, fortified red wines"]}]},{"id":"alentejo","title":"Alentejo","alt":"Plains of the south · talha · Portalegre","country":"Portugal","flag":"🇵🇹","blurb":"Hot, dry, sparsely populated southern plains: ripe, fruit-forward blends, a talha (amphora) revival, and cooler high Portalegre.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Hot Mediterranean, dry","scores":{"warmth":5,"sun":5,"rain":1,"diurnal":3,"risk":2}},"style":{"red":75,"white":22,"rose":2,"sparkling":1},"grapes":[{"name":"Aragonez (Tinta Roriz)","color":"r","pct":24},{"name":"Trincadeira","color":"r","pct":16},{"name":"Alicante Bouschet","color":"r","pct":14},{"name":"Touriga Nacional","color":"r","pct":10},{"name":"Antão Vaz","color":"w","pct":14},{"name":"Roupeiro / Arinto","color":"w","pct":22}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A vast, sparsely populated region across southern Portugal — hot, dry Mediterranean with high sunshine and flat-to-rolling plains.","Low rainfall (~500–800 mm, mostly autumn/winter) means drip irrigation is widely used.","Wide range of soils (granite, schist, limestone, clay); cooler high-altitude Portalegre (>800 m) in the Alto Alentejo keeps freshness."],"kkps":[{"id":"ALENTEJO-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Hot, dry Mediterranean with high sunshine and low rainfall (~500–800 mm) — drip irrigation is widely used."},{"id":"ALENTEJO-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Antão Vaz (full-bodied, dry-climate) and Roupeiro (most planted, citrus/stone fruit); Arinto is added for acidity."}],"checks":[{"kp":"ALENTEJO-F01","type":"flash","question":"What climate defines the Alentejo and how is water managed?","answer":"Hot, dry Mediterranean with high sunshine and low rainfall (~500–800 mm) — drip irrigation is widely used."},{"kp":"ALENTEJO-F02","type":"flash","question":"Name two key Alentejo white grapes and their roles.","answer":"Antão Vaz (full-bodied, dry-climate) and Roupeiro (most planted, citrus/stone fruit); Arinto is added for acidity."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Aragonez (= Tinta Roriz/Tempranillo): backbone red, fuller in cooler spots.","Trincadeira: dry-climate red, prone to rot if wet; blackberry and spice.","Alicante Bouschet: red-fleshed (teinturier), deep colour and acidity — an Alentejo signature in blends.","Whites: Antão Vaz (dry-climate, full-bodied), Roupeiro (most planted, citrus/stone fruit) and Arinto for acidity."],"kkps":[{"id":"ALENTEJO-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Hot, dry climate with long sunshine → Aragonez, Trincadeira and Alicante Bouschet ripen to high sugar → soft, full-bodied, ripe-fruited reds with high alcohol and low-to-medium acidity.","chain":{"factor":"Hot, dry, long sunshine","mechanism":"High sugar ripeness","effect":"High alcohol, soft, low-med acidity","style":"Ripe, full-bodied reds"}}],"checks":[{"kp":"ALENTEJO-CG1","type":"explain","prompt":"Explain how the climate of Alentejo shapes the characteristics of its signature grape(s).","requiredPoints":["Hot, dry, long sunshine","High sugar ripeness","High alcohol, soft, low-med acidity","Ripe, full-bodied reds"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Heat and drought are managed with drip irrigation; double cordon/VSP common with mechanisation on the plains.","Cooler, higher Portalegre retains old field-blend vineyards and gives fresher, higher-acid wines.","One of Portugal's most efficient, high-volume modern wine regions.","Reds are typically ripe, fruit-forward blends, often oak-aged; warmth gives full body and soft tannins.","Vinho de Talha DOC (2010) revives fermentation on skins in clay amphorae (talha) — a Roman/traditional method.","Whites are blended for body and acidity (Antão Vaz with Roupeiro/Arinto); some skin-contact talha whites."],"kkps":[{"id":"ALENTEJO-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Alicante Bouschet — a teinturier (red-fleshed) grape giving deep colour and acidity to blends."},{"id":"ALENTEJO-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"A revived traditional method (DOC since 2010) fermenting and ageing wine on skins in large clay amphorae (talha), of Roman origin."},{"id":"ALENTEJO-F05","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"It's higher (>800 m) and cooler in the Alto Alentejo, giving fresher, higher-acid wines and retaining old field-blend vineyards."}],"checks":[{"kp":"ALENTEJO-F03","type":"flash","question":"Which red grape is an Alentejo signature for colour, and what's unusual about it?","answer":"Alicante Bouschet — a teinturier (red-fleshed) grape giving deep colour and acidity to blends."},{"kp":"ALENTEJO-F04","type":"flash","question":"What is Vinho de Talha?","answer":"A revived traditional method (DOC since 2010) fermenting and ageing wine on skins in large clay amphorae (talha), of Roman origin."},{"kp":"ALENTEJO-F05","type":"flash","question":"How does Portalegre differ within the Alentejo?","answer":"It's higher (>800 m) and cooler in the Alto Alentejo, giving fresher, higher-acid wines and retaining old field-blend vineyards."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Alentejo DOC has eight non-contiguous sub-regions (incl. Portalegre); Vinhão Regional Alentejano (IGP) is widely used.","Vinho de Talha DOC recognises traditional amphora winemaking.","Largest-selling region domestically — strong on cost-effective, high-volume wine."],"kkps":[],"checks":[]}],"blind":[{"id":"ALENTEJO-BLIND-1","tastingProfile":"Red wine. Deep ruby. Pronounced ripe black plum, blackberry and dark spice, soft and warming. Dry, low-to-medium acidity, medium soft tannin, high alcohol, full body, medium-plus finish.","deduce":["Grape: Aragonez (Tempranillo) blend with Trincadeira/Alicante Bouschet","Climate: hot","Region: Alentejo (Portugal)"],"justifyWith":["Full body + high alcohol + soft ripe tannin + low-medium acid → hot-climate ripening","Ripe black fruit and warmth → hot, dry Mediterranean Alentejo","Soft, fruit-forward blend style → Aragonez/Trincadeira/Alicante Bouschet"]}],"quiz":[{"id":"alentejo-Q1","kp":"ALENTEJO-F03","question":"What makes Alicante Bouschet distinctive among Alentejo's red grapes?","correctAnswer":"It is a teinturier (red-fleshed) grape giving deep colour and acidity","distractors":["It is a white grape added for aromatics","It is the region's most planted variety","It requires noble rot to ripen"]},{"id":"alentejo-Q2","kp":"ALENTEJO-F04","question":"What is talha, a revived traditional method in Alentejo (a DOC since 2010)?","correctAnswer":"Fermenting and ageing wine on skins in large clay amphorae of Roman origin","distractors":["Drying grapes on straw mats before fermentation","Ageing under a veil of flor yeast","Blending fractionally through a solera"]},{"id":"alentejo-Q3","kp":"ALENTEJO-F01","question":"Given Alentejo's hot, dry climate with low rainfall, what is widely used in the vineyards?","correctAnswer":"Drip irrigation","distractors":["Frost-protection sprinklers","Pergola training to lift the canopy","Sous voile (veil) ageing"]},{"id":"alentejo-Q4","kp":"ALENTEJO-F02","question":"Which white grape is prized in Alentejo for full-bodied wines suited to its dry climate?","correctAnswer":"Antão Vaz","distractors":["Albariño","Verdejo","Assyrtiko"]}]},{"id":"madeira","title":"Madeira","alt":"Atlantic island · estufagem · canteiro","country":"Portugal","flag":"🇵🇹","blurb":"Volcanic mid-Atlantic island making deliberately heated, near-indestructible fortified wines across a dry-to-sweet varietal ladder.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Subtropical Atlantic island","scores":{"warmth":4,"sun":3,"rain":3,"diurnal":2,"risk":2}},"style":{"sweet":100},"grapes":[{"name":"Tinta Negra","color":"r","pct":50},{"name":"Sercial","color":"w","pct":11},{"name":"Verdelho","color":"w","pct":11},{"name":"Bual","color":"w","pct":11},{"name":"Malvasia (Malmsey)","color":"w","pct":11},{"name":"Terrantez","color":"w","pct":6}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A steep volcanic island ~500 km off NW Africa, subtropical and humid, with vineyards on terraced slopes ('poios').","Rugged terrain makes mechanisation impossible; vines often trained on low pergolas to combat humidity.","Volcanic, fertile soils; the wines' identity comes less from site than from a unique heating process."],"kkps":[],"checks":[]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Tinta Negra: the workhorse, used across all sweetness levels and most volume.","The four 'noble' varieties form a dryness ladder: Sercial (driest), Verdelho (off-dry), Bual (medium-sweet), Malvasia/Malmsey (sweetest).","Terrantez and others are rarer noble grapes."],"kkps":[{"id":"MADEIRA-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Sercial (driest) → Verdelho (off-dry) → Bual (medium-sweet) → Malvasia/Malmsey (sweetest)."},{"id":"MADEIRA-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Tinta Negra — the workhorse variety used across the dry-to-sweet range."},{"id":"MADEIRA-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"The wine is then heated and oxidised, so high acidity keeps it balanced and fresh despite the cooking process."},{"id":"MADEIRA-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Hot, humid subtropical island climate → Sercial, Verdelho, Bual and Malmsey retain high acidity → high-acid base wines that are fortified and heated (estufagem/canteiro) for long-lived oxidative styles.","chain":{"factor":"Hot, humid subtropical island","mechanism":"High acidity retained","effect":"High-acid fortified base","style":"Heated, oxidative, long-lived fortified"}}],"checks":[{"kp":"MADEIRA-F01","type":"flash","question":"List the four noble Madeira grapes from driest to sweetest.","answer":"Sercial (driest) → Verdelho (off-dry) → Bual (medium-sweet) → Malvasia/Malmsey (sweetest)."},{"kp":"MADEIRA-F02","type":"flash","question":"Which grape makes most Madeira and at all sweetness levels?","answer":"Tinta Negra — the workhorse variety used across the dry-to-sweet range."},{"kp":"MADEIRA-F03","type":"flash","question":"Why must Madeira grapes be picked at high acidity?","answer":"The wine is then heated and oxidised, so high acidity keeps it balanced and fresh despite the cooking process."},{"kp":"MADEIRA-CG1","type":"explain","prompt":"Explain how the climate of Madeira shapes the characteristics of its signature grape(s).","requiredPoints":["Hot, humid subtropical island","High acidity retained","High-acid fortified base","Heated, oxidative, long-lived fortified"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Smallholder, fragmented vineyards on steep terraces; high humidity favours pergola training.","Grapes are picked at high acidity — crucial, because the wine is then deliberately heated and oxidised.","Phylloxera-era replanting left much Tinta Negra; noble varieties are a small share.","Wine is fortified, then deliberately heated and oxidised — this is Madeira's signature and makes it virtually indestructible.","Estufagem: bulk/standard wine heated in stainless tanks (estufa) to ~45–50°C for at least ~3 months.","Canteiro: finest wines aged by natural warmth in cask in lofts/warm rooms over years — gentler and more complex.","Sweetness is set by when fortification stops; styles named by noble grape or sweetness (Sercial→Malmsey)."],"kkps":[{"id":"MADEIRA-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Deliberate heating and oxidation after fortification — making the wine cooked, tangy and virtually indestructible once opened."},{"id":"MADEIRA-F05","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Estufagem heats bulk wine in tanks (estufa) to ~45–50°C for at least ~3 months; canteiro ages the finest wines by natural warmth in cask over years (gentler, more complex)."},{"id":"MADEIRA-R06","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Sweetness is set by when fortification stops; styles named by noble grape or sweetness (Sercial→Malmsey)."}],"checks":[{"kp":"MADEIRA-F04","type":"flash","question":"What process gives Madeira its signature character and longevity?","answer":"Deliberate heating and oxidation after fortification — making the wine cooked, tangy and virtually indestructible once opened."},{"kp":"MADEIRA-F05","type":"flash","question":"Distinguish estufagem from canteiro.","answer":"Estufagem heats bulk wine in tanks (estufa) to ~45–50°C for at least ~3 months; canteiro ages the finest wines by natural warmth in cask over years (gentler, more complex)."},{"kp":"MADEIRA-R06","type":"explain","prompt":"Starting from “Sweetness is set by when fortification stops; styles named by noble grape or sweetness (Sercial”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Malmsey)"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["DOP Madeira/Madeira DOC; vintage ('frasqueira') wines age many years in cask before bottling.","Varietal-named wines (Sercial/Verdelho/Bual/Malmsey) must be ≥85% that grape and imply a sweetness level.","Age statements (5/10/15/20/30/40-year) apply to blended reserves."],"kkps":[],"checks":[]}],"blind":[{"id":"MADEIRA-BLIND-1","tastingProfile":"Fortified wine. Deep amber/tawny with green-tinged rim. Pronounced caramel, toffee, roasted nuts, dried fruit, coffee and a distinctive volatile/tangy, smoky 'cooked' note. Medium-sweet to sweet, very high acidity, high alcohol, full body, very long finish.","deduce":["Grape: Bual / Malvasia (noble grape)","Climate: hot","Region: Madeira (Portugal)"],"justifyWith":["Cooked, tangy, roasted-nut character with searing acidity → estufagem/canteiro heating of a Madeira","High alcohol + residual sweetness → fortified, sweetness set by stopping fortification","Very high acidity balancing the sweetness → hot subtropical island fruit"]}],"quiz":[{"id":"madeira-Q1","kp":"MADEIRA-F01","question":"Which Madeira noble grape produces the driest style?","correctAnswer":"Sercial","distractors":["Malvasia (Malmsey)","Bual","Verdelho"]},{"id":"madeira-Q2","kp":"MADEIRA-F02","question":"Which is the most-planted, workhorse grape of Madeira, used across the dry-to-sweet range?","correctAnswer":"Tinta Negra","distractors":["Terrantez","Bual","Sercial"]},{"id":"madeira-Q3","kp":"MADEIRA-F05","question":"How does the estufagem process age Madeira?","correctAnswer":"Bulk wine is heated in tanks (estufa) to ~45–50°C for at least ~3 months","distractors":["Wine ages under a yeast veil for six years","Wine is frozen to concentrate sugars before bottling","Wine matures only in chilled underground cellars"]},{"id":"madeira-Q4","kp":"MADEIRA-F03","question":"Why does Madeira stay balanced despite being deliberately heated and oxidised?","correctAnswer":"The grapes retain high acidity, which keeps the cooked wine fresh and tangy","distractors":["Heavy tannins counter the sweetness","Low acidity makes the wine taste richer","Carbon dioxide is added for freshness"]},{"id":"madeira-Q5","kp":"MADEIRA-R06","question":"What determines a Madeira's sweetness level?","correctAnswer":"When fortification stops, which halts fermentation and retains residual sugar","distractors":["The length of estufagem heating","The amount of grape spirit added at bottling","The size of the cask used for ageing"]}]},{"id":"mosel","title":"Mosel","alt":"Germany · slate · Riesling","country":"Germany, Austria & Hungary","flag":"🇩🇪","blurb":"Germany's steepest slate slopes on the Mosel river: featherweight, racy Riesling from Kabinett to TBA, often with delicate sweetness.","source":"3__GermanyAustriaTokaj.pdf","climate":{"label":"Cool continental, marginal","scores":{"warmth":1,"sun":2,"rain":3,"diurnal":3,"risk":5}},"style":{"white":92,"red":6,"rose":1,"sparkling":1},"grapes":[{"name":"Riesling","color":"w","pct":62},{"name":"Müller-Thurgau","color":"w","pct":12},{"name":"Elbling","color":"w","pct":6},{"name":"Weissburgunder","color":"w","pct":6},{"name":"Spätburgunder","color":"r","pct":8},{"name":"Other","color":"w","pct":6}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A cool, marginal continental region (~49–50°N) following the Mosel and its tributaries Saar and Ruwer.","Steep, south-facing slopes are essential to capture enough sun to ripen Riesling.","Dark slate soils retain the day's heat and radiate it at night, aiding ripening in this cold climate; the river reflects light and moderates."],"kkps":[{"id":"MOSEL-F01","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statem
