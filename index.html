ent":"The climate is cold and marginal (~49–50°N); steep south-facing aspect maximises sun, and dark slate stores daytime heat and radiates it at night to ripen Riesling."}],"checks":[{"kp":"MOSEL-F01","type":"flash","question":"Why are steep, south-facing slate slopes essential on the Mosel?","answer":"The climate is cold and marginal (~49–50°N); steep south-facing aspect maximises sun, and dark slate stores daytime heat and radiates it at night to ripen Riesling."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Riesling: the signature — high acidity, transparency to site (slate minerality), aromatic and age-worthy.","Müller-Thurgau and Elbling fill cheaper/cooler volume; Weissburgunder rising.","Spätburgunder (Pinot Noir) grown in warmer pockets as Germany warms."],"kkps":[{"id":"MOSEL-CG1","cat":"relationship","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Very cool continental climate on steep south-facing slate slopes → Riesling ripens slowly while retaining searing acidity → delicate, low-alcohol, racy wines of lime and green apple, often off-dry.","chain":{"factor":"Very cool; steep slate slopes","mechanism":"Slow ripening; searing acidity","effect":"High acidity, low alcohol","style":"Delicate, racy, off-dry Riesling"}}],"checks":[{"kp":"MOSEL-CG1","type":"explain","prompt":"Explain how the climate of Mosel shapes the characteristics of its signature grape(s).","requiredPoints":["Very cool; steep slate slopes","Slow ripening; searing acidity","High acidity, low alcohol","Delicate, racy, off-dry Riesling"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Among the world's steepest vineyards — slopes can exceed 60°, worked by hand (single-pole 'Einzelpfahl' training historically).","Aspect and slope are everything in such a marginal climate; flat sites struggle to ripen.","Frost and lack of ripeness are the key hazards; cold winters can allow Eiswein.","Famous for off-dry and sweet Riesling: fermentation stopped to retain residual sugar balanced by very high acidity.","Prädikat ladder by must weight: Kabinett, Spätlese, Auslese, Beerenauslese, Eiswein, Trockenbeerenauslese.","Traditional 1,000 L Fuder casks; reductive winemaking preserves delicacy. Trocken (dry) styles rising but still a minority on the Mosel (~26%)."],"kkps":[{"id":"MOSEL-F02","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Delicate, off-dry to sweet Riesling — fermentation is arrested to leave residual sugar that's balanced by the wine's very high acidity."},{"id":"MOSEL-F03","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Wine from grapes naturally frozen on the vine and pressed while frozen, concentrating sugar and acid; it requires Beerenauslese-level must weight."}],"checks":[{"kp":"MOSEL-F02","type":"flash","question":"What style made the Mosel famous and how is it achieved?","answer":"Delicate, off-dry to sweet Riesling — fermentation is arrested to leave residual sugar that's balanced by the wine's very high acidity."},{"kp":"MOSEL-F03","type":"flash","question":"What is Eiswein?","answer":"Wine from grapes naturally frozen on the vine and pressed while frozen, concentrating sugar and acid; it requires Beerenauslese-level must weight."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Steep-site villages/vineyards (e.g. Bernkasteler Doctor, Wehlener Sonnenuhr) prized; Einzellage = single vineyard.","Prädikatswein names denote ripeness at harvest, not sweetness — Kabinett can be dry or sweet.","Many top estates are VDP members, using Prädikat only for sweet wines and 'Qualitätswein trocken' / GG for dry."],"kkps":[{"id":"MOSEL-F04","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Kabinett, Spätlese, Auslese, Beerenauslese, Eiswein, Trockenbeerenauslese (Eiswein needs the same must weight as Beerenauslese)."},{"id":"MOSEL-F05","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"No — Prädikat levels indicate ripeness/must weight at harvest, not sweetness. A Kabinett can be made dry (trocken) or with residual sugar."}],"checks":[{"kp":"MOSEL-F04","type":"flash","question":"List the six German Prädikat levels in order of increasing must weight.","answer":"Kabinett, Spätlese, Auslese, Beerenauslese, Eiswein, Trockenbeerenauslese (Eiswein needs the same must weight as Beerenauslese)."},{"kp":"MOSEL-F05","type":"flash","question":"Does 'Kabinett' tell you the wine is sweet?","answer":"No — Prädikat levels indicate ripeness/must weight at harvest, not sweetness. A Kabinett can be made dry (trocken) or with residual sugar."}]}],"blind":[{"id":"MOS-BLIND","tastingProfile":"Pale lemon-green. Pronounced lime, green apple, white peach, slate/wet-stone; clearly off-dry. Low alcohol (~8%), very high acidity, light body.","deduce":["Grape: Riesling","Climate: cool","Region: Mosel"],"justifyWith":["Low alcohol + residual sugar balanced by very high acid → cool-climate off-dry Riesling","Slate/wet-stone minerality → Mosel slate slopes","Floral lime/peach aromatics + light body → Riesling, not Chardonnay"]}],"quiz":[{"id":"mosel-Q1","kp":"MOSEL-F01","question":"How do steep slate slopes help ripen Riesling in the cool, marginal Mosel?","correctAnswer":"South-facing aspect maximises sun and dark slate stores daytime heat, radiating it at night","distractors":["White chalk reflects heat back to the canopy","The slate holds water to cool the vines through summer","The slopes channel warm Mediterranean winds onto the vines"]},{"id":"mosel-Q2","kp":"MOSEL-F05","question":"Do German Prädikat levels such as Kabinett indicate sweetness?","correctAnswer":"No — they indicate ripeness/must weight at harvest; a Kabinett can be dry or off-dry","distractors":["Yes — Kabinett is always sweet and Auslese sweeter","Yes — they set a fixed residual sugar for each tier","No — they indicate only the vineyard's classification"]},{"id":"mosel-Q3","kp":"MOSEL-F03","question":"How is Eiswein made?","correctAnswer":"From grapes naturally frozen on the vine and pressed while frozen, concentrating sugar and acid","distractors":["From grapes chilled in a freezer after picking","From botrytis-affected grapes shrivelled by noble rot","From sun-dried grapes laid out on mats"]},{"id":"mosel-Q4","kp":"MOSEL-F04","question":"Which of these is the correct ascending sequence of Mosel Prädikat levels?","correctAnswer":"Kabinett, Spätlese, Auslese, Beerenauslese, Trockenbeerenauslese","distractors":["Joven, Crianza, Reserva, Gran Reserva","Spätlese, Kabinett, Auslese, Eiswein","Crianza, Kabinett, Auslese, Trocken"]},{"id":"mosel-Q5","kp":"MOSEL-CG1","question":"What style of Riesling does the cool Mosel typically produce?","correctAnswer":"Delicate, low-alcohol, racy wines of lime and green apple, often off-dry","distractors":["Full-bodied, high-alcohol oaked wines of tropical fruit","Deeply coloured, tannic wines of black fruit","Neutral, low-acid base wines for fortification"]}]},{"id":"rheingau","title":"Rheingau","alt":"Germany · Riesling & Spätburgunder","country":"Germany, Austria & Hungary","flag":"🇩🇪","blurb":"Historic Rhine-facing slopes: structured, often dry Riesling plus Assmannshausen Spätburgunder, and the birthplace of Kabinett.","source":"3__GermanyAustriaTokaj.pdf","climate":{"label":"Cool continental","scores":{"warmth":2,"sun":3,"rain":2,"diurnal":3,"risk":4}},"style":{"white":85,"red":12,"rose":2,"sparkling":1},"grapes":[{"name":"Riesling","color":"w","pct":78},{"name":"Spätburgunder","color":"r","pct":12},{"name":"Müller-Thurgau","color":"w","pct":3},{"name":"Weissburgunder","color":"w","pct":4},{"name":"Other","color":"w","pct":3}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A stretch where the Rhine flows east–west, so the slopes face fully south toward the river.","The broad Rhine moderates temperature and reflects light; autumn mists encourage noble rot for sweet wines.","Soils vary from slate and quartzite in the west to deeper loess and loam in the east."],"kkps":[],"checks":[]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Riesling dominates (~78%) — typically more powerful and structured than the Mosel, often dry.","Spätburgunder (Pinot Noir) excels at Assmannshausen on slate.","A historic home of botrytis sweet wines (the discovery of noble rot is linked here)."],"kkps":[{"id":"RHEINGAU-F01","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"It's generally more powerful and structured, and more often made dry (trocken)."},{"id":"RHEINGAU-CG1","cat":"relationship","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Cool continental climate on south-facing Rhine slopes, moderated by the wide river → Riesling ripens slowly while retaining very high acidity → racy, high-acid wines with citrus and stone fruit, from dry to noble-sweet.","chain":{"factor":"Cool continental, S-facing river slopes","mechanism":"Slow ripening; sugar develops, acidity retained","effect":"High acidity, pronounced aromatics","style":"Racy Riesling, dry to botrytis-sweet"}}],"checks":[{"kp":"RHEINGAU-F01","type":"flash","question":"How does Rheingau Riesling typically differ from the Mosel's?","answer":"It's generally more powerful and structured, and more often made dry (trocken)."},{"kp":"RHEINGAU-CG1","type":"explain","prompt":"Explain how the climate of Rheingau shapes the characteristics of its signature grape(s).","requiredPoints":["Cool continental, S-facing river slopes","Slow ripening; sugar develops, acidity retained","High acidity, pronounced aromatics","Racy Riesling, dry to botrytis-sweet"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["South-facing Rhine slopes; Kabinett was first used at Kloster Eberbach (1712), underlining the region's history.","Autumn mists off the river enable Beerenauslese/TBA in suitable years.","Frost and ripeness risk remain, though warmer than the Mosel.","Leans drier and fuller than the Mosel — much Riesling is trocken.","Erstes Gewächs / GG culture for top dry single-vineyard wines.","Spätburgunder made as serious oak-aged red at Assmannshausen."],"kkps":[{"id":"RHEINGAU-F02","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Assmannshausen, on slate soils, makes serious oak-aged Pinot Noir."}],"checks":[{"kp":"RHEINGAU-F02","type":"flash","question":"Where in the Rheingau does Spätburgunder excel?","answer":"Assmannshausen, on slate soils, makes serious oak-aged Pinot Noir."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["VDP classification strong here; GG (Grosses Gewächs) for top dry wines from Grosse Lage parcels.","Prädikat for sweeter styles; Charta/historic associations promoted dry Riesling.","Single vineyards (e.g. Schloss Johannisberg, Marcobrunn) are renowned."],"kkps":[{"id":"RHEINGAU-F03","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"The Rhine turns east–west here, so the river-facing vineyard slopes are oriented fully south for maximum sun."},{"id":"RHEINGAU-F04","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"The first use of 'Kabinett' (Kloster Eberbach, 1712), and an early association with noble-rot sweet wines."}],"checks":[{"kp":"RHEINGAU-F03","type":"flash","question":"Why do Rheingau slopes face south?","answer":"The Rhine turns east–west here, so the river-facing vineyard slopes are oriented fully south for maximum sun."},{"kp":"RHEINGAU-F04","type":"flash","question":"What historic 'first' is the Rheingau known for?","answer":"The first use of 'Kabinett' (Kloster Eberbach, 1712), and an early association with noble-rot sweet wines."}]}],"blind":[{"id":"RHEINGAU-BLIND-1","tastingProfile":"White wine. Pale lemon-green. Pronounced lime, green apple and white peach with a hint of wet stone and developing petrol/kerosene note; no oak. Dry, high acidity, medium alcohol, medium body, long finish.","deduce":["Grape: Riesling","Climate: cool","Region: Rheingau (Germany)"],"justifyWith":["High acidity + citrus/stone fruit + no oak → cool-climate Riesling","Developing petrol note + racy structure → classic Riesling with bottle age","Medium body and dry, powerful style → Rheingau rather than a sweeter, lighter region"]}],"quiz":[{"id":"rheingau-Q1","kp":"RHEINGAU-F03","question":"Why are the Rheingau's river-facing vineyard slopes oriented fully south?","correctAnswer":"The Rhine turns east–west here, so the slopes face south for maximum sun","distractors":["The vineyards lie on the cooler north bank of the river","The slopes were terraced to face away from the river","Prevailing winds force a southern aspect"]},{"id":"rheingau-Q2","kp":"RHEINGAU-F02","question":"Which Rheingau village is known for serious oak-aged Pinot Noir on slate soils?","correctAnswer":"Assmannshausen","distractors":["Kloster Eberbach","Geisenheim","Rüdesheim"]},{"id":"rheingau-Q3","kp":"RHEINGAU-F01","question":"Compared with other German Riesling regions, how is Rheingau Riesling typically styled?","correctAnswer":"More powerful and structured, and more often made dry (trocken)","distractors":["Lighter and almost always sweet","Predominantly sparkling","Light, low-acid and made for early drinking only"]},{"id":"rheingau-Q4","kp":"RHEINGAU-F04","question":"What term first associated with the Rheingau marked its history of fine Riesling?","correctAnswer":"'Kabinett' (first used at Kloster Eberbach, 1712)","distractors":["'Grosses Gewächs'","'Trockenbeerenauslese'","'Sekt'"]}]},{"id":"rheinhessen","title":"Rheinhessen","alt":"Germany · largest region","country":"Germany, Austria & Hungary","flag":"🇩🇪","blurb":"Germany's largest region: a bulk-wine past now transformed by ambitious dry Riesling on the steep 'Roter Hang' and red-slope sites.","source":"3__GermanyAustriaTokaj.pdf","climate":{"label":"Mild continental, drier","scores":{"warmth":3,"sun":3,"rain":2,"diurnal":2,"risk":3}},"style":{"white":72,"red":24,"rose":3,"sparkling":1},"grapes":[{"name":"Riesling","color":"w","pct":30},{"name":"Müller-Thurgau","color":"w","pct":16},{"name":"Grauburgunder","color":"w","pct":12},{"name":"Dornfelder","color":"r","pct":12},{"name":"Spätburgunder","color":"r","pct":10},{"name":"Silvaner","color":"w","pct":10},{"name":"Other","color":"w","pct":10}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Germany's largest wine region by area, on rolling land west of the Rhine, relatively warm and dry.","Once synonymous with cheap semi-sweet bulk wine (e.g. Liebfraumilch); now a quality hotspot.","Calcareous and loess soils on the plains; the steep red-slate 'Roter Hang' by the Rhine is prized for Riesling."],"kkps":[{"id":"RHEINHESSEN-F01","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"A steep stretch of red slate along the Rhine (Nierstein/Nackenheim) producing the region's best, distinctive Rieslings."}],"checks":[{"kp":"RHEINHESSEN-F01","type":"flash","question":"What is the 'Roter Hang' and why does it matter?","answer":"A steep stretch of red slate along the Rhine (Nierstein/Nackenheim) producing the region's best, distinctive Rieslings."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Riesling is the quality engine, with Silvaner a traditional speciality.","Müller-Thurgau and Grauburgunder/Weissburgunder for volume and modern dry whites.","Significant reds: Dornfelder (deep, soft) and Spätburgunder."],"kkps":[{"id":"RHEINHESSEN-F02","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"It's Germany's largest wine region; once known for cheap semi-sweet bulk wine (Liebfraumilch), now a hotspot for ambitious dry Riesling and Pinots."},{"id":"RHEINHESSEN-F03","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Silvaner is the traditional white speciality; Dornfelder and Spätburgunder are key reds."},{"id":"RHEINHESSEN-CG1","cat":"relationship","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Relatively warm and sheltered for Germany → Riesling and other varieties ripen reliably each year → riper-fruited, slightly fuller wines with balanced (rather than searing) acidity compared with the Mosel.","chain":{"factor":"Warmer, sheltered German climate","mechanism":"More reliable, fuller ripening","effect":"Riper fruit, balanced acidity","style":"Fuller, fruit-forward Riesling vs Mosel"}}],"checks":[{"kp":"RHEINHESSEN-F02","type":"flash","question":"What is Rheinhessen's significance by size and reputation shift?","answer":"It's Germany's largest wine region; once known for cheap semi-sweet bulk wine (Liebfraumilch), now a hotspot for ambitious dry Riesling and Pinots."},{"kp":"RHEINHESSEN-F03","type":"flash","question":"Name a traditional white speciality and two key red grapes of Rheinhessen.","answer":"Silvaner is the traditional white speciality; Dornfelder and Spätburgunder are key reds."},{"kp":"RHEINHESSEN-CG1","type":"explain","prompt":"Explain how the climate of Rheinhessen shapes ":"w","pct":10},{"name":"Müller-Thurgau","color":"w","pct":10},{"name":"Other","color":"r","pct":14}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A warm, dry, sunny region in the rain shadow of the Haardt mountains (a continuation of Alsace's Vosges).","One of Germany's warmest, driest regions — almond and fig trees grow here.","Diverse soils (limestone, sandstone, loess); the Mittelhaardt holds the top Riesling villages."],"kkps":[{"id":"PFALZ-F01","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"It sits in the rain shadow of the Haardt mountains (the northern continuation of Alsace's Vosges), making it one of Germany's warmest, sunniest regions."}],"checks":[{"kp":"PFALZ-F01","type":"flash","question":"Why is the Pfalz warm and dry?","answer":"It sits in the rain shadow of the Haardt mountains (the northern continuation of Alsace's Vosges), making it one of Germany's warmest, sunniest regions."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Riesling makes powerful, riper, often dry wines, especially in the Mittelhaardt.","Strong for Pinots: Spätburgunder, Grauburgunder, Weissburgunder all ripen well.","Dornfelder and other reds thrive in the warmth — the Pfalz is a red-wine stronghold."],"kkps":[{"id":"PFALZ-F02","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Powerful dry Riesling (esp. the Mittelhaardt) and ripe Pinots/reds (Spätburgunder, Grauburgunder, Weissburgunder, Dornfelder)."},{"id":"PFALZ-F03","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"The Mittelhaardt — Forst, Deidesheim and Ruppertsberg."},{"id":"PFALZ-CG1","cat":"relationship","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement"
