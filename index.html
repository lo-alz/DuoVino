g style/quality.","narrative":["Kaiserstuhl is the benchmark sub-region for Spätburgunder.","VDP/GG framework for top wines.","High proportion of dry (trocken) production (~64%)."],"kkps":[],"checks":[]}],"blind":[{"id":"BADEN-BLIND-1","tastingProfile":"Red wine. Medium ruby. Pronounced ripe red cherry, raspberry and strawberry with subtle spice. Dry, medium-plus acidity, medium tannin, medium-plus alcohol, medium-to-full body, medium-plus finish.","deduce":["Grape: Pinot Noir (Spätburgunder)","Climate: warm","Region: Baden (Germany)"],"justifyWith":["Pale-medium colour + ripe red cherry + medium tannin → Pinot Noir","Riper, fuller body than typical German red → warm, sunny southern Baden","Medium-plus alcohol with retained acidity → fully ripened in Germany's warmest region"]}],"quiz":[{"id":"baden-Q1","kp":"BADEN-F01","question":"What is notable about Baden's position among German wine regions?","correctAnswer":"It is Germany's southernmost and warmest region, the only major one in EU Zone B","distractors":["It is Germany's coolest, most northerly region","It is the only region permitted to make sweet wine","It is Germany's largest region by volume"]},{"id":"baden-Q2","kp":"BADEN-F02","question":"Which warm, volcanic sun-trap is one of Baden's most famous sites?","correctAnswer":"The Kaiserstuhl","distractors":["The Mittelhaardt","The Wachau terraces","The Mosel slate slopes"]},{"id":"baden-Q3","kp":"BADEN-F01","question":"Which red grape, ripened fully in Baden's warm climate, is the region's flagship?","correctAnswer":"Spätburgunder (Pinot Noir)","distractors":["Dornfelder","Lemberger (Blaufränkisch)","Portugieser"]},{"id":"baden-Q4","kp":"BADEN-F03","question":"As an EU Zone B region, how much is enrichment (chaptalisation) limited to in Baden?","correctAnswer":"2% abv","distractors":["3% abv","0.5% abv","Enrichment is not permitted"]}]},{"id":"wachau-danube","title":"Wachau & Danube","alt":"Austria · Niederösterreich · Grüner Veltliner","country":"Germany, Austria & Hungary","flag":"🇩🇪","blurb":"Steep, hand-terraced Danube valleys (Wachau, Kremstal, Kamptal): dry, mineral Grüner Veltliner and Riesling, with the Wachau's ripeness ladder.","source":"3__GermanyAustriaTokaj.pdf","climate":{"label":"Cool continental, sunny days","scores":{"warmth":3,"sun":3,"rain":2,"diurnal":4,"risk":3}},"style":{"white":85,"red":12,"rose":2,"sparkling":1},"grapes":[{"name":"Grüner Veltliner","color":"w","pct":55},{"name":"Riesling","color":"w","pct":20},{"name":"Zweigelt","color":"r","pct":8},{"name":"Weissburgunder","color":"w","pct":6},{"name":"Other","color":"w","pct":11}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["The Danube valleys west of Vienna in Niederösterreich (Lower Austria): Wachau, Kremstal and Kamptal.","Cool continental but with warm sunny days and big diurnal swings (cool nights preserve aromatics/acidity).","Two influences: warm Pannonian air from the east and cool air from the northern forests; loess and primary-rock (gneiss) soils."],"kkps":[{"id":"WACHAU-DANUBE-F01","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Grüner Veltliner — peppery and citrusy; fuller on loess (where it needs water), while Riesling shines on steep primary-rock terraces."}],"checks":[{"kp":"WACHAU-DANUBE-F01","type":"flash","question":"What is Austria's signature grape and how does site affect it here?","answer":"Grüner Veltliner — peppery and citrusy; fuller on loess (where it needs water), while Riesling shines on steep primary-rock terraces."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Grüner Veltliner: Austria's signature — peppery, citrus, full-bodied on loess; needs water.","Riesling: superb on steep primary-rock terraces, dry and mineral.","Zweigelt for easy reds; Weissburgunder and others in support."],"kkps":[{"id":"WACHAU-DANUBE-F02","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Steinfeder (light, <11.5% abv), Federspiel (11.5–12.5%), Smaragd (ripe and concentrated, >12.5%)."},{"id":"WACHAU-DANUBE-CG1","cat":"relationship","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Sunny continental climate on stony Danube terraces with a wide diurnal range → Grüner Veltliner and Riesling ripen while retaining high acidity → concentrated yet fresh, full-bodied dry whites (Smaragd).","chain":{"factor":"Continental; stony terraces, big diurnal range","mechanism":"Ripening with acidity retained","effect":"High acidity, concentration","style":"Full-bodied yet fresh dry whites"}}],"checks":[{"kp":"WACHAU-DANUBE-F02","type":"flash","question":"Name the Wachau's three dry ripeness categories from lightest to ripest.","answer":"Steinfeder (light, <11.5% abv), Federspiel (11.5–12.5%), Smaragd (ripe and concentrated, >12.5%)."},{"kp":"WACHAU-DANUBE-CG1","type":"explain","prompt":"Explain how the climate of Wachau & Danube shapes the characteristics of its signature grape(s).","requiredPoints":["Continental; stony terraces, big diurnal range","Ripening with acidity retained","High acidity, concentration","Full-bodied yet fresh dry whites"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Steep, hand-built stone terraces along the Danube are worked by hand; flatter loess sites can be machine-harvested.","Long, varied harvest window; cool nights retain acidity and perfume.","Some humidity/botrytis risk near the river, but dry wine is the goal here.","Almost entirely dry, unoaked or subtly oaked, to showcase fruit and minerality.","Wachau's own ripeness ladder (by must weight/abv): Steinfeder (light, <11.5%), Federspiel (11.5–12.5%), Smaragd (ripe, >12.5%).","Single-vineyard bottlings increasingly important."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["DAC system links style to origin: Kamptal, Kremstal DACs allow Grüner Veltliner and Riesling; Wachau is its own DAC.","Wines outside DAC rules use the broader 'Niederösterreich'.","Vinea Wachau producers use the Steinfeder/Federspiel/Smaragd categories (a private classification)."],"kkps":[{"id":"WACHAU-DANUBE-F03","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"A regionally typical PDO linking style to origin (e.g. Kamptal, Kremstal allow Grüner Veltliner and Riesling); non-conforming wines use the wider 'Niederösterreich'."},{"id":"WACHAU-DANUBE-F04","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Large diurnal range — warm sunny days ripen the fruit while cool nights (and cool forest air) preserve acidity and perfume."}],"checks":[{"kp":"WACHAU-DANUBE-F03","type":"flash","question":"What does the Austrian DAC system signify?","answer":"A regionally typical PDO linking style to origin (e.g. Kamptal, Kremstal allow Grüner Veltliner and Riesling); non-conforming wines use the wider 'Niederösterreich'."},{"kp":"WACHAU-DANUBE-F04","type":"flash","question":"Why do the Danube valleys keep such fresh, aromatic whites?","answer":"Large diurnal range — warm sunny days ripen the fruit while cool nights (and cool forest air) preserve acidity and perfume."}]}],"blind":[{"id":"WAC-BLIND","tastingProfile":"Pale lemon. Pronounced grapefruit, white pepper, lentil/legume, stone fruit, wet stone. Dry, high acidity, medium(+) alcohol, medium(+) body, unoaked.","deduce":["Grape: Grüner Veltliner","Style: Smaragd (ripe, dry)","Region: Wachau"],"justifyWith":["White pepper + lentil + grapefruit → Grüner Veltliner's signature","Full body, riper, high alcohol but dry/unoaked → Wachau Smaragd","Stony minerality on primary rock → Danube terraces"]}],"quiz":[{"id":"wachau-danube-Q1","kp":"WACHAU-DANUBE-F02","question":"In the Wachau, which ripeness category denotes the ripest, most concentrated dry wines (>12.5% abv)?","correctAnswer":"Smaragd","distractors":["Steinfeder","Federspiel","Spätlese"]},{"id":"wachau-danube-Q2","kp":"WACHAU-DANUBE-F01","question":"Which grape gives peppery, citrusy whites and shows fuller on loess soils in the Danube valleys?","correctAnswer":"Grüner Veltliner","distractors":["Riesling","Welschriesling","Sauvignon Blanc"]},{"id":"wachau-danube-Q3","kp":"WACHAU-DANUBE-F04","question":"How does the wide diurnal range benefit Danube-valley whites?","correctAnswer":"Warm sunny days ripen the fruit while cool nights preserve acidity and perfume","distractors":["Constant warmth speeds ripening and lowers acidity","High humidity encourages noble rot for sweet wines","Persistent wind dries and concentrates the berries"]},{"id":"wachau-danube-Q4","kp":"WACHAU-DANUBE-F03","question":"What does the DAC designation (e.g. Kamptal, Kremstal) indicate?","correctAnswer":"A regionally typical PDO linking a permitted style and grapes to origin","distractors":["A minimum sweetness level for the wine","A guaranteed single-vineyard bottling","A maximum alcohol cap of 11.5%"]}]},{"id":"burgenland","title":"Burgenland","alt":"Austria · Neusiedlersee · reds & sweet","country":"Germany, Austria & Hungary","flag":"🇩🇪","blurb":"Warm Pannonian east by Lake Neusiedl: Austria's red-wine heartland (Blaufränkisch, Zweigelt) and a reliable source of botrytis sweet wines.","source":"3__GermanyAustriaTokaj.pdf","climate":{"label":"Warm Pannonian, humid lake","scores":{"warmth":4,"sun":4,"rain":2,"diurnal":3,"risk":3}},"style":{"red":62,"white":26,"sweet":10,"rose":2},"grapes":[{"name":"Blaufränkisch","color":"r","pct":30},{"name":"Zweigelt","color":"r","pct":24},{"name":"Welschriesling","color":"w","pct":12},{"name":"Grüner Veltliner","color":"w","pct":10},{"name":"St. Laurent","color":"r","pct":8},{"name":"Other","color":"r","pct":16}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Eastern Austria on the Hungarian border, warmed by the Pannonian climate; centred on the shallow Lake Neusiedl (Neusiedlersee).","The lake raises humidity and autumn mists, giving very reliable noble rot for sweet wines.","Warm enough to ripen black grapes fully — Austria's main red region; soils include loam, gravel and the limestone Leithaberg."],"kkps":[],"checks":[]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Blaufränkisch: structured, peppery, age-worthy red — the quality benchmark (Leithaberg, Mittelburgenland DACs).","Zweigelt (Blaufränkisch × St. Laurent): juicy, widely planted red.","Welschriesling and others, thin-skinned and lake-side, for botrytis sweet wines."],"kkps":[{"id":"BURGENLAND-CG1","cat":"relationship","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Warm Pannonian climate with humidity off Lake Neusiedl → Blaufränkisch and Zweigelt ripen fully (and botrytis can form) → ripe, structured reds and outstanding sweet wines.","chain":{"factor":"Warm Pannonian; lake humidity","mechanism":"Full ripening; botrytis forms","effect":"Ripe reds; noble rot","style":"Structured reds and sweet wines"}}],"checks":[{"kp":"BURGENLAND-CG1","type":"explain","prompt":"Explain how the climate of Burgenland shapes the characteristics of its signature grape(s).","requiredPoints":["Warm Pannonian; lake humidity","Full ripening; botrytis forms","Ripe reds; noble rot","Structured reds and sweet wines"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Warm, fairly dry growing season; the lake's humidity drives botrytis in autumn.","Flatter sites allow mechanisation; Leithaberg hills give structured reds.","Welschriesling planted near the lake for its thin skins (prone to noble rot).","Serious oak-aged Blaufränkisch and Zweigelt-based reds.","Consistent botrytis sweet wines (Neusiedlersee almost every vintage); around Rust they may be labelled Ausbruch.","Sweet styles show marmalade and high acidity, usually unoaked."],"kkps":[{"id":"BURGENLAND-F01","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"The warm Pannonian climate ripens black grapes fully, while shallow Lake Neusiedl raises humidity for very reliable autumn botrytis."},{"id":"BURGENLAND-F02","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"A historic botrytis sweet-wine style from the town of Rust on Lake Neusiedl."},{"id":"BURGENLAND-F03","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Its thin skins make it prone to noble rot, ideal for the lake-side botrytis sweet wines."}],"checks":[{"kp":"BURGENLAND-F01","type":"flash","question":"Why is Burgenland Austria's red-wine and sweet-wine heartland?","answer":"The warm Pannonian climate ripens black grapes fully, while shallow Lake Neusiedl raises humidity for very reliable autumn botrytis."},{"kp":"BURGENLAND-F02","type":"flash","question":"What is Ruster Ausbruch?","answer":"A historic botrytis sweet-wine style from the town of Rust on Lake Neusiedl."},{"kp":"BURGENLAND-F03","type":"flash","question":"Why is Welschriesling planted near the lake?","answer":"Its thin skins make it prone to noble rot, ideal for the lake-side botrytis sweet wines."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Red-focused DACs: Leithaberg (and white), Mittelburgenland, Eisenberg — defined by Blaufränkisch.","Ruster Ausbruch is a historic sweet-wine designation from the town of Rust.","Neusiedlersee DAC covers Zweigelt-based reds and sweet wines."],"kkps":[{"id":"BURGENLAND-F04","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Blaufränkisch — structured, peppery and age-worthy (Leithaberg, Mittelburgenland DACs)."}],"checks":[{"kp":"BURGENLAND-F04","type":"flash","question":"Which red grape is Burgenland's quality benchmark?","answer":"Blaufränkisch — structured, peppery and age-worthy (Leithaberg, Mittelburgenland DACs)."}]}],"blind":[{"id":"BURGENLAND-BLIND-1","tastingProfile":"Red wine. Medium(+) ruby. Pronounced blackberry, dark cherry, black pepper and a subtle floral, earthy note with cedar oak. Dry, high acidity, medium(+) tannin, medium alcohol, medium(+) body, medium(+) finish.","deduce":["Grape: Blaufränkisch","Climate: warm","Region: Burgenland (Austria)"],"justifyWith":["High acidity + firm tannin + black pepper → structured, peppery Blaufränkisch","Ripe dark fruit with medium(+) body → fully ripened in a warm Pannonian climate","Savoury, age-worthy structure rather than jammy → Austrian Burgenland, not a hot-climate red"]}],"quiz":[{"id":"burgenland-Q1","kp":"BURGENLAND-F01","question":"Why is Burgenland a very reliable source of botrytis sweet wines?","correctAnswer":"Shallow Lake Neusiedl raises autumn humidity, very reliably encouraging noble rot","distractors":["Cold Atlantic fog rolls in each autumn","Heavy autumn rainfall from Alpine storms","The mistral wind concentrates the grapes"]},{"id":"burgenland-Q2","kp":"BURGENLAND-F04","question":"Which black grape is Burgenland's structured, peppery, age-worthy specialty?","correctAnswer":"Blaufränkisch","distractors":["Spätburgunder","Tempranillo","Nebbiolo"]},{"id":"burgenland-Q3","kp":"BURGENLAND-F02","question":"Ausbruch is a historic botrytis sweet-wine style from which town?","correctAnswer":"Rust, on Lake Neusiedl","distractors":["Sauternes, on the Garonne","Tokaj, in Hungary","Rust, in the Wachau"]},{"id":"burgenland-Q4","kp":"BURGENLAND-CG1","question":"What makes Burgenland Austria's red-wine heartland?","correctAnswer":"Its warm Pannonian climate ripens Blaufränkisch and Zweigelt fully","distractors":["A cool maritime climate that retains high acidity","High-altitude vineyards with a large diurnal range","Slate slopes that radiate stored heat at night"]}]},{"id":"tokaj","title":"Tokaj","alt":"Hungary · Furmint · Aszú","country":"Germany, Austria & Hungary","flag":"🇩🇪","blurb":"Hungary's volcanic noble-rot legend: sweet Tokaji Aszú graded by sugar (puttonyos), the rare Eszencia, plus a modern dry Furmint movement.","source":"3__GermanyAustriaTokaj.pdf","climate":{"label":"Continental, misty autumns","scores":{"warmth":3,"sun":3,"rain":2,"diurnal":3,"risk":3}},"style":{"sweet":55,"white":42,"red":3},"grapes":[{"name":"Furmint","color":"w","pct":63},{"name":"Hárslevelű","color":"w","pct":20},{"name":"Sárga Muskotály","color":"w","pct":9},{"name":"Other","color":"w","pct":8}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["North-east Hungary toward the Slovakian border, where the Tisza and Bodrog rivers meet at the town of Tokaj.","A region of hundreds of extinct volcanoes; volcanic soils on the Zemplén foothills.","Long, dry autumns with morning river mists are ideal for noble rot (botrytis)."],"kkps":[],"checks":[]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Furmint: the dominant grape (~63%) — high acid, needs the long season to ripen, takes botrytis well; base for sweet and dry wines.","Hárslevelű: aromatic, fruitier; Sárga Muskotály (Muscat) adds perfume.","Six varieties are permitted in the Tokaji PDO."],"kkps":[{"id":"TOKAJ-CG1","cat":"relationship","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Continental climate where autumn mists off the rivers trigger botrytis → Furmint shrivels to concentrated sugar while keeping searing acidity → lusciously sweet Aszú wines balanced by high acidity.","chain":{"factor":"Continental; river mists trigger botrytis","mechanism":"Botrytis concentration; acidity kept","effect":"High sugar with high acidity","style":"Lusciously sweet, balanced Aszú"}}],"checks":[{"kp":"TOKAJ-CG1","type":"explain","prompt":"Explain how the climate of Tokaj shapes the characteristics of its signature grape(s).","requiredPoints":["Continental; river mists trigger botrytis","Botrytis concentration; acidity kept","High sugar with high acidity","Lusciously sweet, balanced Aszú"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Aszú (botrytised) berries are picked individually in several passes — labour-intensive; yields are tiny (~2–3 hL/ha).","For dry wines, healthy non-botrytised fruit is sought, often from higher, cooler sites.","World's first vineyard classification took place here (1732).","Aszú: botrytised berries are mashed to a paste and macerated in must/fermenting must/base wine to draw out sugar and flavour, then fermented slowly; aged ≥18 months in oak (2 years total).","Sweetness (formerly 3–6 puttonyos) is now set by minimum residual sugar — Aszú must exceed 120 g/L; lower levels become 'Late Harvest' or sweet Szamorodni.","Eszencia: the rare free-run syrup from Aszú berries — >450 g/L sugar, <5% abv, ferments for years.","Szamorodni ('as it comes'): whole bunches, made dry (flor-aged) or sweet; a modern dry Furmint movement is also growing."],"kkps":[{"id":"TOKAJ-F01","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Individually picked botrytised (Aszú) berries are mashed to paste and macerated in must, fermenting must or base wine to extract sugar/flavour, fermented slowly, then aged at least 18 months in oak (2 years total)."},{"id":"TOKAJ-F02","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Extremely rare free-run syrup that trickles from Aszú berries — over 450 g/L sugar and under ~5% abv, taking years to ferment."},{"id":"TOKAJ-F03","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Furmint (~63%) — high acidity, it needs Tokaj's long sunny autumn to ripen and takes botrytis well, serving both sweet Aszú and the growing dry-Furmint category."},{"id":"TOKAJ-F04","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"The confluence of the Tisza and Bodrog rivers brings morning autumn mists (humidity) followed by long, dry, sunny afternoons, encouraging botrytis then concentration."}],"checks":[{"kp":"TOKAJ-F01","type":"flash","question":"How is Tokaji Aszú made?","answer":"Individually picked botrytised (Aszú) berries are mashed to paste and macerated in must, fermenting must or base wine to extract sugar/flavour, fermented slowly, then aged at least 18 months in oak (2 years total)."},{"kp":"TOKAJ-F02","type":"flash","question":"What is Eszencia?","answer":"Extremely rare free-run syrup that trickles from Aszú berries — over 450 g/L sugar and under ~5% abv, taking years to ferment."},{"kp":"TOKAJ-F03","type":"flash","question":"Which grape dominates Tokaj and why does it suit the region?","answer":"Furmint (~63%) — high acidity, it needs Tokaj's long sunny autumn to ripen and takes botrytis well, serving both sweet Aszú and the growing dry-Furmint category."},{"kp":"TOKAJ-F04","type":"flash","question":"What conditions make Tokaj ideal for noble rot?","answer":"The confluence of the Tisza and Bodrog rivers brings morning autumn mists (humidity) followed by long, dry, sunny afternoons, encouraging botrytis then concentration."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Tokaji PDO (broken into village/estate/named-vineyard categories); Hungary joined the EU in 2004 adopting PDO/PGI.","Aszú must be bottled in the traditional 500 mL clear-glass Tokaji bottle and aged in oak.","Zempléni PGI covers other/international grapes at higher yields outside the PDO."],"kkps":[{"id":"TOKAJ-F05","cat":"fact","verified":true,"src":"3__GermanyAustriaTokaj.pdf","statement":"Historically by 'puttonyos' (3–6); since 2013 by minimum residual sugar — Aszú must exceed 120 g/L (≈ old 5 puttonyos), with lower levels reclassified as Late Harvest or sweet Szamorodni."}],"checks":[{"kp":"TOKAJ-F05","type":"flash","question":"How is Aszú sweetness graded today versus historically?","answer":"Historically by 'puttonyos' (3–6); since 2013 by minimum residual sugar — Aszú must exceed 120 g/L (≈ old 5 puttonyos), with lower levels reclassified as Late Harvest or sweet Szamorodni."}]}],"blind":[{"id":"TOK-BLIND","tastingProfile":"Deep amber/gold. Pronounced apricot, orange marmalade, honey, dried fig, botrytis 'noble rot'. Lusciously sweet, very high acidity, medium alcohol, full body.","deduce":["Style: Tokaji Aszú (botrytised)","Grape: Furmint","Region: Tokaj"],"justifyWith":["Marmalade/apricot/honey + noble rot + intense sweetness → botrytis sweet wine","Searing high acidity balancing sugar → Furmint in Tokaj","Amber colour + dried-fruit complexity → barrel-aged Aszú"]}],"quiz":[{"id":"tokaj-Q1","kp":"TOKAJ-F03","question":"Which is the principal grape of Tokaj, taking botrytis well and serving both sweet and dry styles?","correctAnswer":"Furmint","distractors":["Hárslevelű","Sárga Muskotály","Welschriesling"]},{"id":"tokaj-Q2","kp":"TOKAJ-F04","question":"What encourages the autumn botrytis essential to Tokaji Aszú?","correctAnswer":"Morning mists from the Tisza–Bodrog confluence followed by dry, sunny afternoons","distractors":["Cool ocean fog rolling in off the Atlantic","Constant high rainfall throughout the autumn","Irrigation channels that humidify the vineyards"]},{"id":"tokaj-Q3","kp":"TOKAJ-F05","question":"Since 2013, how is Tokaji Aszú sweetness defined?","correctAnswer":"By minimum residual sugar — Aszú must exceed 120 g/L","distractors":["By the number of puttonyos (3–6)","By the years aged in oak","By the percentage of botrytised berries by weight"]},{"id":"tokaj-Q4","kp":"TOKAJ-F02","question":"What is Eszencia in Tokaj?","correctAnswer":"Rare free-run syrup from Aszú berries, over 450 g/L sugar and under ~5% abv","distractors":["A dry Furmint fermented fully to high alcohol","A fortified wine made by adding grape spirit","A sparkling wine made by the traditional method"]}]},{"id":"barossa-valley","title":"Barossa Valley","alt":"South Australia · old-vine Shiraz","country":"Australia","flag":"🇦🇺","blurb":"Australia's powerhouse of rich, full-bodied Shiraz from some of the world's oldest vines.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Warm Mediterranean","scores":{"warmth":5,"sun":5,"rain":1,"diurnal":4,"risk":2}},"style":{"red":85,"white":15},"grapes":[{"name":"Shiraz","color":"r","pct":60},{"name":"Cabernet Sauvignon","color":"r","pct":18},{"name":"Grenache","color":"r","pct":7},{"name":"Chardonnay","color":"w","pct":9},{"name":"Semillon","color":"w","pct":6}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Warm Mediterranean climate with hot, sunny summer days but cooler nights → a big diurnal range that helps retain some acidity and develop aromatics.","60 km inland and north of Adelaide on a low, protected valley floor; the cooler Eden Valley hills lie to the east.","Low growing-season rainfall (~160 mm) means irrigation is widely needed, but low humidity keeps disease pressure low.","Northern ironstone soils retain water, producing the most age-worthy wines."],"kkps":[{"id":"BAROSSA-VALLEY-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Still richer, riper and higher in alcohol with softer tannins, even on cooler higher sites."},{"id":"BAROSSA-VALLEY-R02","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Warm Mediterranean climate with hot, sunny summer days but cooler nights → a big diurnal range that helps retain some acidity and develop aromatics."}],"checks":[{"kp":"BAROSSA-VALLEY-F01","type":"flash","question":"How does Barossa Cabernet compare to Coonawarra?","answer":"Still richer, riper and higher in alcohol with softer tannins, even on cooler higher sites."},{"kp":"BAROSSA-VALLEY-R02","type":"explain","prompt":"Starting from “Warm Mediterranean climate with hot, sunny summer days but cooler nights”, explain what this leads to — through to the resulting wine style.","requiredPoints":["a big diurnal range that helps retain some acidity and develop aromatics"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Hot Barossa floor → Shiraz ripens fully to high sugar with soft tannins → full-bodied, high-alcohol reds with very ripe (often cooked/dried) black fruit and sweet oak.","Home to some of the world's oldest Shiraz and Grenache vines (first planted 1840s); South Australia has never had phylloxera.","Cabernet Sauvignon does better on slightly cooler, higher sites but is still richer and riper here than in Coonawarra or Margaret River.","Grenache, from old and new vines, features in Rhône-style GSM blends and increasingly fine single varietals."],"kkps":[{"id":"BAROSSA-VALLEY-F03","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"South Australia has never been affected by phylloxera, so old plantings (from the 1840s) survive."},{"id":"BAROSSA-VALLEY-R04","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Hot Barossa floor → Shiraz ripens fully to high sugar with soft tannins → full-bodied, high-alcohol reds with very ripe (often cooked/dried) black fruit and sweet oak."},{"id":"BAROSSA-VALLEY-CG1","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Hot, dry climate with warm nights → Shiraz ripens fully to high sugar with low acid retention → deep, full-bodied reds with very ripe/jammy black fruit, high alcohol, soft ripe tannins and chocolate/spice.","chain":{"factor":"Hot, dry, warm nights","mechanism":"Full sugar ripeness, little acid retained","effect":"High alcohol, soft tannin, low acid","style":"Rich, jammy full-bodied Shiraz"}}],"checks":[{"kp":"BAROSSA-VALLEY-F03","type":"flash","question":"Why does Barossa have some of the world's oldest vines?","answer":"South Australia has never been affected by phylloxera, so old plantings (from the 1840s) survive."},{"kp":"BAROSSA-VALLEY-R04","type":"explain","prompt":"Starting from “Hot Barossa floor”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Shiraz ripens fully to high sugar with soft tannins","full-bodied, high-alcohol reds with very ripe (often cooked/dried) black fruit and sweet oak"]},{"kp":"BAROSSA-VALLEY-CG1","type":"explain","prompt":"Explain how the climate of Barossa Valley shapes the characteristics of its signature grape(s).","requiredPoints":["Hot, dry, warm nights","Full sugar ripeness, little acid retained","High alcohol, soft tannin, low acid","Rich, jammy full-bodied Shiraz"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Dry-farmed old bush vines → low yields and outstanding concentration.","The 2009 Barossa Old Vine Charter records and promotes old vines (Old 35+, Survivor 70+, Centenarian 100+, Ancestor 125+ years).","Reds are often taken off skins early, so no post-fermentation maceration is needed.","Traditionally matured in new American oak (coconut/vanilla); the trend is shifting toward French oak and earlier picking for fresher, more structured wines."],"kkps":[{"id":"BAROSSA-VALLEY-F05","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Shiraz (~60%): full-bodied, high alcohol, high soft tannins, pronounced very ripe black fruit and sweet oak."},{"id":"BAROSSA-VALLEY-F06","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Traditionally new American oak; the trend is increasingly toward French oak and earlier harvest for freshness."},{"id":"BAROSSA-VALLEY-R07","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Dry-farmed old bush vines → low yields and outstanding concentration."}],"checks":[{"kp":"BAROSSA-VALLEY-F05","type":"flash","question":"What is Barossa Valley's signature grape and style?","answer":"Shiraz (~60%): full-bodied, high alcohol, high soft tannins, pronounced very ripe black fruit and sweet oak."},{"kp":"BAROSSA-VALLEY-F06","type":"flash","question":"What oak is traditional in Barossa, and what is the trend?","answer":"Traditionally new American oak; the trend is increasingly toward French oak and earlier harvest for freshness."},{"kp":"BAROSSA-VALLEY-R07","type":"explain","prompt":"Starting from “Dry-farmed old bush vines”, explain what this leads to — through to the resulting wine style.","requiredPoints":["low yields and outstanding concentration"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Labelled under the Barossa zone or Barossa Valley region; increasing interest in sub-regions."],"kkps":[],"checks":[]}],"blind":[{"id":"BAROSSA-BLIND-1","tastingProfile":"Red wine. Deep ruby. Pronounced very ripe/jammy blackberry and black plum, chocolate, sweet spice and vanilla/coconut oak. Dry, medium acidity, high soft ripe tannins, high alcohol, full body, pronounced cooked dark fruit, long finish.","deduce":["Grape: Shiraz (Syrah)","Climate: hot","Region: Barossa Valley (Australia)"],"justifyWith":["Jammy/cooked black fruit + high alcohol + soft ripe tannins → Shiraz ripened in a hot, dry climate","Sweet vanilla/coconut and chocolate → generous (often American) new oak typical of Barossa","Full body with only medium acidity → warm-climate Australian Shiraz, not a peppery cool-climate style"]}],"quiz":[{"id":"barossa-valley-Q1","kp":"BAROSSA-VALLEY-F05","question":"What is the signature grape and style of the Barossa Valley?","correctAnswer":"Shiraz: full-bodied, high alcohol, soft tannins, very ripe black fruit and sweet oak","distractors":["Pinot Noir: light, high-acid and elegant","Riesling: bone-dry, steely and lime-scented","Cabernet Sauvignon: lean and herbaceous"]},{"id":"barossa-valley-Q2","kp":"BAROSSA-VALLEY-F03","question":"Why do plantings from the 1840s still survive in the Barossa?","correctAnswer":"South Australia has never been affected by phylloxera","distractors":["The vines were all grafted onto resistant rootstock","Strict laws forced replanting of old vines","The cold winters kill phylloxera each year"]},{"id":"barossa-valley-Q3","kp":"BAROSSA-VALLEY-F06","question":"What oak trend is described for Barossa Shiraz?","correctAnswer":"Traditionally new American oak, moving increasingly toward French oak and earlier harvest","distractors":["A shift from French oak to no oak at all","Mandatory ageing in clay amphorae","Exclusive use of old neutral foudres"]},{"id":"barossa-valley-Q4","kp":"BAROSSA-VALLEY-R02","question":"What does the Barossa's large diurnal range achieve?","correctAnswer":"Hot sunny days with cooler nights help retain some acidity and develop aromatics","distractors":["It triggers reliable botrytis each autumn","It prevents the grapes from ever fully ripening","It eliminates the need for any irrigation"]}]},{"id":"eden-valley","title":"Eden Valley","alt":"South Australia · high-altitude Riesling","country":"Australia","flag":"🇦🇺","blurb":"Cool, high hills east of Barossa making racy, age-worthy Riesling and structured Shiraz.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Warm, cooler at altitude","scores":{"warmth":3,"sun":4,"rain":2,"diurnal":5,"risk":3}},"style":{"white":50,"red":50},"grapes":[{"name":"Riesling","color":"w","pct":32},{"name":"Shiraz","color":"r","pct":40},{"name":"Grenache","color":"r","pct":12},{"name":"Chardonnay","color":"w","pct":16}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Rolling, exposed hills east of Barossa, part of the Mount Lofty Ranges, with altitude up to ~600 m → cooler temperatures and a high diurnal range.","Higher rainfall than Barossa (~230 mm); strong winds can affect flowering and ripening and lower yields.","Most soils have good water-holding capacity, so dry-farming is common."],"kkps":[{"id":"EDEN-VALLEY-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Up to ~600 m gives cooler temperatures and a high diurnal range, preserving acidity and aromatics."},{"id":"EDEN-VALLEY-R02","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Rolling, exposed hills east of Barossa, part of the Mount Lofty Ranges, with altitude up to ~600 m → cooler temperatures and a high diurnal range."}],"checks":[{"kp":"EDEN-VALLEY-F01","type":"flash","question":"How does altitude shape Eden Valley wines?","answer":"Up to ~600 m gives cooler temperatures and a high diurnal range, preserving acidity and aromatics."},{"kp":"EDEN-VALLEY-R02","type":"explain","prompt":"Starting from “Rolling, exposed hills east of Barossa, part of the Mount Lofty Ranges, with altitude up to ~600 m”, explain what this leads to — through to the resulting wine style.","requiredPoints":["cooler temperatures and a high diurnal range"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Altitude and cool air → Riesling ripens slowly while keeping very high acidity → dry, steely wines with pure lemon/lime and floral notes that age to honey, nuttiness and toast.","Riesling is the most planted variety (>30%).","Shiraz here has higher acidity, firmer tannins and lower alcohol than Barossa — between Barossa's very ripe style and cool-climate peppery styles, with ripe plum/blackberry and sweet spice."],"kkps":[{"id":"EDEN-VALLEY-F03","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Higher acidity, firmer tannins, lower alcohol — a more structured mid-point style."},{"id":"EDEN-VALLEY-R04","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Altitude and cool air → Riesling ripens slowly while keeping very high acidity → dry, steely wines with pure lemon/lime and floral notes that age to honey, nuttiness and toast."}],"checks":[{"kp":"EDEN-VALLEY-F03","type":"flash","question":"How does Eden Valley Shiraz differ from Barossa Valley?","answer":"Higher acidity, firmer tannins, lower alcohol — a more structured mid-point style."},{"kp":"EDEN-VALLEY-R04","type":"explain","prompt":"Starting from “Altitude and cool air”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Riesling ripens slowly while keeping very high acidity","dry, steely wines with pure lemon/lime and floral notes that age to honey, nuttiness and toast"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Steep sites are hand-harvested; dry-farming is widespread thanks to water-holding soils.","Riesling is whole-bunch pressed gently to avoid extracting phenolics, fermented in stainless steel."],"kkps":[{"id":"EDEN-VALLEY-F05","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"High-altitude Riesling: dry, high acidity, lemon/lime, floral and steely, ageing to honey and toast."}],"checks":[{"kp":"EDEN-VALLEY-F05","type":"flash","question":"What is Eden Valley best known for?","answer":"High-altitude Riesling: dry, high acidity, lemon/lime, floral and steely, ageing to honey and toast."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["May be labelled Eden Valley, Barossa, Adelaide or South Australia."],"kkps":[],"checks":[]}],"blind":[{"id":"EDEN-BLIND-1","tastingProfile":"White wine. Pale lemon. Pronounced lime, lemon, white blossom and a steely/mineral note, no oak. Dry, high acidity, medium alcohol, medium body, long finish.","deduce":["Grape: Riesling","Climate: moderate (cooler at altitude)","Region: Eden Valley (South Australia)"],"justifyWith":["Pure lime/lemon + high acidity + steeliness → dry Australian Riesling","Intense, ripe lime fruit with floral lift → warm region cooled by altitude/diurnal range","Long finish and ageing potential → high-altitude Eden Valley over warmer Barossa floor"]}],"quiz":[{"id":"eden-valley-Q1","kp":"EDEN-VALLEY-F01","question":"How does Eden Valley's altitude (up to ~600 m) affect its wines?","correctAnswer":"It gives cooler temperatures and a high diurnal range, preserving acidity and aromatics","distractors":["It traps heat, raising alcohol and reducing acidity","It increases rainfall, causing dilution and rot","It eliminates diurnal range, giving flat, soft wines"]},{"id":"eden-valley-Q2","kp":"EDEN-VALLEY-F05","question":"What is the classic profile of Eden Valley Riesling?","correctAnswer":"Dry, high acidity, lemon/lime, floral and steely, ageing to honey and toast","distractors":["Off-dry, low acidity, tropical mango, drunk young","Sweet, botrytised, with marmalade and saffron","Oaky, buttery and full, with low acidity"]},{"id":"eden-valley-Q3","kp":"EDEN-VALLEY-F03","question":"How does Eden Valley Shiraz compare with neighbouring Barossa Valley?","correctAnswer":"Higher acidity, firmer tannins and lower alcohol — a more structured, mid-point style","distractors":["Jammier, softer and higher in alcohol","Paler, lighter-bodied and lower in tannin like Pinot Noir","Identical, as the two share the same climate"]},{"id":"eden-valley-Q4","kp":"EDEN-VALLEY-R02","question":"Where is Eden Valley located?","correctAnswer":"In rolling, exposed hills east of Barossa, part of the Mount Lofty Ranges","distractors":["On the flat valley floor west of Adelaide near the coast","In the cool Yarra Valley near Melbourne","On the limestone coast of Coonawarra"]}]},{"id":"clare-valley","title":"Clare Valley","alt":"South Australia · lime-scented Riesling","country":"Australia","flag":"🇦🇺","blurb":"Warm continental valley famous for bone-dry, lime-driven Riesling under screwcap.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Warm Continental","scores":{"warmth":4,"sun":5,"rain":2,"diurnal":5,"risk":2}},"style":{"red":72,"white":28},"grapes":[{"name":"Shiraz","color":"r","pct":35},{"name":"Riesling","color":"w","pct":26},{"name":"Cabernet Sauvignon","color":"r","pct":21},{"name":"Other","color":"r","pct":18}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Warm continental climate: hot summer days, cool afternoon breezes and cold nights → a big diurnal range that locks in acidity.","~125 km north of Adelaide; a shallow valley of ridges and hills, 300–500 m altitude.","Growing-season rain is low (~250 mm), so dams and dry-farming are needed.","Whites planted on higher, more exposed slopes; blacks on lower, warmer sites."],"kkps":[{"id":"CLARE-VALLEY-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Riesling: bone-dry, high acidity, pronounced lime; flinty/age-worthy on slate, floral on limestone."},{"id":"CLARE-VALLEY-R02","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Warm continental climate: hot summer days, cool afternoon breezes and cold nights → a big diurnal range that locks in acidity."}],"checks":[{"kp":"CLARE-VALLEY-F01","type":"flash","question":"What is Clare Valley's signature white and style?","answer":"Riesling: bone-dry, high acidity, pronounced lime; flinty/age-worthy on slate, floral on limestone."},{"kp":"CLARE-VALLEY-R02","type":"explain","prompt":"Starting from “Warm continental climate: hot summer days, cool afternoon breezes and cold nights”, explain what this leads to — through to the resulting wine style.","requiredPoints":["a big diurnal range that locks in acidity"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool nights and altitude → Riesling keeps very high acidity while ripening → bone-dry, intensely lime-scented wines.","Slate soils (Polish Hill) give flintier, neutral, age-worthy Riesling; limestone (Watervale) gives more floral, aromatic wine drunk younger.","Shiraz and Cabernet show pronounced ripe black fruit with a distinctive minty/eucalyptus character."],"kkps":[{"id":"CLARE-VALLEY-F03","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"To avoid TCA cork taint and oxidation, keeping Riesling's vibrant fresh fruit (led by Jeffrey Grosset, 2000)."},{"id":"CLARE-VALLEY-F04","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Pronounced ripe black fruit with a minty or eucalyptus note."},{"id":"CLARE-VALLEY-R05","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Cool nights and altitude → Riesling keeps very high acidity while ripening → bone-dry, intensely lime-scented wines."}],"checks":[{"kp":"CLARE-VALLEY-F03","type":"flash","question":"Why did Clare Valley pioneer screwcaps?","answer":"To avoid TCA cork taint and oxidation, keeping Riesling's vibrant fresh fruit (led by Jeffrey Grosset, 2000)."},{"kp":"CLARE-VALLEY-F04","type":"flash","question":"What distinctive character marks Clare Valley reds?","answer":"Pronounced ripe black fruit with a minty or eucalyptus note."},{"kp":"CLARE-VALLEY-R05","type":"explain","prompt":"Starting from “Cool nights and altitude”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Riesling keeps very high acidity while ripening","bone-dry, intensely lime-scented wines"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Not steep, so machine harvesting is common.","Riesling canopies are managed for sun protection to avoid sunburn and reduce TDN 'petrol' character in young wines.","In 2000 Jeffrey Grosset led Clare growers to adopt screwcaps to avoid TCA taint and oxidation, preserving Riesling's fresh fruit."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Clare Valley is a registered region within the Mount Lofty Ranges zone."],"kkps":[],"checks":[]}],"blind":[{"id":"CLARE-BLIND-1","tastingProfile":"White wine. Pale lemon. Pronounced lime, lemon and a flinty/mineral edge, no oak. Dry, high acidity, medium alcohol, medium body, medium-plus finish.","deduce":["Grape: Riesling","Climate: warm","Region: Clare Valley (Australia)"],"justifyWith":["Bone-dry + high acidity + pronounced lime → Clare Valley Riesling","Ripe lime intensity with medium alcohol → warm climate with cool nights and altitude preserving acidity","No oak and pure citrus fruit → screwcap-sealed, protectively made Australian Riesling"]}],"quiz":[{"id":"clare-valley-Q1","kp":"CLARE-VALLEY-F01","question":"What is the signature style of Clare Valley Riesling?","correctAnswer":"Bone-dry, high acidity with pronounced lime","distractors":["Off-dry and floral with low acidity","Rich, oaky and tropical","Sweet and botrytised"]},{"id":"clare-valley-Q2","kp":"CLARE-VALLEY-R02","question":"Why does Clare Valley's warm continental climate still yield high-acid wines?","correctAnswer":"Cool afternoon breezes and cold nights give a big diurnal range that locks in acidity","distractors":["Constant cloud cover keeps the region cool all day","High rainfall dilutes the sugars","Coastal fog blankets the vineyards each morning"]},{"id":"clare-valley-Q3","kp":"CLARE-VALLEY-F03","question":"Why did Clare Valley producers pioneer the use of screwcaps for Riesling around 2000?","correctAnswer":"To avoid TCA cork taint and oxidation, keeping the wine's fresh fruit","distractors":["To allow faster oxidative ageing in bottle","To meet a legal requirement for Australian Riesling","To reduce bottling costs only"]},{"id":"clare-valley-Q4","kp":"CLARE-VALLEY-F04","question":"What flavour note is characteristic of Clare Valley Cabernet Sauvignon and Shiraz?","correctAnswer":"Pronounced ripe black fruit with a minty or eucalyptus note","distractors":["Green capsicum and gooseberry","Sour cherry and tobacco","Apple, quince and honey"]}]},{"id":"adelaide-hills","title":"Adelaide Hills","alt":"South Australia · cool-climate whites","country":"Australia","flag":"🇦🇺","blurb":"Cool, high-altitude hills near Adelaide for zesty Sauvignon Blanc, Chardonnay and Pinot.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Moderate Mediterranean (cool)","scores":{"warmth":3,"sun":4,"rain":3,"diurnal":4,"risk":3}},"style":{"white":60,"red":40},"grapes":[{"name":"Sauvignon Blanc","color":"w","pct":32},{"name":"Chardonnay","color":"w","pct":28},{"name":"Pinot Noir","color":"r","pct":24},{"name":"Shiraz","color":"r","pct":16}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Moderate Mediterranean climate cooled by altitude (400–500 m) despite intense low-latitude sunshine → riper fruit but retained acidity.","~25 km east of Adelaide; valleys and steep hillsides near the ocean.","Relatively high growing-season rainfall (280–320 mm) → fungal disease and rot are hazards.","Higher, cooler central area (Piccadilly, Lenswood) suits Sauvignon Blanc, Chardonnay and Pinot Noir."],"kkps":[{"id":"ADELAIDE-HILLS-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Altitude (400–500 m) offsets the intense sunshine, keeping temperatures cool and acidity high."},{"id":"ADELAIDE-HILLS-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Fungal disease and rot, due to relatively high growing-season rainfall."},{"id":"ADELAIDE-HILLS-R03","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Moderate Mediterranean climate cooled by altitude (400–500 m) despite intense low-latitude sunshine → riper fruit but retained acidity."},{"id":"ADELAIDE-HILLS-R04","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Relatively high growing-season rainfall (280–320 mm) → fungal disease and rot are hazards."}],"checks":[{"kp":"ADELAIDE-HILLS-F01","type":"flash","question":"Why is Adelaide Hills a cool-climate region despite low latitude?","answer":"Altitude (400–500 m) offsets the intense sunshine, keeping temperatures cool and acidity high."},{"kp":"ADELAIDE-HILLS-F02","type":"flash","question":"What is the main vineyard hazard here?","answer":"Fungal disease and rot, due to relatively high growing-season rainfall."},{"kp":"ADELAIDE-HILLS-R03","type":"explain","prompt":"Starting from “Moderate Mediterranean climate cooled by altitude (400–500 m) despite intense low-latitude sunshine”, explain what this leads to — through to the resulting wine style.","requiredPoints":["riper fruit but retained acidity"]},{"kp":"ADELAIDE-HILLS-R04","type":"explain","prompt":"Starting from “Relatively high growing-season rainfall (280–320 mm)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["fungal disease and rot are hazards"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool air with intense sun → Sauvignon Blanc ripens to intense (not herbaceous) citrus-to-tropical fruit with high acidity.","Chardonnay shows medium+ to high acidity, medium body and ripe stone fruit, built up with MLC, oak and lees ageing for texture.","Pinot Noir (also used for sparkling) gives medium+ acidity, medium body and red-fruit, delicate-to-spicy character."],"kkps":[{"id":"ADELAIDE-HILLS-R05","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Cool air with intense sun → Sauvignon Blanc ripens to intense (not herbaceous) citrus-to-tropical fruit with high acidity."}],"checks":[{"kp":"ADELAIDE-HILLS-R05","type":"explain","prompt":"Starting from “Cool air with intense sun”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Sauvignon Blanc ripens to intense (not herbaceous) citrus-to-tropical fruit with high acidity"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Steep sites at 400–500 m restrict mechanisation; a wide variety of aspects and soils.","A major source of base wine for traditional-method sparkling."],"kkps":[{"id":"ADELAIDE-HILLS-F06","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Intense (not herbaceous) high-acid Sauvignon Blanc and textural, ripe-stone-fruit Chardonnay; also sparkling base."}],"checks":[{"kp":"ADELAIDE-HILLS-F06","type":"flash","question":"What white styles define Adelaide Hills?","answer":"Intense (not herbaceous) high-acid Sauvignon Blanc and textural, ripe-stone-fruit Chardonnay; also sparkling base."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Region within the Mount Lofty Ranges zone."],"kkps":[],"checks":[]}],"blind":[{"id":"ADELAIDE-BLIND-1","tastingProfile":"White wine. Pale lemon. Pronounced ripe passionfruit, grapefruit and white peach, more fruit-driven than green/herbaceous. Dry, high acidity, medium alcohol, medium body, medium-plus finish.","deduce":["Grape: Sauvignon Blanc","Climate: moderate","Region: Adelaide Hills (Australia)"],"justifyWith":["High acid + pungent passionfruit/grapefruit aromatics → Sauvignon Blanc","Ripe fruit-driven (not green) character + high acid → sunny but altitude-cooled moderate climate","Riper tropical edge → Adelaide Hills rather than cool Loire"]}],"quiz":[{"id":"adelaide-hills-Q1","kp":"ADELAIDE-HILLS-F01","question":"What chiefly keeps the Adelaide Hills cool despite intense low-latitude sunshine?","correctAnswer":"Altitude of 400–500 m","distractors":["Cooling Atlantic sea breezes","A mountain rain shadow","Persistent coastal fog"]},{"id":"adelaide-hills-Q2","kp":"ADELAIDE-HILLS-F02","question":"What is the main viticultural hazard in the Adelaide Hills, due to its growing-season rainfall?","correctAnswer":"Fungal disease and rot","distractors":["Spring frost","Drought stress","Sunburn and heat spikes"]},{"id":"adelaide-hills-Q3","kp":"ADELAIDE-HILLS-F06","question":"What style of Sauvignon Blanc does the Adelaide Hills produce?","correctAnswer":"Intense (not herbaceous) high-acid citrus-to-tropical wine","distractors":["Oxidative, nutty fortified style","Off-dry, lightly herbaceous Loire style","Heavily oaked, full-bodied style"]},{"id":"adelaide-hills-Q4","kp":"ADELAIDE-HILLS-R03","question":"Which climate classification best fits the Adelaide Hills?","correctAnswer":"Moderate Mediterranean, cooled by altitude","distractors":["Cool maritime","Hot continental","Warm semi-desert"]}]},{"id":"mclaren-vale","title":"McLaren Vale","alt":"South Australia · Shiraz & Grenache","country":"Australia","flag":"🇦🇺","blurb":"Warm maritime region of deep, full-bodied Shiraz and old-vine Grenache by the Gulf.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Warm Mediterranean (maritime)","scores":{"warmth":4,"sun":5,"rain":2,"diurnal":3,"risk":2}},"style":{"red":91,"white":9},"grapes":[{"name":"Shiraz","color":"r","pct":59},{"name":"Cabernet Sauvignon","color":"r","pct":19},{"name":"Grenache","color":"r","pct":13},{"name":"Other","color":"w","pct":9}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Warm Mediterranean climate with warm-to-hot summers, moderated by sea breezes off the Gulf St Vincent and down from the Adelaide Hills.","~30 km south of Adelaide; gentle hills from sea level to ~350 m.","Low growing-season rain (<200 mm) with wet winters; soils range from sand-loam to clay."],"kkps":[{"id":"MCLAREN-VALE-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Sea breezes off the Gulf and down from the Adelaide Hills moderate the warm summers."}],"checks":[{"kp":"MCLAREN-VALE-F01","type":"flash","question":"How does the sea influence McLaren Vale?","answer":"Sea breezes off the Gulf and down from the Adelaide Hills moderate the warm summers."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Warm climate + sandy soils over clay (water retention) → Shiraz ripens fully → deep-coloured, full-bodied, high-alcohol reds with pronounced dark fruit and oak spice.","Higher-altitude sites give higher acidity and tannin; lower sites give cooked, jammy fruit.","Old dry-farmed bush-vine Grenache gives medium tannin/acidity, fresh red fruit and spice or herbal notes from old oak."],"kkps":[{"id":"MCLAREN-VALE-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Shiraz (~59%) and Cabernet (~19%), plus prized old-vine Grenache; deep, full-bodied reds."},{"id":"MCLAREN-VALE-R03","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Warm climate + sandy soils over clay (water retention) → Shiraz ripens fully → deep-coloured, full-bodied, high-alcohol reds with pronounced dark fruit and oak spice."}],"checks":[{"kp":"MCLAREN-VALE-F02","type":"flash","question":"What are McLaren Vale's signature grapes?","answer":"Shiraz (~59%) and Cabernet (~19%), plus prized old-vine Grenache; deep, full-bodied reds."},{"kp":"MCLAREN-VALE-R03","type":"explain","prompt":"Starting from “Warm climate + sandy soils over clay (water retention)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Shiraz ripens fully","deep-coloured, full-bodied, high-alcohol reds with pronounced dark fruit and oak spice"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Fertile soils can over-crop Shiraz and Grenache, so canopy management protects quality.","Strong adoption of organic and biodynamic viticulture, helped by low disease pressure.","Reds increasingly made like Pinot Noir — whole-berry/cluster fermentation, stem inclusion, less new oak, foudres."],"kkps":[{"id":"MCLAREN-VALE-F04","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Toward whole-berry/cluster fermentation, stem inclusion, less new oak and foudres for fresher styles."}],"checks":[{"kp":"MCLAREN-VALE-F04","type":"flash","question":"How is the modern red winemaking trend shifting?","answer":"Toward whole-berry/cluster fermentation, stem inclusion, less new oak and foudres for fresher styles."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Region within the Fleurieu zone."],"kkps":[],"checks":[]}],"blind":[{"id":"MCLAREN-BLIND-1","tastingProfile":"Red wine. Deep ruby/purple. Pronounced ripe blackberry, blueberry, plum, dark chocolate and sweet vanilla/oak spice with a hint of menthol. Dry, medium-plus acidity, medium-plus to high ripe tannins, high alcohol, full body, long finish.","deduce":["Grape: Shiraz","Climate: warm","Region: McLaren Vale (Australia)"],"justifyWith":["Pronounced ripe dark fruit + high alcohol + full body → warm-climate Shiraz","Dark chocolate and sweet oak spice → ripe Australian Shiraz with oak","Maritime moderation keeping medium-plus acidity → McLaren Vale rather than a hotter inland region"]}],"quiz":[{"id":"mclaren-vale-Q1","kp":"MCLAREN-VALE-F02","question":"Which is the leading grape of McLaren Vale?","correctAnswer":"Shiraz (~59%), making deep, full-bodied reds","distractors":["Pinot Noir, making light, elegant reds","Riesling, making crisp, dry whites","Chardonnay, making rich oaked whites"]},{"id":"mclaren-vale-Q2","kp":"MCLAREN-VALE-F01","question":"What moderates the warm summers of McLaren Vale?","correctAnswer":"Sea breezes off the Gulf and cooler air down from the Adelaide Hills","distractors":["High altitude above 1,000 m","A cold continental winter freeze","Persistent fog from a nearby cold ocean current"]},{"id":"mclaren-vale-Q3","kp":"MCLAREN-VALE-R03","question":"What style of Shiraz does McLaren Vale's warm climate and sandy soils over clay produce?","correctAnswer":"Deep-coloured, full-bodied, high-alcohol reds with pronounced dark fruit and oak spice","distractors":["Pale, light-bodied, high-acid reds with red-cherry fruit","Off-dry, low-alcohol reds with floral notes","Tannic, austere reds needing decades to soften"]},{"id":"mclaren-vale-Q4","kp":"MCLAREN-VALE-F04","question":"How are some producers shifting winemaking for fresher McLaren Vale styles?","correctAnswer":"Whole-berry/cluster fermentation, stem inclusion, less new oak and use of foudres","distractors":["Adding acidity and fortifying the wines","Extended skin maceration with heavy new oak","Carbonic maceration and early bottling without oak"]}]},{"id":"coonawarra","title":"Coonawarra","alt":"South Australia · Terra Rossa Cabernet","country":"Australia","flag":"🇦🇺","blurb":"A cool strip of red terra rossa over limestone making structured, minty Cabernet Sauvignon.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Cool Mediterranean (maritime)","scores":{"warmth":3,"sun":3,"rain":3,"diurnal":3,"risk":4}},"style":{"red":88,"white":12},"grapes":[{"name":"Cabernet Sauvignon","color":"r","pct":58},{"name":"Shiraz","color":"r","pct":24},{"name":"Merlot","color":"r","pct":10},{"name":"Chardonnay","color":"w","pct":8}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Cool Mediterranean climate similar to Bordeaux but slightly warmer and drier in the growing season.","Famous Terra Rossa: a thin band of iron-rich red soil over free-draining limestone, which contributes to its reputation for fine Cabernet.","Cool afternoon sea breezes reach far inland, and cool nights with cloud cover lengthen the ripening season.","Low growing-season rain (~260 mm) so irrigation is often needed; spring frost is a hazard managed with sprinklers."],"kkps":[{"id":"COONAWARRA-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Terra Rossa (iron-rich red soil over limestone) for structured Cabernet Sauvignon."},{"id":"COONAWARRA-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Cool maritime climate and a long season give slow ripening, firm tannin and elegant structure (Bordeaux-like)."}],"checks":[{"kp":"COONAWARRA-F01","type":"flash","question":"What soil makes Coonawarra famous, and for which grape?","answer":"Terra Rossa (iron-rich red soil over limestone) for structured Cabernet Sauvignon."},{"kp":"COONAWARRA-F02","type":"flash","question":"How does climate shape Coonawarra Cabernet?","answer":"Cool maritime climate and a long season give slow ripening, firm tannin and elegant structure (Bordeaux-like)."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool climate + long season → Cabernet Sauvignon ripens slowly to firm structure → medium-to-full body, blackcurrant fruit and a distinctive mint/eucalyptus note.","Shiraz here is more medium-bodied and peppery than the warm-climate styles further north."],"kkps":[{"id":"COONAWARRA-F03","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Blackcurrant with a distinctive mint/eucalyptus character, plus firm structure."},{"id":"COONAWARRA-R04","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Cool climate + long season → Cabernet Sauvignon ripens slowly to firm structure → medium-to-full body, blackcurrant fruit and a distinctive mint/eucalyptus note."}],"checks":[{"kp":"COONAWARRA-F03","type":"flash","question":"What signature aroma marks Coonawarra Cabernet?","answer":"Blackcurrant with a distinctive mint/eucalyptus character, plus firm structure."},{"kp":"COONAWARRA-R04","type":"explain","prompt":"Starting from “Cool climate + long season”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Cabernet Sauvignon ripens slowly to firm structure","medium-to-full body, blackcurrant fruit and a distinctive mint/eucalyptus note"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Flat aspect; dry-farming with irrigation from aquifers where needed.","Cabernet is typically oak-matured to support its structure and ageing potential."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Region within the Limestone Coast zone."],"kkps":[],"checks":[]}],"blind":[{"id":"COONAWARRA-BLIND-1","tastingProfile":"Red wine. Deep ruby. Pronounced blackcurrant, blackberry and a distinctive mint/eucalyptus lift, with cedar and vanilla oak. Dry, medium(+) acidity, medium(+) to high tannin, medium(+) alcohol, medium(+) to full body, long finish.","deduce":["Grape: Cabernet Sauvignon","Climate: moderate","Region: Coonawarra (Australia)"],"justifyWith":["Blackcurrant + firm tannin + cedar → classic Cabernet Sauvignon","Distinctive mint/eucalyptus note → Coonawarra signature","Firm structure and freshness over jammy fruit → cool maritime, long-season ripening, not a hot region"]}],"quiz":[{"id":"coonawarra-Q1","kp":"COONAWARRA-F01","question":"What is the famous soil of Coonawarra?","correctAnswer":"Terra rossa — iron-rich red soil over limestone","distractors":["Albariza chalk","Dark slate","Galets roulés pebbles"]},{"id":"coonawarra-Q2","kp":"COONAWARRA-F03","question":"What distinctive flavour marks Coonawarra Cabernet Sauvignon?","correctAnswer":"Blackcurrant with a mint/eucalyptus character","distractors":["Tropical pineapple and mango","Rose petal and Turkish delight","Tar and dried roses"]},{"id":"coonawarra-Q3","kp":"COONAWARRA-F02","question":"How does Coonawarra's cool maritime climate shape its Cabernet?","correctAnswer":"A long, slow season gives firm tannin and elegant, Bordeaux-like structure","distractors":["Intense heat gives soft, jammy, high-alcohol wines","A very short season prevents full ripening","Lake humidity gives reliable botrytis sweet wines"]},{"id":"coonawarra-Q4","kp":"COONAWARRA-R04","question":"What body and structure does Coonawarra Cabernet typically show?","correctAnswer":"Medium-to-full body with firm structure","distractors":["Light body with soft, low tannin","Full body but very low acidity","Light, neutral and best drunk young"]}]},{"id":"hunter-valley","title":"Hunter Valley","alt":"New South Wales · ageless Semillon","country":"Australia","flag":"🇦🇺","blurb":"Hot, humid NSW region producing a unique low-alcohol, age-worthy unoaked Semillon.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Hot, humid maritime","scores":{"warmth":5,"sun":3,"rain":4,"diurnal":2,"risk":4}},"style":{"red":45,"white":55},"grapes":[{"name":"Semillon","color":"w","pct":40},{"name":"Shiraz","color":"r","pct":35},{"name":"Chardonnay","color":"w","pct":25}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Hot and humid with relatively high rainfall (~750 mm) and afternoon cloud, which moderates heat but raises rot risk at harvest.","One of Australia's oldest wine regions, near the eastern mountains north of Sydney."],"kkps":[{"id":"HUNTER-VALLEY-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Heat plus humidity and harvest rain → rot risk, making harvest timing critical."}],"checks":[{"kp":"HUNTER-VALLEY-F01","type":"flash","question":"What is the main climatic challenge in the Hunter?","answer":"Heat plus humidity and harvest rain → rot risk, making harvest timing critical."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Early picking in a hot climate → Semillon is harvested at low sugar with high acidity → low-alcohol, lean, neutral unoaked wines in youth that develop honey, toast and complexity over 5–10 years in bottle.","Shiraz is medium-bodied with earthy, savoury character."],"kkps":[{"id":"HUNTER-VALLEY-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"It is picked early at low sugar (high acidity) to make a lean, fresh, age-worthy style."},{"id":"HUNTER-VALLEY-R03","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Early picking in a hot climate → Semillon is harvested at low sugar with high acidity → low-alcohol, lean, neutral unoaked wines in youth that develop honey, toast and complexity over 5–10 years in bottle."}],"checks":[{"kp":"HUNTER-VALLEY-F02","type":"flash","question":"Why is Hunter Semillon low in alcohol?","answer":"It is picked early at low sugar (high acidity) to make a lean, fresh, age-worthy style."},{"kp":"HUNTER-VALLEY-R03","type":"explain","prompt":"Starting from “Early picking in a hot climate”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Semillon is harvested at low sugar with high acidity","low-alcohol, lean, neutral unoaked wines in youth that develop honey, toast and complexity over 5–10 years in bottle"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Harvest timing is critical to beat humidity and rot.","Classic Hunter Semillon is fermented in stainless steel and bottled early, unoaked, to preserve fruit for long ageing."],"kkps":[{"id":"HUNTER-VALLEY-F04","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Unoaked Semillon: low alcohol, high acidity, lean and neutral young, ageing to honey/toast over 5–10 years."}],"checks":[{"kp":"HUNTER-VALLEY-F04","type":"flash","question":"What is Hunter Valley's iconic wine?","answer":"Unoaked Semillon: low alcohol, high acidity, lean and neutral young, ageing to honey/toast over 5–10 years."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Hunter is a region with notable sub-regions (e.g. Pokolbin)."],"kkps":[],"checks":[]}],"blind":[{"id":"HUNTER-BLIND-1","tastingProfile":"White wine. Pale lemon. Medium-intensity lemon, grass and a touch of lanolin, developing toast and honey with age; no oak. Dry, high acidity, low alcohol, light-to-medium body, medium-plus finish.","deduce":["Grape: Semillon","Climate: warm","Region: Hunter Valley (Australia)"],"justifyWith":["High acidity + low alcohol + lean neutral fruit → early-picked Semillon","No oak + lanolin/toast development → classic Hunter unoaked style","Light body despite a warm origin → deliberately early harvest in a hot climate"]}],"quiz":[{"id":"hunter-valley-Q1","kp":"HUNTER-VALLEY-F02","question":"How is Hunter Valley Semillon harvested to create its lean, age-worthy style?","correctAnswer":"Picked early at low sugar with high acidity","distractors":["Picked very late at high sugar","Picked botrytis-affected for sweetness","Picked and then barrel-fermented in new oak"]},{"id":"hunter-valley-Q2","kp":"HUNTER-VALLEY-F01","question":"What is the main viticultural hazard in the Hunter's hot, humid maritime climate?","correctAnswer":"Rot risk from heat, humidity and harvest rain, making timing critical","distractors":["Spring frost from cold nights","Drought requiring heavy irrigation","Hail in the growing season"]},{"id":"hunter-valley-Q3","kp":"HUNTER-VALLEY-F04","question":"How does classic unoaked Hunter Semillon develop with bottle age?","correctAnswer":"From lean and neutral in youth to honey and toast over 5–10 years","distractors":["It becomes oxidised and nutty within a year","It gains coconut and vanilla from oak","It loses all acidity and fades quickly"]},{"id":"hunter-valley-Q4","kp":"HUNTER-VALLEY-R03","question":"What is the alcohol level of classic Hunter Valley Semillon?","correctAnswer":"Low alcohol, due to early picking at low sugar","distractors":["High alcohol from late picking","Fortified to around 18%","Medium-high alcohol from full ripeness"]}]},{"id":"yarra-valley","title":"Yarra Valley","alt":"Victoria · cool-climate Pinot & Chardonnay","country":"Australia","flag":"🇦🇺","blurb":"Cool Victorian valley for elegant Pinot Noir, Chardonnay, sparkling and peppery Shiraz.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Cool maritime","scores":{"warmth":2,"sun":3,"rain":3,"diurnal":3,"risk":3}},"style":{"red":50,"white":50},"grapes":[{"name":"Pinot Noir","color":"r","pct":35},{"name":"Chardonnay","color":"w","pct":35},{"name":"Shiraz","color":"r","pct":18},{"name":"Cabernet Sauvignon","color":"r","pct":12}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Cool climate near Melbourne, with cooler and warmer sub-zones across a range of altitudes.","(Note: Victoria, unlike South Australia, does have phylloxera.)"],"kkps":[{"id":"YARRA-VALLEY-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Cooler climate gives less body, medium alcohol and a distinct black-pepper note."}],"checks":[{"kp":"YARRA-VALLEY-F01","type":"flash","question":"How does Yarra Shiraz differ from Barossa?","answer":"Cooler climate gives less body, medium alcohol and a distinct black-pepper note."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and c ":"flash","question":"What are Yarra Valley's signature grapes?","answer":"Pinot Noir and Chardonnay (still and sparkling), plus cool-climate peppery Shiraz."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Region within the Port Phillip zone, Victoria."],"kkps":[],"checks":[]}],"blind":[{"id":"YARRA-BLIND-1","tastingProfile":"Red wine. Medium ruby. Pronounced red cherry, raspberry and strawberry with subtle forest-floor and savoury notes, light oak spice. Dry, high acidity, medium tannins, medium alcohol, medium body, fresh red-fruit flavours, medium-plus finish.","deduce":["Grape: Pinot Noir","Climate: cool","Region: Yarra Valley (Australia)"],"justifyWith":["Pale-to-medium colour + red cherry/raspberry + medium tannin + high acid → Pinot Noir from a cool climate","Elegant medium body with fresh acidity rather than jammy weight → cool maritime Yarra, not a warm Australian region","Savoury/forest-floor complexity with restrained oak → quality cool-climate Pinot Noir"]}],"quiz":[{"id":"yarra-valley-Q1","kp":"YARRA-VALLEY-F04","question":"Which grapes are the Yarra Valley best known for?","correctAnswer":"Pinot Noir and Chardonnay (still and sparkling), plus cool-climate peppery Shiraz","distractors":["Shiraz and Grenache GSM blends","Riesling and Semillon","Cabernet Sauvignon and Merlot blends"]},{"id":"yarra-valley-Q2","kp":"YARRA-VALLEY-R03","question":"How does cool-climate Yarra Shiraz differ from a warm-climate style?","correctAnswer":"Less full-bodied, medium alcohol, with a distinct black-pepper character","distractors":["Jammier, higher in alcohol and fuller-bodied","Sweet and fortified","Pale and oxidative with nutty notes"]},{"id":"yarra-valley-Q3","kp":"YARRA-VALLEY-R02","question":"What does the Yarra's cool climate do for Pinot Noir and Chardonnay?","correctAnswer":"They ripen slowly with high acidity, giving elegant, medium-bodied wine te → Pinot Noir and Chardonnay ripen slowly keeping very high acidity → ideal base for premium traditional-method sparkling, plus delicate still Pinot Noir.","Riesling and Sauvignon Blanc give high-acid, aromatic whites."],"kkps":[{"id":"TASMANIA-R02","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Cool climate → Pinot Noir and Chardonnay ripen slowly keeping very high acidity → ideal base for premium traditional-method sparkling, plus delicate still Pinot Noir."}],"checks":[{"kp":"TASMANIA-R02","type":"explain","prompt":"Starting from “Cool climate”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Pinot Noir and Chardonnay ripen slowly keeping very high acidity","ideal base for premium traditional-method sparkling, plus delicate still Pinot Noir"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Site selection matters to achieve ripeness in a marginal climate.","A key source of Australia's top sparkling wine."],"kkps":[{"id":"TASMANIA-F03","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Premium traditional-method sparkling, plus cool-climate Pinot Noir, Chardonnay and Riesling."},{"id":"TASMANIA-F04","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Its cool maritime climate ripens Pinot and Chardonnay slowly, keeping the very high acidity sparkling needs."}],"checks":[{"kp":"TASMANIA-F03","type":"flash","question":"What is Tasmania best known for?","answer":"Premium traditional-method sparkling, plus cool-climate Pinot Noir, Chardonnay and Riesling."},{"kp":"TASMANIA-F04","type":"flash","question":"Why is Tasmania ideal for sparkling base wine?","answer":"Its cool maritime climate ripens Pinot and Chardonnay slowly, keeping the very high acidity sparkling needs."}]},{"id":"LO4","title":"Law, classificati tralia's coolest state, a cool maritime island","distractors":["Australia's hottest, driest inland region","A warm Mediterranean coastal strip","A high-altitude continental plateau"]}]},{"id":"marlborough","title":"Marlborough","alt":"South Island · world-famous Sauvignon Blanc","country":"New Zealand","flag":"🇳🇿","blurb":"New Zealand's largest region and the home of its pungent, aromatic Sauvignon Blanc.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Cool maritime","scores":{"warmth":3,"sun":5,"rain":2,"diurnal":4,"risk":3}},"style":{"white":85,"red":15},"grapes":[{"name":"Sauvignon Blanc","color":"w","pct":80},{"name":"Pinot Noir","color":"r","pct":10},{"name":"Chardonnay","color":"w","pct":5},{"name":"Pinot Gris","color":"w","pct":5}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Cool maritime climate with moderately warm summers, mild winters and a long, dry growing season; it is very sunny (~2,410 hours/year).","Surrounding mountain ranges shelter it from rain, so despite ~650 mm the growing season stays dry → low fungal-disease pressure.","Free-draining alluvial soils (silt and clay) require irrigation; flat land suits machine harvesting.","Two main valleys: the warmer Wairau, the clay-rich, cooler Southern Valleys, and the coolest, windiest Awatere."],"kkps":[{"id":"MARLBOROUGH-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Sauvignon Blanc: dry, high acidity, intensely aromatic — passionfruit, green capsicum, herbaceous and tropical."},{"id":"MARLBOROUGH-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"A long, dry, sunny growing season lets grapes hang into autumn, building very intense flavour while keeping high acidity."},{"id":"MARLBOROUGH-F03","cat":"fact","verified":true,"src":"6__AustraliaNZ
