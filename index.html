his leads to — through to the resulting wine style.","requiredPoints":["Syrah and Riesling keep freshness; Red Mountain (warmest) gives the most powerful, tannic reds"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Frost and winter freeze are the chief hazards → many vineyards are planted on slopes for air drainage.","Drip irrigation from the Columbia River sustains vines in the arid desert (150–250 mm rainfall).","Sub-AVAs include Yakima Valley (oldest, largest), Walla Walla, Red Mountain and Horse Heaven Hills.","A high % of new oak is used, with some older or large oak vessels, particularly for Syrah.","Warm-site reds are ripe and full-bodied with high alcohol; cooler sites within the valley keep freshness for whites."],"kkps":[{"id":"COLUMBIA-VALLEY-R10","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Frost and winter freeze are the chief hazards → many vineyards are planted on slopes for air drainage."}],"checks":[{"kp":"COLUMBIA-VALLEY-R10","type":"explain","prompt":"Starting from “Frost and winter freeze are the chief hazards”, explain what this leads to — through to the resulting wine style.","requiredPoints":["many vineyards are planted on slopes for air drainage"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Columbia Valley is a multi-state AVA extending into Oregon; it can span more than one state.","Washington follows California-style labelling (≥75% for a stated variety)."],"kkps":[],"checks":[]}],"blind":[{"id":"COLUMBIA-BLIND-1","tastingProfile":"Red wine. Deep ruby/purple. Pronounced ripe blackcurrant, black cherry, plum with cedar, vanilla and sweet baking-spice oak. Dry, medium-plus to high acidity, medium-plus to high ripe tannins, high alcohol, full body, long finish.","deduce":["Grape: Cabernet Sauvignon","Climate: warm","Region: Columbia Valley (Washington, USA)"],"justifyWith":["Ripe blackcurrant + high alcohol + full body → warm-climate Cabernet Sauvignon","High alcohol yet retained medium-plus to high acidity → big diurnal range with cold nights","Ripe, deeply coloured fruit with structured tannins and oak → sunny, dry continental Washington"]}],"quiz":[{"id":"columbia-valley-Q1","kp":"COLUMBIA-VALLEY-F01","question":"Why does the Columbia Valley have a dry, sunny, warm continental climate?","correctAnswer":"The Cascade Range blocks wet Pacific weather, creating a rain shadow","distractors":["A warm ocean current borders the vineyards","Persistent fog rolls in from the Pacific","High altitude lowers temperatures year-round"]},{"id":"columbia-valley-Q2","kp":"COLUMBIA-VALLEY-R05","question":"Why is irrigation essential in the Columbia Valley?","correctAnswer":"It is arid and desert-like, with only ~150–250 mm of rainfall, supplied by the Columbia River","distractors":["Heavy summer rain must be drained from the soils","Vines are planted in pure free-draining sand only","Cool maritime conditions slow water uptake"]},{"id":"columbia-valley-Q3","kp":"COLUMBIA-VALLEY-R08","question":"What red wine style results from warm, dry days and cold nights in the Columbia Valley?","correctAnswer":"Reds with high alcohol and medium-plus to high acidity, deep colour and ripe fruit","distractors":["Pale, low-alcohol, high-acid reds","Soft, low-acid, jammy reds","Light, tannic reds with green, unripe fruit"]},{"id":"columbia-valley-Q4","kp":"COLUMBIA-VALLEY-R10","question":"What is the chief vineyard hazard in the Columbia Valley, and how is it managed?","correctAnswer":"Frost and winter freeze, managed by planting on slopes for cold-air drainage","distractors":["Spring hail, managed with netting","Fungal disease, managed with sprays","Drought, managed by dry-farming"]},{"id":"columbia-valley-Q5","kp":"COLUMBIA-VALLEY-F07","question":"Why is Riesling well suited to the Columbia Valley?","correctAnswer":"It is winter-hardy and ripens reliably where other vinifera struggle; usually made off-dry","distractors":["It thrives in humid maritime conditions","It needs little sunlight and ripens late","It resists drought without any irrigation"]}]},{"id":"finger-lakes","title":"Finger Lakes","alt":"New York, USA · cool-climate Riesling","country":"United States","flag":"🇺🇸","blurb":"New York's quality heartland — racy, age-worthy Riesling and Cabernet Franc moderated by deep glacial lakes.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Cool continental","scores":{"warmth":2,"sun":3,"rain":4,"diurnal":3,"risk":5}},"style":{"white":62,"red":38},"grapes":[{"name":"Riesling","color":"w","pct":30},{"name":"Chardonnay","color":"w","pct":16},{"name":"Cabernet Franc","color":"r","pct":12},{"name":"Hybrids (Concord, Vidal, etc.)","color":"r","pct":30},{"name":"Other","color":"w","pct":12}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Cool continental climate; the deep Finger Lakes store summer heat and release it slowly → lake-effect snow and moderation that protects vines.","The lakes keep autumn warm for a longer ripening season and reduce autumn-frost risk, while cool spring air delays budburst → lower spring-frost risk.","Most vineyards sit on the steeper slopes above the lakes for air drainage and lake influence.","Fertile soils with sufficient year-round rainfall → vigour must be actively controlled."],"kkps":[{"id":"FINGER-LAKES-F01","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The cool continental climate lets it keep very high acidity → racy, light-bodied wines from dry to sweet; it's the region's most reputed vinifera."},{"id":"FINGER-LAKES-F02","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The short, cool season makes ripening vinifera difficult and winters can damage vines → hybrids ripen reliably and survive the cold (also used for juice/jelly)."},{"id":"FINGER-LAKES-R03","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool continental climate; the deep Finger Lakes store summer heat and release it slowly → lake-effect snow and moderation that protects vines."},{"id":"FINGER-LAKES-R04","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The lakes keep autumn warm for a longer ripening season and reduce autumn-frost risk, while cool spring air delays budburst → lower spring-frost risk."},{"id":"FINGER-LAKES-R05","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Fertile soils with sufficient year-round rainfall → vigour must be actively controlled."}],"checks":[{"kp":"FINGER-LAKES-F01","type":"flash","question":"Why does Riesling suit the Finger Lakes so well?","answer":"The cool continental climate lets it keep very high acidity → racy, light-bodied wines from dry to sweet; it's the region's most reputed vinifera."},{"kp":"FINGER-LAKES-F02","type":"flash","question":"Why are cold-hardy hybrids (Concord, Vidal, Cayuga) widely grown?","answer":"The short, cool season makes ripening vinifera difficult and winters can damage vines → hybrids ripen reliably and survive the cold (also used for juice/jelly)."},{"kp":"FINGER-LAKES-R03","type":"explain","prompt":"Starting from “Cool continental climate; the deep Finger Lakes store summer heat and release it slowly”, explain what this leads to — through to the resulting wine style.","requiredPoints":["lake-effect snow and moderation that protects vines"]},{"kp":"FINGER-LAKES-R04","type":"explain","prompt":"Starting from “The lakes keep autumn warm for a longer ripening season and reduce autumn-frost risk, while cool spring air delays budburst”, explain what this leads to — through to the resulting wine style.","requiredPoints":["lower spring-frost risk"]},{"kp":"FINGER-LAKES-R05","type":"explain","prompt":"Starting from “Fertile soils with sufficient year-round rainfall”, explain what this leads to — through to the resulting wine style.","requiredPoints":["vigour must be actively controlled"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool continental climate → Riesling keeps very high acidity → light-bodied, fresh wines of apple, lemon and peach, from dry to sweet (mostly dry to medium-dry).","Riesling is the most reputed vinifera here; Cabernet Franc (mid-ripening and winter-hardy) is the leading black vinifera → light-to-medium-bodied reds of red cherry, cranberry and black plum, sometimes herbaceous.","Ability to ripen in the short season is critical, especially for black grapes → cold-hardy hybrids (Concord, Niagara, Cayuga, Vidal) are widely grown.","Chardonnay is used for both still and sparkling, with medium-plus to high acidity and citrus fruit."],"kkps":[{"id":"FINGER-LAKES-F06","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cabernet Franc — it is mid-ripening and winter-hardy, giving light-to-medium reds of red cherry and cranberry."},{"id":"FINGER-LAKES-R07","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool continental climate → Riesling keeps very high acidity → light-bodied, fresh wines of apple, lemon and peach, from dry to sweet (mostly dry to medium-dry)."},{"id":"FINGER-LAKES-R08","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Riesling is the most reputed vinifera here; Cabernet Franc (mid-ripening and winter-hardy) is the leading black vinifera → light-to-medium-bodied reds of red cherry, cranberry and black plum, sometimes herbaceous."},{"id":"FINGER-LAKES-R09","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Ability to ripen in the short season is critical, especially for black grapes → cold-hardy hybrids (Concord, Niagara, Cayuga, Vidal) are widely grown."}],"checks":[{"kp":"FINGER-LAKES-F06","type":"flash","question":"What is the leading black vinifera, and why?","answer":"Cabernet Franc — it is mid-ripening and winter-hardy, giving light-to-medium reds of red cherry and cranberry."},{"kp":"FINGER-LAKES-R07","type":"explain","prompt":"Starting from “Cool continental climate”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Riesling keeps very high acidity","light-bodied, fresh wines of apple, lemon and peach, from dry to sweet (mostly dry to medium-dry)"]},{"kp":"FINGER-LAKES-R08","type":"explain","prompt":"Starting from “Riesling is the most reputed vinifera here; Cabernet Franc (mid-ripening and winter-hardy) is the leading black vinifera”, explain what this leads to — through to the resulting wine style.","requiredPoints":["light-to-medium-bodied reds of red cherry, cranberry and black plum, sometimes herbaceous"]},{"kp":"FINGER-LAKES-R09","type":"explain","prompt":"Starting from “Ability to ripen in the short season is critical, especially for black grapes”, explain what this leads to — through to the resulting wine style.","requiredPoints":["cold-hardy hybrids (Concord, Niagara, Cayuga, Vidal) are widely grown"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Vigour control is essential on fertile soils → divided-canopy systems (e.g. Scott Henry) improve air circulation and light penetration.","Winter snow insulates vines; many growers hill up soil to cover the graft union against freeze.","A large share of hybrids and American vine species is grown, mainly for grape juice and jelly.","Riesling is cool-fermented in stainless steel (sometimes with a few hours' skin contact for flavour and texture) and lees-aged; sweetness comes from late-harvest, botrytis or stopping fermentation early.","Cabernet Franc sees less new oak than in the past for fresher, red-fruited reds.","Quality reaches Q:2–3(4) for Riesling."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["New York grows a large proportion of hybrids and native species alongside vinifera.","Long Island (a separate AVA) has a maritime climate suited to Bordeaux varieties, especially Merlot."],"kkps":[{"id":"FINGER-LAKES-F10","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The deep lakes store summer heat and release it slowly → they warm the autumn for longer ripening and reduce autumn frost, while cool spring air delays budburst → less spring-frost damage."}],"checks":[{"kp":"FINGER-LAKES-F10","type":"flash","question":"How do the lakes make viticulture possible in the Finger Lakes?","answer":"The deep lakes store summer heat and release it slowly → they warm the autumn for longer ripening and reduce autumn frost, while cool spring air delays budburst → less spring-frost damage."}]}],"blind":[{"id":"FINGER-BLIND-1","tastingProfile":"White wine. Pale lemon-green. Pronounced green apple, lemon, lime and peach, with a subtle wet-stone note and no oak. Dry to off-dry, very high acidity, low-to-medium alcohol, light body, medium finish.","deduce":["Grape: Riesling","Climate: cool","Region: Finger Lakes (New York, United States)"],"justifyWith":["No oak + very high acid + apple/lime/peach → Riesling","Light body and low-to-medium alcohol with racy acidity → cool continental climate","Lake-moderated freshness rather than petrol-rich ripeness → Finger Lakes, not a warm region"]}],"quiz":[{"id":"finger-lakes-Q1","kp":"FINGER-LAKES-F01","question":"Which is the Finger Lakes' most reputed vinifera grape?","correctAnswer":"Riesling","distractors":["Cabernet Sauvignon","Concord","Chenin Blanc"]},{"id":"finger-lakes-Q2","kp":"FINGER-LAKES-F10","question":"How do the deep Finger Lakes moderate the climate for vines?","correctAnswer":"They store summer heat and release it slowly, warming autumn and reducing frost risk","distractors":["They cool the vineyards all summer to slow ripening","They raise humidity for reliable botrytis","They reflect sunlight onto the slopes to ripen fruit"]},{"id":"finger-lakes-Q3","kp":"FINGER-LAKES-F02","question":"Why are cold-hardy hybrids widely grown in the Finger Lakes?","correctAnswer":"The short, cool season and cold winters make ripening and surviving with vinifera difficult","distractors":["Hybrids command higher prices than vinifera","They are required by the appellation rules","The hot climate suits disease-resistant hybrids"]},{"id":"finger-lakes-Q4","kp":"FINGER-LAKES-F06","question":"Which is the leading black vinifera grape of the Finger Lakes?","correctAnswer":"Cabernet Franc — mid-ripening and winter-hardy","distractors":["Cabernet Sauvignon — late-ripening and full-bodied","Pinotage — early-ripening and hardy","Nebbiolo — late-ripening and tannic"]},{"id":"finger-lakes-Q5","kp":"FINGER-LAKES-R07","question":"What style of Riesling does the cool continental climate give here?","correctAnswer":"Light-bodied, very high-acid wines of apple, lemon and peach, from dry to sweet","distractors":["Full-bodied, oaky wines of tropical fruit","Deeply coloured, tannic red wines","Neutral base wine for fortification"]}]},{"id":"maipo","title":"Maipo Valley","alt":"Chile · benchmark Cabernet Sauvignon","country":"Chile","flag":"🇨🇱","blurb":"Chile's historic Cabernet heartland near Santiago — minty, cassis-driven reds, more elegant as you climb the Andes.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Warm Mediterranean","scores":{"warmth":4,"sun":5,"rain":1,"diurnal":4,"risk":2}},"style":{"red":88,"white":12},"grapes":[{"name":"Cabernet Sauvignon","color":"r","pct":55},{"name":"Carmenère","color":"r","pct":14},{"name":"Merlot","color":"r","pct":10},{"name":"Syrah","color":"r","pct":8},{"name":"Other","color":"r","pct":13}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["The northernmost part of the Central Valley, surrounding the capital Santiago — warm, sunny and dry.","Coastal ranges shelter it from almost any maritime influence, and it is mostly surrounded by mountains.","Vineyards increasingly climb the Andean foothills (Alto Maipo) up to 1,000 m → cool nights and a wider diurnal range.","Soils run sandy and gravelly to the east, with more clay to the west; Chile remains phylloxera-free thanks to geographic barriers and quarantine."],"kkps":[{"id":"MAIPO-F01","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Geographic barriers (Andes, desert, ocean) plus strict quarantine → vines can be planted ungrafted on their own roots."},{"id":"MAIPO-F02","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The Maipo River, fed by Andean meltwater."},{"id":"MAIPO-R03","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Vineyards increasingly climb the Andean foothills (Alto Maipo) up to 1,000 m → cool nights and a wider diurnal range."}],"checks":[{"kp":"MAIPO-F01","type":"flash","question":"Why is Chile phylloxera-free, and why does it matter?","answer":"Geographic barriers (Andes, desert, ocean) plus strict quarantine → vines can be planted ungrafted on their own roots."},{"kp":"MAIPO-F02","type":"flash","question":"Which river and source supply Maipo's irrigation?","answer":"The Maipo River, fed by Andean meltwater."},{"kp":"MAIPO-R03","type":"explain","prompt":"Starting from “Vineyards increasingly climb the Andean foothills (Alto Maipo) up to 1,000 m”, explain what this leads to — through to the resulting wine style.","requiredPoints":["cool nights and a wider diurnal range"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Warm valley floor → Cabernet ripens fully with high, soft tannins → intense reds of cassis with a signature minty/eucalyptus note (Q:2–3, much P:1–2).","Cooler, high-altitude Alto Maipo → Andes breezes give cool nights and a wider diurnal range → fresher, more elegant Cabernet and Bordeaux blends (Q:3–4).","Carmenère and Syrah reach Q:3 here; Merlot is mainly high-volume (P:1).","The Andean diurnal range preserves acidity and aromatics in the top sites (e.g. Puente Alto, Pirque) → balance and structure."],"kkps":[{"id":"MAIPO-F04","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cassis (blackcurrant) with a distinctive minty/eucalyptus note and high, soft tannins."},{"id":"MAIPO-R05","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Warm valley floor → Cabernet ripens fully with high, soft tannins → intense reds of cassis with a signature minty/eucalyptus note (Q:2–3, much P:1–2)."},{"id":"MAIPO-R06","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cooler, high-altitude Alto Maipo → Andes breezes give cool nights and a wider diurnal range → fresher, more elegant Cabernet and Bordeaux blends (Q:3–4)."},{"id":"MAIPO-R07","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The Andean diurnal range preserves acidity and aromatics in the top sites (e.g. Puente Alto, Pirque) → balance and structure."}],"checks":[{"kp":"MAIPO-F04","type":"flash","question":"What is Maipo Cabernet's signature character?","answer":"Cassis (blackcurrant) with a distinctive minty/eucalyptus note and high, soft tannins."},{"kp":"MAIPO-R05","type":"explain","prompt":"Starting from “Warm valley floor”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Cabernet ripens fully with high, soft tannins","intense reds of cassis with a signature minty/eucalyptus note (Q:2–3, much P:1–2)"]},{"kp":"MAIPO-R06","type":"explain","prompt":"Starting from “Cooler, high-altitude Alto Maipo”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Andes breezes give cool nights and a wider diurnal range","fresher, more elegant Cabernet and Bordeaux blends (Q:3–4)"]},{"kp":"MAIPO-R07","type":"explain","prompt":"Starting from “The Andean diurnal range preserves acidity and aromatics in the top sites (e.g. Puente Alto, Pirque)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["balance and structure"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Irrigation water comes from the Maipo River and Andean meltwater; the dry climate keeps disease pressure low.","Alto Maipo's alluvial-gravel soils and altitude give lower yields and more concentrated, structured fruit.","Sustainable and organic viticulture is widely practised across Chile.","Top reds are oak-aged for structure; Alto Maipo icons (e.g. Almaviva, Don Melchor) reach Q:4.","Producers such as Concha y Toro and Santa Rita are based here."],"kkps":[{"id":"MAIPO-F08","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Its higher Andean altitude brings cool night breezes and a wider diurnal range → slower ripening that preserves acidity → fresher, more elegant, structured Cabernet and Bordeaux blends."}],"checks":[{"kp":"MAIPO-F08","type":"flash","question":"Why does Alto Maipo give more elegant Cabernet than the valley floor?","answer":"Its higher Andean altitude brings cool night breezes and a wider diurnal range → slower ripening that preserves acidity → fresher, more elegant, structured Cabernet and Bordeaux blends."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Chilean DO labelling: a stated region or variety requires ≥75% (≥85% for EU export).","Optional 'Costa / Andes / Entre Cordilleras' terms describe coastal, Andean or central positioning."],"kkps":[],"checks":[]}],"blind":[{"id":"MAIPO-BLIND-1","tastingProfile":"Red wine. Deep ruby. Pronounced cassis and blackberry with a distinctive minty/eucalyptus lift and cedar oak. Dry, medium-plus acidity, high but soft tannins, medium-plus alcohol, full body, long finish.","deduce":["Grape: Cabernet Sauvignon","Climate: warm","Region: Maipo Valley (Chile)"],"justifyWith":["Cassis + high firm tannin + full body → Cabernet Sauvignon","Minty/eucalyptus note → signature Maipo marker","Ripe, soft tannins and high alcohol → warm valley floor with Andean diurnal freshness"]}],"quiz":[{"id":"maipo-Q1","kp":"MAIPO-F04","question":"What is the signature flavour note of classic Maipo Cabernet Sauvignon?","correctAnswer":"Cassis with a distinctive minty/eucalyptus character","distractors":["Sour cherry and dried herbs","Green pepper and asparagus","Smoky, saline minerality"]},{"id":"maipo-Q2","kp":"MAIPO-F01","question":"Why can vines in Maipo be planted ungrafted on their own roots?","correctAnswer":"Geographic barriers (Andes, desert, ocean) plus strict quarantine keep phylloxera out","distractors":["The volcanic soils kill phylloxera","All rootstock is banned by law","The climate is too cold for the louse"]},{"id":"maipo-Q3","kp":"MAIPO-F08","question":"How does the higher Andean altitude of Alto Maipo shape its Cabernet?","correctAnswer":"Cool night breezes and a wider diurnal range give fresher, more elegant, structured wines","distractors":["More heat gives jammier, softer wines","Constant fog mutes aromatics","Higher humidity raises rot pressure"]},{"id":"maipo-Q4","kp":"MAIPO-F02","question":"What is the primary water source for irrigation in the Maipo Valley?","correctAnswer":"The Maipo River, fed by Andean meltwater","distractors":["Coastal fog condensation","Pacific-fed coastal aquifers","Regular Mediterranean rainfall"]}]},{"id":"casablanca","title":"Casablanca Valley","alt":"Chile · cool-climate whites & Pinot","country":"Chile","flag":"🇨🇱","blurb":"Chile's pioneering cool-climate region — fog-cooled Sauvignon Blanc, Chardonnay and Pinot Noir near the coast.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Cool maritime","scores":{"warmth":2,"sun":4,"rain":2,"diurnal":4,"risk":3}},"style":{"white":62,"red":38},"grapes":[{"name":"Sauvignon Blanc","color":"w","pct":40},{"name":"Chardonnay","color":"w","pct":24},{"name":"Pinot Noir","color":"r","pct":20},{"name":"Syrah","color":"r","pct":10},{"name":"Other","color":"w","pct":6}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["One of Chile's coolest wine regions and the first modern cool-climate area to be developed — close to Santiago on a flat plain.","Low hills to the west let ocean influence and fog in; higher hills to the north and east trap the cool, humid air.","Its relatively low latitude still allows good colour in Pinot Noir despite the cool conditions.","Where rivers are absent, irrigation draws on aquifers; morning fog and ocean breezes are the defining feature."],"kkps":[{"id":"CASABLANCA-F01","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Ocean influence and morning fog enter over low western hills → fog and cool breezes lower temperatures and slow ripening, giving high acidity in whites and Pinot Noir."},{"id":"CASABLANCA-F02","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool-climate Sauvignon Blanc, Chardonnay and Pinot Noir (plus cool-climate Syrah)."},{"id":"CASABLANCA-F03","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Casablanca → higher acidity, fresh black fruit, pepper and clove; warm Colchagua → fuller-bodied, riper, more intense black fruit."},{"id":"CASABLANCA-F04","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Spring frost, because of its cool, fog-prone climate."}],"checks":[{"kp":"CASABLANCA-F01","type":"flash","question":"Why is Casablanca cool despite being near the equator's latitude?","answer":"Ocean influence and morning fog enter over low western hills → fog and cool breezes lower temperatures and slow ripening, giving high acidity in whites and Pinot Noir."},{"kp":"CASABLANCA-F02","type":"flash","question":"Which grapes made Casablanca's reputation?","answer":"Cool-climate Sauvignon Blanc, Chardonnay and Pinot Noir (plus cool-climate Syrah)."},{"kp":"CASABLANCA-F03","type":"flash","question":"How does cool-climate Syrah here differ from warm Colchagua Syrah?","answer":"Casablanca → higher acidity, fresh black fruit, pepper and clove; warm Colchagua → fuller-bodied, riper, more intense black fruit."},{"kp":"CASABLANCA-F04","type":"flash","question":"What is Casablanca's main hazard?","answer":"Spring frost, because of its cool, fog-prone climate."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool, foggy maritime climate → Sauvignon Blanc and Chardonnay ripen slowly with high acidity → fresh, aromatic whites (citrus to tropical, wet-stone or herbaceous notes).","Cool conditions also suit Pinot Noir → red fruit with herbal character and medium-to-high alcohol; quality is improving rapidly.","Cooler coastal positioning → cool-climate Syrah keeps high acidity with fresh black fruit, pepper and clove (vs riper, fuller Syrah in warm Colchagua).","Morning fog reduces temperatures and slows sugar accumulation → freshness and aromatic intensity."],"kkps":[{"id":"CASABLANCA-R05","cat":"relationship","verified":true,"src":" gh to the resulting wine style.","requiredPoints":["freshness and aromatic intensity"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Spring frost is a real risk in the cool valley → frost protection is used.","Sauvignon Blanc and Chardonnay get some lees contact (and occasionally oak) for texture.","Cool, fog-bound sites give naturally lower yields and concentrated, fresh fruit.","Whites are cool-fermented to preserve aromatics; premium examples add lees ageing.","Pinot Noir is made for freshness and red-fruited elegance."],"kkps":[{"id":"CASABLANCA-R09","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Spring frost is a real risk in the cool valley → frost protection is used."}],"checks":[{"kp":"CASABLANCA-R09","type":"explain","prompt":"Starting from “Spring frost is a real risk in the cool valley”, explain what this leads to — through to the resulting wine style.","requiredPoints":["frost protection is used"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["DO Casablanca sits in the Aconcagua region and may carry the 'Costa' descriptor.","≥75% region/variety for labelling (≥85% for EU)."],"kkps":[],"checks":[]}],"blind":[{"id":"CASABLANCA-BLIND-1","tastingProfile":"White wine. Pale lemon. Pronounced grapefruit, lime, gooseberry and passion fruit with a wet-stone/herbaceous edge, no oak. Dry, high acidity, medium alcohol, light-to-medium body, zesty citrus-to-tropical flavours, medium-plus finish.","deduce":["Grape: Sauvignon Blanc","Climate: cool","Region: Casablanca Valley (Chile)"],"justifyWith":["Pronounced gooseberry/grapefruit + high acid + no oak → aromatic cool-climate Sauvignon Blanc","Citrus-to-tropical fruit with herbaceous/wet-stone notes → fog-cooled maritime ripening","High acidity and freshness rather than fat tropical fruit → cool coastal Chile, not a warm inland valley"]}],"quiz":[{"id":"casablanca-Q1","kp":"CASABLANCA-F01","question":"What cools the Casablanca Valley and slows ripening?","correctAnswer":"Ocean influence and morning fog entering over low western hills","distractors":["High Andean altitude over 1,000 m","A cold continental winter and warm dry summer only","A rain shadow from a coastal mountain range"]},{"id":"casablanca-Q2","kp":"CASABLANCA-F04","question":"What is the main vineyard hazard in Casablanca?","correctAnswer":"Spring frost, because of its cool, fog-prone climate","distractors":["Drought leading to total crop loss","Excessive heat and sunburn","Autumn hail from the Andes"]},{"id":"casablanca-Q3","kp":"CASABLANCA-F02","question":"Which grapes is Casablanca best known for?","correctAnswer":"Cool-climate Sauvignon Blanc, Chardonnay and Pinot Noir (plus cool-climate Syrah)","distractors":["Carmenère, Cabernet Sauvignon and Merlot","Malbec, Bonarda and Torrontés","Tempranillo, Garnacha and Monastrell"]},{"id":"casablanca-Q4","kp":"CASABLANCA-F03","question":"How does Casablanca Syrah compare with warm Colchagua Syrah?","correctAnswer":"Higher acidity with fresh black fruit, pepper and clove","distractors":["Fuller-bodied, riper and more intense black fruit","Pale, oxidative and nutty","Sweet and fortified"]}]},{"id":"limari","title":"Limarí Valley","alt":"Chile · Coquimbo · coastal Chardonnay & Syrah","country":"Chile","flag":"🇨🇱","blurb":"A desert-edge northern valley where Humboldt fog and rare limestone soils give mineral Chardonnay and fresh Syrah.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Warm, very dry (fog-cooled)","scores":{"warmth":4,"sun":5,"rain":1,"diurnal":4,"risk":3}},"style":{"white":52,"red":48},"grapes":[{"name":"Chardonnay","color":"w","pct":34},{"name":"Syrah","color":"r","pct":26},{"name":"Sauvignon Blanc","color":"w","pct":16},{"name":"Cabernet Sauvignon","color":"r","pct":12},{"name":"Other","color":"r","pct":12}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["In the Coquimbo region on the edge of the Atacama Desert (the world's driest) → rainfall under 100 mm, so irrigation is essential.","The cold Humboldt Current brings morning fogs ('camanchaca') and cooling breezes that temper the intense northern sun.","A narrow, steeply-sided valley through the coastal mountains; the western end is cooled by fog and sea breezes, the Andean foothills cool the east.","Unusually for Chile, soils are calcareous/limestone, which retain moisture in the desert-like conditions."],"kkps":[{"id":"LIMARI-F01","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The cold Humboldt Current brings morning fog and cooling breezes that temper the intense sun → Chardonnay and Syrah retain high acidity; rare limestone soils add minerality."},{"id":"LIMARI-F02","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"They are calcareous/limestone — rare in Chile — and retain moisture in the desert-like conditions, prized especially for Chardonnay."},{"id":"LIMARI-F03","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Wind (alongside chronic water shortage requiring drip irrigation)."},{"id":"LIMARI-F04","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Coastal (fog-cooled) → lighter-bodied, high-acid Chardonnay; inland/east → riper, fuller styles and warm-climate reds (Cabernet, Carmenère)."},{"id":"LIMARI-R05","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"In the Coquimbo region on the edge of the Atacama Desert (the world's driest) → rainfall under 100 mm, so irrigation is essential."}],"checks":[{"kp":"LIMARI-F01","type":"flash","question":"Why can a desert-edge valley like Limarí make fresh, mineral whites?","answer":"The cold Humboldt Current brings morning fog and cooling breezes that temper the intense sun → Chardonnay and Syrah retain high acidity; rare limestone soils add minerality."},{"kp":"LIMARI-F02","type":"flash","question":"What makes Limarí's soils unusual for Chile?","answer":"They are calcareous/limestone — rare in Chile — and retain moisture in the desert-like conditions, prized especially for Chardonnay."},{"kp":"LIMARI-F03","type":"flash","question":"What is the biggest hazard in Limarí?","answer":"Wind (alongside chronic water shortage requiring drip irrigation)."},{"kp":"LIMARI-F04","type":"flash","question":"How does style change from the coast to inland in Limarí?","answer":"Coastal (fog-cooled) → lighter-bodied, high-acid Chardonnay; inland/east → riper, fuller styles and warm-climate reds (Cabernet, Carmenère)."},{"kp":"LIMARI-R05","type":"explain","prompt":"Starting from “In the Coquimbo region on the edge of the Atacama Desert (the world's driest)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["rainfall under 100 mm, so irrigation is essential"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool coastal fog plus limestone soils → Chardonnay keeps medium-plus to high acidity → from light-bodied, high-acid coastal styles to riper, fruitier wines inland; this is one of Chile's finest Chardonnay sources.","Fog-cooled sites → Syrah and Sauvignon Blanc retain high acidity and fresh fruit; warmer eastern sites suit Cabernet, Merlot and Carmenère.","Morning fog lowers temperatures and slows ripening → freshness and mineral character.","The calcareous soils (rare in Chile) add a mineral dimension prized for Chardonnay."],"kkps":[{"id":"LIMARI-R06","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool coastal fog plus limestone soils → Chardonnay keeps medium-plus to high acidity → from light-bodied, high-acid coastal styles to riper, fruitier wines inland; this is one of Chile's finest Chardonnay sources."},{"id":"LIMARI-R07","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Fog-cooled sites → Syrah and Sauvignon Blanc retain high acidity and fresh fruit; warmer eastern sites suit Cabernet, Merlot and Carmenère."},{"id":"LIMARI-R08","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Morning fog lowers temperatures and slows ripening → freshness and mineral character."}],"checks":[{"kp":"LIMARI-R06","type":"explain","prompt":"Starting from “Cool coastal fog plus limestone soils”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Chardonnay keeps medium-plus to high acidity","from light-bodied, high-acid coastal styles to riper, fruitier wines inland; this is one of Chile's finest Chardonnay sources"]},{"kp":"LIMARI-R07","type":"explain","prompt":"Starting from “Fog-cooled sites”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Syrah and Sauvignon Blanc retain high acidity and fresh fruit; warmer eastern sites suit Cabernet, Merlot and Carmenère"]},{"kp":"LIMARI-R08","type":"explain","prompt":"Starting from “Morning fog lowers temperatures and slows ripening”, explain what this leads to — through to the resulting wine style.","requiredPoints":["freshness and mineral character"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Severe water shortage (Andean snowfall has declined) → efficient drip irrigation; wind is the biggest hazard.","Cordon training is common (low labour, mechanisation-friendly).","Recognised for high-quality wine only since the 1990s; previously table grapes and Pisco.","Coastal Chardonnay sees some lees/oak work for texture; Syrah is made to highlight f  → growers often spread vineyards across sites to manage risk."}],"checks":[{"kp":"LUJAN-DE-CUYO-F09","type":"flash","question":"What is Luján de Cuyo's claim to fame in Argentine wine law?","answer":"It was Argentina's first DOC, requiring >24 months ageing (>12 in oak)."},{"kp":"LUJAN-DE-CUYO-R10","type":"explain","prompt":"Starting from “Hail and frost are the main hazards”, explain what this leads to — through to the resulting wine style.","requiredPoints":["growers often spread vineyards across sites to manage risk"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Luján de Cuyo was Argentina's first DOC (one of only two DOCs in the country).","Most labels use the more flexible GI system rather than the strict DOC."],"kkps":[],"checks":[]}],"blind":[{"id":"LUJAN-BLIND-1","tastingProfile":"Red wine. Deep ruby/purple with violet rim. Pronounced ripe blackberry, black plum, violet and a floral note with mocha/vanilla oak spice. Dry, medium-plus acidity, medium-plus to high ripe, plush tannins, high alcohol, full body, long finish.","deduce":["Grape: Malbec","Climate: warm","Region: Luján de Cuyo (Mendoza, Argentina)"],"justifyWith":["Deep colour, ripe blackberry and violet floral note → Malbec","Plush, ripe yet structured tannins with retained acidity → high-altitude continental ripening with cold nights","High alcohol + concentrated dark fruit → warm, sunny, dry Mendoza foothills"]}],"quiz":[{"id":"lujan-de-cuyo-Q1","kp":"LUJAN-DE-CUYO-F01","question":"How does altitude (900–1,100 m) shape Luján de Cuyo's Malbec?","correctAnswer":"Cold nights and a wide diurnal range slow ripening, retaining acidity and ripe tannins for rich yet balanced wines","distractors":["Constant heat speeds ripening, lowering acidity","Cool, foggy conditions give light, high-acid reds","Heavy rainfall dilutes the fruit and tannins"]},{"id":"lujan-de-cuyo-Q2","kp":"LUJAN-DE-CUYO-F02","question":"What is the essential water source for Luján de Cuyo's vineyards?","correctAnswer":"Andean snow/glacier meltwater, because rainfall is only ~200 mm","distractors":["Abundant summer rainfall","Deep underground aquifers tapped by wells","A large adjacent river fed by Atlantic weather"]},{"id":"lujan-de-cuyo-Q3","kp":"LUJAN-DE-CUYO-F09","question":"What is the significance of Luján de Cuyo's DOC?","correctAnswer":"It was Argentina's first DOC, requiring >24 months ageing (>12 in oak)","distractors":["It is Argentina's only sparkling-wine DOC","It permits only white-wine production","It was the last DOC created in Argentina"]},{"id":"lujan-de-cuyo-Q4","kp":"LUJAN-DE-CUYO-F06","question":"Why does Argentine Malbec have smaller berries and softer tannins than modern French Malbec?","correctAnswer":"Its vines descend from pre-phylloxera French cuttings, giving a plush texture","distractors":["It is grown at sea level on fertile soils","It is harvested very early before full ripeness","It is a different grape variety entirely"]}]},{"id":"uco-valley","title":"Uco Valley","alt":"Argentina · Mendoza · high-altitude Malbec","country":"Argentina","flag":"🇦🇷","blurb":"Mendoza's coolest, highest frontier — pure, floral Malbec and crisp whites from limestone-rich Andean sites.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Continental, very high-altitude","scores":{"warmth":3,"sun":5,"rain":1,"diurnal":5,"risk":3}},"style":{"red":78,"white":22},"grapes":[{"name":"Malbec","color":"r","pct":50},{"name":"Cabernet Franc","color":"r","pct":10},{"name":"Cabernet Sauvignon","color":"r","pct":10},{"name":"Chardonnay","color":"w","pct":12},{"name":"Other","color":"r","pct":18}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["In the Andean foothills straddling the Tunuyán River and its tributaries, at ing from “Cooler temperatures and a wider diurnal range than the rest of Mendoza”, explain what this leads to — through to the resulting wine style.","requiredPoints":["slower ripening"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Very high altitude and cold nights → grapes accumulate sugar slowly and retain acidity, ripe tannins and deep colour → Malbec that is lighter-bodied, higher-acid and floral with a red/black-fruit, herbal lift.","Gualtallary's limestone soils at 1,100–1,600 m → especially fine, fresh, structured Malbec, often blended with Cabernet Franc.","Paraje Altamira's calcareous alluvial-fan soils → more intense, fuller-bodied Malbec with firm acidity and tannin structure.","The coolest, highest sites suit crisp, elegant whites (Chardonnay, Sauvignon Blanc) and Pinot Noir."],"kkps":[{"id":"UCO-VALLEY-R05","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Very high altitude and cold nights → grapes accumulate sugar slowly and retain acidity, ripe tannins and deep colour → Malbec that is lighter-bodied, higher-acid and floral with a red/black-fruit, herbal lift."},{"id":"UCO-VALLEY-R06","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Gualtallary's limestone soils at 1,100–1,600 m → especially fine, fresh, structured Malbec, often blended with Cabernet Franc."},{"id":"UCO-VALLEY-R07","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Paraje Altamira's calcareous alluvial-fan soils → more intense, fuller-bodied Malbec with firm acidity and tannin structure."}],"checks":[{"kp":"UCO-VALLEY-R05","type":"explain","prompt":"Starting from “Very high altitude and cold nights”, explain what this leads to — through to the resulting wine style.","requiredPoints":["grapes accumulate sugar slowly and retain acidity, ripe tannins and deep colour","Malbec that is lighter-bodied, higher-acid and floral with a red/black-fruit, herbal lift"]},{"kp":"UCO-VALLEY-R06","type":"explain","prompt":"Starting from “Gualtallary's limestone soils at 1,100–1,600 m”, explain what this leads to — through to the resulting wine style.","requiredPoints":["especially fine, fresh, structured Malbec, often blended with Cabernet Franc"]},{"kp":"UCO-VALLEY-R07","type":"explain","prompt":"Starting from “Paraje Altamira's calcareous alluvial-fan soils”, explain what this leads to — through to the resulting wine style.","requiredPoints":["more intense, fuller-bodied Malbec with firm acidity and tannin structure"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Poor, stony, often calcareous soils at altitude → naturally low yields and high-quality viticulture.","Drip irrigation from Andean rivers is common; hail and frost are hazards.","Soils low in nitrogen can cause stuck fermentation → DAP is added.","Site-expressive, single-vineyard Malbec and Malbec–Cabernet Franc blends are a hallmark.","Cooler fruit is made with restraint to preserve florality and freshness."],"kkps":[{"id":"UCO-VALLEY-F08","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The poor, high-altitude soils are low in nitrogen → risk of stuck fermentation, corrected with diammonium phosphate."},{"id":"UCO-VALLEY-R09","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Poor, stony, often calcareous soils at altitude → naturally low yields and high-quality viticulture."},{"id":"UCO-VALLEY-R10","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Soils low in nitrogen can cause stuck fermentation → DAP is added."}],"checks":[{"kp":"UCO-VALLEY-F08","type":"flash","question":"Why is DAP sometimes added during fermentation here?","answer":"The poor, high-altitude soils are low in nitrogen → risk of stuck fermentation, corrected with diammonium phosphate."},{"kp":"UCO-VALLEY-R09","type":"explain","prompt":"Starting from “Poor, stony, often calcareous soils at altitude”, explain what this leads to — through to the resulting wine style.","requiredPoints":["naturally low yields and high-quality viticulture"]},{"kp":"UCO-VALLEY-R10","type":"explain","prompt":"Starting from “Soils low in nitrogen can cause stuck fermentation”, explain what this leads to — through to the resulting wine style.","requiredPoints":["DAP is added"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Uco Valley uses the GI system (Tupungato, San Carlos, Tunuyán and their districts).","Gualtallary and Paraje Altamira are prized GIs for their distinctive soils."],"kkps":[],"checks":[]}],"blind":[{"id":"UCO-BLIND-1","tastingProfile":"Red wine. Deep ruby/purple. Pronounced violet, blackberry and red plum with a fresh herbal lift and subtle oak spice. Dry, medium(+) acidity, medium(+) ripe tannin, medium(+) alcohol, medium body, medium(+) finish.","deduce":["Grape: Malbec","Climate: moderate","Region: Uco Valley (Mendoza, Argentina)"],"justifyWith":["Violet, blackberry and deep colour → Malbec","Floral lift, medium body and bright acidity rather than jammy weight → high-altitude cool nights with a wide diurnal range","Fine, fresh, structured profile → Uco Valley's altitude and limestone, not lower, warmer Mendoza"]}],"quiz":[{"id":"uco-valley-Q1","kp":"UCO-VALLEY-F01","question":"How does Uco Valley's very high altitude shape its Malbec?","correctAnswer":"Cold nights and a wide diurnal range slow ripening, giving lighter-bodied, higher-acid, floral Malbec","distractors":["Constant heat gives heavy, jammy, high-alcohol Malbec","Lake humidity gives sweet, botrytised Malbec","Maritime fog gives pale, herbaceous Malbec"]},{"id":"uco-valley-Q2","kp":"UCO-VALLEY-F02","question":"What distinctive soil type gives Uco Valley especially fine, mineral Malbec?","correctAnswer":"Calcareous/limestone soils","distractors":["Iron-rich terra rossa","Dark slate","Albariza chalk"]},{"id":"uco-valley-Q3","kp":"UCO-VALLEY-F08","question":"Why is stuck fermentation a risk in Uco Valley, and how is it corrected?","correctAnswer":"Poor high-altitude soils are low in nitrogen; diammonium phosphate (DAP) is added","distractors":["Cold cellars stall the yeast; the must is warmed","High pH inhibits yeast; tartaric acid is added","Excess sugar stalls yeast; the wine is chaptalised"]},{"id":"uco-valley-Q4","kp":"UCO-VALLEY-R06","question":"What style of Malbec do Gualtallary's limestone soils at altitude produce?","correctAnswer":"Especially fine, fresh, structured Malbec, often blended with Cabernet Franc","distractors":["Soft, jammy, low-acid Malbec for early drinking","Sweet, fortified Malbec","Pale, oxidative Malbec rosé"]},{"id":"uco-valley-Q5","kp":"UCO-VALLEY-F03","question":"Besides Malbec, what does Uco Valley produce well?","correctAnswer":"Crisp, elegant whites (Chardonnay, Sauvignon Blanc) and Pinot Noir","distractors":["Botrytis sweet wines from Lake Neusiedl","Fortified wines aged under flor","Skin-contact orange wines"]}]},{"id":"salta-cafayate","title":"Salta (Cafayate)","alt":"Argentina · extreme-altitude Malbec & Torrontés","country":"Argentina","flag":"🇦🇷","blurb":"The world's highest vineyards — intensely coloured, fragrant Malbec and aromatic Torrontés near the equator.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Hot, extreme-altitude desert","scores":{"warmth":4,"sun":5,"rain":1,"diurnal":5,"risk":3}},"style":{"red":70,"white":30},"grapes":[{"name":"Malbec","color":"r","pct":45},{"name":"Torrontés","color":"w","pct":28},{"name":"Cabernet Sauvignon","color":"r","pct":10},{"name":"Tannat","color":"r","pct":6},{"name":"Other","color":"r","pct":11}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["In Argentina's far north at 24–26°S — among the closest wine regions to the equator on Earth.","Some of the world's highest vineyards at 1,500–3,000 m → intense sunlight and a wide diurnal range.","Very low rainfall (80–200 mm) → irrigation from the Calchaquí River; the strong 'Zonda' wind blows down the valley.","Surrounding mountains cast shade that shortens extreme sunlight exposure."],"kkps":[{"id":"SALTA-CAFAYATE-F01","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Extreme altitude (up to 3,000 m) and intense UV thicken grape skins (more anthocyanins and tannins) while cold nights keep acidity → deep, concentrated, fragrant, fresh Malbec."},{"id":"SALTA-CAFAYATE-F02","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"24–26°S, among the world's closest wine regions to the equator → extreme altitude is what makes viticulture possible by providing cooling."},{"id":"SALTA-CAFAYATE-R03","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Some of the world's highest vineyards at 1,500–3,000 m → intense sunlight and a wide diurnal range."},{"id":"SALTA-CAFAYATE-R04","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Very low rainfall (80–200 mm) → irrigation from the Calchaquí River; the strong 'Zonda' wind blows down the valley."}],"checks":[{"kp":"SALTA-CAFAYATE-F01","type":"flash","question":"Why are Salta's Malbecs so deeply coloured and concentrated?","answer":"Extreme altitude (up to 3,000 m) and intense UV thicken grape skins (more anthocyanins and tannins) while cold nights keep acidity → deep, concentrated, fragrant, fresh Malbec."},{"kp":"SALTA-CAFAYATE-F02","type":"flash","question":"How close to the equator is Salta, and why does that matter?","answer":"24–26°S, among the world's closest wine regions to the equator → extreme altitude is what makes viticulture possible by providing cooling."},{"kp":"SALTA-CAFAYATE-R03","type":"explain","prompt":"Starting from “Some of the world's highest vineyards at 1,500–3,000 m”, explain what this leads to — through to the resulting wine style.","requiredPoints":["intense sunlight and a wide diurnal range"]},{"kp":"SALTA-CAFAYATE-R04","type":"explain","prompt":"Starting from “Very low rainfall (80–200 mm)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["irrigation from the Calchaquí River; the strong 'Zonda' wind blows down the valley"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Extreme altitude and intense UV → thick grape skins with high anthocyanins and tannins, while cold nights retain acidity → Malbec that is deep-coloured, highly concentrated, full-bodied and extremely fragrant, with a distinctive herbal/floral lift.","Cafayate (~1,700 m), the region's main area with ~70% of vineyards, is the heartland of aromatic, un-oaked Torrontés.","Hot, sunny days build full body and high alcohol; the wide diurnal range keeps the wines fresh.","Cabernet Sauvignon, Bonarda, Syrah and Tannat also feature in the blends."],"kkps":[{"id":"SALTA-CAFAYATE-F05","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Nearly 70% — it is the most important valley in the region."},{"id":"SALTA-CAFAYATE-R06","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Extreme altitude and intense UV → thick grape skins with high anthocyanins and tannins, while cold nights retain acidity → Malbec that is deep-coloured, highly concentrated, full-bodied and extremely fragrant, with a distinctive herbal/floral lift."}],"checks":[{"kp":"SALTA-CAFAYATE-F05","type":"flash","question":"What share of Salta's vineyards is in Cafayate?","answer":"Nearly 70% — it is the most important valley in the region."},{"kp":"SALTA-CAFAYATE-R06","type":"explain","prompt":"Starting from “Extreme altitude and intense UV”, explain what this leads to — through to the resulting wine style.","requiredPoints":["thick grape skins with high anthocyanins and tannins, while cold nights retain acidity","Malbec that is deep-coloured, highly concentrated, full-bodied and extremely fragrant, with a distinctive herbal/floral lift"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Thick skins and low yields result from the intense high-altitude sunlight → concentration.","The Zonda wind and shading mountains influence ripening; irrigation is essential in the desert.","Producers such as Colomé farm steep terraces at extreme altitude.","Torrontés is made fresh and un-oaked to showcase its floral aromatics.","Malbec is oak-aged for its deep, concentrated, fragrant style."],"kkps":[{"id":"SALTA-CAFAYATE-F07","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Torrontés — made fresh and un-oaked to highlight its intense floral aromatics."},{"id":"SALTA-CAFAYATE-R08","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Thick skins and low yields result from the intense high-altitude sunlight → concentration."}],"checks":[{"kp":"SALTA-CAFAYATE-F07","type":"flash","question":"What white grape is Cafayate famous for, and how is it made?","answer":"Torrontés — made fresh and un-oaked to highlight its intense floral aromatics."},{"kp":"SALTA-CAFAYATE-R08","type":"explain","prompt":"Starting from “Thick skins and low yields result from the intense high-altitude sunlight”, explain what this leads to — through to the resulting wine style.","requiredPoints":["concentration"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["GI Cafayate is a district in southern Salta at ~1,700 m, known for aromatic whites.","Export wines may be labelled by the Salta or Cafayate GI."],"kkps":[],"checks":[]}],"blind":[{"id":"SALTA-BLIND-1","tastingProfile":"Red wine. Deep purple. Pronounced blackberry and black plum with violet, herbal and floral lift and well-integrated oak. Dry, medium-plus acidity, high ripe tannins, high alcohol, full body, long finish.","deduce":["Grape: Malbec","Climate: hot","Region: Salta / Cafayate (Argentina)"],"justifyWith":["Deep colour + black fruit + violet → Malbec","Floral/herbal lift with retained acidity despite full ripeness → extreme high-altitude UV with cold nights","High alcohol and ripe concentrated tannin → hot, sunny desert valley"]}],"quiz":[{"id":"salta-cafayate-Q1","kp":"SALTA-CAFAYATE-F07","question":"How is Torrontés typically made in Salta to highlight its character?","correctAnswer":"Fresh and un-oaked, to showcase intense floral aromatics","distractors":["Barrel-fermented in new oak","Oxidatively under a yeast veil","As a sweet botrytised wine"]},{"id":"salta-cafayate-Q2","kp":"SALTA-CAFAYATE-F02","question":"Why is viticulture possible at Salta's low latitude (24–26°S), close to the equator?","correctAnswer":"Extreme altitude provides the cooling that makes the climate viable","distractors":["A strong cool ocean current moderates the heat","Heavy cloud cover blocks the sun","Abundant rainfall cools the vineyards"]},{"id":"salta-cafayate-Q3","kp":"SALTA-CAFAYATE-R06","question":"What style of Malbec results from Salta's extreme altitude and intense UV?","correctAnswer":"Deep-coloured, highly concentrated, full-bodied and very fragrant, with herbal/floral lift","distractors":["Pale, light-bodied and low in tannin","Oxidative and nutty","Sweet and fortified"]},{"id":"salta-cafayate-Q4","kp":"SALTA-CAFAYATE-R04","question":"What is the source of irrigation water in Cafayate's very dry climate (80–200 mm rain)?","correctAnswer":"The Calchaquí River","distractors":["The Maipo River","Andean coastal fog","The Bodrog River"]}]},{"id":"patagonia","title":"Patagonia","alt":"Argentina · cool-climate Pinot & Malbec","country":"Argentina","flag":"🇦🇷","blurb":"Argentina's cool southern frontier — elegant, balanced Pinot Noir, Malbec and Semillon in a windy desert.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Cool, dry, windy continental","scores":{"warmth":3,"sun":4,"rain":1,"diurnal":4,"risk":3}},"style":{"red":68,"white":32},"grapes":[{"name":"Malbec","color":"r","pct":34},{"name":"Pinot Noir","color":"r","pct":20},{"name":"Merlot","color":"r","pct":10},{"name":"Semillon","color":"w","pct":10},{"name":"Sauvignon Blanc","color":"w","pct":10},{"name":"Other","color":"w","pct":16}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["In Argentina's far south at 38–39°S → less intense sunlight but a longer growing season.","Much lower altitude than the rest of Argentina (highest only ~400 m).","Very low rainfall (<200 mm) → irrigation is essential; production centres on Río Negro and Neuquén provinces.","Strong Andean winds thicken skins and can disrupt flowering → wind barriers are used."],"kkps":[{"id":"PATAGONIA-F01","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Its cool southern latitude (38–39°S) and long growing season ripen grapes slowly → high acidity and elegant, well-balanced wines, with Pinot Noir excelling."},{"id":"PATAGONIA-F02","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cooler conditions give a more floral, fresher character (vs the riper, fuller Malbec of warm Mendoza)."},{"id":"PATAGONIA-F03","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Strong Andean wind, which thickens skins and can disrupt flowering → vineyards use wind barriers."},{"id":"PATAGONIA-R04","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"In Argentina's far south at 38–39°S → less intense sunlight but a longer growing season."},{"id":"PATAGONIA-R05","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Very low rainfall (<200 mm) → irrigation is essential; production centres on Río Negro and Neuquén provinces."},{"id":"PATAGONIA-R06","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Strong Andean winds thicken skins and can disrupt flowering → wind barriers are used."}],"checks":[{"kp":"PATAGONIA-F01","type":"flash","question":"Why is Patagonia suited to Pinot Noir and elegant styles?","answer":"Its cool southern latitude (38–39°S) and long growing season ripen grapes slowly → high acidity and elegant, well-balanced wines, with Pinot Noir excelling."},{"kp":"PATAGONIA-F02","type":"flash","question":"How does Patagonian Malbec differ from Mendoza Malbec?","answer":"Cooler conditions give a more floral, fresher character (vs the riper, fuller Malbec of warm Mendoza)."},{"kp":"PATAGONIA-F03","type":"flash","question":"What is the defining hazard in Patagonia?","answer":"Strong Andean wind, which thickens skins and can disrupt flowering → vineyards use wind barriers."},{"kp":"PATAGONIA-R04","type":"explain","prompt":"Starting from “In Argentina's far south at 38–39°S”, explain what this leads to — through to the resulting wine style.","requiredPoints":["less intense sunlight but a longer growing season"]},{"kp":"PATAGONIA-R05","type":"explain","prompt":"Starting from “Very low rainfall (<200 mm)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["irrigation is essential; production centres on Río Negro and Neuquén provinces"]},{"kp":"PATAGONIA-R06","type":"explain","prompt":"Starting from “Strong Andean winds thicken skins and can disrupt flowering”, explain what this leads to — through to the resulting wine style.","requiredPoints":["wind barriers are used"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool southern latitude with a long growing season → grapes ripen slowly and keep high acidity → elegant, well-balanced wines.","Pinot Noir thrives in the cool conditions; Malbec shows a more floral, fresher character than in warm Mendoza.","Old vines of Semillon, Pinot Noir and Malbec in Río Negro give concentration and complexity.","Slightly warmer, more arid Neuquén → riper styles than Río Negro."],"kkps":[{"id":"PATAGONIA-F07","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Río Negro, with over a century of winegrowing and big old vines."},{"id":"PATAGONIA-R08","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool southern latitude with a long growing season → grapes ripen slowly and keep high acidity → elegant, well-balanced wines."},{"id":"PATAGONIA-R09","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Slightly warmer, more arid Neuquén → riper styles than Río Negro."}],"checks":[{"kp":"PATAGONIA-F07","type":"flash","question":"Which province leads Patagonian production?","answer":"Río Negro, with over a century of winegrowing and big old vines."},{"kp":"PATAGONIA-R08","type":"explain","prompt":"Starting from “Cool southern latitude with a long growing season”, explain what this leads to — through to the resulting wine style.","requiredPoints":["grapes ripen slowly and keep high acidity","elegant, well-balanced wines"]},{"kp":"PATAGONIA-R09","type":"explain","prompt":"Starting from “Slightly warmer, more arid Neuquén”, explain what this leads to — through to the resulting wine style.","requiredPoints":["riper styles than Río Negro"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Persistent wind is the defining hazard → barriers protect vines and reduce flowering damage.","Irrigation from rivers is essential in the dry climate.","Río Negro has over 100 years of winegrowing with big old vines; Neuquén is a newer, modern region.","Cool-climate fruit is made for elegance and balance.","Pinot Noir and fresher Malbec are the calling cards."],"kkps":[{"id":"PATAGONIA-R10","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Persistent wind is the defining hazard → barriers protect vines and reduce flowering damage."}],"checks":[{"kp":"PATAGONIA-R10","type":"explain","prompt":"Starting from “Persistent wind is the defining hazard”, explain what this leads to — through to the resulting wine style.","requiredPoints":["barriers protect vines and reduce flowering damage"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["A GI covers the whole of Patagonia, with Río Negro and Neuquén as key sub-areas.","Production is concentrated in Río Negro."],"kkps":[],"checks":[]}],"blind":[{"id":"PATAGONIA-BLIND-1","tastingProfile":"Red wine. Medium ruby. Pronounced red cherry, raspberry and floral violet notes with a savoury, earthy edge, subtle oak. Dry, high acidity, medium tannins, medium alcohol, medium body, fresh red fruit, medium-plus finish.","deduce":["Grape: Pinot Noir","Climate: cool","Region: Patagonia (Argentina)"],"justifyWith":["Medium colour + red cherry/raspberry + high acid + medium tannin → cool-climate Pinot Noir","Floral lift and freshness rather than jammy weight → cool, windy southern-latitude ripening","Elegant, balanced medium body → cool Patagonia, not warm Mendoza"]}],"quiz":[{"id":"patagonia-Q1","kp":"PATAGONIA-F01","question":"Why does Patagonia produce elegant, well-balanced wines with high acidity?","correctAnswer":"Its cool southern latitude (38-39°S) and long growing season ripen grapes slowly","distractors":["Its tropical heat ripens grapes very fast","Constant rainfall dilutes the fruit","Its high Andean altitude over 1,500 m"]},{"id":"patagonia-Q2","kp":"PATAGONIA-F03","question":"What is the defining vineyard hazard in Patagonia?","correctAnswer":"Strong Andean wind, which thickens skins and can disrupt flowering","distractors":["Spring frost in the fog","Heavy autumn rain and rot","Intense tropical humidity"]},{"id":"patagonia-Q3","kp":"PATAGONIA-F02","question":"How does cool Patagonian Malbec compare with warm Mendoza Malbec?","correctAnswer":"More floral and fresher in character","distractors":["Riper, jammier and fuller-bodied","Pale and oxidative","Sweet and fortified"]},{"id":"patagonia-Q4","kp":"PATAGONIA-R05","question":"Why is irrigation essential in Patagonia?","correctAnswer":"Very low rainfall (under 200 mm) means vines cannot survive without it","distractors":["Excessive rain must be drained and recycled","The soils are waterlogged clay","Fog provides no usable moisture"]}]},{"id":"stellenbosch","title":"Stellenbosch","alt":"South Africa · benchmark Cabernet & Cape blends","country":"South Africa","flag":"🇿🇦","blurb":"South Africa's most famous district — structured Cabernet, Cape blends, Shiraz and Chenin around a historic university town.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Warm maritime","scores":{"warmth":4,"sun":4,"rain":2,"diurnal":3,"risk":2}},"style":{"red":62,"white":38},"grapes":[{"name":"Cabernet Sauvignon","color":"r","pct":26},{"name":"Chenin Blanc","color":"w","pct":16},{"name":"Shiraz","color":"r","pct":14},{"name":"Pinotage","color":"r","pct":10},{"name":"Sauvignon Blanc","color":"w","pct":12},{"name":"Other","color":"r","pct":22}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["The oldest of South Africa's wine districts and a business/education hub (Stellenbosch University).","A warm climate, but breezes off nearby False Bay moderate summer temperatures and cooler mountain slopes add freshness.","Rainfall of 600–900 mm allows much dry farming; the Cape Doctor (south-easterly wind) extends ocean influence inland.","Very varied soils → sandy and alluvial on the valley floor near False Bay, granite and shale on the slopes of Simonsberg, the Bottelary Hills and Helderberg."],"kkps":[{"id":"STELLENBOSCH-R01","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Very varied soils → sandy and alluvial on the valley floor near False Bay, granite and shale on the slopes of Simonsberg, the Bottelary Hills and Helderberg."}],"checks":[{"kp":"STELLENBOSCH-R01","type":"explain","prompt":"Starting from “Very varied soils”, explain what this leads to — through to the resulting wine style.","requiredPoints":["sandy and alluvial on the valley floor near False Bay, granite and shale on the slopes of Simonsberg, the Bottelary Hills and Helderberg"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Warm climate moderated by False Bay breezes and mountain slopes → Cabernet ripens fully but keeps structure → full-bodied, structured reds; Stellenbosch's reputation rests on Cabernet, its blends and Shiraz.","Cooler mountain sites (e.g. Simonsberg-Stellenbosch) with a higher diurnal range → Cabernet and Pinotage keep acidity (they lose it quickly on warmer, lower sites).","Pinotage — South Africa's own crossing (Pinot Noir × Cinsaut) — features in red Cape Blends.","Picking time and yield are decisive for style and body; Chenin Blanc, Sauvignon Blanc and Chardonnay give the whites."],"kkps":[{"id":"STELLENBOSCH-R02","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Warm climate moderated by False Bay breezes and mountain slopes → Cabernet ripens fully but keeps structure → full-bodied, structured reds; Stellenbosch's reputation rests on Cabernet, its blends and Shiraz."},{"id":"STELLENBOSCH-R03","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Cooler mountain sites (e.g. Simonsberg-Stellenbosch) with a higher diurnal range → Cabernet and Pinotage keep acidity (they lose it quickly on warmer, lower sites)."}],"checks":[{"kp":"STELLENBOSCH-R02","type":"explain","prompt":"Starting from “Warm climate moderated by False Bay breezes and mountain slopes”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Cabernet ripens fully but keeps structure","full-bodied, structured reds; Stellenbosch's reputation rests on Cabernet, its blends and Shiraz"]},{"kp":"STELLENBOSCH-R03","type":"explain","prompt":"Starting from “Cooler mountain sites (e.g. Simonsberg-Stellenbosch) with a higher diurnal range”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Cabernet and Pinotage keep acidity (they lose it quickly on warmer, lower sites)"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Dry farming is widespread (600–900 mm rainfall); mountain slopes provide cooler aspects for quality.","Granite and shale slope soils restrict vigour for structured reds; valley-floor soils are more fertile.","Revitalised historic estates and new wineries drive quality (Q:3–4).","Top reds are oak-aged for structure; Cape Blends combine Bordeaux varieties with Pinotage.","Whites range from fresh Sauvignon Blanc to textured, sometimes oaked Chenin."],"kkps":[{"id":"STELLENBOSCH-F04","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Structured Cabernet Sauvignon, its blends, Shiraz and Chenin Blanc."},{"id":"STELLENBOSCH-F05","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"South Africa's own crossing of Pinot Noir × Cinsaut → used as a varietal and in red Cape Blends (>30% Pinotage/Rhône)."}],"checks":[{"kp":"STELLENBOSCH-F04","type":"flash","question":"What is Stellenbosch's reputation built on?","answer":"Structured Cabernet Sauvignon, its blends, Shiraz and Chenin Blanc."},{"kp":"STELLENBOSCH-F05","type":"flash","question":"What is Pinotage, and where does it appear?","answer":"South Africa's own crossing of Pinot Noir × Cinsaut → used as a varietal and in red Cape Blends (>30% Pinotage/Rhône)."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["South Africa's Wine of Origin hierarchy: Geographical Unit → Region → District (Stellenbosch) → Ward (e.g. Simonsberg-Stellenbosch).","A red Cape Blend contains more than 30% Pinotage and/or black Rhône varieties."],"kkps":[{"id":"STELLENBOSCH-F06","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Breezes off the bay (and the Cape Doctor wind) moderate the warm summer temperatures → fresher, more structured wines, especially on cooler mountain slopes."},{"id":"STELLENBOSCH-F07","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"They have a higher diurnal range → grapes retain acidity (lost quickly on warmer, lower sites) for more structured, age-worthy reds."},{"id":"STELLENBOSCH-R08","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"South Africa's Wine of Origin hierarchy: Geographical Unit → Region → District (Stellenbosch) → Ward (e.g. Simonsberg-Stellenbosch)."}],"checks":[{"kp":"STELLENBOSCH-F06","type":"flash","question":"How does False Bay influence Stellenbosch?","answer":"Breezes off the bay (and the Cape Doctor wind) moderate the warm summer temperatures → fresher, more structured wines, especially on cooler mountain slopes."},{"kp":"STELLENBOSCH-F07","type":"flash","question":"Why do cooler mountain wards matter for Cabernet here?","answer":"They have a higher diurnal range → grapes retain acidity (lost quickly on warmer, lower sites) for more structured, age-worthy reds."},{"kp":"STELLENBOSCH-R08","type":"explain","prompt":"Starting from “South Africa's Wine of Origin hierarchy: Geographical Unit”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Region","District (Stellenbosch)","Ward (e.g. Simonsberg-Stellenbosch)"]}]}],"blind":[{"id":"STELLENBOSCH-BLIND-1","tastingProfile":"Red wine. Deep ruby. Pronounced ripe blackcurrant, black cherry, with cedar, dried herb and a subtle smoky/vanilla oak note. Dry, medium-plus acidity, high firm tannin, medium-plus alcohol, full body, long finish.","deduce":["Grape: Cabernet Sauvignon","Climate: warm (maritime-moderated)","Region: Stellenbosch (South Africa)"],"justifyWith":["Blackcurrant + cedar + high firm tannin → Cabernet Sauvignon","Ripe fruit and full body but retained acidity and structure → warm climate moderated by False Bay breezes and mountain slopes","Dried-herb and smoky edge → Stellenbosch Cabernet over a cooler Bordeaux"]}],"quiz":[{"id":"stellenbosch-Q1","kp":"STELLENBOSCH-R02","question":"What moderates Stellenbosch's warm climate, allowing Cabernet to keep structure?","correctAnswer":"False Bay breezes and mountain slopes","distractors":["Ocean fog from the cold Benguela Current","High altitude above 1,000 m","A rain shadow that brings cold continental air"]},{"id":"stellenbosch-Q2","kp":"STELLENBOSCH-F04","question":"What is Stellenbosch's reputation built on?","correctAnswer":"Structured Cabernet Sauvignon, its blends, Shiraz and Chenin Blanc","distractors":["Aromatic Riesling and traditional-method sparkling","Light-bodied Pinot Noir and Chardonnay","Fortified wines aged in a solera"]},{"id":"stellenbosch-Q3","kp":"STELLENBOSCH-F05","question":"What is Pinota , adjacent to the Atlantic Ocean → one of the coolest parts of the Cape.","Planting of Chardonnay and Pinot Noir began in 1975 with Burgundy-loving Tim Hamilton-Russell.","The Hemel-en-Aarde area comprises three wards (Valley, Upper Valley, Ridge) rising deeper inland and higher in altitude.","Clay-rich soils (sometimes >55% clay) retain water; the Ridge is the smallest, coldest and highest ward (~400 m)."],"kkps":[{"id":"WALKER-BAY-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"It is right beside the Atlantic → cooling sea winds slow ripening and reduce vigour → fresh, bright Pinot Noir and Chardonnay."},{"id":"WALKER-BAY-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Lower, warmer Valley → riper (up to ~14% abv); higher, cooler Ridge (~400 m) → fresher, brighter wines."},{"id":"WALKER-BAY-R03","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Part of the cool Cape South Coast Region, adjacent to the Atlantic Ocean → one of the coolest parts of the Cape."}],"checks":[{"kp":"WALKER-BAY-F01","type":"flash","question":"Why is Walker Bay one of South Africa's coolest regions?","answer":"It is right beside the Atlantic → cooling sea winds slow ripening and reduce vigour → fresh, bright Pinot Noir and Chardonnay."},{"kp":"WALKER-BAY-F02","type":"flash","question":"How does style change across the Hemel-en-Aarde wards?","answer":"Lower, warmer Valley → riper (up to ~14% abv); higher, cooler Ridge (~400 m) → fresher, brighter wines."},{"kp":"WALKER-BAY-R03","type":"explain","prompt":"Starting from “Part of the cool Cape South Coast Region, adjacent to the Atlantic Ocean”, explain what this leads to — through to the resulting wine style.","requiredPoints":["one of the coolest parts of the Cape"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrati
