SouthAfricaChina.pdf","statement":"Flat land suits it, and it boosts pungent thiol precursors (passionfruit, green pepper) 5–10× vs hand-picking."},{"id":"MARLBOROUGH-R04","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Surrounding mountain ranges shelter it from rain, so despite ~650 mm the growing season stays dry → low fungal-disease pressure."}],"checks":[{"kp":"MARLBOROUGH-F01","type":"flash","question":"What is Marlborough's signature wine and style?","answer":"Sauvignon Blanc: dry, high acidity, intensely aromatic — passionfruit, green capsicum, herbaceous and tropical."},{"kp":"MARLBOROUGH-F02","type":"flash","question":"How does the climate create Marlborough Sauvignon's intensity?","answer":"A long, dry, sunny growing season lets grapes hang into autumn, building very intense flavour while keeping high acidity."},{"kp":"MARLBOROUGH-F03","type":"flash","question":"Why is machine harvesting common for Marlborough Sauvignon?","answer":"Flat land suits it, and it boosts pungent thiol precursors (passionfruit, green pepper) 5–10× vs hand-picking."},{"kp":"MARLBOROUGH-R04","type":"explain","prompt":"Starting from “Surrounding mountain ranges shelter it from rain, so despite ~650 mm the growing season stays dry”, explain what this leads to — through to the resulting wine style.","requiredPoints":["low fungal-disease pressure"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["A long, dry, sunny growing season lets grapes hang into autumn → Sauvignon Blanc develops very intense flavour with high acidity → dry, pungent wines of passionfruit, green capsicum, herbaceous and tropical aromas.","Machine harvesting raises the pungent thiol precursors (passionfruit, green bell pepper) 5–10× versus hand harvest.","The cool Awatere gives leaner, more herbaceous, very high-acid Sauvignon; the Wairau gives riper, more tropical styles.","Pinot Noir thrives in the clay Southern Valleys, ripening slowly without excessive sugar/alcohol → weightier, more concentrated reds."],"kkps":[{"id":"MARLBOROUGH-R05","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"A long, dry, sunny growing season lets grapes hang into autumn → Sauvignon Blanc develops very intense flavour with high acidity → dry, pungent wines of passionfruit, green capsicum, herbaceous and tropical aromas."},{"id":"MARLBOROUGH-R06","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Pinot Noir thrives in the clay Southern Valleys, ripening slowly without excessive sugar/alcohol → weightier, more concentrated reds."}],"checks":[{"kp":"MARLBOROUGH-R05","type":"explain","prompt":"Starting from “A long, dry, sunny growing season lets grapes hang into autumn”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Sauvignon Blanc develops very intense flavour with high acidity","dry, pungent wines of passionfruit, green capsicum, herbaceous and tropical aromas"]},{"kp":"MARLBOROUGH-R06","type":"explain","prompt":"Starting from “Pinot Noir thrives in the clay Southern Valleys, ripening slowly without excessive sugar/alcohol”, explain what this leads to — through to the resulting wine style.","requiredPoints":["weightier, more concentrated reds"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Flat landscape → widespread machine harvesting; irrigation from underground aquifers.","Frost is the main hazard in the valley floors.","Sauvignon is fermented cool in stainless steel with cultured yeast; no MLC and no oak, to keep high acidity and pure primary fruit.","Premium examples experiment with wild yeast, barrel fermentation and lees stirring for texture."],"kkps":[{"id":"MARLBOROUGH-R07","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Flat landscape → widespread machine harvesting; irrigation from underground aquifers."}],"checks":[{"kp":"MARLBOROUGH-R07","type":"explain","prompt":"Starting from “Flat landscape”, explain what this leads to — through to the resulting wine style.","requiredPoints":["widespread machine harvesting; irrigation from underground aquifers"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Marlborough is a GI; sub-regional labelling is emerging."],"kkps":[{"id":"MARLBOROUGH-F08","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Wairau is warmer (riper, more tropical); Awatere is cooler/windier (leaner, herbaceous, very high acid)."}],"checks":[{"kp":"MARLBOROUGH-F08","type":"flash","question":"How do the Wairau and Awatere valleys differ?","answer":"Wairau is warmer (riper, more tropical); Awatere is cooler/windier (leaner, herbaceous, very high acid)."}]}],"blind":[{"id":"MARLBOROUGH-BLIND-1","tastingProfile":"White wine. Pale lemon. Pronounced passionfruit, gooseberry, green capsicum and grassy/herbaceous notes. Dry, high acidity, medium alcohol, medium body, medium-plus finish.","deduce":["Grape: Sauvignon Blanc","Climate: cool","Region: Marlborough (New Zealand)"],"justifyWith":["Pungent passionfruit + green capsicum + grassy aromatics → Sauvignon Blanc","Very high acid with herbaceous notes → cool growing season","Intense aromatics with both green and tropical fruit → classic Marlborough"]}],"quiz":[{"id":"marlborough-Q1","kp":"MARLBOROUGH-F01","question":"What is the classic flavour profile of Marlborough Sauvignon Blanc?","correctAnswer":"Dry, high-acid, intensely aromatic: passionfruit, green capsicum and herbaceous/tropical notes","distractors":["Off-dry with honey, ginger and stone fruit","Oaky with vanilla, butter and toast","Neutral, light and floral"]},{"id":"marlborough-Q2","kp":"MARLBOROUGH-R04","question":"Despite around 650 mm of rain, why does Marlborough's growing season stay dry with low fungal pressure?","correctAnswer":"Surrounding mountain ranges shelter the vineyards from rain","distractors":["A strong, drying offshore wind all summer","Deep free-draining sandy soils","An extremely short growing season"]},{"id":"marlborough-Q3","kp":"MARLBOROUGH-F03","question":"Why is machine harvesting at night favoured for Marlborough Sauvignon Blanc?","correctAnswer":"It boosts pungent thiol precursors (passionfruit, green pepper) 5–10× versus hand-picking","distractors":["It is required by appellation law","It allows whole-bunch pressing only","It avoids the region's frequent harvest rain"]},{"id":"marlborough-Q4","kp":"MARLBOROUGH-F08","question":"How do Marlborough's Wairau and Awatere sub-valleys differ in style?","correctAnswer":"Wairau is warmer and more tropical; Awatere is cooler, windier, leaner and herbaceous","distractors":["Wairau is cooler and leaner; Awatere is warmer and tropical","Both are equally warm but differ only in soil","Wairau makes only reds; Awatere only whites"]}]},{"id":"hawkes-bay","title":"Hawke's Bay","alt":"North Island · Bordeaux blends & Syrah","country":"New Zealand","flag":"🇳🇿","blurb":"Warm North Island region for Merlot-led Bordeaux blends and Syrah, led by Gimblett Gravels.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Moderate maritime","scores":{"warmth":4,"sun":4,"rain":3,"diurnal":3,"risk":3}},"style":{"red":55,"white":45},"grapes":[{"name":"Merlot","color":"r","pct":35},{"name":"Chardonnay","color":"w","pct":22},{"name":"Cabernet Sauvignon","color":"r","pct":14},{"name":"Syrah","color":"r","pct":12},{"name":"Sauvignon Blanc","color":"w","pct":10},{"name":"Malbec","color":"r","pct":7}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Moderate maritime climate similar to Bordeaux with an extended growing season (>200 days, ~2,180 sunshine hours).","A central mountain range shelters it from western rain (~1,000 mm); gravelly, alluvial river-terrace soils recall the Médoc.","Cool Pacific breezes near the coast slow ripening for fresher Chardonnay and Syrah."],"kkps":[],"checks":[]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Gimblett Gravels: stony topsoil heats up during the day and releases warmth in the evening → helps Syrah, Merlot and Cabernet ripen fully in a marginal climate → concentrated, structured reds.","Bordeaux varieties dominate: Merlot-led blends with Cabernet Sauvignon, Cabernet Franc and Malbec.","Syrah (77% of NZ's plantings) gives concentrated ripe blackberry, black pepper and floral character with medium+ body and acidity.","Free-draining gravels need irrigation; with little coastal moderation inland, frost can be a hazard."],"kkps":[{"id":"HAWKES-BAY-R01","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Gimblett Gravels: stony topsoil heats up during the day and releases warmth in the evening → helps Syrah, Merlot and Cabernet ripen fully in a marginal climate → concentrated, structured reds."}],"checks":[{"kp":"HAWKES-BAY-R01","type":"explain","prompt":"Starting from “Gimblett Gravels: stony topsoil heats up during the day and releases warmth in the evening”, explain what this leads to — through to the resulting wine style.","requiredPoints":["helps Syrah, Merlot and Cabernet ripen fully in a marginal climate","concentrated, structured reds"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Site choice (warm gravels vs cool coast) strongly shapes ripeness and style.","Top reds matured in French oak (some new) for 12–18 months; coastal Chardonnay shows higher acidity and citrus."],"kkps":[{"id":"HAWKES-BAY-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Merlot-led Bordeaux blends and Syrah, plus Chardonnay; many from the Gimblett Gravels."}],"checks":[{"kp":"HAWKES-BAY-F02","type":"flash","question":"What are Hawke's Bay's signature wines?","answer":"Merlot-led Bordeaux blends and Syrah, plus Chardonnay; many from the Gimblett Gravels."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Gimblett Gravels is New Zealand's first registered sub-region."],"kkps":[{"id":"HAWKES-BAY-F03","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"The stony topsoil warms in the day and radiates heat at night, helping Syrah/Merlot/Cabernet ripen in a marginal climate."},{"id":"HAWKES-BAY-F04","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Gravelly, alluvial river-terrace soils similar to the Médoc, well suited to Bordeaux varieties."}],"checks":[{"kp":"HAWKES-BAY-F03","type":"flash","question":"How do the Gimblett Gravels aid ripening?","answer":"The stony topsoil warms in the day and radiates heat at night, helping Syrah/Merlot/Cabernet ripen in a marginal climate."},{"kp":"HAWKES-BAY-F04","type":"flash","question":"What is special about Hawke's Bay's soils?","answer":"Gravelly, alluvial river-terrace soils similar to the Médoc, well suited to Bordeaux varieties."}]}],"blind":[{"id":"HAWKES-BLIND-1","tastingProfile":"Red wine. Medium-deep ruby. Medium-plus intensity blackcurrant, plum, red and black cherry with leafy/herbal hints, cedar and vanilla oak. Dry, medium-plus acidity, medium-plus ripe tannins, medium-plus alcohol, medium-plus body, long finish.","deduce":["Grape: Merlot (Bordeaux blend)","Climate: moderate","Region: Hawke's Bay (New Zealand)"],"justifyWith":["Blackcurrant/plum with leafy herbal hints and cedar oak → Merlot-led Bordeaux blend","Ripe fruit but retained medium-plus acidity and herbal edge → moderate maritime climate","Concentration and structure without overt high alcohol → Gimblett Gravels ripening in a marginal climate"]}],"quiz":[{"id":"hawkes-bay-Q1","kp":"HAWKES-BAY-F02","question":"Which wine styles is Hawke's Bay best known for?","correctAnswer":"Merlot-led Bordeaux blends and Syrah, plus Chardonnay","distractors":["Aromatic Sauvignon Blanc and Pinot Noir","Riesling and sweet botrytis wines","Traditional-method sparkling wine"]},{"id":"hawkes-bay-Q2","kp":"HAWKES-BAY-R01","question":"How does the Gimblett Gravels help grapes ripen in a marginal climate?","correctAnswer":"The stony topsoil heats up during the day and radiates warmth in the evening","distractors":["The deep clay soils retain cool moisture all season","Coastal fog traps heat overnight","Irrigation warms the vineyard soils"]},{"id":"hawkes-bay-Q3","kp":"HAWKES-BAY-F04","question":"The Gimblett Gravels' soils are most similar to which classic region?","correctAnswer":"The Médoc, with gravelly alluvial river-terrace soils suited to Bordeaux varieties","distractors":["Chablis, with Kimmeridgian limestone","The Mosel, with blue slate","Barolo, with calcareous marl"]},{"id":"hawkes-bay-Q4","kp":"HAWKES-BAY-R01","question":"What style of reds does the Gimblett Gravels yield?","correctAnswer":"Concentrated, structured reds from fully ripened Syrah, Merlot and Cabernet","distractors":["Light, pale, high-acid reds for early drinking","Sweet fortified reds","Soft, low-tannin carbonic-style reds"]}]},{"id":"martinborough","title":"Martinborough (Wairarapa)","alt":"North Island · Burgundian Pinot Noir","country":"New Zealand","flag":"🇳🇿","blurb":"Small, windy southern region making intense, structured, Burgundian Pinot Noir.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Cool maritime","scores":{"warmth":3,"sun":4,"rain":2,"diurnal":5,"risk":4}},"style":{"red":55,"white":45},"grapes":[{"name":"Pinot Noir","color":"r","pct":52},{"name":"Sauvignon Blanc","color":"w","pct":22},{"name":"Pinot Gris","color":"w","pct":14},{"name":"Chardonnay","color":"w","pct":12}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Cool maritime with warm summer days but a big diurnal range → slow ripening that retains acidity.","The most southerly North Island region; strong Cook Strait winds during flowering and fruit set cut yields and give small, thick-skinned grapes.","Free-draining alluvial gravel terraces with silt loam have a cooling influence, lengthening the season for more concentrated fruit."],"kkps":[{"id":"MARTINBOROUGH-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Intense, structured, Burgundian Pinot Noir with savoury red/black fruit and fine-grained tannins."},{"id":"MARTINBOROUGH-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Cook Strait winds cut yields and give small, thick-skinned grapes → more concentrated, structured wines."},{"id":"MARTINBOROUGH-F03","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"More restrained and herbaceous, with high acidity and more intensity from lower yields."},{"id":"MARTINBOROUGH-R04","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Cool maritime with warm summer days but a big diurnal range → slow ripening that retains acidity."}],"checks":[{"kp":"MARTINBOROUGH-F01","type":"flash","question":"What is Martinborough best known for?","answer":"Intense, structured, Burgundian Pinot Noir with savoury red/black fruit and fine-grained tannins."},{"kp":"MARTINBOROUGH-F02","type":"flash","question":"How does wind shape Martinborough's wines?","answer":"Cook Strait winds cut yields and give small, thick-skinned grapes → more concentrated, structured wines."},{"kp":"MARTINBOROUGH-F03","type":"flash","question":"How does its Sauvignon Blanc differ from Marlborough's?","answer":"More restrained and herbaceous, with high acidity and more intensity from lower yields."},{"kp":"MARTINBOROUGH-R04","type":"explain","prompt":"Starting from “Cool maritime with warm summer days but a big diurnal range”, explain what this leads to — through to the resulting wine style.","requiredPoints":["slow ripening that retains acidity"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Big diurnal range + wind-reduced yields → Pinot Noir develops intense, concentrated fruit with ripe, structured, fine-grained tannins → savoury, Burgundian wines of red cherry and black plum with earthy spice.","Pinot Noir is over half of plantings; the Abel clone (from Burgundy) is prized.","Sauvignon Blanc is more restrained and herbaceous than Marlborough, with high acidity and greater intensity from low yields."],"kkps":[{"id":"MARTINBOROUGH-R05","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Big diurnal range + wind-reduced yields → Pinot Noir develops intense, concentrated fruit with ripe, structured, fine-grained tannins → savoury, Burgundian wines of red cherry and black plum with earthy spice."}],"checks":[{"kp":"MARTINBOROUGH-R05","type":"explain","prompt":"Starting from “Big diurnal range + wind-reduced yields”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Pinot Noir develops intense, concentrated fruit with ripe, structured, fine-grained tannins","savoury, Burgundian wines of red cherry and black plum with earthy spice"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Wind machines combat spring frost; the windy, dry conditions reduce fungal disease.","Pinot Noir matured in French oak for 12–18 months; some whole-bunch fermentation for aromatics."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Martinborough sits within the Wairarapa GI."],"kkps":[],"checks":[]}],"blind":[{"id":"MARTINBOROUGH-BLIND-1","tastingProfile":"Red wine. Medium ruby. Pronounced red cherry, black plum, with savoury, earthy spice and subtle oak. Dry, high acidity, medium tannin (ripe, fine-grained), medium alcohol, medium body, long finish.","deduce":["Grape: Pinot Noir","Climate: cool","Region: Martinborough / Wairarapa (New Zealand)"],"justifyWith":["Red cherry + fine-grained tannin + high acid → Pinot Noir","Savoury, earthy, Burgundian character with concentration → wind-reduced yields in Martinborough","High acidity and restraint → cool maritime climate with a large diurnal range, not a warm region"]}],"quiz":[{"id":"martinborough-Q1","kp":"MARTINBOROUGH-F01","question":"What style of Pinot Noir is Martinborough known for?","correctAnswer":"Intense, structured, Burgundian wines with savoury red/black fruit and fine-grained tannins","distractors":["Light, pale, simple wines for early drinking","Deeply tannic, jammy, high-alcohol wines","Off-dry, low-alcohol wines with residual sugar"]},{"id":"martinborough-Q2","kp":"MARTINBOROUGH-F02","question":"How do the Cook Strait winds affect Martinborough's grapes?","correctAnswer":"They cut yields and give small, thick-skinned grapes, concentrating the wines","distractors":["They raise humidity and encourage botrytis","They bring warmth that boosts ripeness and yields","They cause spring frost that damages buds"]},{"id":"martinborough-Q3","kp":"MARTINBOROUGH-R04","question":"What is the effect of Martinborough's big diurnal range?","correctAnswer":"Slow ripening that retains acidity","distractors":["Rapid ripening that lowers acidity","Reliable autumn noble rot","Higher yields of dilute fruit"]},{"id":"martinborough-Q4","kp":"MARTINBOROUGH-F03","question":"Compared with Marlborough, how is Martinborough Sauvignon Blanc described?","correctAnswer":"More restrained and herbaceous, with high acidity and more intensity from lower yields","distractors":["Riper and more tropical, with lower acidity","Oaked and full-bodied with toasty notes","Sweet and low in acidity"]}]},{"id":"central-otago","title":"Central Otago","alt":"South Island · the world's southernmost Pinot","country":"New Zealand","flag":"🇳🇿","blurb":"NZ's only semi-continental region — high, dry mountains making deep, fruit-rich Pinot Noir.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Semi-continental","scores":{"warmth":3,"sun":5,"rain":1,"diurnal":5,"risk":4}},"style":{"red":75,"white":25},"grapes":[{"name":"Pinot Noir","color":"r","pct":80},{"name":"Pinot Gris","color":"w","pct":9},{"name":"Riesling","color":"w","pct":6},{"name":"Chardonnay","color":"w","pct":5}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["New Zealand's only semi-continental climate, surrounded by the Southern Alps, with warm, dry summers and cold winters.","At 46°S it is one of the world's most southerly wine regions, with long daylight and high UV.","Very dry (~360 mm) and mountain-sheltered → irrigation is essential; spring frost from cold nights is fought with helicopters.","Most vineyards sit above 300 m on free-draining schist-based soils, giving a high diurnal range."],"kkps":[{"id":"CENTRAL-OTAGO-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"It is the country's only semi-continental region — warm dry summers, cold winters, sheltered by the Southern Alps."},{"id":"CENTRAL-OTAGO-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"High UV and warm summers with cold nights give deep colour, full body, ripe tannins and intense red/black cherry, with good acidity."},{"id":"CENTRAL-OTAGO-F03","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Bannockburn and Bendigo are warmest (Bendigo even ripens Syrah); Gibbston is highest and coolest."},{"id":"CENTRAL-OTAGO-R04","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Very dry (~360 mm) and mountain-sheltered → irrigation is essential; spring frost from cold nights is fought with helicopters."}],"checks":[{"kp":"CENTRAL-OTAGO-F01","type":"flash","question":"Why is Central Otago's climate unusual for New Zealand?","answer":"It is the country's only semi-continental region — warm dry summers, cold winters, sheltered by the Southern Alps."},{"kp":"CENTRAL-OTAGO-F02","type":"flash","question":"How does the climate shape Central Otago Pinot Noir?","answer":"High UV and warm summers with cold nights give deep colour, full body, ripe tannins and intense red/black cherry, with good acidity."},{"kp":"CENTRAL-OTAGO-F03","type":"flash","question":"Which sub-regions are warmest and coolest?","answer":"Bannockburn and Bendigo are warmest (Bendigo even ripens Syrah); Gibbston is highest and coolest."},{"kp":"CENTRAL-OTAGO-R04","type":"explain","prompt":"Starting from “Very dry (~360 mm) and mountain-sheltered”, explain what this leads to — through to the resulting wine style.","requiredPoints":["irrigation is essential; spring frost from cold nights is fought with helicopters"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["High UV and warm summers with cold nights → Pinot Noir ripens to full flavour while keeping acidity → deep-coloured, full-bodied wines with good acidity, ripe tannins and intense red plum and black cherry.","Pinot Noir is ~80% of the region (30% of all NZ Pinot).","Cold nights preserve acidity and aromatics in Pinot Gris and Riesling, made dry to fully sweet.","Sub-regions vary: Bannockburn and Bendigo are warmest (Bendigo can even ripen Syrah); Gibbston is highest and coolest with fresher, higher-acid styles."],"kkps":[{"id":"CENTRAL-OTAGO-R05","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"High UV and warm summers with cold nights → Pinot Noir ripens to full flavour while keeping acidity → deep-coloured, full-bodied wines with good acidity, ripe tannins and intense red plum and black cherry."}],"checks":[{"kp":"CENTRAL-OTAGO-R05","type":"explain","prompt":"Starting from “High UV and warm summers with cold nights”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Pinot Noir ripens to full flavour while keeping acidity","deep-coloured, full-bodied wines with good acidity, ripe tannins and intense red plum and black cherry"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Canopies shade the west-facing side to protect fruit from the hot afternoon sun.","Low disease pressure (dry climate) supports organic and biodynamic viticulture.","Pinot matured in oak with some whole-cluster fermentation for complexity."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Central Otago has six sub-regions with distinct mesoclimates."],"kkps":[],"checks":[]}],"blind":[{"id":"CENTRAL-BLIND-1","tastingProfile":"Red wine. Medium-deep ruby. Pronounced ripe red plum, black cherry and floral/spice notes with subtle oak. Dry, medium-plus acidity, medium-plus ripe tannins, medium-plus alcohol, full body, long finish.","deduce":["Grape: Pinot Noir","Climate: moderate","Region: Central Otago (New Zealand)"],"justifyWith":["Ripe red cherry/plum + floral lift + fine tannins → Pinot Noir","Deep colour and full body with retained acidity → high-UV warm days with cold nights","Concentration and ripe tannins → sunny semi-continental Central Otago rather than a cooler maritime site"]}],"quiz":[{"id":"central-otago-Q1","kp":"CENTRAL-OTAGO-F01","question":"What is distinctive about Central Otago's climate within New Zealand?","correctAnswer":"It is the country's only semi-continental region, sheltered by the Southern Alps","distractors":["It is the country's warmest maritime region","It is the wettest region in New Zealand","It is a tropical, humid region"]},{"id":"central-otago-Q2","kp":"CENTRAL-OTAGO-F03","question":"Which Central Otago sub-region is the highest and coolest?","correctAnswer":"Gibbston","distractors":["Bannockburn","Bendigo","Cromwell"]},{"id":"central-otago-Q3","kp":"CENTRAL-OTAGO-R04","question":"Why is irrigation essential in Central Otago?","correctAnswer":"It is very dry (~360 mm) and sheltered from rain by the mountains","distractors":["The soils are too free-draining sand","Constant heat evaporates all rainfall","Salty coastal soils require flushing"]},{"id":"central-otago-Q4","kp":"CENTRAL-OTAGO-R05","question":"What style of Pinot Noir results from Central Otago's high UV, warm summers and cold nights?","correctAnswer":"Deep-coloured, full-bodied wines with good acidity, ripe tannins and intense red plum and black cherry","distractors":["Pale, light-bodied wines with low tannin","Oxidative, nutty wines","Sweet, botrytised dessert wines"]}]},{"id":"napa-valley","title":"Napa Valley","alt":"California, USA · benchmark Cabernet","country":"United States","flag":"🇺🇸","blurb":"California's most prestigious region — structured, age-worthy Cabernet Sauvignon and Bordeaux blends.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Warm Mediterranean","scores":{"warmth":5,"sun":5,"rain":1,"diurnal":4,"risk":2}},"style":{"red":80,"white":20},"grapes":[{"name":"Cabernet Sauvignon","color":"r","pct":45},{"name":"Merlot","color":"r","pct":12},{"name":"Chardonnay","color":"w","pct":16},{"name":"Sauvignon Blanc","color":"w","pct":8},{"name":"Other reds (Zinfandel, Petit Verdot)","color":"r","pct":19}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Warm Mediterranean climate; the Mayacamas Mountains to the west shelter the valley from the cold Pacific, while the Vaca Range to the east blocks Central Valley heat.","Open to San Pablo Bay in the south → as the valley heats up during the day, rising air pulls cool bay air and fog up-valley in the afternoon, moderating temperatures.","Just 50 km long by 8 km wide with the Napa River running through it; vineyards sit on both the valley floor and the mountain slopes either side.","Valley-floor sites sit under the fog layer → a high diurnal range; the southern AVAs (Carneros, Coombsville, Oak Knoll) are coolest as fog lingers into the morning."],"kkps":[{"id":"NAPA-VALLEY-F01","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The Mayacamas (west) shelter it from the cold Pacific; the Vaca Range (east) protects it from Central Valley heat."},{"id":"NAPA-VALLEY-R02","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Open to San Pablo Bay in the south → as the valley heats up during the day, rising air pulls cool bay air and fog up-valley in the afternoon, moderating temperatures."},{"id":"NAPA-VALLEY-R03","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Valley-floor sites sit under the fog layer → a high diurnal range; the southern AVAs (Carneros, Coombsville, Oak Knoll) are coolest as fog lingers into the morning."}],"checks":[{"kp":"NAPA-VALLEY-F01","type":"flash","question":"What two mountain ranges shelter Napa Valley, and from what?","answer":"The Mayacamas (west) shelter it from the cold Pacific; the Vaca Range (east) protects it from Central Valley heat."},{"kp":"NAPA-VALLEY-R02","type":"explain","prompt":"Starting from “Open to San Pablo Bay in the south”, explain what this leads to — through to the resulting wine style.","requiredPoints":["as the valley heats up during the day, rising air pulls cool bay air and fog up-valley in the afternoon, moderating temperatures"]},{"kp":"NAPA-VALLEY-R03","type":"explain","prompt":"Starting from “Valley-floor sites sit under the fog layer”, explain what this leads to — through to the resulting wine style.","requiredPoints":["a high diurnal range; the southern AVAs (Carneros, Coombsville, Oak Knoll) are coolest as fog lingers into the morning"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Warm valley floor → Cabernet ripens to high sugar with high, ripe tannins → full-bodied reds, rounder and more fruity in youth (juicy blackcurrant, blackberry, plum, liquorice) than the structured mountain wines.","Mountain AVAs sit above the fog layer with fewer temperature extremes and a lower diurnal range → higher tannins and acidity; Howell Mountain gives the most concentrated, firmly tannic Cabernet.","Cool, fog-bound Carneros in the south → early-ripening Chardonnay and Pinot Noir retain acidity for fresher styles.","Cabernet Sauvignon is over 40% of production and 55% of crop value; Sauvignon Blanc gives ripe, juicy, peachy whites with medium-plus acidity."],"kkps":[{"id":"NAPA-VALLEY-F04","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cabernet Sauvignon — over 40% of production and ~55% of crop value."},{"id":"NAPA-VALLEY-F05","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Screaming Eagle, Harlan Estate, Stag's Leap Wine Cellars (any)."},{"id":"NAPA-VALLEY-R06","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Warm valley floor → Cabernet ripens to high sugar with high, ripe tannins → full-bodied reds, rounder and more fruity in youth (juicy blackcurrant, blackberry, plum, liquorice) than the structured mountain wines."},{"id":"NAPA-VALLEY-R07","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Mountain AVAs sit above the fog layer with fewer temperature extremes and a lower diurnal range → higher tannins and acidity; Howell Mountain gives the most concentrated, firmly tannic Cabernet."},{"id":"NAPA-VALLEY-R08","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool, fog-bound Carneros in the south → early-ripening Chardonnay and Pinot Noir retain acidity for fresher styles."}],"checks":[{"kp":"NAPA-VALLEY-F04","type":"flash","question":"Which grape dominates Napa, by value?","answer":"Cabernet Sauvignon — over 40% of production and ~55% of crop value."},{"kp":"NAPA-VALLEY-F05","type":"flash","question":"Name two iconic Napa Cabernet producers.","answer":"Screaming Eagle, Harlan Estate, Stag's Leap Wine Cellars (any)."},{"kp":"NAPA-VALLEY-R06","type":"explain","prompt":"Starting from “Warm valley floor”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Cabernet ripens to high sugar with high, ripe tannins","full-bodied reds, rounder and more fruity in youth (juicy blackcurrant, blackberry, plum, liquorice) than the structured mountain wines"]},{"kp":"NAPA-VALLEY-R07","type":"explain","prompt":"Starting from “Mountain AVAs sit above the fog layer with fewer temperature extremes and a lower diurnal range”, explain what this leads to — through to the resulting wine style.","requiredPoints":["higher tannins and acidity; Howell Mountain gives the most concentrated, firmly tannic Cabernet"]},{"kp":"NAPA-VALLEY-R08","type":"explain","prompt":"Starting from “Cool, fog-bound Carneros in the south”, explain what this leads to — through to the resulting wine style.","requiredPoints":["early-ripening Chardonnay and Pinot Noir retain acidity for fresher styles"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["90% of Napa County is under high protection from development and all viable vineyard land is planted → very high grape and land prices.","Mountain soils are thin and low in nutrients, restricting vigour for small, concentrated grapes; valley-floor silt and clay are more fertile and water-retaining.","Frost is the main hazard on the valley floor; warmer nights and air movement in the mountain AVAs reduce the risk. Drip irrigation is widely installed for the dry growing season.","The 1980s–90s style was full-bodied and intense — late-harvested for extra-ripe flavours, high alcohol and a high % of new oak (vanilla, coconut, toast).","Today producers tend to pick earlier; a high % of new oak is still common for reds but for shorter periods.","Single-varietal labels may still include a small % of other varieties (Merlot, Cabernet Franc); blending across vineyards and soil types is common."],"kkps":[{"id":"NAPA-VALLEY-F09","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"It is open to San Pablo Bay → fog and cool air push up-valley and linger into the morning, limiting hours of warmth (e.g. Carneros, Coombsville, Oak Knoll)."},{"id":"NAPA-VALLEY-R10","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"90% of Napa County is under high protection from development and all viable vineyard land is planted → very high grape and land prices."}],"checks":[{"kp":"NAPA-VALLEY-F09","type":"flash","question":"Why is the southern end of the valley floor the coolest?","answer":"It is open to San Pablo Bay → fog and cool air push up-valley and linger into the morning, limiting hours of warmth (e.g. Carneros, Coombsville, Oak Knoll)."},{"kp":"NAPA-VALLEY-R10","type":"explain","prompt":"Starting from “90% of Napa County is under high protection from development and all viable vineyard land is planted”, explain what this leads to — through to the resulting wine style.","requiredPoints":["very high grape and land prices"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Napa Valley AVA contains how many smaller nested AVAs?","16 — and a wine must include 'Napa Valley' on the label."],"kkps":[{"id":"NAPA-VALLEY-F11","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Mountains sit above the fog with a lower diurnal range and poor soils → higher tannin and acidity, more structured; valley-floor wines are rounder, fruitier and riper in youth."}],"checks":[{"kp":"NAPA-VALLEY-F11","type":"flash","question":"How do mountain-AVA Cabernets differ from valley-floor Cabernets?","answer":"Mountains sit above the fog with a lower diurnal range and poor soils → higher tannin and acidity, more structured; valley-floor wines are rounder, fruitier and riper in youth."}]}],"blind":[{"id":"NAPA-BLIND-1","tastingProfile":"Red wine. Deep ruby. Pronounced ripe blackcurrant, blackberry and plum, liquorice, with cedar/vanilla new oak. Dry, medium-plus acidity, high ripe tannins, high alcohol, full body, rich juicy dark fruit, long finish.","deduce":["Grape: Cabernet Sauvignon","Climate: warm","Region: Napa Valley (United States)"],"justifyWith":["Pronounced blackcurrant + high ripe tannin + full body → Cabernet Sauvignon from a warm climate","Rich, juicy, rounded fruit with generous new oak in youth → warm Napa valley-floor style","High alcohol with ripe (not green) tannins → fully ripened Cabernet, not a cooler Bordeaux example"]}],"quiz":[{"id":"napa-valley-Q1","kp":"NAPA-VALLEY-F04","question":"Which grape dominates Napa Valley by production and value?","correctAnswer":"Cabernet Sauvignon (over 40% of production, ~55% of crop value)","distractors":["Zinfandel","Pinot Noir","Chardonnay"]},{"id":"napa-valley-Q2","kp":"NAPA-VALLEY-R02","question":"What moderates daytime heat on the Napa Valley floor?","correctAnswer":"Cool bay air and fog pulled up-valley from San Pablo Bay in the afternoon","distractors":["Persistent heavy rainfall through summer","High-altitude alpine winds","A cold ocean current directly on the vineyards"]},{"id":"napa-valley-Q3","kp":"NAPA-VALLEY-R07","question":"How do Napa's mountain AVAs differ from the valley floor?","correctAnswer":"Above the fog with a lower diurnal range, giving higher tannins and acidity (e.g. Howell Mountain)","distractors":["Cooler and foggier, giving lighter, fresher wines","Warmer with very ripe, jammy, low-acid reds","Best suited only to sparkling base wine"]},{"id":"napa-valley-Q4","kp":"NAPA-VALLEY-F01","question":"What role do the Mayacamas and Vaca ranges play?","correctAnswer":"The Mayacamas shelter Napa from the cold Pacific; the Vaca protect it from Central Valley heat","distractors":["They both block all marine fog from entering","They funnel desert winds into the valley","They provide the region's only source of irrigation water"]},{"id":"napa-valley-Q5","kp":"NAPA-VALLEY-R08","question":"Why is cool, fog-bound Carneros suited to Chardonnay and Pinot Noir?","correctAnswer":"Early-ripening varieties retain acidity there for fresher styles","distractors":["The extreme heat boosts sugar and alcohol","It is the warmest, driest part of Napa","It lies above the fog with very ripe tannins"]}]},{"id":"sonoma-county","title":"Sonoma County","alt":"California, USA · cool-coast Pinot to warm Cabernet","country":"United States","flag":"🇺🇸","blurb":"A hugely diverse county spanning fog-cooled Pinot Noir and Chardonnay to warm-inland Cabernet and old-vine Zinfandel.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Moderate to warm (very varied)","scores":{"warmth":3,"sun":4,"rain":2,"diurnal":3,"risk":3}},"style":{"red":55,"white":45},"grapes":[{"name":"Pinot Noir","color":"r","pct":22},{"name":"Chardonnay","color":"w","pct":26},{"name":"Cabernet Sauvignon","color":"r","pct":16},{"name":"Zinfandel","color":"r","pct":14},{"name":"Sauvignon Blanc","color":"w","pct":10},{"name":"Other","color":"r","pct":12}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Far more diverse than Napa: 19 AVAs spanning the cool Pacific coast to warm, sheltered inland valleys.","The Russian River and gaps in the coastal hills (the Petaluma Gap) funnel cold ocean air and fog inland → dramatic cooling that varies block by block.","Coastal Sonoma Coast and the Russian River Valley are cool and fog-bound; inland Alexander, Knights and Dry Creek valleys are sheltered and warm.","Altitude matters: sites above the fog line (Rockpile, Sonoma Mountain at ~730 m) get long sunshine hours and warmth while valley floors stay foggy and cool."],"kkps":[{"id":"SONOMA-COUNTY-F01","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The Russian River and the Petaluma Gap funnel cold Pacific air and evening/morning fog inland → lower temperatures, slower sugar accumulation and higher acidity, ideal for Pinot Noir and Chardonnay."},{"id":"SONOMA-COUNTY-F02","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Sites above the fog line (e.g. Rockpile, Sonoma Mountain) get long sunshine and warmth → riper, more structured wines, while foggy valley floors stay cooler and fresher."},{"id":"SONOMA-COUNTY-R03","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The Russian River and gaps in the coastal hills (the Petaluma Gap) funnel cold ocean air and fog inland → dramatic cooling that varies block by block."}],"checks":[{"kp":"SONOMA-COUNTY-F01","type":"flash","question":"Why is the Russian River Valley cool despite being inland?","answer":"The Russian River and the Petaluma Gap funnel cold Pacific air and evening/morning fog inland → lower temperatures, slower sugar accumulation and higher acidity, ideal for Pinot Noir and Chardonnay."},{"kp":"SONOMA-COUNTY-F02","type":"flash","question":"How does altitude change style within Sonoma?","answer":"Sites above the fog line (e.g. Rockpile, Sonoma Mountain) get long sunshine and warmth → riper, more structured wines, while foggy valley floors stay cooler and fresher."},{"kp":"SONOMA-COUNTY-R03","type":"explain","prompt":"Starting from “The Russian River and gaps in the coastal hills (the Petaluma Gap) funnel cold ocean air and fog inland”, explain what this leads to — through to the resulting wine style.","requiredPoints":["dramatic cooling that varies block by block"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool, fog-bound Russian River Valley and Sonoma Coast → Pinot Noir and Chardonnay keep high acidity → fresh, lighter-bodied, elegant wines (ripe strawberry/red cherry Pinot; creamy, citrus/peach Chardonnay).","Warm, sheltered Alexander and Knights valleys → Cabernet Sauvignon ripens fully → full-bodied reds of ripe blackberry, blackcurrant, dried herbs and chocolate.","Dry Creek Valley is famous for old-vine Zinfandel (some over 100 years) → medium-plus to full-bodied, ripe blackberry/black-plum reds, often with jammy, dried-fruit notes; American oak is common.","Coolest coastal sites (Fort Ross-Seaview, Petaluma Gap) → high winds close leaf stomata and slow ripening → fresh, high-acid, lower-alcohol Pinot and Chardonnay."],"kkps":[{"id":"SONOMA-COUNTY-R04","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool, fog-bound Russian River Valley and Sonoma Coast → Pinot Noir and Chardonnay keep high acidity → fresh, lighter-bodied, elegant wines (ripe strawberry/red cherry Pinot; creamy, citrus/peach Chardonnay)."},{"id":"SONOMA-COUNTY-R05","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Warm, sheltered Alexander and Knights valleys → Cabernet Sauvignon ripens fully → full-bodied reds of ripe blackberry, blackcurrant, dried herbs and chocolate."},{"id":"SONOMA-COUNTY-R06","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Dry Creek Valley is famous for old-vine Zinfandel (some over 100 years) → medium-plus to full-bodied, ripe blackberry/black-plum reds, often with jammy, dried-fruit notes; American oak is common."},{"id":"SONOMA-COUNTY-R07","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Coolest coastal sites (Fort Ross-Seaview, Petaluma Gap) → high winds close leaf stomata and slow ripening → fresh, high-acid, lower-alcohol Pinot and Chardonnay."}],"checks":[{"kp":"SONOMA-COUNTY-R04","type":"explain","prompt":"Starting from “Cool, fog-bound Russian River Valley and Sonoma Coast”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Pinot Noir and Chardonnay keep high acidity","fresh, lighter-bodied, elegant wines (ripe strawberry/red cherry Pinot; creamy, citrus/peach Chardonnay)"]},{"kp":"SONOMA-COUNTY-R05","type":"explain","prompt":"Starting from “Warm, sheltered Alexander and Knights valleys”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Cabernet Sauvignon ripens fully","full-bodied reds of ripe blackberry, blackcurrant, dried herbs and chocolate"]},{"kp":"SONOMA-COUNTY-R06","type":"explain","prompt":"Starting from “Dry Creek Valley is famous for old-vine Zinfandel (some over 100 years)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["medium-plus to full-bodied, ripe blackberry/black-plum reds, often with jammy, dried-fruit notes; American oak is common"]},{"kp":"SONOMA-COUNTY-R07","type":"explain","prompt":"Starting from “Coolest coastal sites (Fort Ross-Seaview, Petaluma Gap)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["high winds close leaf stomata and slow ripening","fresh, high-acid, lower-alcohol Pinot and Chardonnay"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Free-draining, low-nutrient soils on hillsides (volcanic, sandstone, gravel) limit vigour and yields for concentrated fruit.","Cool, windy spring conditions on the coast often disrupt fruit set → naturally low yields in Sonoma Coast.","Sonoma County has its own sustainability certification (Sonoma County) widely adopted across the region.","Cooler-vintage Pinot is made with gentle extraction and a decreasing % of new (often older) French oak.","Coastal Chardonnay uses malolactic conversion and oak maturation for creamy, spicy texture; warmer-site fruit gives riper, fuller styles.","Quality and price range widely across the county's AVAs (Q: 2–4)."],"kkps":[{"id":"SONOMA-COUNTY-F08","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Old-vine Zinfandel — ripe, medium-plus to full-bodied reds, often jammy, typically aged in American oak."},{"id":"SONOMA-COUNTY-R09","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool, windy spring conditions on the coast often disrupt fruit set → naturally low yields in Sonoma Coast."}],"checks":[{"kp":"SONOMA-COUNTY-F08","type":"flash","question":"What is Dry Creek Valley best known for?","answer":"Old-vine Zinfandel — ripe, medium-plus to full-bodied reds, often jammy, typically aged in American oak."},{"kp":"SONOMA-COUNTY-R09","type":"explain","prompt":"Starting from “Cool, windy spring conditions on the coast often disrupt fruit set”, explain what this leads to — through to the resulting wine style.","requiredPoints":["naturally low yields in Sonoma Coast"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["A wine labelled with a specific AVA (e.g. Russian River Valley) follows California's rule of ≥85% of grapes from that AVA.","Many overlapping AVAs exist — Northern Sonoma, Sonoma Coast and Sonoma Valley overlap one another."],"kkps":[{"id":"SONOMA-COUNTY-F10","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"They are sheltered from coastal cooling by hills → warm days ripen Cabernet fully into full-bodied, ripe-fruited reds."}],"checks":[{"kp":"SONOMA-COUNTY-F10","type":"flash","question":"Why do the warm inland valleys (Alexander, Knights) suit Cabernet?","answer":"They are sheltered from coastal cooling by hills → warm days ripen Cabernet fully into full-bodied, ripe-fruited reds."}]}],"blind":[{"id":"SONOMA-BLIND-1","tastingProfile":"Red wine. Medium ruby. Pronounced ripe strawberry, red cherry, raspberry with subtle baking spice and vanilla oak. Dry, medium-plus to high acidity, medium tannin, medium-plus alcohol, medium body, medium-plus finish.","deduce":["Grape: Pinot Noir","Climate: moderate (cool, fog-cooled sites)","Region: Sonoma County / Russian River Valley (California, USA)"],"justifyWith":["Red-fruited, medium tannin, perfumed → Pinot Noir","Ripe fruit yet fresh high acidity and elegance → cool, fog-cooled coastal California","Riper strawberry/cherry with spice oak → Russian River Valley over a cooler Burgundy"]}],"quiz":[{"id":"sonoma-county-Q1","kp":"SONOMA-COUNTY-F01","question":"How do the Russian River and the Petaluma Gap shape Sonoma's cooler sites?","correctAnswer":"They funnel cold Pacific air and fog inland, lowering temperatures and preserving acidity for Pinot Noir and Chardonnay","distractors":["They block ocean air, trapping heat for full-bodied Cabernet","They bring summer rain that dilutes the fruit","They warm the vineyards with foehn winds off the mountains"]},{"id":"sonoma-county-Q2","kp":"SONOMA-COUNTY-R04","question":"What style of Pinot Noir comes from the fog-bound Russian River Valley and Sonoma Coast?","correctAnswer":"Fresh, lighter-bodied, elegant wines with ripe strawberry and red cherry","distractors":["Jammy, full-bodied, high-alcohol wines with dried-fruit notes","Pale, very tannic wines with green bell-pepper character","Oxidative, nutty wines aged under flor"]},{"id":"sonoma-county-Q3","kp":"SONOMA-COUNTY-R05","question":"Which warm, sheltered Sonoma valleys are best for full-bodied Cabernet Sauvignon?","correctAnswer":"Alexander and Knights valleys","distractors":["Russian River Valley and Sonoma Coast","Fort Ross-Seaview and the Petaluma Gap","Carneros and Green Valley"]},{"id":"sonoma-county-Q4","kp":"SONOMA-COUNTY-F08","question":"Which Sonoma valley is famous for old-vine Zinfandel?","correctAnswer":"Dry Creek Valley","distractors":["Russian River Valley","Alexander Valley","Petaluma Gap"]}]},{"id":"central-coast","title":"Central Coast","alt":"California, USA · Monterey, Paso Robles, Santa Barbara","country":"United States","flag":"🇺🇸","blurb":"A long coastal stretch where marine air funnels through gaps in the hills, from cool Chardonnay/Pinot to warm Rhône and Bordeaux reds.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Cool to warm maritime","scores":{"warmth":3,"sun":4,"rain":2,"diurnal":4,"risk":2}},"style":{"red":50,"white":50},"grapes":[{"name":"Chardonnay","color":"w","pct":34},{"name":"Pinot Noir","color":"r","pct":14},{"name":"Cabernet Sauvignon","color":"r","pct":12},{"name":"Syrah","color":"r","pct":10},{"name":"Sauvignon Blanc","color":"w","pct":8},{"name":"Other","color":"r","pct":22}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Parallels the Pacific from San Francisco to Santa Barbara at low latitude; cooled by marine air funnelling through gaps in the coastal hills.","Monterey's vineyards sit in the Salinas Valley → cold, deep Monterey Bay sends cool, windy marine air down the valley in afternoons and evenings.","Santa Barbara's transverse (east–west) valleys open directly to the ocean → cool maritime air and fog reach far inland (e.g. Sta. Rita Hills).","Paso Robles is largely sheltered from the coast → warm to hot, with a wide diurnal range; the Templeton Gap lets some Pacific air reach inland."],"kkps":[{"id":"CENTRAL-COAST-F01","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cold, deep Monterey Bay funnels cool, windy marine air down the Salinas Valley in the afternoon and evening → slow ripening, high acidity, especially in Santa Lucia Highlands."},{"id":"CENTRAL-COAST-F02","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Full-bodied, ripe Cabernet Sauvignon and Rhône varieties (Syrah, Grenache, Mourvèdre) → concentrated, ripe-fruited reds; it's largely sheltered from coastal cooling."},{"id":"CENTRAL-COAST-F03","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Its transverse east–west valleys open straight to the ocean → cool maritime air and fog penetrate far inland, suiting Pinot Noir and Chardonnay (e.g. Sta. Rita Hills)."},{"id":"CENTRAL-COAST-R04","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Monterey's vineyards sit in the Salinas Valley → cold, deep Monterey Bay sends cool, windy marine air down the valley in afternoons and evenings."},{"id":"CENTRAL-COAST-R05","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Santa Barbara's transverse (east–west) valleys open directly to the ocean → cool maritime air and fog reach far inland (e.g. Sta. Rita Hills)."},{"id":"CENTRAL-COAST-R06","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Paso Robles is largely sheltered from the coast → warm to hot, with a wide diurnal range; the Templeton Gap lets some Pacific air reach inland."}],"checks":[{"kp":"CENTRAL-COAST-F01","type":"flash","question":"Why is Monterey's Salinas Valley so cool despite low latitude?","answer":"Cold, deep Monterey Bay funnels cool, windy marine air down the Salinas Valley in the afternoon and evening → slow ripening, high acidity, especially in Santa Lucia Highlands."},{"kp":"CENTRAL-COAST-F02","type":"flash","question":"What styles dominate warm Paso Robles?","answer":"Full-bodied, ripe Cabernet Sauvignon and Rhône varieties (Syrah, Grenache, Mourvèdre) → concentrated, ripe-fruited reds; it's largely sheltered from coastal cooling."},{"kp":"CENTRAL-COAST-F03","type":"flash","question":"Why can Santa Barbara grow cool-climate grapes so close to the equator's latitude?","answer":"Its transverse east–west valleys open straight to the ocean → cool maritime air and fog penetrate far inland, suiting Pinot Noir and Chardonnay (e.g. Sta. Rita Hills)."},{"kp":"CENTRAL-COAST-R04","type":"explain","prompt":"Starting from “Monterey's vineyards sit in the Salinas Valley”, explain what this leads to — through to the resulting wine style.","requiredPoints":["cold, deep Monterey Bay sends cool, windy marine air down the valley in afternoons and evenings"]},{"kp":"CENTRAL-COAST-R05","type":"explain","prompt":"Starting from “Santa Barbara's transverse (east–west) valleys open directly to the ocean”, explain what this leads to — through to the resulting wine style.","requiredPoints":["cool maritime air and fog reach far inland (e.g. Sta. Rita Hills)"]},{"kp":"CENTRAL-COAST-R06","type":"explain","prompt":"Starting from “Paso Robles is largely sheltered from the coast”, explain what this leads to — through to the resulting wine style.","requiredPoints":["warm to hot, with a wide diurnal range; the Templeton Gap lets some Pacific air reach inland"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool Monterey (Santa Lucia Highlands) and Santa Barbara → Chardonnay and Pinot Noir retain high acidity → fresh, elegant wines; Chardonnay is the main grape at over 50% of Monterey.","Warm, sheltered Paso Robles → full-bodied, ripe Cabernet Sauvignon plus Rhône varieties (Syrah, Grenache, Mourvèdre — the 'Rhône Rangers') → concentrated, ripe-fruited reds.","Wind in the Salinas Valley closes leaf stomata and slows ripening → high acidity and fresh fruit flavours in Santa Lucia Highlands.","Eastern, inland sites are warmer and suit Cabernet, Merlot and Zinfandel; coastal and high-altitude sites suit Chardonnay and Pinot."],"kkps":[{"id":"CENTRAL-COAST-F07","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Chardonnay — over half of plantings."},{"id":"CENTRAL-COAST-R08","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool Monterey (Santa Lucia Highlands) and Santa Barbara → Chardonnay and Pinot Noir retain high acidity → fresh, elegant wines; Chardonnay is the main grape at over 50% of Monterey."},{"id":"CENTRAL-COAST-R09","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Warm, sheltered Paso Robles → full-bodied, ripe Cabernet Sauvignon plus Rhône varieties (Syrah, Grenache, Mourvèdre — the 'Rhône Rangers') → concentrated, ripe-fruited reds."},{"id":"CENTRAL-COAST-R10","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Wind in the Salinas Valley closes leaf stomata and slows ripening → high acidity and fresh fruit flavours in Santa Lucia Highlands."}],"checks":[{"kp":"CENTRAL-COAST-F07","type":"flash","question":"What is the main grape of Monterey?","answer":"Chardonnay — over half of plantings."},{"kp":"CENTRAL-COAST-R08","type":"explain","prompt":"Starting from “Cool Monterey (Santa Lucia Highlands) and Santa Barbara”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Chardonnay and Pinot Noir retain high acidity","fresh, elegant wines; Chardonnay is the main grape at over 50% of Monterey"]},{"kp":"CENTRAL-COAST-R09","type":"explain","prompt":"Starting from “Warm, sheltered Paso Robles”, explain what this leads to — through to the resulting wine style.","requiredPoints":["full-bodied, ripe Cabernet Sauvignon plus Rhône varieties (Syrah, Grenache, Mourvèdre — the 'Rhône Rangers')","concentrated, ripe-fruited reds"]},{"kp":"CENTRAL-COAST-R10","type":"explain","prompt":"Starting from “Wind in the Salinas Valley closes leaf stomata and slows ripening”, explain what this leads to — through to the resulting wine style.","requiredPoints":["high acidity and fresh fruit flavours in Santa Lucia Highlands"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Low growing-season rainfall makes irrigation essential (drawn from the Salinas River); free-draining sandy loam and gravel soils.","Large, flat valley floors (Monterey) allow easy mechanisation → high-volume, inexpensive wines.","Paso Robles is often dry-farmed on calcareous clay; western, cooler sites give fresher styles than the warmer east.","High-volume Monterey fruit (P:1–2) is made cleanly for blends; cool-site Chardonnay and Pinot are made for quality (Q:2–4).","Santa Barbara Pinot and Chardonnay use Burgundian methods; Paso Robles reds see oak maturation for ripe, spicy structure."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["California labelling: a named variety requires ≥75% of that grape; an AVA requires ≥85%.","Paso Robles, once California's largest undivided AVA, now has 11 sub-AVAs."],"kkps":[],"checks":[]}],"blind":[{"id":"CENTRAL-BLIND-1","tastingProfile":"White wine. Medium lemon-gold. Pronounced ripe citrus, white peach and melon with notes of vanilla, toast and a creamy/buttery character from oak and malolactic. Dry, medium-plus acidity, medium-plus alcohol, medium-plus body, long finish.","deduce":["Grape: Chardonnay","Climate: moderate (cool maritime, e.g. Monterey/Santa Barbara)","Region: Central Coast (California, USA)"],"justifyWith":["Ripe stone fruit + oak/malolactic toast and cream → barrel-fermented New World Chardonnay","Retained medium-plus acidity despite ripeness → cool, fog- and wind-influenced coastal sites","Medium-plus alcohol and body with ripe fruit → warm-sunshine California Central Coast"]}],"quiz":[{"id":"central-coast-Q1","kp":"CENTRAL-COAST-F07","question":"Which grape accounts for over half of Central Coast plantings?","correctAnswer":"Chardonnay","distractors":["Pinot Noir","Cabernet Sauvignon","Syrah"]},{"id":"central-coast-Q2","kp":"CENTRAL-COAST-R09","question":"What style of wine does warm, sheltered Paso Robles specialise in?","correctAnswer":"Full-bodied, ripe Cabernet Sauvignon plus Rhône varieties like Syrah and Grenache","distractors":["Lean, high-acid Chardonnay and Pinot Noir","Aromatic, off-dry Riesling","Traditional-method sparkling wine"]},{"id":"central-coast-Q3","kp":"CENTRAL-COAST-R04","question":"How does cold Monterey Bay influence the Salinas Valley vineyards?","correctAnswer":"It sends cool, windy marine air down the valley in afternoons and evenings, slowing ripening","distractors":["It radiates stored heat to speed ripening at night","It shelters the valley from all coastal influence","It brings heavy rainfall through the growing season"]},{"id":"central-coast-Q4","kp":"CENTRAL-COAST-R05","question":"Why do Santa Barbara's valleys (e.g. Sta. Rita Hills) suit Pinot Noir and Chardonnay?","correctAnswer":"Their transverse east–west orientation opens directly to the ocean, letting cool air and fog reach far inland","distractors":["They sit at very high altitude with a wide diurnal range","They are completely sheltered from the Pacific","Their granite terraces radiate heat to the vines"]}]},{"id":"willamette-valley","title":"Willamette Valley","alt":"Oregon, USA · cool-climate Pinot Noir","country":"United States","flag":"🇺🇸","blurb":"Oregon's flagship — restrained, elegant Pinot Noir from a cool, wet maritime climate, with rising Chardonnay.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Cool maritime","scores":{"warmth":2,"sun":3,"rain":4,"diurnal":4,"risk":3}},"style":{"red":65,"white":35},"grapes":[{"name":"Pinot Noir","color":"r","pct":66},{"name":"Pinot Gris","color":"w","pct":16},{"name":"Chardonnay","color":"w","pct":10},{"name":"Other","color":"w","pct":8}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Cool–moderate maritime climate at 42–46°N → long summer daylight hours (not too intense) and a long, cool autumn that aids slow, even ripening.","About 80 km from the Pacific; the Coast Range to the west gives some protection, but gaps let cold Pacific winds and rain through; the Cascades lie to the east.","High annual rainfall falls mostly in winter with dry summers; the north is cooler and wetter, the south drier and warmer.","A high diurnal range and low humidity → fresh acidity is retained in the grapes."],"kkps":[{"id":"WILLAMETTE-VALLEY-F01","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Its cool maritime climate with a long, cool autumn ripens Pinot slowly → medium-plus acidity, medium tannins and bright red/black cherry fruit rather than jammy ripeness."},{"id":"WILLAMETTE-VALLEY-R02","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool–moderate maritime climate at 42–46°N → long summer daylight hours (not too intense) and a long, cool autumn that aids slow, even ripening."},{"id":"WILLAMETTE-VALLEY-R03","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"A high diurnal range and low humidity → fresh acidity is retained in the grapes."}],"checks":[{"kp":"WILLAMETTE-VALLEY-F01","type":"flash","question":"Why does Willamette Valley produce elegant, restrained Pinot Noir?","answer":"Its cool maritime climate with a long, cool autumn ripens Pinot slowly → medium-plus acidity, medium tannins and bright red/black cherry fruit rather than jammy ripeness."},{"kp":"WILLAMETTE-VALLEY-R02","type":"explain","prompt":"Starting from “Cool–moderate maritime climate at 42–46°N”, explain what this leads to — through to the resulting wine style.","requiredPoints":["long summer daylight hours (not too intense) and a long, cool autumn that aids slow, even ripening"]},{"kp":"WILLAMETTE-VALLEY-R03","type":"explain","prompt":"Starting from “A high diurnal range and low humidity”, explain what this leads to — through to the resulting wine style.","requiredPoints":["fresh acidity is retained in the grapes"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool maritime climate with a long, cool autumn → Pinot Noir ripens slowly → medium-plus acidity, medium tannins and red-to-black cherry fruit; restrained and elegant.","Pinot Noir is over two-thirds of plantings; clonal selection is important here for both Pinot and Chardonnay.","Pinot Gris (the second grape) is made Alsace-style → medium to full body, pear/peach/melon fruit with nutty or honeyed notes.","Cool sites → Chardonnay keeps medium-plus to high acidity with lemon and peach fruit."],"kkps":[{"id":"WILLAMETTE-VALLEY-F04","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Pinot Gris, made in an Alsace style — medium to full body with pear, peach and nutty/honeyed notes."},{"id":"WILLAMETTE-VALLEY-R05","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool maritime climate with a long, cool autumn → Pinot Noir ripens slowly → medium-plus acidity, medium tannins and red-to-black cherry fruit; restrained and elegant."},{"id":"WILLAMETTE-VALLEY-R06","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Pinot Gris (the second grape) is made Alsace-style → medium to full body, pear/peach/melon fruit with nutty or honeyed notes."},{"id":"WILLAMETTE-VALLEY-R07","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool sites → Chardonnay keeps medium-plus to high acidity with lemon and peach fruit."}],"checks":[{"kp":"WILLAMETTE-VALLEY-F04","type":"flash","question":"What is Willamette's second most-planted grape and its style?","answer":"Pinot Gris, made in an Alsace style — medium to full body with pear, peach and nutty/honeyed notes."},{"kp":"WILLAMETTE-VALLEY-R05","type":"explain","prompt":"Starting from “Cool maritime climate with a long, cool autumn”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Pinot Noir ripens slowly","medium-plus acidity, medium tannins and red-to-black cherry fruit; restrained and elegant"]},{"kp":"WILLAMETTE-VALLEY-R06","type":"explain","prompt":"Starting from “Pinot Gris (the second grape) is made Alsace-style”, explain what this leads to — through to the resulting wine style.","requiredPoints":["medium to full body, pear/peach/melon fruit with nutty or honeyed notes"]},{"kp":"WILLAMETTE-VALLEY-R07","type":"explain","prompt":"Starting from “Cool sites”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Chardonnay keeps medium-plus to high acidity with lemon and peach fruit"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Dry summers and wind reduce mildew and disease pressure → strong sustainable/organic/biodynamic adoption (47% certified sustainable).","Mostly dry-farmed on free-draining volcanic (basalt), marine-sedimentary and loess (windblown silt) soils; irrigation from rivers is limited and expensive.","Smaller, family-owned businesses dominate; vigour is managed with larger training systems at altitude.","Pinot Noir winemaking increasingly uses whole bunches and wild yeast (Burgundian influence), with a decreasing % of new oak.","Chardonnay is whole-bunch pressed, fermented/aged in oak (high % old oak), with full malolactic and lees contact; lees are left unstirred to develop smoky, struck-match (reductive) aromas.","Pinot Gris is whole-bunch pressed and cool-fermented in stainless steel for a fruity style."],"kkps":[{"id":"WILLAMETTE-VALLEY-F08","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Dry summers and wind reduce disease pressure, making organic/biodynamic farming viable → 47% of vineyards are certified sustainable."},{"id":"WILLAMETTE-VALLEY-R09","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Dry summers and wind reduce mildew and disease pressure → strong sustainable/organic/biodynamic adoption (47% certified sustainable)."}],"checks":[{"kp":"WILLAMETTE-VALLEY-F08","type":"flash","question":"Why is sustainable viticulture so widespread in Oregon?","answer":"Dry summers and wind reduce disease pressure, making organic/biodynamic farming viable → 47% of vineyards are certified sustainable."},{"kp":"WILLAMETTE-VALLEY-R09","type":"explain","prompt":"Starting from “Dry summers and wind reduce mildew and disease pressure”, explain what this leads to — through to the resulting wine style.","requiredPoints":["strong sustainable/organic/biodynamic adoption (47% certified sustainable)"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Oregon origin labelling is stricter than California: 100% of grapes must be grown in Oregon, and ≥95% from a stated AVA.","A named variety on the label requires ≥90% (vs California's 75%); estate-bottled wine must be 100% from the winery's AVA."],"kkps":[{"id":"WILLAMETTE-VALLEY-F10","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"100% of grapes must be grown in Oregon (vs California's 75% in-state), ≥95% from a stated AVA, and ≥90% of a named variety (vs 75%)."}],"checks":[{"kp":"WILLAMETTE-VALLEY-F10","type":"flash","question":"How is Oregon's origin labelling stricter than California's?","answer":"100% of grapes must be grown in Oregon (vs California's 75% in-state), ≥95% from a stated AVA, and ≥90% of a named variety (vs 75%)."}]}],"blind":[{"id":"WILLAMETTE-BLIND-1","tastingProfile":"Red wine. Pale to medium ruby. Pronounced red cherry, cranberry and red plum with earthy, savoury undertones. Dry, medium-plus to high acidity, medium tannin, medium alcohol, medium body, medium-plus finish.","deduce":["Grape: Pinot Noir","Climate: cool","Region: Willamette Valley (Oregon, USA)"],"justifyWith":["Pale colour + red cherry/cranberry + medium tannin → Pinot Noir","High acidity and restrained, non-jammy fruit → cool maritime climate","Elegant, bright, savoury style → Willamette Valley rather than a warm region"]}],"quiz":[{"id":"willamette-valley-Q1","kp":"WILLAMETTE-VALLEY-F01","question":"What style of Pinot Noir results from Willamette Valley's cool maritime climate and long, cool autumn?","correctAnswer":"Medium-plus acidity, medium tannin and bright red/black cherry fruit, not jammy","distractors":["Jammy, high-alcohol, low-acid reds","Pale, low-tannin rosé-like reds","Tannic, black-fruited, oak-driven reds"]},{"id":"willamette-valley-Q2","kp":"WILLAMETTE-VALLEY-F04","question":"Willamette Valley's second grape, Pinot Gris, is typically made in which style?","correctAnswer":"An Alsace style — medium to full body with pear, peach and nutty/honeyed notes","distractors":["A light, neutral Italian pinot grigio style","An oxidative, fortified style","A sweet, botrytised dessert style"]},{"id":"willamette-valley-Q3","kp":"WILLAMETTE-VALLEY-F10","question":"What does Oregon labelling law require for grape origin (stricter than California)?","correctAnswer":"100% of grapes grown in Oregon, with ≥90% of any named variety","distractors":["75% from the state and 75% of a named variety","85% from the stated AVA only","No varietal minimum, only an AVA requirement"]},{"id":"willamette-valley-Q4","kp":"WILLAMETTE-VALLEY-F08","question":"Why is organic and biodynamic farming widely viable in the Willamette Valley?","correctAnswer":"Dry summers and wind reduce mildew and disease pressure","distractors":["Hot, arid conditions prevent all fungal growth","Sandy soils block phylloxera and pests","Government subsidies require certification"]}]},{"id":"columbia-valley","title":"Columbia Valley","alt":"Washington, USA · warm, dry continental reds","country":"United States","flag":"🇺🇸","blurb":"Washington's vast inland engine — ripe Cabernet, Merlot and Syrah from a sunny, irrigated desert with cold nights.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Continental (warm, dry)","scores":{"warmth":4,"sun":5,"rain":1,"diurnal":5,"risk":4}},"style":{"red":58,"white":42},"grapes":[{"name":"Cabernet Sauvignon","color":"r","pct":30},{"name":"Merlot","color":"r","pct":16},{"name":"Riesling","color":"w","pct":14},{"name":"Chardonnay","color":"w","pct":12},{"name":"Syrah","color":"r","pct":12},{"name":"Other","color":"w","pct":16}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A very large cross-border AVA covering a third of Washington State, east of the Cascade Range, which blocks wet Pacific weather → dry, warm conditions (rain shadow).","Arid, desert-like with only 150–250 mm rainfall → irrigation from the Columbia River is essential; vineyards sit on slopes to avoid frost and winter freeze.","High latitude (45–48°N) → very long summer days (up to ~17.5 hours of sun, 300 cloudless days) with rapid autumn cooling and cold winters.","A high diurnal range from warm, sunny days and cold nights; basalt bedrock with sandy, silty loess and alluvial topsoils from ancient Missoula floods."],"kkps":[{"id":"COLUMBIA-VALLEY-F01","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The Cascade Range blocks wet Pacific weather → a rain shadow gives a dry, sunny, warm-summer continental climate; irrigation from the Columbia River is essential."},{"id":"COLUMBIA-VALLEY-F02","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Warm sunny days build ripeness and high alcohol while cold nights preserve medium-plus to high acidity → deeply coloured, ripe yet fresh reds."},{"id":"COLUMBIA-VALLEY-F03","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Frost and winter freeze → vineyards are planted on slopes for cold-air drainage."},{"id":"COLUMBIA-VALLEY-R04","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"A very large cross-border AVA covering a third of Washington State, east of the Cascade Range, which blocks wet Pacific weather → dry, warm conditions (rain shadow)."},{"id":"COLUMBIA-VALLEY-R05","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Arid, desert-like with only 150–250 mm rainfall → irrigation from the Columbia River is essential; vineyards sit on slopes to avoid frost and winter freeze."},{"id":"COLUMBIA-VALLEY-R06","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"High latitude (45–48°N) → very long summer days (up to ~17.5 hours of sun, 300 cloudless days) with rapid autumn cooling and cold winters."}],"checks":[{"kp":"COLUMBIA-VALLEY-F01","type":"flash","question":"Why is the Columbia Valley warm and dry despite its high latitude?","answer":"The Cascade Range blocks wet Pacific weather → a rain shadow gives a dry, sunny, warm-summer continental climate; irrigation from the Columbia River is essential."},{"kp":"COLUMBIA-VALLEY-F02","type":"flash","question":"How does the high diurnal range shape Washington reds?","answer":"Warm sunny days build ripeness and high alcohol while cold nights preserve medium-plus to high acidity → deeply coloured, ripe yet fresh reds."},{"kp":"COLUMBIA-VALLEY-F03","type":"flash","question":"What is the main hazard, and how is it managed?","answer":"Frost and winter freeze → vineyards are planted on slopes for cold-air drainage."},{"kp":"COLUMBIA-VALLEY-R04","type":"explain","prompt":"Starting from “A very large cross-border AVA covering a third of Washington State, east of the Cascade Range, which blocks wet Pacific weather”, explain what this leads to — through to the resulting wine style.","requiredPoints":["dry, warm conditions (rain shadow)"]},{"kp":"COLUMBIA-VALLEY-R05","type":"explain","prompt":"Starting from “Arid, desert-like with only 150–250 mm rainfall”, explain what this leads to — through to the resulting wine style.","requiredPoints":["irrigation from the Columbia River is essential; vineyards sit on slopes to avoid frost and winter freeze"]},{"kp":"COLUMBIA-VALLEY-R06","type":"explain","prompt":"Starting from “High latitude (45–48°N)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["very long summer days (up to ~17.5 hours of sun, 300 cloudless days) with rapid autumn cooling and cold winters"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Warm, dry, sunny growing season with cold nights → grapes reach high sugar while retaining acidity → reds with high alcohol and medium-plus to high acidity, deep colour and ripe fruit.","Cabernet Sauvignon and Merlot dominate the warm sites; Walla Walla's basalt stones radiate heat for extra ripeness, giving ~40% Cabernet plus Merlot and Syrah.","Big diurnal range preserves aromatics → Syrah and Riesling keep freshness; Red Mountain (warmest) gives the most powerful, tannic reds.","Riesling is widely planted (historically, for cold-hardiness) and usually made off-dry with 10–15 g/L residual sugar."],"kkps":[{"id":"COLUMBIA-VALLEY-F07","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"It is winter-hardy (resisting freeze) and ripens reliably where other vinifera struggled; it's usually made off-dry."},{"id":"COLUMBIA-VALLEY-R08","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Warm, dry, sunny growing season with cold nights → grapes reach high sugar while retaining acidity → reds with high alcohol and medium-plus to high acidity, deep colour and ripe fruit."},{"id":"COLUMBIA-VALLEY-R09","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Big diurnal range preserves aromatics → Syrah and Riesling keep freshness; Red Mountain (warmest) gives the most powerful, tannic reds."}],"checks":[{"kp":"COLUMBIA-VALLEY-F07","type":"flash","question":"Why was Riesling historically so widely planted in Washington?","answer":"It is winter-hardy (resisting freeze) and ripens reliably where other vinifera struggled; it's usually made off-dry."},{"kp":"COLUMBIA-VALLEY-R08","type":"explain","prompt":"Starting from “Warm, dry, sunny growing season with cold nights”, explain what this leads to — through to the resulting wine style.","requiredPoints":["grapes reach high sugar while retaining acidity","reds with high alcohol and medium-plus to high acidity, deep colour and ripe fruit"]},{"kp":"COLUMBIA-VALLEY-R09","type":"explain","prompt":"Starting from “Big diurnal range preserves aromatics”, explain what t
