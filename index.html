 red blend of the Southern Rhône."},{"kp":"S-RHONE-F03","type":"flash","question":"Describe Grenache's strengths and weaknesses.","answer":"Heat- and drought-tolerant with red fruit, spice and high alcohol, but oxidative and pale — so it is usually blended with Syrah and Mourvèdre."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Hierarchy: Côtes du Rhône → Côtes du Rhône-Villages (+named villages) → Crus.","Southern Crus: Châteauneuf-du-Pape, Gigondas, Vacqueyras, Vinsobres, Rasteau, Cairanne, Beaumes-de-Venise (and others).","Châteauneuf-du-Pape allows up to 18 grape varieties and bans rosé; no irrigation in principle.","Sweet fortified Muscat de Beaumes-de-Venise and Rasteau VDN are made here."],"kkps":[{"id":"S-RHONE-F04","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Large rounded pebbles (famous at Châteauneuf-du-Pape) that absorb heat by day and radiate it to the vines at night, aiding ripening."},{"id":"S-RHONE-F05","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Any of: Châteauneuf-du-Pape, Gigondas, Vacqueyras, Rasteau, Cairanne, Vinsobres, Beaumes-de-Venise."},{"id":"S-RHONE-R06","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Hierarchy: Côtes du Rhône → Côtes du Rhône-Villages (+named villages) → Crus."}],"checks":[{"kp":"S-RHONE-F04","type":"flash","question":"What are galets roulés and what do they do?","answer":"Large rounded pebbles (famous at Châteauneuf-du-Pape) that absorb heat by day and radiate it to the vines at night, aiding ripening."},{"kp":"S-RHONE-F05","type":"flash","question":"Name three Southern Rhône Crus.","answer":"Any of: Châteauneuf-du-Pape, Gigondas, Vacqueyras, Rasteau, Cairanne, Vinsobres, Beaumes-de-Venise."},{"kp":"S-RHONE-R06","type":"explain","prompt":"Starting from “Hierarchy: Côtes du Rhône”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Côtes du Rhône-Villages (+named villages)","Crus"]}]}],"blind":[{"id":"SRH-BLIND","tastingProfile":"Medium ruby. Pronounced ripe red plum, strawberry, dried herbs/garrigue, warm spice. Dry, medium acidity, medium soft tannin, high alcohol (~14.5%), medium(+) body.","deduce":["Grape: Grenache-based GSM blend","Climate: warm Mediterranean","Region: Southern Rhône (Châteauneuf-du-Pape)"],"justifyWith":["Red fruit + garrigue + high alcohol + soft tannin → Grenache-led blend","Warm-climate ripeness, dried herbs → Southern Rhône","Blend character (red + savoury spice) → GSM, not single-varietal"]}],"quiz":[{"id":"s-rhone-Q1","kp":"S-RHONE-F02","question":"Which three grapes form the signature red blend of the Southern Rhône (GSM)?","correctAnswer":"Grenache, Syrah, Mourvèdre","distractors":["Cabernet Sauvignon, Merlot, Cabernet Franc","Tempranillo, Garnacha, Graciano","Nebbiolo, Barbera, Dolcetto"]},{"id":"s-rhone-Q2","kp":"S-RHONE-F01","question":"What is the mistral and how does it affect Southern Rhône vineyards?","correctAnswer":"A cold, dry wind that reduces fungal disease but can damage flowering and shoots","distractors":["A warm, humid wind that encourages botrytis","A fog that moderates daytime heat","A southerly wind that brings autumn rain"]},{"id":"s-rhone-Q3","kp":"S-RHONE-F04","question":"What are the galets roulés famous at Châteauneuf-du-Pape?","correctAnswer":"Large rounded pebbles that absorb heat by day and radiate it at night, aiding ripening","distractors":["Chalky white soils that retain winter rainfall","Iron-rich red soils over limestone","Volcanic ash soils that retain water"]},{"id":"s-rhone-Q4","kp":"S-RHONE-F03","question":"Why is Grenache usually blended with Syrah and Mourvèdre in the Southern Rhône?","correctAnswer":"It is oxidative and pale, so other varieties add colour and structure","distractors":["It has searing acidity that needs softening","It is very tannic and needs softer partners","It ripens too late to stand alone"]},{"id":"s-rhone-Q5","kp":"S-RHONE-R06","question":"What is the appellation hierarchy of the Southern Rhône, from base to top?","correctAnswer":"Côtes du Rhône → Côtes du Rhône-Villages → Crus","distractors":["Joven → Crianza → Reserva → Gran Reserva","Bourgogne → Village → Premier Cru → Grand Cru","DOC → DOCG → Riserva → Gran Selezione"]}]},{"id":"loire","title":"Loire Valley","alt":"Muscadet · Anjou-Saumur · Touraine · Centre","country":"France","flag":"🇫🇷","blurb":"France's longest wine river: Melon, Chenin, Sauvignon Blanc and Cabernet Franc, cool to continental from west to east.","source":"1_France20241004_final.pdf","climate":{"label":"Cool maritime → continental","scores":{"warmth":2,"sun":2,"rain":3,"diurnal":2,"risk":4}},"style":{"white":50,"red":25,"rose":15,"sparkling":10},"grapes":[{"name":"Melon de Bourgogne","color":"w","pct":24},{"name":"Chenin Blanc","color":"w","pct":18},{"name":"Sauvignon Blanc","color":"w","pct":22},{"name":"Cabernet Franc","color":"r","pct":24},{"name":"Other","color":"w","pct":12}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Follows the Loire from the Atlantic (Pays Nantais) inland to the Centre (Sancerre/Pouilly).","West is cool and maritime; the east becomes continental. The river moderates and reflects light.","Frost and autumn rain are the main hazards; site selection is critical for ripeness."],"kkps":[{"id":"LOIRE-F01","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Cool and maritime in the west (Pays Nantais) becoming more continental inland toward the Centre (Sancerre/Pouilly)."}],"checks":[{"kp":"LOIRE-F01","type":"flash","question":"How does climate change across the Loire from west to east?","answer":"Cool and maritime in the west (Pays Nantais) becoming more continental inland toward the Centre (Sancerre/Pouilly)."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Melon de Bourgogne (Muscadet): neutral, high acid, often aged sur lie for texture.","Chenin Blanc: high acidity and versatility — dry, off-dry, sweet (botrytis) and sparkling.","Sauvignon Blanc: pungent, high acid, citrus/gooseberry/flint — Sancerre & Pouilly-Fumé.","Cabernet Franc: the leading red — leafy/red-fruited; Chinon, Bourgueil, Saumur-Champigny."],"kkps":[{"id":"LOIRE-CG1","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Cool maritime-to-continental climate → Sauvignon Blanc and Chenin Blanc ripen slowly, retaining very high acidity → crisp, aromatic whites (gooseberry/flint Sauvignon; apple/quince Chenin) from dry to sweet.","chain":{"factor":"Cool maritime to continental","mechanism":"Slow ripening; high acidity kept","effect":"High acidity, aromatic","style":"Crisp Loire whites, dry to sweet"}}],"checks":[{"kp":"LOIRE-CG1","type":"explain","prompt":"Explain how the climate of Loire Valley shapes the characteristics of its signature grape(s).","requiredPoints":["Cool maritime to continental","Slow ripening; high acidity kept","High acidity, aromatic","Crisp Loire whites, dry to sweet"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Muscadet often trained for mechanisation on flat coastal land; sur lie ageing in tank.","Chinon/Bourgueil reds need warm gravel and tuffeau (limestone) sites to ripen Cabernet Franc.","Cool climate keeps acidity high and supports sparkling production (Crémant de Loire).","Muscadet 'sur lie': aged on fine lees over winter, bottled directly off lees for freshness and texture.","Chenin made across the sweetness spectrum; botrytis sweet wines in Coteaux du Layon, Bonnezeaux, Quarts de Chaume.","Crémant de Loire by traditional method; reds typically unoaked to lightly oaked."],"kkps":[{"id":"LOIRE-F02","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"The wine is aged on its fine lees over winter and bottled directly off them, adding texture and a slight spritz while keeping freshness."},{"id":"LOIRE-F03","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Chenin Blanc — its high acidity makes it extremely versatile across styles."}],"checks":[{"kp":"LOIRE-F02","type":"flash","question":"What does 'sur lie' mean for Muscadet?","answer":"The wine is aged on its fine lees over winter and bottled directly off them, adding texture and a slight spritz while keeping freshness."},{"kp":"LOIRE-F03","type":"flash","question":"Which Loire grape can make dry, off-dry, sweet and sparkling wines?","answer":"Chenin Blanc — its high acidity makes it extremely versatile across styles."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Four sections: Pays Nantais (Muscadet), Anjou-Saumur, Touraine, Centre (Sancerre/Pouilly-Fumé).","Key red AOCs: Chinon, Bourgueil, Saint-Nicolas-de-Bourgueil, Saumur-Champigny.","Key white AOCs: Muscadet (+ Sèvre et Maine), Vouvray & Savennières (Chenin), Sancerre & Pouilly-Fumé (Sauvignon).","Anjou and Saumur are separate AOCs (not 'Anjou-Saumur'); note Saumur-Champigny, not 'Champigny-Saumur'."],"kkps":[{"id":"LOIRE-F04","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Melon de Bourgogne (Muscadet), Chenin Blanc (Vouvray/Savennières), Sauvignon Blanc (Sancerre/Pouilly-Fumé), Cabernet Franc (Chinon/Bourgueil)."},{"id":"LOIRE-F05","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Cabernet Franc — in Chinon, Bourgueil, Saint-Nicolas-de-Bourgueil and Saumur-Champigny."}],"checks":[{"kp":"LOIRE-F04","type":"flash","question":"Name the four principal grapes of the Loire and a key appellation for each.","answer":"Melon de Bourgogne (Muscadet), Chenin Blanc (Vouvray/Savennières), Sauvignon Blanc (Sancerre/Pouilly-Fumé), Cabernet Franc (Chinon/Bourgueil)."},{"kp":"LOIRE-F05","type":"flash","question":"Which red grape dominates the Loire and which appellations showcase it?","answer":"Cabernet Franc — in Chinon, Bourgueil, Saint-Nicolas-de-Bourgueil and Saumur-Champigny."}]}],"blind":[{"id":"LOI-BLIND","tastingProfile":"Pale lemon. Pronounced gooseberry, elderflower, grapefruit, wet-stone/flint, grassy. Dry, high acidity, medium alcohol, light(+) body, unoaked.","deduce":["Grape: Sauvignon Blanc","Climate: cool","Region: Loire (Sancerre/Pouilly-Fumé)"],"justifyWith":["Gooseberry/elderflower/grassy + flint → Sauvignon Blanc on Loire limestone/flint","High acid, unoaked, light body → cool-climate Loire, not warm","Flinty 'fumé' note → Pouilly-Fumé/Sancerre"]}],"quiz":[{"id":"loire-Q1","kp":"LOIRE-F04","question":"Which grape is used for Muscadet in the Loire's Pays Nantais?","correctAnswer":"Melon de Bourgogne","distractors":["Chenin Blanc","Sauvignon Blanc","Cabernet Franc"]},{"id":"loire-Q2","kp":"LOIRE-F02","question":"What technique gives Muscadet its texture and slight spritz?","correctAnswer":"Ageing on fine lees over winter and bottling directly off them (sur lie)","distractors":["Extended barrel ageing in new oak","A second fermentation in bottle","Botrytis concentration before fermentation"]},{"id":"loire-Q3","kp":"LOIRE-F05","question":"Which red grape dominates Chinon, Bourgueil and Saumur-Champigny?","correctAnswer":"Cabernet Franc","distractors":["Pinot Noir","Gamay","Cabernet Sauvignon"]},{"id":"loire-Q4","kp":"LOIRE-F01","question":"How does the Loire's climate change from the Pays Nantais toward Sancerre and Pouilly?","correctAnswer":"Cool and maritime in the west, becoming more continental inland","distractors":["Mediterranean in the west, becoming maritime inland","Continental in the west, becoming maritime inland","Uniformly hot and dry along its length"]},{"id":"loire-Q5","kp":"LOIRE-F03","question":"Why is Chenin Blanc so versatile across dry, sweet and sparkling styles in the Loire?","correctAnswer":"Its naturally high acidity supports a wide range of styles","distractors":["Its thick skins resist all rot","Its very low acidity suits sweet wines only","It ripens extremely early at high sugar"]}]},{"id":"alsace","title":"Alsace","alt":"The noble varieties · Grand Cru · VT & SGN","country":"France","flag":"🇫🇷","blurb":"Vosges rain-shadow gives sun and dryness. Varietally labelled aromatic whites: Riesling, Gewurztraminer, Pinot Gris, Muscat.","source":"1_France20241004_final.pdf","climate":{"label":"Sunny, dry continental","scores":{"warmth":3,"sun":4,"rain":2,"diurnal":3,"risk":2}},"style":{"white":90,"sparkling":8,"red":2},"grapes":[{"name":"Riesling","color":"w","pct":22},{"name":"Pinot Gris","color":"w","pct":15},{"name":"Gewurztraminer","color":"w","pct":18},{"name":"Pinot Blanc","color":"w","pct":21},{"name":"Muscat","color":"w","pct":4},{"name":"Pinot Noir","color":"r","pct":10},{"name":"Sylvaner/other","color":"w","pct":10}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Eastern France against the Vosges mountains, which create a rain shadow — one of France's driest, sunniest regions.","Sheltered, warm and dry: ripens aromatic varieties fully while retaining acidity.","Continental climate with a long, sunny autumn ideal for late-harvest styles."],"kkps":[{"id":"ALSACE-F01","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"The Vosges mountains create a rain shadow, sheltering the vineyards and making Alsace one of France's driest, sunniest regions."}],"checks":[{"kp":"ALSACE-F01","type":"flash","question":"Why is Alsace so sunny and dry?","answer":"The Vosges mountains create a rain shadow, sheltering the vineyards and making Alsace one of France's driest, sunniest regions."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["The four 'noble' grapes: Riesling, Gewurztraminer, Pinot Gris, Muscat (only these allowed in most Grands Crus).","Riesling: high acid, citrus/stone fruit, minerally; the most prized for dry, age-worthy wines.","Gewurztraminer: low acid, lychee, rose, spice, high alcohol; Pinot Gris: rich, smoky, broad.","Also Pinot Blanc (soft, for Crémant), Sylvaner, and Pinot Noir for light reds and rosé."],"kkps":[{"id":"ALSACE-CG1","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Sunny, dry climate sheltered by the Vosges (rain shadow) → Riesling, Gewürztraminer and Pinot Gris ripen fully → ripe, full-bodied, aromatic and usually dry whites.","chain":{"factor":"Sunny, dry; Vosges rain shadow","mechanism":"Full ripening","effect":"Ripe, full-bodied, aromatic","style":"Dry aromatic Alsace whites"}}],"checks":[{"kp":"ALSACE-CG1","type":"explain","prompt":"Explain how the climate of Alsace shapes the characteristics of its signature grape(s).","requiredPoints":["Sunny, dry; Vosges rain shadow","Full ripening","Ripe, full-bodied, aromatic","Dry aromatic Alsace whites"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Best sites on the Vosges foothills; varied geology (granite, limestone, schist, sandstone) matched to variety.","Sun and dryness reduce disease pressure, easing organic/biodynamic viticulture.","Grand Cru sites are steep, well-exposed slopes.","Mostly dry, unoaked, fermented in large old casks (foudres) or steel to preserve aromatics.","Sweetness varies and is not always indicated — a long-standing commercial challenge.","Crémant d'Alsace (traditional method) is a major category."],"kkps":[{"id":"ALSACE-F02","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Vendange Tardive = late harvest (richer, often off-dry); Sélection de Grains Nobles = botrytis-affected, sweet."},{"id":"ALSACE-F03","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Mostly dry and unoaked, fermented in steel or large old casks (foudres)."}],"checks":[{"kp":"ALSACE-F02","type":"flash","question":"What do VT and SGN mean on an Alsace label?","answer":"Vendange Tardive = late harvest (richer, often off-dry); Sélection de Grains Nobles = botrytis-affected, sweet."},{"kp":"ALSACE-F03","type":"flash","question":"How are Alsace wines typically vinified to keep their aromatics?","answer":"Mostly dry and unoaked, fermented in steel or large old casks (foudres)."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Wines are labelled by variety — unusual for France.","Three tiers: Alsace AOC, Alsace Grand Cru (51 sites), and Crémant d'Alsace.","Vendange Tardive (VT) = late harvest; Sélection de Grains Nobles (SGN) = botrytis-affected, sweet.","Grands Crus generally restricted to the four noble varieties."],"kkps":[{"id":"ALSACE-F04","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Riesling, Gewurztraminer, Pinot Gris and Muscat — the varieties generally permitted in Grand Cru wines."},{"id":"ALSACE-F05","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Wines are labelled by grape variety rather than place."}],"checks":[{"kp":"ALSACE-F04","type":"flash","question":"Name the four 'noble' grapes of Alsace.","answer":"Riesling, Gewurztraminer, Pinot Gris and Muscat — the varieties generally permitted in Grand Cru wines."},{"kp":"ALSACE-F05","type":"flash","question":"What is unusual about Alsace labelling within France?","answer":"Wines are labelled by grape variety rather than place."}]}],"blind":[{"id":"ALS-BLIND","tastingProfile":"Medium lemon. Pronounced rose, lychee, ginger and stone fruit; oily texture. Dry to off-dry, medium(+) alcohol, medium acidity, medium(+) body, no oak.","deduce":["Grape: Gewurztraminer","Climate: cool but dry/sunny","Region: Alsace"],"justifyWith":["Rose + lychee + ginger + oily body → unmistakably Gewurztraminer","Ripe, full, dry/off-dry, unoaked, varietally pure → Alsace","Medium acidity (low for the family) fits Gewurztraminer"]}],"quiz":[{"id":"alsace-Q1","kp":"ALSACE-F01","question":"Why is Alsace one of France's driest, sunniest regions?","correctAnswer":"The Vosges mountains create a rain shadow that shelters the vineyards","distractors":["A cold ocean current suppresses rainfall","High altitude limits cloud formation","A persistent dry mistral wind blows through the valley"]},{"id":"alsace-Q2","kp":"ALSACE-F05","question":"How are Alsace wines typically labelled?","correctAnswer":"By grape variety rather than by place","distractors":["By a Cru classification of châteaux","By ageing category (Crianza, Reserva)","By sweetness level only"]},{"id":"alsace-Q3","kp":"ALSACE-F04","question":"Which four varieties are generally permitted in Alsace Grand Cru wines?","correctAnswer":"Riesling, Gewurztraminer, Pinot Gris and Muscat","distractors":["Chardonnay, Pinot Noir, Aligoté and Gamay","Sauvignon Blanc, Sémillon, Chenin and Melon","Sylvaner, Pinot Blanc, Auxerrois and Chasselas"]},{"id":"alsace-Q4","kp":"ALSACE-F02","question":"What does the term Vendange Tardive mean on an Alsace label?","correctAnswer":"Late harvest (richer, often off-dry)","distractors":["Botrytis-affected, intensely sweet","Dry, made in stainless steel","Single-vineyard Grand Cru"]},{"id":"alsace-Q5","kp":"ALSACE-F03","question":"How are most Alsace wines made in the cellar?","correctAnswer":"Mostly dry and unoaked, in steel or large old casks (foudres)","distractors":["Aged in new American oak barriques","Fortified with grape spirit","Aged oxidatively under a yeast veil"]}]},{"id":"champagne","title":"Champagne","alt":"Chalk · Traditional method · Reserve wines","country":"France","flag":"🇫🇷","blurb":"The world's benchmark sparkling: cool, marginal, chalk-soiled, built on blending, reserve wines and lees autolysis. (Detailed in D4.)","source":"1_France20241004_final.pdf","climate":{"label":"Cool marginal continental","scores":{"warmth":1,"sun":2,"rain":3,"diurnal":2,"risk":5}},"style":{"sparkling":100},"grapes":[{"name":"Pinot Noir","color":"r","pct":38},{"name":"Pinot Meunier","color":"r","pct":32},{"name":"Chardonnay","color":"w","pct":30}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Northern France near the climatic limit for ripening — high acidity and low potential alcohol, ideal for sparkling base wine.","Chalk subsoil drains well, reflects light, stores water and moderates temperature.","Frost and poor flowering are perennial hazards; vintage variation is high — hence non-vintage blending."],"kkps":[{"id":"CHAMPAGNE-F01","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Pinot Noir (body/structure), Pinot Meunier (fruit, frost-tolerance), Chardonnay (finesse, acidity)."},{"id":"CHAMPAGNE-F02","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Good drainage, water storage, light reflection and temperature moderation."}],"checks":[{"kp":"CHAMPAGNE-F01","type":"flash","question":"Name Champagne's three principal grapes and what each contributes.","answer":"Pinot Noir (body/structure), Pinot Meunier (fruit, frost-tolerance), Chardonnay (finesse, acidity)."},{"kp":"CHAMPAGNE-F02","type":"flash","question":"What does the chalk subsoil contribute?","answer":"Good drainage, water storage, light reflection and temperature moderation."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Pinot Noir: body and structure; Pinot Meunier: fruit and frost-tolerance (later budding); Chardonnay: finesse and acidity.","Côte des Blancs is Chardonnay; Montagne de Reims and the Aube favour the Pinots."],"kkps":[{"id":"CHAMPAGNE-CG1","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Cool, marginal continental climate on chalk → Chardonnay and Pinot Noir ripen to low sugar with very high acidity → lean, high-acid base wine ideal for traditional-method sparkling.","chain":{"factor":"Cool, marginal continental, chalk","mechanism":"Low sugar, very high acidity","effect":"High acidity, low alcohol base","style":"Taut traditional-method sparkling base"}}],"checks":[{"kp":"CHAMPAGNE-CG1","type":"explain","prompt":"Explain how the climate of Champagne shapes the characteristics of its signature grape(s).","requiredPoints":["Cool, marginal continental, chalk","Low sugar, very high acidity","High acidity, low alcohol base","Taut traditional-method sparkling base"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Hand-harvest required; whole-bunch pressing in shallow presses to keep juice pale.","Strict yields and pressing fractions (cuvée vs taille) protect quality.","Traditional method: second fermentation in bottle creating CO₂; lees ageing gives autolytic brioche notes.","Reserve wines (older base wines) are blended into non-vintage cuvées for house style and consistency.","Dosage at disgorgement sets final sweetness (Brut, Extra Brut, etc.)."],"kkps":[{"id":"CHAMPAGNE-F03","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"It gives high acidity and low potential alcohol in the base wine — exactly what a traditional-method sparkling needs."},{"id":"CHAMPAGNE-F04","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Older base wines held back and blended into non-vintage cuvées to maintain a consistent house style across vintages."},{"id":"CHAMPAGNE-F05","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Autolysis — extended ageing on the lees after the second (in-bottle) fermentation."}],"checks":[{"kp":"CHAMPAGNE-F03","type":"flash","question":"Why is Champagne's cool, marginal climate ideal for sparkling wine?","answer":"It gives high acidity and low potential alcohol in the base wine — exactly what a traditional-method sparkling needs."},{"kp":"CHAMPAGNE-F04","type":"flash","question":"What are reserve wines and why are they used?","answer":"Older base wines held back and blended into non-vintage cuvées to maintain a consistent house style across vintages."},{"kp":"CHAMPAGNE-F05","type":"flash","question":"What gives Champagne its 'brioche' character?","answer":"Autolysis — extended ageing on the lees after the second (in-bottle) fermentation."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Méthode traditionnelle is mandatory; minimum lees ageing (longer for vintage).","Categories: Non-Vintage, Vintage, Blanc de Blancs, Blanc de Noirs, Rosé, Prestige Cuvée.","Grower Champagne (RM) vs houses (NM) distinction shown by codes on the label."],"kkps":[],"checks":[]}],"blind":[{"id":"CHM-BLIND","tastingProfile":"Pale lemon, persistent fine mousse. Green apple, citrus, brioche/biscuit, almond. Dry (Brut), very high acidity, light(+) body, no overt oak.","deduce":["Method: traditional method sparkling","Climate: cool","Region: Champagne"],"justifyWith":["Very high acidity + autolytic brioche → cool-climate traditional-method sparkling","Green apple/citrus base + fine persistent mousse → Champagne","Brut, restrained, biscuit autolysis → bottle-aged on lees"]}],"quiz":[{"id":"champagne-Q1","kp":"CHAMPAGNE-CG1","question":"Why is Champagne's cool, marginal climate on chalk ideal for traditional-method sparkling base wine?","correctAnswer":"Chardonnay and Pinot Noir ripen to low sugar with very high acidity, giving a lean, high-acid base wine","distractors":["The grapes ripen to high sugar, giving a rich, high-alcohol base wine","The warmth gives low-acid, full-bodied base wine needing acidification","Late ripening concentrates botrytis sugars for a sweet base wine"]},{"id":"champagne-Q2","kp":"CHAMPAGNE-F01","question":"What does Pinot Meunier contribute to a Champagne blend?","correctAnswer":"Fruit and frost-tolerance","distractors":["Finesse and high acidity","Body and structure","Colour and tannin"]},{"id":"champagne-Q3","kp":"CHAMPAGNE-F04","question":"What is the purpose of reserve wines in Champagne?","correctAnswer":"Older base wines held back and blended into non-vintage cuvées to maintain a consistent house style across vintages","distractors":["Wines reserved unblended to be sold only as vintage Champagne","Wines kept aside to add sweetness at the dosage stage","The first-press juice reserved for prestige cuvées only"]},{"id":"champagne-Q4","kp":"CHAMPAGNE-F05","question":"What gives aged Champagne its biscuit and brioche character?","correctAnswer":"Autolysis — extended ageing on the lees after the second (in-bottle) fermentation","distractors":["Malolactic conversion in new oak barrels","Oxidative ageing in a solera system","Botrytis developed in the vineyard"]}]},{"id":"languedoc","title":"Languedoc-Roussillon","alt":"Mediterranean volume · IGP Pays d'Oc · VDN","country":"France","flag":"🇫🇷","blurb":"France's largest vineyard. Warm, sunny, GSM and Carignan, plus a rich tradition of fortified Vins Doux Naturels.","source":"1_France20241004_final.pdf","climate":{"label":"Warm, dry Mediterranean","scores":{"warmth":4,"sun":5,"rain":1,"diurnal":2,"risk":2}},"style":{"red":65,"white":15,"rose":15,"sweet":5},"grapes":[{"name":"Grenache","color":"r","pct":25},{"name":"Syrah","color":"r","pct":22},{"name":"Carignan","color":"r","pct":16},{"name":"Mourvèdre/Cinsault","color":"r","pct":17},{"name":"Whites (incl. Muscat)","color":"w","pct":20}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Arcs around the Mediterranean from the Rhône delta to the Spanish border — the largest vineyard area in France.","Hot, dry and very sunny; the tramontane wind keeps vines healthy. Drought is the main constraint.","Hugely varied: coastal plains for volume, hillsides (garrigue) for quality."],"kkps":[],"checks":[]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Grenache, Syrah, Mourvèdre, Carignan, Cinsault for reds; Carignan increasingly old-vine and prized.","Whites: Grenache Blanc, Picpoul, Marsanne, Roussanne, Vermentino; Muscat for sweet wines.","International varieties widely planted for varietal IGP wines."],"kkps":[{"id":"LANGUEDOC-CG1","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Warm, dry Mediterranean climate with abundant sunshine → Grenache, Syrah, Mourvèdre and Carignan ripen fully, accumulating high sugar and softening tannins → deep-coloured reds with ripe black/red fruit, high alcohol, soft tannins and low-to-medium acidity.","chain":{"factor":"Warm Mediterranean, high sunshine","mechanism":"Full ripening; high sugar, low malic acid","effect":"High alcohol, soft tannins, low/med acidity","style":"Ripe, full-bodied southern reds (garrigue herbs)"}}],"checks":[{"kp":"LANGUEDOC-CG1","type":"explain","prompt":"Explain how the climate of Languedoc-Roussillon shapes the characteristics of its signature grape(s).","requiredPoints":["Warm Mediterranean, high sunshine","Full ripening; high sugar, low malic acid","High alcohol, soft tannins, low/med acidity","Ripe, full-bodied southern reds (garrigue herbs)"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Old bush-vine Carignan on poor hillside soils gives concentrated, characterful reds.","Drought and heat managed by low yields and bush training; some irrigation permitted.","Quality movement has shifted plantings from plains to hillside garrigue.","Carbonic maceration used for soft, fruity Carignan; modern temperature-controlled wineries widespread.","Vins Doux Naturels (VDN): fermentation arrested by adding spirit (mutage) to retain sweetness.","Styles range from inexpensive varietal IGP to ambitious cru-level reds."],"kkps":[{"id":"LANGUEDOC-F01","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"A fortified sweet wine made by mutage — adding grape spirit to arrest fermentation and retain natural sugar (e.g. Banyuls, Maury, Muscat de Rivesaltes)."},{"id":"LANGUEDOC-F02","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Carignan — old bush vines on poor soils, often vinified by carbonic maceration for softer, fruitier wines."},{"id":"LANGUEDOC-F03","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Roussillon — fortified VDN based on Grenache."}],"checks":[{"kp":"LANGUEDOC-F01","type":"flash","question":"What is a Vin Doux Naturel and how is it made?","answer":"A fortified sweet wine made by mutage — adding grape spirit to arrest fermentation and retain natural sugar (e.g. Banyuls, Maury, Muscat de Rivesaltes)."},{"kp":"LANGUEDOC-F02","type":"flash","question":"Which old-vine grape is increasingly prized in the Languedoc and how is it often made?","answer":"Carignan — old bush vines on poor soils, often vinified by carbonic maceration for softer, fruitier wines."},{"kp":"LANGUEDOC-F03","type":"flash","question":"Where is Banyuls/Maury made and from what grape?","answer":"Roussillon — fortified VDN based on Grenache."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["AOC Languedoc umbrella with crus: Corbières, Minervois, Faugères, Saint-Chinian, Pic Saint-Loup, La Clape.","IGP Pays d'Oc: huge varietal category, France's leading source of varietally labelled wine.","Sweet VDN: Muscat de Frontignan, Muscat de Rivesaltes, Banyuls and Maury (Grenache-based, Roussillon).","Limoux makes traditional-method sparkling (Blanquette and Crémant de Limoux)."],"kkps":[{"id":"LANGUEDOC-F04","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"France's largest source of varietally labelled wine — inexpensive, fruit-forward single-variety bottlings from the Languedoc."},{"id":"LANGUEDOC-F05","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Any of: Corbières, Minervois, Faugères, Saint-Chinian, Pic Saint-Loup, La Clape."}],"checks":[{"kp":"LANGUEDOC-F04","type":"flash","question":"What is IGP Pays d'Oc known for?","answer":"France's largest source of varietally labelled wine — inexpensive, fruit-forward single-variety bottlings from the Languedoc."},{"kp":"LANGUEDOC-F05","type":"flash","question":"Name three quality cru appellations of the Languedoc.","answer":"Any of: Corbières, Minervois, Faugères, Saint-Chinian, Pic Saint-Loup, La Clape."}]}],"blind":[{"id":"LANG-BLIND-1","tastingProfile":"Red wine. Medium ruby. Pronounced ripe red and black fruit (blackberry, plum), garrigue/dried herbs, black pepper and a hint of spice; little to no oak. Dry, medium acidity, medium-plus tannin, high alcohol, medium-plus body, medium finish.","deduce":["Grape: Grenache–Syrah–Mourvèdre blend","Climate: warm","Region: Languedoc-Roussillon (S. France)"],"justifyWith":["Ripe fruit + high alcohol + garrigue herbs → warm, dry Mediterranean GSM blend","Black pepper + firm tannin → Syrah/Mourvèdre component","Medium acidity, generous body, little oak → southern French value red, not a cool-climate wine"]}],"quiz":[{"id":"languedoc-Q1","kp":"LANGUEDOC-CG1","question":"What style of red does the Languedoc's warm, dry Mediterranean climate typically yield?","correctAnswer":"Deep-coloured reds with ripe fruit, high alcohol, soft tannins and low-to-medium acidity","distractors":["Light-bodied, high-acid reds with low alcohol and firm tannins","Pale, oxidative reds aged under a yeast veil","Bone-dry, austere reds with very high acidity from a cool climate"]},{"id":"languedoc-Q2","kp":"LANGUEDOC-F01","question":"How is a Vin Doux Naturel such as Banyuls made sweet?","correctAnswer":"By mutage — adding grape spirit to arrest fermentation and retain natural sugar","distractors":["By drying the grapes (appassimento) before pressing","By harvesting botrytis-affected grapes","By stopping fermentation through chilling alone"]},{"id":"languedoc-Q3","kp":"LANGUEDOC-F02","question":"Which winemaking technique is often used for Carignan in the Languedoc to give softer, fruitier wines?","correctAnswer":"Carbonic maceration","distractors":["Appassimento drying","Extended oxidative ageing under flor","Solera fractional blending"]},{"id":"languedoc-Q4","kp":"LANGUEDOC-F05","question":"Which of the following is an appellation of the Languedoc?","correctAnswer":"Corbières","distractors":["Châteauneuf-du-Pape","Sancerre","Vouvray"]}]},{"id":"sw-france","title":"South West France","alt":"Madiran · Cahors · Jurançon · Gascony","country":"France","flag":"🇫🇷","blurb":"A patchwork beyond Bordeaux: tannic Tannat, 'black' Malbec, and racy sweet whites from the Pyrenean foothills.","source":"1_France20241004_final.pdf","climate":{"label":"Maritime to continental","scores":{"warmth":3,"sun":3,"rain":3,"diurnal":2,"risk":3}},"style":{"red":60,"white":30,"sweet":10},"grapes":[{"name":"Malbec (Côt)","color":"r","pct":25},{"name":"Tannat","color":"r","pct":20},{"name":"Merlot/Cabernets","color":"r","pct":25},{"name":"Petit/Gros Manseng","color":"w","pct":18},{"name":"Other whites","color":"w","pct":12}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Inland and south of Bordeaux toward the Pyrenees; mix of Atlantic influence and warmer continental pockets.","Diverse terroirs — river valleys (Cahors), foothills (Madiran, Jurançon).","Stronger Atlantic influence on flatter land closer to Bordeaux (Bergerac, Duras)."],"kkps":[],"checks":[]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Malbec ('Côt'/'Auxerrois' in Cahors): deep colour, plummy, firm tannin.","Tannat (Madiran): very high tannin, dark fruit — micro-oxygenation pioneered here to soften it.","Petit Manseng & Gros Manseng: high-acid whites for dry and sweet Jurançon.","Bordeaux varieties dominate Bergerac/Duras (satellite appellations)."],"kkps":[{"id":"SW-FRANCE-F01","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Malbec — known as Côt or Auxerrois; Cahors requires a minimum of 70% Malbec ('the black wine')."},{"id":"SW-FRANCE-F02","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Tannat — extremely high in tannin; micro-oxygenation was developed in Madiran to soften it."},{"id":"SW-FRANCE-CG1","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Varied climate from maritime to warmer inland → thick-skinned Tannat (with Bordeaux varieties) ripens to high phenolic levels → deeply coloured, very tannic, structured reds that need softening.","chain":{"factor":"Maritime to warm inland","mechanism":"Thick skins; high phenolics","effect":"Deep colour, very high tannin","style":"Powerful, structured Tannat reds"}}],"checks":[{"kp":"SW-FRANCE-F01","type":"flash","question":"Which grape dominates Cahors and what is it called locally?","answer":"Malbec — known as Côt or Auxerrois; Cahors requires a minimum of 70% Malbec ('the black wine')."},{"kp":"SW-FRANCE-F02","type":"flash","question":"What grape defines Madiran and what technique was pioneered to soften it?","answer":"Tannat — extremely high in tannin; micro-oxygenation was developed in Madiran to soften it."},{"kp":"SW-FRANCE-CG1","type":"explain","prompt":"Explain how the climate of South West France shapes the characteristics of its signature grape(s).","requiredPoints":["Maritime to warm inland","Thick skins; high phenolics","Deep colour, very high tannin","Powerful, structured Tannat reds"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Cahors limestone plateau (causse) vs alluvial terraces give different Malbec styles.","Late-harvest Manseng for sweet Jurançon, picked in passerillage (raisined on the vine).","Cool foothill nights preserve acidity in the Mansengs.","Madiran: long maceration and oak; micro-oxygenation invented here to tame Tannat's tannins.","Cahors: a spectrum from fruity to structured, oak-aged Malbec.","Jurançon Moelleux: sweet from passerillage; Jurançon Sec is bracingly dry."],"kkps":[{"id":"SW-FRANCE-F03","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Petit Manseng and Gros Manseng — sweetness comes from passerillage (grapes raisining on the vine), not botrytis."},{"id":"SW-FRANCE-F04","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Monbazillac (botrytis-affected, near Bergerac)."}],"checks":[{"kp":"SW-FRANCE-F03","type":"flash","question":"Which grapes make sweet Jurançon and how is sweetness achieved?","answer":"Petit Manseng and Gros Manseng — sweetness comes from passerillage (grapes raisining on the vine), not botrytis."},{"kp":"SW-FRANCE-F04","type":"flash","question":"Name a famous sweet wine of the South West besides Jurançon.","answer":"Monbazillac (botrytis-affected, near Bergerac)."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Madiran (Tannat reds) with Pacherenc du Vic-Bilh (whites) alongside it.","Cahors: minimum 70% Malbec.","Jurançon (sweet) and Jurançon Sec (dry) from Petit/Gros Manseng.","Bergerac, Monbazillac (sweet), Duras — Bordeaux-style satellites."],"kkps":[],"checks":[]}],"blind":[{"id":"SW-BLIND-1","tastingProfile":"Red wine. Deep ruby to opaque purple. Pronounced blackberry, black plum and dark spice with a savoury, structured edge. Dry, medium-plus acidity, high firm tannin, medium-plus alcohol, full body, long finish.","deduce":["Grape: Tannat","Climate: moderate","Region: Madiran, South West France (France)"],"justifyWith":["Deep colour + very high firm tannin + full body → thick-skinned Tannat","Savoury structure needing softening → Madiran (home of micro-oxygenation)","Ripe black fruit with retained acidity → moderate maritime-to-continental climate"]}],"quiz":[{"id":"sw-france-Q1","kp":"SW-FRANCE-F01","question":"Which grape must make up at least 70% of a Cahors red, known there as Côt or Auxerrois?","correctAnswer":"Malbec","distractors":["Tannat","Cabernet Franc","Merlot"]},{"id":"sw-france-Q2","kp":"SW-FRANCE-F02","question":"Which technique was developed in Madiran to soften the extremely high tannins of Tannat?","correctAnswer":"Micro-oxygenation","distractors":["Carbonic maceration","Passerillage","Cryoextraction"]},{"id":"sw-france-Q3","kp":"SW-FRANCE-F03","question":"In the Pyrenean-foothill whites of Petit and Gros Manseng, how is sweetness typically achieved?","correctAnswer":"Passerillage — grapes raisining on the vine","distractors":["Noble rot (Botrytis cinerea)","Adding grape spirit (mutage)","Freezing the grapes (eiswein)"]},{"id":"sw-france-Q4","kp":"SW-FRANCE-F04","question":"Which South West France appellation, near Bergerac, is known for botrytis-affected sweet whites?","correctAnswer":"Monbazillac","distractors":["Madiran","Cahors","Jurançon"]}]},{"id":"jura","title":"Jura","alt":"Vin Jaune · Savagnin · Crémant","country":"France","flag":"🇫🇷","blurb":"A tiny, cool eastern region of oxidative whites — Vin Jaune aged sous voile — plus delicate Poulsard and Trousseau reds.","source":"1_France20241004_final.pdf","climate":{"label":"Cool continental","scores":{"warmth":2,"sun":2,"rain":3,"diurnal":3,"risk":4}},"style":{"white":55,"red":25,"sparkling":15,"sweet":5},"grapes":[{"name":"Chardonnay","color":"w","pct":40},{"name":"Savagnin","color":"w","pct":20},{"name":"Poulsard","color":"r","pct":18},{"name":"Trousseau","color":"r","pct":10},{"name":"Pinot Noir","color":"r","pct":12}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Between Burgundy and Switzerland; cool, continental, with marl and limestone slopes.","Higher rainfall and disease pressure; vintage variation is significant.","Small production with a strong, distinctive identity."],"kkps":[],"checks":[]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Savagnin: high acidity; the grape of Vin Jaune, aged oxidatively under a yeast veil (voile).","Chardonnay: made both 'topped up' (ouillé, fresh) and oxidatively.","Poulsard (pale, delicate), Trousseau (more structured) and Pinot Noir for light reds."],"kkps":[{"id":"JURA-F01","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Poulsard (pale, delicate) and Trousseau (more structured), alongside Pinot Noir."},{"id":"JURA-CG1","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Cool continental climate → Savagnin and Chardonnay ripen slowly with high acidity → high-acid whites, including nutty oxidative Vin Jaune aged under a veil of yeast.","chain":{"factor":"Cool continental","mechanism":"Slow ripening; high acidity","effect":"High acidity","style":"Nutty, oxidative and fresh whites"}}],"checks":[{"kp":"JURA-F01","type":"flash","question":"Name the two traditional red grapes of the Jura.","answer":"Poulsard (pale, delicate) and Trousseau (more structured), alongside Pinot Noir."},{"kp":"JURA-CG1","type":"explain","prompt":"Explain how the climate of Jura shapes the characteristics of its signature grape(s).","requiredPoints":["Cool continental","Slow ripening; high acidity","High acidity","Nutty, oxidative and fresh whites"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Marl soils suit Savagnin; limestone slopes for Chardonnay and reds.","Cool sites preserve the high acidity central to the region's styles.","Vin Jaune: Savagnin aged 6 years 3 months in barrel under a flor-like veil, not topped up — nutty, intense.","Bottled in the 62 cl clavelin, reflecting the portion that survives evaporation.","Vin de Paille: sweet wine from grapes dried on straw; Crémant du Jura by traditional method."],"kkps":[{"id":"JURA-F02","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"An oxidative wine from Savagnin, aged 6 years 3 months in barrel under a yeast veil (voile) without topping up — giving nutty, intense flavours. Bottled in the 62 cl clavelin."},{"id":"JURA-F03","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Topped-up ageing — barrels are kept full to prevent oxidation, giving a fresh (non-oxidative) style."}],"checks":[{"kp":"JURA-F02","type":"flash","question":"What is Vin Jaune and how is it made?","answer":"An oxidative wine from Savagnin, aged 6 years 3 months in barrel under a yeast veil (voile) without topping up — giving nutty, intense flavours. Bottled in the 62 cl clavelin."},{"kp":"JURA-F03","type":"flash","question":"What does 'ouillé' mean for Jura Chardonnay/Savagnin?","answer":"Topped-up ageing — barrels are kept full to prevent oxidation, giving a fresh (non-oxidative) style."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["AOCs: Arbois, Côtes du Jura, L'Étoile, Château-Chalon (Vin Jaune only).","Macvin du Jura: a fortified mistelle (grape juice + marc).","Crémant du Jura is an important volume category."],"kkps":[{"id":"JURA-F04","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Château-Chalon."}],"checks":[{"kp":"JURA-F04","type":"flash","question":"Which appellation makes only Vin Jaune?","answer":"Château-Chalon."}]}],"blind":[{"id":"JURA-BLIND-1","tastingProfile":"White wine. Medium gold. Pronounced nutty, curry-spice (fenugreek), bruised apple, dried fruit and almond aromas with no fresh primary fruit. Dry, high acidity, medium alcohol, medium body, very long savoury finish.","deduce":["Grape: Savagnin","Climate: cool","Region: Jura (France)"],"justifyWith":["Nutty, oxidative, fenugreek notes with no topping-up character → sous voile / Vin Jaune ageing","High acidity → cool continental climate","Bruised-apple oxidative profile + Savagnin → Jura, not a flor sherry"]}],"quiz":[{"id":"jura-Q1","kp":"JURA-F02","question":"How is Vin Jaune produced in the Jura?","correctAnswer":"From Savagnin, aged 6 years 3 months in barrel under a yeast veil (voile) without topping up","distractors":["From Chardonnay, aged under flor for 2 years then fortified","From Poulsard, aged in topped-up barrels to stay fresh","From Savagnin, fortified and heated like Madeira"]},{"id":"jura-Q2","kp":"JURA-F01","question":"Which red grapes are typical of the Jura?","correctAnswer":"Poulsard (pale, delicate) and Trousseau (more structured), alongside Pinot Noir","distractors":["Syrah and Grenache","Cabernet Sauvignon and Merlot","Nebbiolo and Barbera"]},{"id":"jura-Q3","kp":"JURA-F02","question":"In which distinctive bottle is Vin Jaune sold?","correctAnswer":"The 62 cl clavelin","distractors":["The 50 cl clavelin","The 75 cl Bordeaux bottle","The 100 cl bocksbeutel"]},{"id":"jura-Q4","kp":"JURA-F04","question":"Which appellation is dedicated exclusively to Vin Jaune?","correctAnswer":"Château-Chalon","distractors":["Côtes du Jura","Arbois","L'Étoile"]}]},{"id":"rioja","title":"Rioja","alt":"Alta · Alavesa · Oriental","country":"Spain","flag":"🇪🇸","blurb":"Spain's flagship DOCa. Tempranillo-led blends along the Ebro, defined by oak ageing categories and, since 2018, new geographical tiers.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Continental + maritime","scores":{"warmth":3,"sun":4,"rain":2,"diurnal":3,"risk":3}},"style":{"red":75,"rose":15,"white":10},"grapes":[{"name":"Tempranillo","color":"r","pct":78},{"name":"Garnacha","color":"r","pct":8},{"name":"Graciano","color":"r","pct":2},{"name":"Mazuelo","color":"r","pct":2},{"name":"Viura","color":"w","pct":7},{"name":"Other white","color":"w","pct":3}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Runs ~100 km NW–SE along the River Ebro; vineyards 350–650 m. Three zones: Rioja Alta, Rioja Alavesa, Rioja Oriental.","Sierra de Cantabria shelters the north-west from Atlantic storms; the east feels Mediterranean influence (warmer, drier).","Rainfall ~450 mm, sunshine ~2,800 hours; summer to 40°C, winter to −4°C.","Alta & Alavesa cooler/wetter (calcareous clay & limestone → finesse); Oriental warmest and driest (suits Garnacha)."],"kkps":[{"id":"RIOJA-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"About 88%. It ripens even in cooler, higher-altitude sites with cool clay soils, giving medium tannin and acidity with raspberry/black-plum fruit."},{"id":"RIOJA-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Rioja Oriental — warm and dry, best suited to Garnacha."},{"id":"RIOJA-R03","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Alta & Alavesa cooler/wetter (calcareous clay & limestone → finesse); Oriental warmest and driest (suits Garnacha)."}],"checks":[{"kp":"RIOJA-F01","type":"flash","question":"What share of Rioja's black grapes is Tempranillo, and why does it suit Alta/Alavesa?","answer":"About 88%. It ripens even in cooler, higher-altitude sites with cool clay soils, giving medium tannin and acidity with raspberry/black-plum fruit."},{"kp":"RIOJA-F02","type":"flash","question":"Which Rioja zone is warmest and driest, and which grape suits it?","answer":"Rioja Oriental — warm and dry, best suited to Garnacha."},{"kp":"RIOJA-R03","type":"explain","prompt":"Starting from “Alta & Alavesa cooler/wetter (calcareous clay & limestone”, explain what this leads to — through to the resulting wine style.","requiredPoints":["finesse); Oriental warmest and driest (suits Garnacha)"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Tempranillo: 88% of black plantings; early budding/ripening; raspberry & black plum, medium tannin & acidity.","Garnacha: ripe strawberry, fuller body, lower tannin; suits warm dry Oriental; oxidises, so less used for long ageing.","Graciano: late-ripening, high acid & tannin, very aromatic — adds freshness and ageing potential.","Mazuelo (Carignan): high acidity; Maturana Tinta (Trousseau) permitted 2009.","Whites: Viura (Macabeo) dominant; Tempranillo Blanco (permitted 2004) rising; Malvasía & Garnacha Blanca for complexity."],"kkps":[{"id":"RIOJA-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Moderate continental climate moderated by the Ebro → Tempranillo ripens to medium sugar with medium acidity → medium-bodied reds of red cherry and savoury spice, suited to long oak ageing.","chain":{"factor":"Moderate continental, Ebro-moderated","mechanism":"Steady, even ripening","effect":"Medium tannin and acidity","style":"Oak-aged, savoury Tempranillo"}}],"checks":[{"kp":"RIOJA-CG1","type":"explain","prompt":"Explain how the climate of Rioja shapes the characteristics of its signature grape(s).","requiredPoints":["Moderate continental, Ebro-moderated","Steady, even ripening","Medium tannin and acidity","Oak-aged, savoury Tempranillo"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Mix of old bush vines (some 100+ years) and modern VSP for mechanisation.","Max yields 47 hL/ha (red), 62 hL/ha (white).","Blending across zones is used for consistency; single-zone/vineyard wines emphasise site.","Only 225 L barriques permitted for Crianza/Reserva/Gran Reserva (cap 300 L).","Traditional: long ageing in American oak → dried fruit, vanilla, coconut. Modern: French oak, less extraction, fresher fruit.","Vinos de autor / 'generic' wines (from 1990s): low yields, selected parcels, new French oak, no ageing category.","Whites: cool steel for early-drinking Viura; barrel-fermented premium styles; classic oxidative whites still made (Tondonia, Ygay)."],"kkps":[{"id":"RIOJA-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Joven → Crianza → Reserva → Gran Reserva (each requires progressively longer total and oak ageing)."},{"id":"RIOJA-F05","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"It oxidises easily and loses colour, fruit and primary aromas quickly, so it is less suited to long oak ageing."},{"id":"RIOJA-F06","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"225-litre barriques (the regulation caps oak vessels at 300 L)."},{"id":"RIOJA-R07","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Traditional: long ageing in American oak → dried fruit, vanilla, coconut. Modern: French oak, less extraction, fresher fruit."}],"checks":[{"kp":"RIOJA-F04","type":"flash","question":"Name the four red ageing categories of Rioja in ascending order.","answer":"Joven → Crianza → Reserva → Gran Reserva (each requires progressively longer total and oak ageing)."},{"kp":"RIOJA-F05","type":"flash","question":"Why is Garnacha rarely used for Gran Reserva in Rioja?","answer":"It oxidises easily and loses colour, fruit and primary aromas quickly, so it is less suited to long oak ageing."},{"kp":"RIOJA-F06","type":"flash","question":"What barrel size is mandated for Crianza, Reserva and Gran Reserva?","answer":"225-litre barriques (the regulation caps oak vessels at 300 L)."},{"kp":"RIOJA-R07","type":"explain","prompt":"Starting from “Traditional: long ageing in American oak”, explain what this leads to — through to the resulting wine style.","requiredPoints":["dried fruit, vanilla, coconut. Modern: French oak, less extraction, fresher fruit"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Ageing categories (red): Joven, Crianza (24 mo, ≥12 in oak), Reserva (36 mo, ≥12 oak), Gran Reserva (60 mo, ≥24 oak).","2018 geographic tiers: Vino de Zona, Vino de Municipio, Viñedo Singular (single vineyard).","Viñedo Singular requires ≥10 yrs ownership, vines ≥35 yrs, hand-harvest, sustainable, panel approval.","One of only two DOCa/DOQ regions in Spain (with Priorat); bottling must occur within the region."],"kkps":[{"id":"RIOJA-F08","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Vino de Zona, Vino de Municipio and Viñedo Singular (single vineyard)."}],"checks":[{"kp":"RIOJA-F08","type":"flash","question":"What three geographic tiers did the 2018 Rioja legislation introduce?","answer":"Vino de Zona, Vino de Municipio and Viñedo Singular (single vineyard)."}]}],"blind":[{"id":"RIO-BLIND","tastingProfile":"Medium ruby with garnet rim. Ripe red cherry, dried fig, vanilla, coconut, dill, leather, tobacco. Dry, medium(+) acidity, medium(+) fine tannin, medium(+) alcohol, long American-oak ageing.","deduce":["Grape: Tempranillo","Style: extended oak ageing (Gran Reserva)","Region: Rioja"],"justifyWith":["Vanilla/coconut/dill → American oak, classic Rioja signature","Garnet rim + dried fruit + leather/tobacco → bottle + cask age (Reserva/Gran Reserva)","Red cherry, medium tannin, savoury → Tempranillo"]}],"quiz":[{"id":"rioja-Q1","kp":"RIOJA-F04","question":"What is the correct order of Rioja's oak-ageing categories, from least to most aged?","correctAnswer":"Joven → Crianza → Reserva → Gran Reserva","distractors":["Crianza → Joven → Gran Reserva → Reserva","Kabinett → Spätlese → Auslese → BA","Crianza → Reserva → Gran Reserva → Joven"]},{"id":"rioja-Q2","kp":"RIOJA-F08","question":"Which geographical tiers were introduced to Rioja in 2018?","correctAnswer":"Vino de Zona, Vino de Municipio and Viñedo Singular","distractors":["Village, Premier Cru and Grand Cru","Crianza, Reserva and Gran Reserva","Alta, Alavesa and Oriental"]},{"id":"rioja-Q3","kp":"RIOJA-R03","question":"Which Rioja zone is warmest and driest, best suited to Garnacha?","correctAnswer":"Rioja Oriental","distractors":["Rioja Alavesa","Rioja Alta","Rioja Sierra"]},{"id":"rioja-Q4","kp":"RIOJA-R07","question":"What flavours characterise the traditional Rioja style aged in American oak?","correctAnswer":"Dried fruit, vanilla and coconut","distractors":["Fresh red fruit with subtle French oak spice","Wet stone and citrus minerality","Smoke, tar and roses"]},{"id":"rioja-Q5","kp":"RIOJA-F06","question":"What size are the barrels traditionally used to age Rioja?","correctAnswer":"225-litre barriques (oak vessels capped at 300 L)","distractors":["500-litre puncheons only","Large 5,000-litre foudres","Concrete eggs of varying size"]}]},{"id":"ribera-del-duero","title":"Ribera del Duero","alt":"Tinto Fino on the high meseta","country":"Spain","flag":"🇪🇸","blurb":"High, sun-baked plateau on the upper Duero. Powerful Tempranillo (Tinto Fino) with huge diurnal swings and a meteoric rise since the 1980s.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Continental, high-altitude","scores":{"warmth":4,"sun":5,"rain":2,"diurnal":5,"risk":4}},"style":{"red":95,"rose":4,"white":1},"grapes":[{"name":"Tempranillo (Tinto Fino)","color":"r","pct":96},{"name":"Cabernet Sauvignon / Merlot / Malbec","color":"r","pct":3},{"name":"Albillo Mayor","color":"w","pct":1}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Upper valley of the Duero on the northern meseta; vineyards 750–1,000 m.","Continental — hotter summers and colder winters than Rioja; low rainfall 400–600 mm.","Frost in spring and autumn is a real hazard (heaters, spraying, even helicopters); vintage variation is marked.","Very large diurnal range preserves acidity and builds colour and aroma."],"kkps":[{"id":"RIBERA-DEL-DUERO-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"High altitude (750–1,000 m) gives a very large diurnal range that preserves acidity and builds colour, tannin and aroma, while a hot, sunny climate ripens the fruit fully."},{"id":"RIBERA-DEL-DUERO-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Frost — in both spring and autumn — combated with heaters, water spraying and occasionally helicopters."}],"checks":[{"kp":"RIBERA-DEL-DUERO-F01","type":"flash","question":"Why does Ribera del Duero produce such concentrated, structured reds?","answer":"High altitude (750–1,000 m) gives a very large diurnal range that preserves acidity and builds colour, tannin and aroma, while a hot, sunny climate ripens the fruit fully."},{"kp":"RIBERA-DEL-DUERO-F02","type":"flash","question":"What is the main viticultural hazard in Ribera del Duero?","answer":"Frost — in both spring and autumn — combated with heaters, water spraying and occasionally helicopters."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Tempranillo, locally Tinto Fino / Tinta del País, is ~96% of plantings.","Small amounts of Cabernet Sauvignon, Merlot, Malbec and Garnacha can be blended.","White wines (Albillo Mayor, all old-vine) permitted only since 2019."],"kkps":[{"id":"RIBERA-DEL-DUERO-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Tinto Fino / Tinta del País — about 96% of the vineyard."},{"id":"RIBERA-DEL-DUERO-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Vega Sicilia (the historic benchmark) and Pesquera (Alejandro Fernández), which inspired the wave of new wineries after 1982."},{"id":"RIBERA-DEL-DUERO-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"High-altitude continental climate with a wide diurnal range → Tinto Fino (Tempranillo) ripens deeply while cold nights preserve acidity → deeply coloured, powerful reds with high tannin and freshness.","chain":{"factor":"High-altitude continental, big diurnal range","mechanism":"Deep ripening; acidity preserved at night","effect":"High tannin, retained freshness","style":"Powerful, dark, structured Tempranillo"}}],"checks":[{"kp":"RIBERA-DEL-DUERO-F03","type":"flash","question":"What is Tempranillo called in Ribera del Duero and what share of plantings is it?","answer":"Tinto Fino / Tinta del País — about 96% of the vineyard."},{"kp":"RIBERA-DEL-DUERO-F04","type":"flash","question":"Which two estates drove Ribera del Duero's reputation?","answer":"Vega Sicilia (the historic benchmark) and Pesquera (Alejandro Fernández), which inspired the wave of new wineries after 1982."},{"kp":"RIBERA-DEL-DUERO-CG1","type":"explain","prompt":"Explain how the climate of Ribera del Duero shapes the characteristics of its signature grape(s).","requiredPoints":["High-altitude continental, big diurnal range","Deep ripening; acidity preserved at night","High tannin, retained freshness","Powerful, dark, structured Tempranillo"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":[">50% bush vines, the rest on trellises; ~25% of vines over 40 years old, some 100+.","Limestone layers within silt or clay soils; average grower farms under 3 ha.","Irrigation allowed at certain times but not during ripening.","Full-bodied, high-alcohol reds; ripe blackberry/plum with vanilla & chocolate from new oak.","French oak increasingly popular (often 50–100% new for top wines).","Recent trend: less extraction, shorter post-fermentation maceration, less new oak.","Crianza is the most common category; Gran Reserva is rare; much wine sold without an ageing category."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["DO since 1982; pioneered by Vega Sicilia (late 19th c.) and Pesquera (Alejandro Fernández).","Red must be ≥75% Tempranillo (mostly 100%); white ≥75% Albillo Mayor.","Uses the same Crianza/Reserva/Gran Reserva ageing categories as the rest of Castilla y León."],"kkps":[],"checks":[]}],"blind":[{"id":"RIB-BLIND","tastingProfile":"Deep ruby. Pronounced black cherry, blackberry, liquorice, vanilla/cedar (French oak). Dry, medium(+) acidity, high ripe tannin, high alcohol, full body.","deduce":["Grape: Tempranillo (Tinto Fino)","Climate: continental, high-altitude","Region: Ribera del Duero"],"justifyWith":["Darker, more powerful fruit + high tannin → Tempranillo from high-altitude Ribera","More French oak (cedar) and concentration vs Rioja","Full body, high alcohol, big structure → warm days/cold nights at altitude"]}],"quiz":[{"id":"ribera-del-duero-Q1","kp":"RIBERA-DEL-DUERO-F03","question":"What is the dominant grape of Ribera del Duero, making about 96% of the vineyard?","correctAnswer":"Tinto Fino / Tinta del País (Tempranillo)","distractors":["Garnacha","Cabernet Sauvignon","Monastrell"]},{"id":"ribera-del-duero-Q2","kp":"RIBERA-DEL-DUERO-F01","question":"What is the main effect of Ribera del Duero's high altitude (750–1,000 m)?","correctAnswer":"A very large diurnal range that preserves acidity and builds colour, tannin and aroma","distractors":["A maritime influence that raises humidity and rot pressure","Consistently mild temperatures with no frost risk","Reduced sunlight that limits ripeness"]},{"id":"ribera-del-duero-Q3","kp":"RIBERA-DEL-DUERO-F02","question":"Which climatic hazard threatens Ribera del Duero in both spring and autumn?","correctAnswer":"Frost","distractors":["Harvest-time rain and rot","Coastal fog","Hailstorms from the Atlantic"]},{"id":"ribera-del-duero-Q4","kp":"RIBERA-DEL-DUERO-F04","question":"Which historic estate is the benchmark that helped trigger Ribera del Duero's rise after 1982?","correctAnswer":"Vega Sicilia","distractors":["Marqués de Riscal","Vega de la Reina","López de Heredia"]}]},{"id":"toro","title":"Toro","alt":"Tinta de Toro · ungrafted vines","country":"Spain","flag":"🇪🇸","blurb":"Hot, arid, high and remote on the Duero. Thick-skinned Tinta de Toro on sandy, often ungrafted old vines gives dark, powerful reds.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Hot continental","scores":{"warmth":4,"sun":5,"rain":1,"diurnal":4,"risk":3}},"style":{"red":90,"rose":7,"white":3},"grapes":[{"name":"Tinta de Toro (Tempranillo)","color":"r","pct":85},{"name":"Garnacha","color":"r","pct":10},{"name":"Malvasía / Verdejo","color":"w","pct":5}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["West of Castilla y León on the Duero; continental, hot summers, cold winters, intense sun.","Very low rainfall (300–400 mm); irrigation banned June to harvest; altitude 620–750 m, large diurnal range.","Sandy soils mean phylloxera was never a major problem — many vines are ungrafted."],"kkps":[{"id":"TORO-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Toro's sandy soils prevented phylloxera from taking hold, so a large proportion of old vines remain on their own roots."}],"checks":[{"kp":"TORO-F01","type":"flash","question":"Why are many Toro vines ungrafted?","answer":"Toro's sandy soils prevented phylloxera from taking hold, so a large proportion of old vines remain on their own roots."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Tinta de Toro: a local Tempranillo, thicker-skinned with greater colour and higher tannin.","Reds are ≥75% Tinta de Toro, balance Garnacha; rosé from either; whites Malvasía or Verdejo."],"kkps":[{"id":"TORO-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"It is a local variant with thicker skins, giving deeper colour and higher tannin."},{"id":"TORO-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Deep-coloured, full-bodied, high in alcohol (up to 15%) and tannin, with ripe blackberry and blueberry fruit."},{"id":"TORO-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Hot, dry, high-altitude continental climate → Tinta de Toro (Tempranillo) reaches very high ripeness with thick skins → intensely coloured, concentrated wines with high alcohol, high ripe tannin and bold dark fruit.","chain":{"factor":"Hot dry continental at altitude","mechanism":"Thick skins; very high sugar & phenolic ripeness","effect":"Deep colour, high alcohol & tannin","style":"Powerful, concentrated full-bodied reds"}}],"checks":[{"kp":"TORO-F02","type":"flash","question":"How does Tinta de Toro differ from regular Tempranillo?","answer":"It is a local variant with thicker skins, giving deeper colour and higher tannin."},{"kp":"TORO-F03","type":"flash","question":"Describe the typical style of red Toro.","answer":"Deep-coloured, full-bodied, high in alcohol (up to 15%) and tannin, with ripe blackberry and blueberry fruit."},{"kp":"TORO-CG1","type":"explain","prompt":"Explain how the climate of Toro shapes the characteristics of its signature grape(s).","requiredPoints":["Hot dry continental at altitude","Thick skins; very high sugar & phenolic ripeness","Deep colour, high alcohol & tannin","Powerful, concentrated full-bodied reds"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Mostly bush vines; cooler sites, higher western altitudes and north-facing aspects sought for slower ripening.","Old vines: ~20% over 50 years, some 100+; low density, ~27 hL/ha, few bunches per vine.","Deep colour, full body, high alcohol (max 15%) and high tannin; ripe blackberry/blueberry.","High-volume wines use carbonic maceration for softer, fruitier styles.","Premium wines aged in American and/or French oak."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["DO with classic Castilla y León ageing categories.","Remote location long hampered development (8 wineries in 1998 → ~60 today).","Rose to prominence partly as a cheaper alternative to Ribera del Duero."],"kkps":[{"id":"TORO-R04","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Remote location long hampered development (8 wineries in 1998 → ~60 today)."}],"checks":[{"kp":"TORO-R04","type":"explain","prompt":"Starting from “Remote location long hampered development (8 wineries in 1998”, explain what this leads to — through to the resulting wine style.","requiredPoints":["~60 today)"]}]}],"blind":[{"id":"TORO-BLIND-1","tastingProfile":"Red wine. Deep ruby/purple. Pronounced ripe blackberry and blueberry, liquorice, sweet vanilla/coconut oak. Dry, medium-plus acidity, high ripe tannin, high alcohol (up to 15%), full body, pronounced dark fruit, long finish.","deduce":["Grape: Tinta de Toro (Tempranillo)","Climate: hot","Region: Toro (Spain)"],"justifyWith":["Deep colour + high ripe tannin + bold blackberry/blueberry → thick-skinned Tinta de Toro from a hot, dry climate","High alcohol up to 15% + ripe/jammy fruit → very high ripeness on a hot high-altitude plateau","Concentration with sweet oak → powerful Duero Tempranillo, distinct from lighter, savoury Rioja"]}],"quiz":[{"id":"toro-Q1","kp":"TORO-F01","question":"Why do many old Toro vines survive on their own roots (ungrafted)?","correctAnswer":"Its sandy soils prevented phylloxera from taking hold","distractors":["The high altitude is too cold for phylloxera","Strict laws ban rootstock grafting","The vines are recent disease-resistant crossings"]},{"id":"toro-Q2","kp":"TORO-F02","question":"How does Tinta de Toro differ from standard Tempranillo?","correctAnswer":"It is a local variant with thicker skins, giving deeper colour and higher tannin","distractors":["It is a white-berried mutation","It ripens far earlier with lower sugar","It is naturally low in tannin and pale"]},{"id":"toro-Q3","kp":"TORO-CG1","question":"What is the climate of Toro?","correctAnswer":"Hot, dry, high-altitude continental","distractors":["Cool maritime Atlantic","Moderate continental moderated by a river","Warm, foggy coastal"]},{"id":"toro-Q4","kp":"TORO-F03","question":"Which style best describes a typical Toro red?","correctAnswer":"Deep-coloured, full-bodied, high alcohol (up to 15%) with ripe blackberry/blueberry","distractors":["Pale, light-bodied with low tannin and high acidity","Off-dry and aromatic with floral notes","Lean, steely and unoaked with green-apple fruit"]}]},{"id":"rueda","title":"Rueda","alt":"Verdejo country","country":"Spain","flag":"🇪🇸","blurb":"Castilla y León's white specialist: crisp, herbal Verdejo, night-harvested at altitude. Reinvented from oxidative fortified to fresh, modern whites.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Continental","scores":{"warmth":3,"sun":4,"rain":2,"diurnal":4,"risk":3}},"style":{"white":95,"red":3,"rose":2},"grapes":[{"name":"Verdejo","color":"w","pct":85},{"name":"Sauvignon Blanc","color":"w","pct":10},{"name":"Viura / other","color":"w","pct":5}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Between Toro (west) and Ribera del Duero (east); hot dry summers, cold winters, cool evenings.","Altitude 700–800 m; low rainfall; gravel soils with high chalk content.","Night harvesting (by machine) preserves aromatics and acidity."],"kkps":[{"id":"RUEDA-F01","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Cooler night temperatures preserve the grape's aromatics and acidity (Verdejo oxidises easily)."}],"checks":[{"kp":"RUEDA-F01","type":"flash","question":"Why is Rueda harvested at night?","answer":"Cooler night temperatures preserve the grape's aromatics and acidity (Verdejo oxidises easily)."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Verdejo: a more neutral Sauvignon-like grape; medium+ to high acidity, phenolic, with apple, pear, peach, green herbs (fennel) and a slightly bitter finish; drought-tolerant but oxidises easily.","Sauvignon Blanc and Viura are blended or bottled alone."],"kkps":[{"id":"RUEDA-F02","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Verdejo — apple, pear and peach with green-herb (fennel) notes and a slightly bitter finish, medium+ to high acidity."},{"id":"RUEDA-CG1","cat":"relationship","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Continental climate with hot days but cool nights (altitude) → Verdejo ripens its aromatics while the cold nights preserve acidity → fresh, high-acid whites with citrus, fennel and herbaceous/grassy notes.","chain":{"factor":"Continental, hot days / cool nights","mechanism":"Aroma ripeness with retained acidity (diurnal range)","effect":"High acidity + ripe aromatics","style":"Fresh, aromatic, herbaceous Verdejo"}}],"checks":[{"kp":"RUEDA-F02","type":"flash","question":"What grape defines Rueda and what are its hallmark flavours?","answer":"Verdejo — apple, pear and peach with green-herb (fennel) notes and a slightly bitter finish, medium+ to high acidity."},{"kp":"RUEDA-CG1","type":"explain","prompt":"Explain how the climate of Rueda shapes the characteristics of its signature grape(s).","requiredPoints":["Continental, hot days / cool nights","Aroma ripeness with retained acidity (diurnal range)","High acidity + ripe aromatics","Fresh, aromatic, herbaceous Verdejo"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Modern training is cordon VSP; ~10% remains very old bush vines.","Little or no skin contact to limit phenolics; MLF generally avoided to keep acidity.","Inexpensive: protective, cool steel, sold soon after fermentation.","Mid-priced: lees ageing (months up to a year) with lees stirring.","Premium: barrel ferment/age for body and texture."],"kkps":[{"id":"RUEDA-F03","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"Marqués de Riscal in the early 1970s, using protective winemaking and stainless steel — replacing the old oxidative fortified style."}],"checks":[{"kp":"RUEDA-F03","type":"flash","question":"Who revived Rueda as a fresh white wine region and how?","answer":"Marqués de Riscal in the early 1970s, using protective winemaking and stainless steel — replacing the old oxidative fortified style."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["≥85% of the named variety required on the label (Verdejo or Sauvignon Blanc).","Production has quadrupled; the crisp, fruity early-drinking style drives popularity.","Revival led by Marqués de Riscal in the early 1970s using protective winemaking + stainless steel."],"kkps":[{"id":"RUEDA-F04","cat":"fact","verified":true,"src":"2__Spain_Portugal_20240906.pdf","statement":"At least 85% of the named grape."}],"checks":[{"kp":"RUEDA-F04","type":"flash","question":"What is the minimum varietal content to label a Rueda by variety?","answer":"At least 85% of the named grape."}]}],"blind":[{"id":"RUEDA-BLIND-1","tastingProfile":"White wine. Pale lemon. Medium-plus intensity apple, pear, peach with green-herb/fennel and a grassy, herbaceous note; no oak. Dry, high acidity, medium alcohol, medium body, slightly bitter medium finish.","deduce":["Grape: Verdejo","Climate: moderate (continental)","Region: Rueda (Castilla y León, Spain)"],"justifyWith":["Fennel/green-herb + slightly bitter finish → Verdejo's signature character","High acidity with ripe stone fruit → hot days but cool nights at altitude","Unoaked, fresh, protective style → modern stainless-steel Rueda"]}],"quiz":[{"id":"rueda-Q1","kp":"RUEDA-CG1","question":"Why does Rueda's continental climate suit Verdejo?","correctAnswer":"Hot days ripen the aromatics while cool nights at altitude preserve acidity, giving fresh, high-acid whites","distractors":["Constant maritime humidity slows ripening and resists rot","A hot, low-altitude climate gives soft, low-acid wines","Cool, cloudy conditions give very light, neutral wines"]},{"id":"rueda-Q2","kp":"RUEDA-F02","question":"Which flavour profile is typical of Verdejo from Rueda?","correctAnswer":"Apple, pear and peach with green-herb (fennel) notes and a slightly bitter finish","distractors":["Pronounced tropical mango and pineapple with low acidity","Buttery, nutty oxidative notes from long oak ageing","Lychee and rose with very low acidity"]},{"id":"rueda-Q3","kp":"RUEDA-F03","question":"Who reinvented Rueda as a fresh white-wine region in the early 1970s?","correctAnswer":"Marqués de Riscal, using protective winemaking and stainless steel","distractors":["Miguel Torres, using temperature-controlled fermentation","Vega Sicilia, focusing on oak-aged reds","Marqués de Murrieta, reviving the fortified style"]},{"id":"rueda-Q4","kp":"RUEDA-F04","question":"What is the minimum proportion of the named grape required for a varietal Rueda?","correctAnswer":"At least 85%","distractors":["At least 100% (single variety only)","At least 51%","At least 70%"]}]},{"id":"rias-baixas","title":"Rías Baixas","alt":"Galicia · Albariño","country":"Spain","flag":"🇪🇸","blurb":"Green, rain-soaked Atlantic Galicia. Thick-skinned Albariño on granite, trained high on pergolas, giving aromatic, high-acid whites.","source":"2__Spain_Portugal_20240906.pdf","climate":{"label":"Cool maritime","scores":{"warmth":2,"sun":2,"rain":5,"diurnal":2,"risk":4}},"style":{"white":99,"red":1},"grapes":[{"name":"Albariño","color":"w","pct":95},{"name":"Loureira / Treixadura / Caiño","c
