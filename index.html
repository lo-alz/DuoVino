high tannin and great ageing potential.","Aglianico is early budding and late ripening, picked at the end of October/early November for fully ripe skins and pips.","Cooler, higher sites give more intense, structured wines.","Long maceration and oak ageing soften the firm tannins."],"kkps":[{"id":"TAURASI-R03","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Cool hillside altitude with a long season → Aglianico ripens its high tannins fully while keeping high acidity → powerful, structured reds of red plum and blackberry with high acid, high tannin and great ageing potential."}],"checks":[{"kp":"TAURASI-R03","type":"explain","prompt":"Starting from “Cool hillside altitude with a long season”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Aglianico ripens its high tannins fully while keeping high acidity","powerful, structured reds of red plum and blackberry with high acid, high tannin and great ageing potential"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Cordon spur or cane VSP; the late harvest risks autumn rain, so site and timing matter.","Prone to BBR and vulnerable to late-season rain.","High-altitude cool slopes are sought for the best quality.","Long maceration on the skins (20 days+), aged in French barriques or large casks.","Taurasi DOCG: ≥3 years ageing (1 in wood); Riserva 4 years (18 months in wood).","Quality reaches Q:3–4."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Taurasi DOCG requires ≥85% Aglianico.","Campania's other DOCGs include Fiano di Avellino and Greco di Tufo (whites)."],"kkps":[{"id":"TAURASI-F04","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"≥85% Aglianico; aged ≥3 years (1 in wood), Riserva 4 years (18 months in wood)."}],"checks":[{"kp":"TAURASI-F04","type":"flash","question":"What is the grape requirement and a key ageing rule for Taurasi DOCG?","answer":"≥85% Aglianico; aged ≥3 years (1 in wood), Riserva 4 years (18 months in wood)."}]}],"blind":[{"id":"TAURASI-BLIND-1","tastingProfile":"Red wine. Deep ruby, garnet at rim. Pronounced red plum, blackberry, dried herbs, leather and a smoky/earthy note with cedar oak. Dry, high acidity, high firm tannins, medium-plus alcohol, full body, intense dark fruit, long finish.","deduce":["Grape: Aglianico","Climate: warm (warm Mediterranean, altitude-cooled)","Region: Taurasi (Campania, Italy)"],"justifyWith":["High acid + high firm tannin + red plum/blackberry → late-ripening Aglianico","Full body and ripe fruit while retaining high acidity → warm climate cooled by hillside altitude and a long season","Powerful, structured, age-worthy profile with savoury earth/leather → 'the Barolo of the south', Taurasi"]}],"quiz":[{"id":"taurasi-Q1","kp":"TAURASI-F04","question":"What are the grape and ageing rules for Taurasi?","correctAnswer":"At least 85% Aglianico, aged at least 3 years (1 in wood); Riserva 4 years (18 months in wood)","distractors":["100% Sangiovese aged 4 years","100% Nebbiolo aged 2 years","85% Primitivo aged over 30 months"]},{"id":"taurasi-Q2","kp":"TAURASI-F02","question":"When is Aglianico typically harvested in Taurasi?","correctAnswer":"End of October/early November, as it is late ripening","distractors":["In August to beat autumn rain","In early September with the whites","In December as an ice-wine pick"]},{"id":"taurasi-Q3","kp":"TAURASI-R03","question":"What style of wine does Aglianico give in Taurasi?","correctAnswer":"Powerful, structured reds of red plum/blackberry with high acid, high tannin and great ageing potential","distractors":["Light, fruity, low-tannin reds for early drinking","Pale, aromatic, off-dry reds","Jammy, high-alcohol, low-acid reds"]},{"id":"taurasi-Q4","kp":"TAURASI-F01","question":"Why can Aglianico ripen its high tannins fully in Taurasi while keeping high acidity?","correctAnswer":"Cool hillside altitude combined with a long growing season","distractors":["A hot, low-altitude coastal plain","Reliable autumn botrytis","A cold maritime fog belt"]}]},{"id":"primitivo-di-manduria","title":"Primitivo di Manduria (Puglia)","alt":"Italy · Puglia · Primitivo","country":"Italy","flag":"🇮🇹","blurb":"Puglia's powerhouse — ripe, jammy, high-alcohol Primitivo (Zinfandel) from the hot heel of Italy.","source":"4__ItalyGreece.pdf","climate":{"label":"Hot Mediterranean","scores":{"warmth":5,"sun":5,"rain":1,"diurnal":2,"risk":3}},"style":{"red":100},"grapes":[{"name":"Primitivo","color":"r","pct":100}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["In the Salento, the hot heel of Italy, surrounded on three sides by the sea with moderating breezes.","A hot Mediterranean climate with very low rainfall (drought and climate change are hazards); irrigation is permitted.","Fertile soils support volume; hillier areas (250–500 m) are slightly cooler.","Primitivo is genetically identical to California's Zinfandel."],"kkps":[{"id":"PRIMITIVO-DI-MANDURIA-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"The hot, sunny, dry Salento climate makes Primitivo accumulate sugar easily and ripen to high alcohol → ripe-to-jammy, full-bodied reds."},{"id":"PRIMITIVO-DI-MANDURIA-F02","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"It ripens unevenly — a single bunch can hold ripe and unripe berries and tends to shrivel — so it is often picked in August to avoid autumn rain."}],"checks":[{"kp":"PRIMITIVO-DI-MANDURIA-F01","type":"flash","question":"Why is Primitivo di Manduria so ripe and high in alcohol?","answer":"The hot, sunny, dry Salento climate makes Primitivo accumulate sugar easily and ripen to high alcohol → ripe-to-jammy, full-bodied reds."},{"kp":"PRIMITIVO-DI-MANDURIA-F02","type":"flash","question":"What ripening quirk must growers manage with Primitivo?","answer":"It ripens unevenly — a single bunch can hold ripe and unripe berries and tends to shrivel — so it is often picked in August to avoid autumn rain."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Hot, sunny, dry conditions → Primitivo accumulates sugar easily and ripens to high alcohol → ripe-to-jammy red-cherry/strawberry reds, full-bodied with medium acidity and medium-to-high tannin.","Primitivo is early budding (frost-prone) and ripens unevenly (a bunch can hold ripe and unripe berries), with a tendency to shrivel on the vine.","Picked in August to avoid autumn rain; Puglian Primitivo has looser bunches and smaller, more disease-resistant berries than California Zinfandel.","Care is taken to avoid overly jammy or dried-fruit flavours."],"kkps":[{"id":"PRIMITIVO-DI-MANDURIA-F03","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"California's Zinfandel."},{"id":"PRIMITIVO-DI-MANDURIA-R04","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Hot, sunny, dry conditions → Primitivo accumulates sugar easily and ripens to high alcohol → ripe-to-jammy red-cherry/strawberry reds, full-bodied with medium acidity and medium-to-high tannin."}],"checks":[{"kp":"PRIMITIVO-DI-MANDURIA-F03","type":"flash","question":"What other grape is Primitivo identical to?","answer":"California's Zinfandel."},{"kp":"PRIMITIVO-DI-MANDURIA-R04","type":"explain","prompt":"Starting from “Hot, sunny, dry conditions”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Primitivo accumulates sugar easily and ripens to high alcohol","ripe-to-jammy red-cherry/strawberry reds, full-bodied with medium acidity and medium-to-high tannin"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Older vines are bush-trained at low density; newer/high-volume vines are trellised for mechanisation.","Susceptible to poor flowering and fruit set in rainy/humid conditions.","Early August picking dodges autumn rain.","Inexpensive: warm fermentation, 7–10 days maceration, 6 months in steel/large casks.","Premium: longer skin contact for structure, 12 months in French oak.","Riserva styles exceed 14% alcohol."],"kkps":[{"id":"PRIMITIVO-DI-MANDURIA-F05","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"≥85% Primitivo and >14% abv (Riserva aged >30 months, 9 in oak)."}],"checks":[{"kp":"PRIMITIVO-DI-MANDURIA-F05","type":"flash","question":"What is the grape/alcohol rule for Primitivo di Manduria DOC?","answer":"≥85% Primitivo and >14% abv (Riserva aged >30 months, 9 in oak)."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Primitivo di Manduria DOC requires ≥85% Primitivo; Riserva aged >30 months (9 in oak); >14% abv.","Gioia del Colle DOC Primitivo (slightly cooler hills) requires 100% Primitivo, max 52 hL/ha."],"kkps":[],"checks":[]}],"blind":[{"id":"PRIMITIVO-BLIND-1","tastingProfile":"Red wine. Deep ruby. Pronounced ripe-to-jammy red cherry, strawberry, blackberry, dried fruit and sweet spice with vanilla oak. Dry (hint of sweetness), medium acidity, medium-to-high soft tannin, high alcohol, full body, medium-plus finish.","deduce":["Grape: Primitivo (Zinfandel)","Climate: hot","Region: Primitivo di Manduria / Puglia (Italy)"],"justifyWith":["Jammy red fruit + high alcohol + soft tannin → Primitivo (Zinfandel)","Riper-than-fresh, dried-fruit notes and medium acidity → hot, sunny, dry Mediterranean climate","Powerful, warm, full-bodied style → the hot heel of Italy (Salento)"]}],"quiz":[{"id":"primitivo-di-manduria-Q1","kp":"PRIMITIVO-DI-MANDURIA-F01","question":"How does the hot Salento climate shape Primitivo di Manduria?","correctAnswer":"Primitivo accumulates sugar easily and ripens to high alcohol, giving ripe-to-jammy, full-bodied reds","distractors":["It under-ripens, giving lean, high-acid, low-alcohol reds","It gives pale, delicate, low-tannin wines","Constant rain dilutes the fruit and lowers alcohol"]},{"id":"primitivo-di-manduria-Q2","kp":"PRIMITIVO-DI-MANDURIA-F02","question":"Why is Primitivo often picked in August?","correctAnswer":"It ripens unevenly and tends to shrivel, so it is picked early to avoid autumn rain","distractors":["Its high acidity drops too fast if left longer","It must ripen before the mistral damages the vines","Late picking always triggers noble rot"]},{"id":"primitivo-di-manduria-Q3","kp":"PRIMITIVO-DI-MANDURIA-F03","question":"Primitivo is genetically the same variety as which Californian grape?","correctAnswer":"Zinfandel","distractors":["Petite Sirah","Barbera","Carignane"]},{"id":"primitivo-di-manduria-Q4","kp":"PRIMITIVO-DI-MANDURIA-F05","question":"What does the Primitivo di Manduria DOC require?","correctAnswer":"At least 85% Primitivo and over 14% abv (Riserva aged over 30 months, 9 in oak)","distractors":["100% Primitivo and a maximum of 12.5% abv","A minimum of 70% Negroamaro","At least 50% Primitivo blended with Sangiovese"]}]},{"id":"naoussa","title":"Naoussa","alt":"Greece · Macedonia · age-worthy Xinomavro","country":"Greece","flag":"🇬🇷","blurb":"Greece's benchmark for structured, age-worthy Xinomavro — high in acid and tannin, often called the Barolo of Greece.","source":"4__ItalyGreece.pdf","climate":{"label":"Cool continental","scores":{"warmth":3,"sun":4,"rain":3,"diurnal":4,"risk":3}},"style":{"red":100},"grapes":[{"name":"Xinomavro","color":"r","pct":100}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["On the south-eastern slopes of Mount Vermio in Macedonia (northern Greece), at 150–400 m.","A cool continental climate; the best sites are sheltered from the strong, cold north and west winds.","Higher rainfall here (650–700 mm) than the Greek average → less water stress than the south.","Soils vary: light sand gives lighter wines, clay and limestone give fuller-bodied wines."],"kkps":[{"id":"NAOUSSA-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Its cool continental climate ripens Xinomavro slowly to very high acidity and high tannins → structured, complex reds that can age for decades."},{"id":"NAOUSSA-R02","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Higher rainfall here (650–700 mm) than the Greek average → less water stress than the south."}],"checks":[{"kp":"NAOUSSA-F01","type":"flash","question":"Why is Naoussa Xinomavro so age-worthy?","answer":"Its cool continental climate ripens Xinomavro slowly to very high acidity and high tannins → structured, complex reds that can age for decades."},{"kp":"NAOUSSA-R02","type":"explain","prompt":"Starting from “Higher rainfall here (650–700 mm) than the Greek average”, explain what this leads to — through to the resulting wine style.","requiredPoints":["less water stress than the south"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool continental climate → Xinomavro ripens slowly with very high acidity and high tannins → structured reds with great aromatic complexity and the potential to age for decades.","Xinomavro is pale-coloured and turns garnet quickly (like Nebbiolo) → best examples show flowers, herbs, spices, leather and earthiness, not just fruit.","Traditional ageing in large old casks → pronounced spicy and meaty (rather than fruity) character.","Modern styles use cold soaking/whole-bunch fermentation → deeper colour, less tannin, more accessible in youth."],"kkps":[{"id":"NAOUSSA-F03","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Like Nebbiolo it is pale-coloured, turns garnet quickly, and shows high acid, high tannin and savoury aromas (flowers, herbs, leather) that reward long ageing."},{"id":"NAOUSSA-R04","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Cool continental climate → Xinomavro ripens slowly with very high acidity and high tannins → structured reds with great aromatic complexity and the potential to age for decades."},{"id":"NAOUSSA-R05","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Xinomavro is pale-coloured and turns garnet quickly (like Nebbiolo) → best examples show flowers, herbs, spices, leather and earthiness, not just fruit."},{"id":"NAOUSSA-R06","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Traditional ageing in large old casks → pronounced spicy and meaty (rather than fruity) character."},{"id":"NAOUSSA-R07","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Modern styles use cold soaking/whole-bunch fermentation → deeper colour, less tannin, more accessible in youth."}],"checks":[{"kp":"NAOUSSA-F03","type":"flash","question":"Why is Xinomavro called the 'Nebbiolo of Greece'?","answer":"Like Nebbiolo it is pale-coloured, turns garnet quickly, and shows high acid, high tannin and savoury aromas (flowers, herbs, leather) that reward long ageing."},{"kp":"NAOUSSA-R04","type":"explain","prompt":"Starting from “Cool continental climate”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Xinomavro ripens slowly with very high acidity and high tannins","structured reds with great aromatic complexity and the potential to age for decades"]},{"kp":"NAOUSSA-R05","type":"explain","prompt":"Starting from “Xinomavro is pale-coloured and turns garnet quickly (like Nebbiolo)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["best examples show flowers, herbs, spices, leather and earthiness, not just fruit"]},{"kp":"NAOUSSA-R06","type":"explain","prompt":"Starting from “Traditional ageing in large old casks”, explain what this leads to — through to the resulting wine style.","requiredPoints":["pronounced spicy and meaty (rather than fruity) character"]},{"kp":"NAOUSSA-R07","type":"explain","prompt":"Starting from “Modern styles use cold soaking/whole-bunch fermentation”, explain what this leads to — through to the resulting wine style.","requiredPoints":["deeper colour, less tannin, more accessible in youth"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["100% Xinomavro is required for the PDO.","Site selection and aspect are crucial in this complex mix of soils and microclimates.","The grape's late ripening means cool years can leave it austere and high in acid.","Aged over 1 year (the PDO minimum); top wines reward long bottle ageing.","1990s producers tried new French oak (firmer tannins, more body); many have reverted to a more restrained style.","Quality reaches Q:2–4 (e.g. Kir-Yianni)."],"kkps":[{"id":"NAOUSSA-F08","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Modern: cold soaking/whole-bunch fermentation → deeper colour, softer tannins, more accessible young; traditional: large old casks → spicy, meaty, firmly tannic."}],"checks":[{"kp":"NAOUSSA-F08","type":"flash","question":"How do modern Naoussa wines differ from traditional ones?","answer":"Modern: cold soaking/whole-bunch fermentation → deeper colour, softer tannins, more accessible young; traditional: large old casks → spicy, meaty, firmly tannic."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["PDO Naoussa must be 100% Xinomavro and is red only (no rosé permitted).","Rosé and international-variety reds exist outside the PDO with no appellation status."],"kkps":[{"id":"NAOUSSA-F09","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"100% Xinomavro, red only."}],"checks":[{"kp":"NAOUSSA-F09","type":"flash","question":"What is the grape requirement for PDO Naoussa?","answer":"100% Xinomavro, red only."}]}],"blind":[{"id":"NAOUSSA-BLIND-1","tastingProfile":"Red wine. Pale ruby, already turning garnet at the rim. Pronounced red cherry and dried tomato with savoury notes of herbs, spice, leather and earth, subtle old-cask spice. Dry, high acidity, high tannin, medium-plus alcohol, medium-to-full body, long finish.","deduce":["Grape: Xinomavro","Climate: cool","Region: Naoussa (Greece)"],"justifyWith":["Pale colour turning garnet quickly + high acid + high tannin → Xinomavro (Nebbiolo-like)","Savoury leather/herb/spice over fruit → traditional large-old-cask ageing in Naoussa","Structured, age-worthy profile with retained acidity → cool continental climate"]}],"quiz":[{"id":"naoussa-Q1","kp":"NAOUSSA-F09","question":"Which grape is grown in Naoussa, and in what style?","correctAnswer":"100% Xinomavro, red only","distractors":["100% Assyrtiko, white only","A blend of Xinomavro and Agiorgitiko","100% Nebbiolo, red only"]},{"id":"naoussa-Q2","kp":"NAOUSSA-F03","question":"Which famous Italian grape is Xinomavro often compared to, and why?","correctAnswer":"Nebbiolo — pale-coloured, quick to turn garnet, with high acid, high tannin and savoury aromas","distractors":["Sangiovese — for its sour-cherry fruit and medium body","Cabernet Sauvignon — for its deep colour and blackcurrant","Barbera — for its low tannin and bright acidity"]},{"id":"naoussa-Q3","kp":"NAOUSSA-R06","question":"What does traditional ageing in large old casks give Naoussa wines?","correctAnswer":"A pronounced spicy and meaty (rather than fruity) character","distractors":["Bright, primary red-fruit flavours","Vanilla and coconut from new oak","An oxidative, nutty character"]},{"id":"naoussa-Q4","kp":"NAOUSSA-F01","question":"What does Naoussa's cool continental climate give Xinomavro?","correctAnswer":"Slow ripening to very high acidity and high tannins, giving structured reds that can age for decades","distractors":["Fast ripening to high sugar and soft tannins","Low acidity and low tannin for early drinking","A pale, low-tannin style suited only to rosé"]}]},{"id":"amynteo","title":"Amyndeon (Amynteo)","alt":"Greece · Macedonia · lighter Xinomavro & rosé","country":"Greece","flag":"🇬🇷","blurb":"A cool, high-altitude Xinomavro region on the other side of Mount Vermio — lighter, fresher reds and rosé, including sparkling.","source":"4__ItalyGreece.pdf","climate":{"label":"Cool continental, high-altitude","scores":{"warmth":2,"sun":4,"rain":3,"diurnal":5,"risk":4}},"style":{"red":70,"rosé":30},"grapes":[{"name":"Xinomavro","color":"r","pct":100}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["On the north-western side of Mount Vermio, opposite Naoussa, at high altitude (570–750 m).","A northerly aspect exposes it to cold northerly winds → cool summers and cold winters.","Sites near a lake bring humidity (rot risk) and fertile soils (yield control needed) → site selection is crucial.","Sandy, phylloxera-free soils support big stocks of old vines."],"kkps":[{"id":"AMYNTEO-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"The sandy soils are phylloxera-free → big stocks of ungrafted old vines that give concentration."},{"id":"AMYNTEO-R02","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"A northerly aspect exposes it to cold northerly winds → cool summers and cold winters."},{"id":"AMYNTEO-R03","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Sites near a lake bring humidity (rot risk) and fertile soils (yield control needed) → site selection is crucial."}],"checks":[{"kp":"AMYNTEO-F01","type":"flash","question":"Why can old vines thrive here?","answer":"The sandy soils are phylloxera-free → big stocks of ungrafted old vines that give concentration."},{"kp":"AMYNTEO-R02","type":"explain","prompt":"Starting from “A northerly aspect exposes it to cold northerly winds”, explain what this leads to — through to the resulting wine style.","requiredPoints":["cool summers and cold winters"]},{"kp":"AMYNTEO-R03","type":"explain","prompt":"Starting from “Sites near a lake bring humidity (rot risk) and fertile soils (yield control needed)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["site selection is crucial"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cooler, higher and more exposed than Naoussa → Xinomavro gives lighter body and lower tannins → fresher, more elegant reds.","Sandy soils and old vines → concentrated wines despite the lighter structure.","The cool climate also suits rosé and sparkling Xinomavro (rosé is permitted here, unlike Naoussa).","A recent trend toward riper, more accessible styles."],"kkps":[{"id":"AMYNTEO-R04","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Cooler, higher and more exposed than Naoussa → Xinomavro gives lighter body and lower tannins → fresher, more elegant reds."},{"id":"AMYNTEO-R05","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Sandy soils and old vines → concentrated wines despite the lighter structure."}],"checks":[{"kp":"AMYNTEO-R04","type":"explain","prompt":"Starting from “Cooler, higher and more exposed than Naoussa”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Xinomavro gives lighter body and lower tannins","fresher, more elegant reds"]},{"kp":"AMYNTEO-R05","type":"explain","prompt":"Starting from “Sandy soils and old vines”, explain what this leads to — through to the resulting wine style.","requiredPoints":["concentrated wines despite the lighter structure"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Old, phylloxera-free, ungrafted bush vines on sand give concentration.","Lakeside humidity is managed through site selection and yield control.","100% Xinomavro for the PDO.","Reds and rosé (still and sparkling) are made; quality reaches Q:2–3(4) (e.g. Alpha Estate).","Some Xinomavro–Merlot blends are made outside the PDO."],"kkps":[{"id":"AMYNTEO-F06","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"It is cooler, higher and more exposed → lighter-bodied, lower-tannin, fresher reds; rosé and sparkling are also permitted (unlike red-only Naoussa)."},{"id":"AMYNTEO-F07","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Rosé (still and sparkling) from Xinomavro."}],"checks":[{"kp":"AMYNTEO-F06","type":"flash","question":"How does Amyndeon Xinomavro differ from Naoussa?","answer":"It is cooler, higher and more exposed → lighter-bodied, lower-tannin, fresher reds; rosé and sparkling are also permitted (unlike red-only Naoussa)."},{"kp":"AMYNTEO-F07","type":"flash","question":"What styles are permitted in PDO Amyndeon that Naoussa forbids?","answer":"Rosé (still and sparkling) from Xinomavro."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["PDO Amyndeon is 100% Xinomavro; rosé is permitted (unlike Naoussa).","Higher altitude and south-facing slopes elsewhere help ripening."],"kkps":[],"checks":[]}],"blind":[{"id":"AMYNTEO-BLIND-1","tastingProfile":"Red wine. Pale to medium ruby with quick garnet tinge. Pronounced red cherry, tomato, dried herb and olive with savoury, earthy notes. Dry, high acidity, high tannin, medium alcohol, medium body, long finish.","deduce":["Grape: Xinomavro","Climate: cool","Region: Amyndeon (Amynteo), Greece"],"justifyWith":["Pale colour + high acid + high tannin + tomato/dried-herb notes → Xinomavro","Lighter body and fresher, more elegant structure → cool, high-altitude exposed site","Savoury red-fruited style cooler than Naoussa → Amyndeon"]}],"quiz":[{"id":"amynteo-Q1","kp":"AMYNTEO-F01","question":"Why does Amyndeon retain large stocks of ungrafted old vines?","correctAnswer":"Its sandy soils are phylloxera-free","distractors":["Strict laws ban grafted rootstock","Its high altitude kills the phylloxera louse","The vines are too young to need grafting"]},{"id":"amynteo-Q2","kp":"AMYNTEO-F06","question":"How does Amyndeon's Xinomavro differ from that of neighbouring Naoussa?","correctAnswer":"Cooler, higher and more exposed, it gives lighter-bodied, lower-tannin, fresher reds","distractors":["Warmer and lower, it gives bigger, more tannic reds","It is always sweet rather than dry","It is much higher in alcohol and colour"]},{"id":"amynteo-Q3","kp":"AMYNTEO-F07","question":"Which style, not permitted in red-only Naoussa, is allowed in Amyndeon from Xinomavro?","correctAnswer":"Rosé (still and sparkling)","distractors":["Fortified sweet wine","White wine","Oxidative flor-aged wine"]},{"id":"amynteo-Q4","kp":"AMYNTEO-R02","question":"What gives Amyndeon its cool summers and cold winters?","correctAnswer":"A northerly aspect exposing it to cold northerly winds","distractors":["Adjacency to the Atlantic Ocean","A coastal fog belt","A low, sheltered valley floor"]}]},{"id":"nemea","title":"Nemea","alt":"Greece · Peloponnese · Agiorgitiko","country":"Greece","flag":"🇬🇷","blurb":"The Peloponnese's red flagship — versatile Agiorgitiko, from juicy and fruity to structured and age-worthy across three altitude zones.","source":"4__ItalyGreece.pdf","climate":{"label":"Warm Mediterranean (altitude-tiered)","scores":{"warmth":4,"sun":5,"rain":2,"diurnal":4,"risk":3}},"style":{"red":100},"grapes":[{"name":"Agiorgitiko","color":"r","pct":100}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["In the Peloponnese, near the Corinth Canal; a Mediterranean climate with marked vintage variation.","Rainfall (400–900 mm) falls in autumn and winter, helping retain acidity, but varies a lot year to year.","Three distinct zones by altitude define style.","Drought is a hazard in dry years, where clay soils perform better."],"kkps":[{"id":"NEMEA-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Hot valley floor (230–400 m) → soft, full-bodied high-volume reds; cool middle zone (450–650 m) → the best quality; highest zone (650–1,000 m) → grapes struggle to ripen, giving fresh, high-acid wines mainly for rosé."}],"checks":[{"kp":"NEMEA-F01","type":"flash","question":"How does altitude shape Nemea's Agiorgitiko?","answer":"Hot valley floor (230–400 m) → soft, full-bodied high-volume reds; cool middle zone (450–650 m) → the best quality; highest zone (650–1,000 m) → grapes struggle to ripen, giving fresh, high-acid wines mainly for rosé."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Hot, fertile valley floor (230–400 m, summers reaching 40°C) → Agiorgitiko ripens fully → soft, full-bodied P:1 reds (and high-quality sweet wine).","Cooler middle zone (450–650 m) on poor, free-draining soils → slow sugar accumulation while flavours and tannins ripen → the best quality wines.","Highest zone (650–1,000 m) with cool clay → Agiorgitiko struggles to ripen fully → fresh red fruit, high acidity and potentially harsh tannins; mainly rosé.","Agiorgitiko gives deeply coloured wines with soft, medium acidity, medium-to-high soft tannins and ripe red fruit with sweet spice."],"kkps":[{"id":"NEMEA-F02","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Deeply coloured, soft medium acidity, medium-to-high soft tannins, ripe red fruit and sweet spice — versatile from juicy to age-worthy."},{"id":"NEMEA-R03","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Hot, fertile valley floor (230–400 m, summers reaching 40°C) → Agiorgitiko ripens fully → soft, full-bodied P:1 reds (and high-quality sweet wine)."},{"id":"NEMEA-R04","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Cooler middle zone (450–650 m) on poor, free-draining soils → slow sugar accumulation while flavours and tannins ripen → the best quality wines."},{"id":"NEMEA-R05","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Highest zone (650–1,000 m) with cool clay → Agiorgitiko struggles to ripen fully → fresh red fruit, high acidity and potentially harsh tannins; mainly rosé."}],"checks":[{"kp":"NEMEA-F02","type":"flash","question":"What is Agiorgitiko's typical profile?","answer":"Deeply coloured, soft medium acidity, medium-to-high soft tannins, ripe red fruit and sweet spice — versatile from juicy to age-worthy."},{"kp":"NEMEA-R03","type":"explain","prompt":"Starting from “Hot, fertile valley floor (230–400 m, summers reaching 40°C)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Agiorgitiko ripens fully","soft, full-bodied P:1 reds (and high-quality sweet wine)"]},{"kp":"NEMEA-R04","type":"explain","prompt":"Starting from “Cooler middle zone (450–650 m) on poor, free-draining soils”, explain what this leads to — through to the resulting wine style.","requiredPoints":["slow sugar accumulation while flavours and tannins ripen","the best quality wines"]},{"kp":"NEMEA-R05","type":"explain","prompt":"Starting from “Highest zone (650–1,000 m) with cool clay”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Agiorgitiko struggles to ripen fully","fresh red fruit, high acidity and potentially harsh tannins; mainly rosé"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Very low yields are typical for quality wine.","Clay soils help buffer drought in dry years.","Altitude is the key lever for style and quality.","A new semi-carbonic maceration style enhances fruit and keeps tannin low; premium versions are oaked.","1990s new French barriques have given way to subtler oak.","Quality spans Q:1–4 (e.g. Gaia Wines)."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["PDO Nemea is red only and 100% Agiorgitiko; dry and (rarely) sweet are permitted.","Higher-altitude, fresher styles often sit outside the PDO."],"kkps":[{"id":"NEMEA-F06","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"100% Agiorgitiko, red only (dry and rarely sweet)."}],"checks":[{"kp":"NEMEA-F06","type":"flash","question":"What is the grape rule for PDO Nemea?","answer":"100% Agiorgitiko, red only (dry and rarely sweet)."}]}],"blind":[{"id":"NEMEA-BLIND-1","tastingProfile":"Red wine. Deep ruby. Medium-plus intensity ripe red and black plum, red cherry, sweet baking spice with vanilla oak. Dry, medium acidity, medium-plus soft tannins, medium-plus alcohol, medium-plus body, medium-plus finish.","deduce":["Grape: Agiorgitiko","Climate: warm","Region: Nemea (Peloponnese, Greece)"],"justifyWith":["Deep colour with soft medium acidity and soft tannins → Agiorgitiko","Ripe red fruit and sweet spice without harsh structure → warm Mediterranean ripening","Balanced ripeness with freshness retained → altitude-tiered Nemea"]}],"quiz":[{"id":"nemea-Q1","kp":"NEMEA-F06","question":"Which grape is Nemea made from?","correctAnswer":"100% Agiorgitiko, red only","distractors":["100% Xinomavro","100% Assyrtiko","A blend of Agiorgitiko and Cabernet Sauvignon"]},{"id":"nemea-Q2","kp":"NEMEA-F02","question":"Which describes the typical character of Agiorgitiko from Nemea?","correctAnswer":"Deeply coloured, soft medium acidity, medium-to-high soft tannins, ripe red fruit and sweet spice","distractors":["Pale, very high acid, high harsh tannins and tart red fruit","Light-bodied with floral notes and low tannin","Oxidative and nutty with high acidity"]},{"id":"nemea-Q3","kp":"NEMEA-R04","question":"Which altitude zone of Nemea is considered to give the best-quality wines?","correctAnswer":"The cooler middle zone (450–650 m) on poor, free-draining soils","distractors":["The hot valley floor (230–400 m)","The highest zone (650–1,000 m)","Coastal sites near sea level"]},{"id":"nemea-Q4","kp":"NEMEA-R05","question":"What is the highest zone of Nemea (650–1,000 m) mainly used for?","correctAnswer":"Rosé, as Agiorgitiko struggles to ripen fully, giving fresh, high-acid wines","distractors":["Full-bodied, age-worthy reds","Sweet fortified wine","Sparkling wine"]}]},{"id":"mantinia","title":"Mantinia","alt":"Greece · Peloponnese · aromatic Moschofilero","country":"Greece","flag":"🇬🇷","blurb":"A cool, high-plateau white region — floral, spicy, high-acid Moschofilero made fresh for early drinking.","source":"4__ItalyGreece.pdf","climate":{"label":"Cool continental (high plateau)","scores":{"warmth":2,"sun":4,"rain":3,"diurnal":4,"risk":3}},"style":{"white":100},"grapes":[{"name":"Moschofilero","color":"w","pct":100}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A high plateau in the Peloponnese, south-west of Nemea, with elevations starting at 600 m.","One of the coolest regions with one of the longest growing seasons — harvest can start in October or even November.","The altitude is the defining cooling influence.","A PDO for white wine only."],"kkps":[{"id":"MANTINIA-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Its cool, high (600 m+) plateau and long growing season let the pink-skinned grape keep high acidity while developing intense floral, spicy aromatics → light, fresh whites."}],"checks":[{"kp":"MANTINIA-F01","type":"flash","question":"Why is Mantinia Moschofilero so aromatic and high in acid?","answer":"Its cool, high (600 m+) plateau and long growing season let the pink-skinned grape keep high acidity while developing intense floral, spicy aromatics → light, fresh whites."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool, high-altitude conditions → the pink-skinned Moschofilero keeps high acidity → light-bodied, low-to-medium-alcohol whites that are floral (rose petal) and slightly spicy.","The long, cool growing season builds aromatic intensity while preserving freshness.","Wines are fermented in stainless steel to retain freshness and drunk young.","Extended skin contact can also produce an aromatic rosé from the pink berries."],"kkps":[{"id":"MANTINIA-R02","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Cool, high-altitude conditions → the pink-skinned Moschofilero keeps high acidity → light-bodied, low-to-medium-alcohol whites that are floral (rose petal) and slightly spicy."}],"checks":[{"kp":"MANTINIA-R02","type":"explain","prompt":"Starting from “Cool, high-altitude conditions”, explain what this leads to — through to the resulting wine style.","requiredPoints":["the pink-skinned Moschofilero keeps high acidity","light-bodied, low-to-medium-alcohol whites that are floral (rose petal) and slightly spicy"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["High altitude gives the cool temperatures and long hang time behind the aromatics.","Moschofilero is pink-skinned, so careful handling preserves its perfume.","Quality reaches Q:2–3 (e.g. Boutari).","Fermented cool in stainless steel and released young to keep aromatic freshness.","Low to medium alcohol (~12%) is typical."],"kkps":[{"id":"MANTINIA-F03","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Cool-fermented in stainless steel and drunk young to preserve its rose-petal, spicy freshness."}],"checks":[{"kp":"MANTINIA-F03","type":"flash","question":"How is Mantinia made and consumed?","answer":"Cool-fermented in stainless steel and drunk young to preserve its rose-petal, spicy freshness."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["PDO Mantinia is white only; Moschofilero must be ≥85% (top wines are 100%).","The cool plateau gives high acidity and floral, spicy character."],"kkps":[{"id":"MANTINIA-F04","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"White only, Moschofilero ≥85% (top wines 100%)."}],"checks":[{"kp":"MANTINIA-F04","type":"flash","question":"What is the grape requirement for PDO Mantinia?","answer":"White only, Moschofilero ≥85% (top wines 100%)."}]}],"blind":[{"id":"MANTINIA-BLIND-1","tastingProfile":"White wine. Pale lemon, sometimes with a faint pink/copper tinge. Pronounced rose petal, orange blossom, white peach and a gentle spicy note; no oak. Dry, high acidity, low-to-medium alcohol, light body, medium finish.","deduce":["Grape: Moschofilero","Climate: cool","Region: Mantinia (Peloponnese, Greece)"],"justifyWith":["Pronounced rose petal and spice from a pink-skinned grape → Moschofilero","High acidity, light body and low-to-medium alcohol → cool, high-altitude plateau","Fresh, unoaked, drink-young style → Mantinia stainless-steel fermentation"]}],"quiz":[{"id":"mantinia-Q1","kp":"MANTINIA-F04","question":"From which grape must Mantinia be made?","correctAnswer":"Moschofilero (at least 85%; top wines 100%)","distractors":["Assyrtiko (100%)","Savatiano (at least 85%)","Roditis (100%)"]},{"id":"mantinia-Q2","kp":"MANTINIA-F01","question":"How does Mantinia's cool, high plateau shape its wines?","correctAnswer":"The pink-skinned grape keeps high acidity while developing intense floral, spicy aromatics, giving light, fresh whites","distractors":["Heat gives full-bodied, low-acid, oaky whites","Lake humidity gives botrytis sweet wines","Drought gives concentrated, raisined wines"]},{"id":"mantinia-Q3","kp":"MANTINIA-F03","question":"How is Mantinia typically vinified?","correctAnswer":"Cool-fermented in stainless steel and drunk young to preserve rose-petal, spicy freshness","distractors":["Aged for years in American oak","Fortified and aged under flor","Macerated on skins to make orange wine"]},{"id":"mantinia-Q4","kp":"MANTINIA-R02","question":"What flavour and body profile defines Mantinia Moschofilero?","correctAnswer":"Light-bodied, low-to-medium-alcohol, floral (rose petal) and slightly spicy","distractors":["Full-bodied, high-alcohol and tropical","Tannic and deeply coloured","Neutral and oxidative"]}]},{"id":"santorini","title":"Santorini","alt":"Greece · Aegean island · volcanic Assyrtiko","country":"Greece","flag":"🇬🇷","blurb":"A windswept volcanic island producing the world's most distinctively saline, smoky, high-acid Assyrtiko, plus sweet sun-dried Vinsanto.","source":"4__ItalyGreece.pdf","climate":{"label":"Hot, dry, windy Mediterranean (volcanic)","scores":{"warmth":5,"sun":5,"rain":1,"diurnal":3,"risk":4}},"style":{"white":100},"grapes":[{"name":"Assyrtiko","color":"w","pct":80},{"name":"Athiri & Aidani","color":"w","pct":20}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A volcano in the southern Aegean; the present island is the eastern rim of a caldera left by a massive eruption around 1500 BCE.","A Mediterranean climate with very strong sun (vines need shading), very little rain, and strong winds.","The growing season is essentially dry → the only moisture comes from morning fog rising off the caldera.","Volcanic, very infertile, free-draining rocky and sandy soils — and phylloxera-free, with some vines over 400 years old."],"kkps":[{"id":"SANTORINI-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Assyrtiko uniquely retains high acidity even in hot conditions → on bone-dry, sunny, volcanic Santorini it gives high-alcohol, high-acid dry whites with a smoky, saline character."},{"id":"SANTORINI-F02","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"To trap the only moisture (morning caldera fog) and shelter the fruit from fierce wind and sun."},{"id":"SANTORINI-F03","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Its soils are phylloxera-free → ungrafted vines survive for centuries."},{"id":"SANTORINI-R04","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"The growing season is essentially dry → the only moisture comes from morning fog rising off the caldera."}],"checks":[{"kp":"SANTORINI-F01","type":"flash","question":"Why does Santorini Assyrtiko keep high acidity despite the heat?","answer":"Assyrtiko uniquely retains high acidity even in hot conditions → on bone-dry, sunny, volcanic Santorini it gives high-alcohol, high-acid dry whites with a smoky, saline character."},{"kp":"SANTORINI-F02","type":"flash","question":"Why are vines trained in a low basket (kouloura) on Santorini?","answer":"To trap the only moisture (morning caldera fog) and shelter the fruit from fierce wind and sun."},{"kp":"SANTORINI-F03","type":"flash","question":"Why can Santorini have 400-year-old vines?","answer":"Its soils are phylloxera-free → ungrafted vines survive for centuries."},{"kp":"SANTORINI-R04","type":"explain","prompt":"Starting from “The growing season is essentially dry”, explain what this leads to — through to the resulting wine style.","requiredPoints":["the only moisture comes from morning fog rising off the caldera"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Hot, sunny, bone-dry volcanic conditions → Assyrtiko ripens to high sugar yet, unusually, keeps high acidity even in the heat → high-alcohol, high-acid dry whites with a distinctive smoky, flinty, saline character.","The dry, fruity wines age a decade, developing honeyed, toasty notes.","Sun-dried Assyrtiko → Vinsanto, an oxidative sweet wine of raisin, coffee and chocolate, aged over 2 years in oak.","Assyrtiko is highly adaptable and structured (made unoaked, oaked or in amphora)."],"kkps":[{"id":"SANTORINI-R05","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Hot, sunny, bone-dry volcanic conditions → Assyrtiko ripens to high sugar yet, unusually, keeps high acidity even in the heat → high-alcohol, high-acid dry whites with a distinctive smoky, flinty, saline character."},{"id":"SANTORINI-R06","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Sun-dried Assyrtiko → Vinsanto, an oxidative sweet wine of raisin, coffee and chocolate, aged over 2 years in oak."}],"checks":[{"kp":"SANTORINI-R05","type":"explain","prompt":"Starting from “Hot, sunny, bone-dry volcanic conditions”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Assyrtiko ripens to high sugar yet, unusually, keeps high acidity even in the heat","high-alcohol, high-acid dry whites with a distinctive smoky, flinty, saline character"]},{"kp":"SANTORINI-R06","type":"explain","prompt":"Starting from “Sun-dried Assyrtiko”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Vinsanto, an oxidative sweet wine of raisin, coffee and chocolate, aged over 2 years in oak"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Vines are trained low in a woven basket shape (kouloura), in a hollow, to trap caldera moisture and shelter the fruit from wind and sun.","Every ~20 years an overgrown basket is cut back and re-started from a shoot (labour-intensive).","Phylloxera-free soils support ungrafted, very old, low-density, low-yielding vines → PDO Santorini has Greece's lowest maximum yield.","Dry wines are fermented cool in stainless steel or neutral vessels to retain fruit; oak and lees are increasingly used.","Vinsanto is made from grapes sun-dried ~2 weeks, then aged oxidatively in oak >2 years.","Quality reaches Q:2–4."],"kkps":[{"id":"SANTORINI-F07","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Santorini's sweet wine — sun-dried Assyrtiko (≥51%) fermented and aged oxidatively in oak >2 years, giving raisin, coffee and chocolate notes."},{"id":"SANTORINI-R08","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Phylloxera-free soils support ungrafted, very old, low-density, low-yielding vines → PDO Santorini has Greece's lowest maximum yield."}],"checks":[{"kp":"SANTORINI-F07","type":"flash","question":"What is Vinsanto and how is it made?","answer":"Santorini's sweet wine — sun-dried Assyrtiko (≥51%) fermented and aged oxidatively in oak >2 years, giving raisin, coffee and chocolate notes."},{"kp":"SANTORINI-R08","type":"explain","prompt":"Starting from “Phylloxera-free soils support ungrafted, very old, low-density, low-yielding vines”, explain what this leads to — through to the resulting wine style.","requiredPoints":["PDO Santorini has Greece's lowest maximum yield"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["PDO Santorini is white only; dry wines must be ≥75% Assyrtiko, sweet (Vinsanto) ≥51% Assyrtiko.","Very low yields (as little as 15 hL/ha from the oldest vines) concentrate the wines."],"kkps":[{"id":"SANTORINI-F09","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"White only, ≥75% Assyrtiko."}],"checks":[{"kp":"SANTORINI-F09","type":"flash","question":"What is the grape rule for dry PDO Santorini?","answer":"White only, ≥75% Assyrtiko."}]}],"blind":[{"id":"SANTORINI-BLIND-1","tastingProfile":"White wine. Medium lemon. Pronounced lemon, lime, white peach with a smoky, flinty, saline minerality; little or no oak. Dry, high acidity, high alcohol, medium-to-full body, long finish.","deduce":["Grape: Assyrtiko","Climate: hot","Region: Santorini (Greece)"],"justifyWith":["High acidity together with high alcohol → Assyrtiko, which holds acid in heat","Smoky, flinty, saline character → volcanic Santorini soils and maritime setting","Full body and high alcohol → hot, sunny, bone-dry climate driving high sugar"]}],"quiz":[{"id":"santorini-Q1","kp":"SANTORINI-F09","question":"What does PDO Santorini require for its dry white wines?","correctAnswer":"White only, at least 75% Assyrtiko","distractors":["Red or white, 50% Assyrtiko","White only, 100% Athiri","White only, at least 60% Aidani"]},{"id":"santorini-Q2","kp":"SANTORINI-F02","question":"Why are Santorini's vines trained into low basket shapes (kouloura)?","correctAnswer":"To trap morning caldera fog and shelter fruit from fierce wind and sun","distractors":["To maximise sun exposure on the canopy","To allow mechanical harvesting","To raise the fruit above flood level"]},{"id":"santorini-Q3","kp":"SANTORINI-F03","question":"Why do Santorini's vines survive ungrafted for centuries?","correctAnswer":"Its volcanic soils are phylloxera-free","distractors":["The climate is too hot for phylloxera","All vines are replanted every decade","Strict quarantine keeps the louse out"]},{"id":"santorini-Q4","kp":"SANTORINI-R05","question":"What makes Assyrtiko unusual in Santorini's hot, sunny climate?","correctAnswer":"It keeps high acidity even in the heat, giving high-alcohol, high-acid smoky, saline whites","distractors":["It loses all acidity, giving flat, low-acid wines","It only ripens to low sugar and low alcohol","It must be picked under-ripe to keep freshness"]}]}]/*__END__*/;

let _gid=0;
function glass(pct,w){
  const id='gl'+(_gid++); const h=w*1.36;
  // bowl interior spans y≈20 (rim) to y≈64 (base of bowl); fill from bottom up
  const top=64-(pct/100)*44;
  const bowl="M16 20 C16 46 28 62 40 62 C52 62 64 46 64 20 Z";
  return `<svg viewBox="0 0 80 108" width="${w}" height="${h}" aria-label="${pct}% filled" role="img">
    <defs><clipPath id="${id}"><path d="${bowl}"/></clipPath></defs>
    <rect x="14" y="${top}" width="52" height="60" fill="url(#garnetGrad)" clip-path="url(#${id})"/>
    <path d="${bowl}" fill="none" stroke="var(--gold)" stroke-width="1.6"/>
    <line x1="40" y1="62" x2="40" y2="94" stroke="var(--gold)" stroke-width="1.6"/>
    <line x1="26" y1="98" x2="54" y2="98" stroke="var(--gold)" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="40" cy="20" rx="24" ry="3.4" fill="none" stroke="var(--gold)" stroke-width="1.6"/>
  </svg>`;
}
function polar(cx,cy,r,a){const rad=(a-90)*Math.PI/180;return [cx+r*Math.cos(rad),cy+r*Math.sin(rad)];}

const RADAR_AX=[['warmth','Warmth'],['sun','Sun'],['rain','Rain'],['diurnal','Diurnal'],['risk','Risk']];
function radar(scores){
  if(!scores)return '';
  const cx=100,cy=96,R=66,N=5;
  let grid='';
  for(let ring=1;ring<=5;ring++){
    let pts=[];
    for(let i=0;i<N;i++){const[x,y]=polar(cx,cy,R*ring/5,i*360/N);pts.push(x.toFixed(1)+','+y.toFixed(1));}
    grid+=`<polygon points="${pts.join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }
  let axes='',labels='',valpts=[];
  RADAR_AX.forEach((ax,i)=>{
    const[x,y]=polar(cx,cy,R,i*360/N); axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    const v=scores[ax[0]]||0; const[vx,vy]=polar(cx,cy,R*v/5,i*360/N); valpts.push(vx.toFixed(1)+','+vy.toFixed(1));
    const[lx,ly]=polar(cx,cy,R+15,i*360/N);
    labels+=`<text x="${lx}" y="${ly}" font-family="var(--mono)" font-size="9" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle" style="text-transform:uppercase;letter-spacing:.06em">${ax[1]}</text>`;
  });
  return `<svg viewBox="0 0 200 192" width="100%" role="img" aria-label="climate fingerprint">
    ${grid}${axes}
    <polygon points="${valpts.join(' ')}" fill="rgba(202,166,75,.22)" stroke="var(--gold)" stroke-width="2"/>
    ${valpts.map(p=>{const[x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="2.4" fill="var(--gold-l)"/>`}).join('')}
    ${labels}</svg>`;
}

const GOLDS=['#caa64b','#e6d7a0','#b8923a','#d9c27a','#9c7c2e','#f0e4b8'];
const REDS=['#8a2540','#c0566e','#6e1d33','#a83b56','#d98a9c','#5a1628'];
function donut(grapes){
  if(!grapes||!grapes.length)return '';
  const whites=grapes.filter(g=>g.color==='w').slice().sort((a,b)=>b.pct-a.pct);
  const reds=grapes.filter(g=>g.color!=='w').slice().sort((a,b)=>b.pct-a.pct);
  let gi=0,ri=0; const sl=[];
  whites.forEach(g=>sl.push({...g,c:GOLDS[gi++%GOLDS.length]}));
  reds.forEach(g=>sl.push({...g,c:REDS[ri++%REDS.length]}));
  const tot=sl.reduce((s,x)=>s+x.pct,0)||1; const cx=100,cy=100,R=86,r=52; let ang=0,paths='';
  sl.forEach(s=>{
    const a0=ang,a1=ang+s.pct/tot*360;ang=a1;
    const[x0,y0]=polar(cx,cy,R,a0),[x1,y1]=polar(cx,cy,R,a1);
    const[xi1,yi1]=polar(cx,cy,r,a1),[xi0,yi0]=polar(cx,cy,r,a0);
    const lg=(a1-a0)>180?1:0;
    paths+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${lg} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L${xi1.toFixed(1)} ${yi1.toFixed(1)} A${r} ${r} 0 ${lg} 0 ${xi0.toFixed(1)} ${yi0.toFixed(1)} Z" fill="${s.c}" stroke="var(--panel)" stroke-width="1.4"/>`;
  });
  const leg=sl.map(s=>`<span><span class="dot" style="background:${s.c}"></span>${s.name} ${s.pct}%</span>`).join('');
  return `<svg viewBox="0 0 200 200" width="84%" style="max-width:170px" role="img" aria-label="grape blend">${paths}</svg><div class="legend">${leg}</div>`;
}

const STYLE_LBL={red:'Red',white:'White',rose:'Rosé',sparkling:'Sparkling',sweet:'Sweet'};
function styleBar(st){
  if(!st)return '';
  const keys=Object.keys(st).filter(k=>st[k]>0);

  return `<div style="display:flex;height:22px;border-radius:7px;overflow:hidden;border:1px solid var(--line)">${bar}</div><div class="legend">${leg}</div>`;
}

/* ============================ QUEUE BUILDER ============================ */
function inScope(kpId,scope){
  const k=KKP[kpId];
  if(scope.type==='all')return true;
  if(scope.type==='country')return k.country===scope.name;
  if(scope.type==='topic')return k.topic===scope.topic;
  if(scope.type==='weak')return getState(kpId)<2;
  return true;
}
function buildQueue(mode,scope){
  let items=[];
  // blind handled separately (per topic, not per KKP)
  if(mode==='blind'){
    TOPICS.forEach(t=>{ if(scope.type==='country'&&t.country!==scope.name)return; if(scope.type==='topic'&&t.id!==scope.topic)return;
      (t.blind||[]).forEach(b=>items.push({kind:'blind',topic:t.id,topicTitle:t.title,data:b})); });
    return shuffle(items);
  }
  if(mode==='mcq'){
    TOPICS.forEach(t=>{ if(scope.type==='country'&&t.country!==scope.name)return; if(scope.type==='topic'&&t.id!==scope.topic)return;
      (t.quiz||[]).forEach(q=>{ if(scope.type==='weak'&&getState(q.kp)>=2)return; items.push({kind:'mcq',kp:q.kp,topicTitle:t.title,check:q}); }); });
    ALL_KKP.forEach(id=>{ if(!inScope(id,scope))return; const c=CHECK[id]; if(c&&c.type==='mcq')items.push({kind:'mcq',kp:id,check:c}); });
    return shuffle(items);
  }
  ALL_KKP.forEach(id=>{
    if(!inScope(id,scope))return;
    const c=CHECK[id]; if(!c)return;
    if(mode==='mixed'){ if(c.type==='blind')return; items.push({kind:c.type,kp:id,check:c}); }
    else if(mode===c.type){ items.push({kind:c.type,kp:id,check:c}); }
    else if(mode==='flash'&&c.type==='flash'){items.push({kind:'flash',kp:id,check:c});}
  });
  // weak scope: order weakest first; else shuffle
  if(scope.type==='weak')items.sort((a,b)=>getState(a.kp)-getState(b.kp));
  else items=shuffle(items);
  return items;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============================ MAP (Portugal) ============================ */
let mapCountry='France', mapSel=null, _map=null, _mapNameMarker=null, _regionMarkers=[];
const MAP_ORDER=['France','Italy','Spain','Portugal','Germany, Austria & Hungary','Greece','Australia','New Zealand','United States','Chile','Argentina','South Africa','Canada','China'];
const MAP_SHORT={'France':'France','Italy':'Italy','Spain':'Spain','Portugal':'Portugal','Germany, Austria & Hungary':'Germany +','Greece':'Greece','Australia':'Australia','New Zealand':'New Zealand','United States':'USA','Chile':'Chile','Argentina':'Argentina','South Africa':'S. Africa','Canada':'Canada','China':'China'};
const STATE_FILL=['#3a4150','#3f82c4','#caa64b','#7faa55'];
function countryFlag(c){const t=TOPICS.find(x=>x.country===c);return t?t.flag:'';}
function mapCountryRegions(c){return TOPICS.filter(t=>t.country===c && MAPPTS[t.id]).map(t=>t.id);}
function topicStateNum(t){const p=fillPct(topicKKPs(t));return p>=100?3:p>=50?2:p>0?1:0;}
function circleRing(lng,lat,km,n){n=n||56;const ring=[];const dLat=km/110.574;const dLng=km/(111.320*Math.cos(lat*Math.PI/180));
  for(let i=0;i<=n;i++){const a=2*Math.PI*i/n;ring.push([lng+dLng*Math.sin(a),lat+dLat*Math.cos(a)]);}return ring;}
const REGION_ORDER=MAP_ORDER.reduce((a,c)=>a.concat(mapCountryRegions(c)),[]);
// Colour each region's AREA by its CLIMATE (cool -> hot), so climate reads at a glance.
const CLIMATE_SCALE=['#3f82c4','#5fa3a3','#9bbf5a','#d98a4f','#b5354f']; // 1 cool ... 5 hot
function regionWarmth(id){const t=BY_ID[id];const w=t&&t.climate&&t.climate.scores?t.climate.scores.warmth:3;return Math.max(1,Math.min(5,Math.round(w||3)));}
function climateColor(id){return CLIMATE_SCALE[regionWarmth(id)-1];}
const CLIMATE_LEGEND=[['Cool',CLIMATE_SCALE[0]],['',CLIMATE_SCALE[1]],['Moderate',CLIMATE_SCALE[2]],['',CLIMATE_SCALE[3]],['Hot',CLIMATE_SCALE[4]]];
function mapAllFeatures(){const f=[];REGION_ORDER.forEach(id=>{const p=MAPPTS[id];const t=BY_ID[id];
  f.push({type:'Feature',properties:{id:id,name:p.name||(t&&t.title)||id,color:climateColor(id),warmth:regionWarmth(id),state:topicStateNum(t),country:t&&t.country},geometry:{type:'Polygon',coordinates:[circleRing(p.lng,p.lat,p.km||20)]}});});
  return {type:'FeatureCollection',features:f};}
function mapAllCenters(){return {type:'FeatureCollection',features:REGION_ORDER.map(id=>{const p=MAPPTS[id];const t=BY_ID[id];
  return {type:'Feature',properties:{id:id,name:p.name||(t&&t.title)||id,country:t&&t.country,color:climateColor(id),km:p.km||20,state:topicStateNum(t)},geometry:{type:'Point',coordinates:[p.lng,p.lat]}};})};}
function allBounds(){let mnx=180,mny=90,mxx=-180,mxy=-90;REGION_ORDER.forEach(id=>{const p=MAPPTS[id];mnx=Math.min(mnx,p.lng);mxx=Math.max(mxx,p.lng);mny=Math.min(mny,p.lat);mxy=Math.max(mxy,p.lat);});return [[mnx-2,mny-2],[mxx+2,mxy+2]];}
function countryBounds(country){const ids=mapCountryRegions(country);let mnx=180,mny=90,mxx=-180,mxy=-90;
  ids.forEach(id=>{const p=MAPPTS[id];const d=(p.km||20)/100;mnx=Math.min(mnx,p.lng-d*1.4);mxx=Math.max(mxx,p.lng+d*1.4);mny=Math.min(mny,p.lat-d);mxy=Math.max(mxy,p.lat+d);});
  return [[mnx,mny],[mxx,mxy]];}

function viewMap(){
  const countries=MAP_ORDER.filter(c=>mapCountryRegions(c).length);
  if(!mapCountryRegions(mapCountry).length) mapCountry=countries[0];
  const regs=mapCountryRegions(mapCountry);
  if(!regs.includes(mapSel)) mapSel=regs[0];
  const chips=countries.map(c=>`<button class="mapchip ${c===mapCountry?'on':''}" data-mapcountry="${esc(c)}"><span class="cf">${countryFlag(c)}</span>${esc(MAP_SHORT[c]||c)}</button>`).join('');
  const regionChips=regs.map(id=>`<button class="rgchip ${id===mapSel?'on':''}" data-mapsel="${id}">${esc(MAPPTS[id].name||BY_ID[id].title)}</button>`).join('');
  return `<div class="view">
   <div class="top"><div class="brand"><span><h1 style="font-size:26px">Wine Map</h1><div class="sub">Regions on a live map</div></span></div></div>
   <div class="mapchips">${chips}</div>
   <div id="maptab" class="maptab"><div class="mapload">Loading map…</div></div>
   <div class="maplegend"><span class="mll">Climate</span>${CLIMATE_LEGEND.map(([lab,col])=>`<span class="mls" style="background:${col}"></span>${lab?`<span class="mlt">${lab}</span>`:''}`).join('')}</div>
   <div class="maphint">Pick a country to see <b>all its regions</b> as coloured areas — colour shows climate (cool→hot). Tap an area or chip to highlight &amp; centre it. <span style="color:var(--muted)">Shaded areas are approximate extents.</span></div>
   <div class="rgchips">${regionChips}</div>
   <div id="mapdetail" class="mapinfo">${mapDetailHTML()}</div>
  </div>`;
}
function mapDetailHTML(){
  const t=BY_ID[mapSel]; if(!t) return '';
  const grapes=(t.grapes&&t.grapes.length)?t.grapes:[];
  const donutEl=grapes.length?donut(grapes):'<div class="empty" style="padding:18px">Grape breakdown not available for this region.</div>';
  const clim=t.climate&&t.climate.label?t.climate.label:''; const p=fillPct(topicKKPs(t));
  return `<div class="sec-h" style="margin-top:12px"><div class="blend-h">${esc(t.title)}</div><span class="link" data-topic="${t.id}">Open topic →</span></div>
    ${clim?`<div class="mapclim"><span class="mb">${esc(clim)}</span><span class="mapfill">${p}% mastered</span></div>`:''}
    <div class="chartbox" style="text-align:center">${donutEl}</div>`;
}
function refreshMapDetail(){const d=document.getElementById('mapdetail'); if(d) d.innerHTML=mapDetailHTML();
  document.querySelectorAll('#mapdetail [data-topic]').forEach(b=>b.onclick=()=>nav('topic',{id:b.dataset.topic}));}
function setMapChips(){
  document.querySelectorAll('[data-mapcountry]').forEach(b=>b.classList.toggle('on',b.dataset.mapcountry===mapCountry));
  document.querySelectorAll('[data-mapsel]').forEach(b=>b.classList.toggle('on',b.dataset.mapsel===mapSel));}
function renderRegionMarkers(){
  if(!_map) return;
  // remove any previous markers
  _regionMarkers.forEach(m=>{try{m.remove();}catch(e){}}); _regionMarkers=[];
  mapCountryRegions(mapCountry).forEach(id=>{
    const p=MAPPTS[id]; if(!p) return;
    const sel=(id===mapSel);
    const el=document.createElement('div');
    el.className='rgmark'+(sel?' sel':'');
    el.innerHTML='<span class="rgdot" style="background:'+climateColor(id)+'"></span><span class="rglabel">'+esc(p.name||(BY_ID[id]||{}).title||id)+'</span>';
    el.addEventListener('click',function(ev){ ev.stopPropagation(); selectMapRegion(id,true); });
    try{ _regionMarkers.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([p.lng,p.lat]).addTo(_map)); }catch(e){}
  });
}
function rebuildRegionChips(){
  const regs=mapCountryRegions(mapCountry);
  const rc=document.querySelector('.rgchips');
  if(rc){ rc.innerHTML=regs.map(id=>`<button class="rgchip ${id===mapSel?'on':''}" data-mapsel="${id}">${esc(MAPPTS[id].name||BY_ID[id].title)}</button>`).join('');
    rc.querySelectorAll('[data-mapsel]').forEach(b=>b.onclick=()=>selectMapRegion(b.dataset.mapsel,true)); }
}
function applyCountryFilter(){ renderRegionMarkers(); }
function highlightSel(){ renderRegionMarkers(); }
function selectMapRegion(id,fly){
  mapSel=id;
  const t=BY_ID[id];
  if(t && t.country!==mapCountry){ mapCountry=t.country; rebuildRegionChips(); applyCountryFilter(); }
  setMapChips(); refreshMapDetail(); highlightSel();
  // highlight + centre the selected region
  const p=MAPPTS[id]; if(_map && fly!==false && p) _map.easeTo({center:[p.lng,p.lat],zoom:Math.max(_map.getZoom(),7.5),pitch:0,duration:900});
}
function selectMapCountry(c){
  mapCountry=c; const regs=mapCountryRegions(c); mapSel=regs[0];
  setMapChips(); rebuildRegionChips(); refreshMapDetail();
  applyCountryFilter(); highlightSel();
  // show ALL of this country's regions at once
  if(_map) _map.fitBounds(countryBounds(c),{padding:54,pitch:35,duration:1000,maxZoom:9});
}
function ensureMap(){
  const el=document.getElementById('maptab'); if(!el) return;
  if(typeof maplibregl==='undefined'){ el.innerHTML='<div class="mapfail">The map library couldn\'t load (needs a network connection). The rest of the app works offline — reopen the Map tab once you\'re online.</div>'; return; }
  el.innerHTML='';
  let map;
  try{
    map=new maplibregl.Map({container:el,style:'https://tiles.openfreemap.org/styles/liberty',
      center:[MAPPTS[mapSel].lng,MAPPTS[mapSel].lat],zoom:2,pitch:0,bearing:0,attributionControl:true,cooperativeGestures:false});
  }catch(e){ el.innerHTML='<div class="mapfail">Couldn\'t start the map: '+esc(String(e))+'</div>'; return; }
  _map=map; _mapNameMarker=null;
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
  map.on('error',()=>{}); // swallow tile errors so they don't spam
  map.on('load',()=>{
    try{
      renderRegionMarkers();
      map.fitBounds(countryBounds(mapCountry),{padding:54,duration:0,pitch:0,maxZoom:9});
    }catch(e){}
  });
  // render markers immediately too — HTML markers don't depend on tiles/style loading
  setTimeout(renderRegionMarkers,150);
  // wire chips (no global re-render, to keep the map alive)
  document.querySelectorAll('[data-mapcountry]').forEach(b=>b.onclick=()=>selectMapCountry(b.dataset.mapcountry));
  document.querySelectorAll('.rgchips [data-mapsel]').forEach(b=>b.onclick=()=>selectMapRegion(b.dataset.mapsel,true));
}

/* ============================ TOAST ============================ */
let toastT=null;
function toast(msg){ let el=document.getElementById('toast'); if(!el){el=document.createElement('div');el.id='toast';
  el.style.cssText='position:fixed;bottom:calc(var(--navh) + 18px);left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line2);color:var(--ink);padding:11px 18px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.4)';document.body.appendChild(el);}
  el.textContent=msg; el.style.opacity='1'; clearTimeout(toastT); toastT=setTimeout(()=>el.style.opacity='0',1800); }

/* ============================ EVENT BINDING ============================ */
function bind(){
  // generic data-run buttons
  app.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>{try{startRun(JSON.parse(b.dataset.run));}catch(e){}});
  app.querySelectorAll('[data-runcur]').forEach(b=>b.onclick=()=>{const cur=studyScope.type==='all'?'all':(studyScope.type==='weak'?'weak':'c:'+studyScope.name);startRun({mode:studyMode,scope:cur});});
  app.querySelectorAll('[data-nav2]').forEach(b=>b.onclick=()=>nav(b.dataset.nav2));
  app.querySelectorAll('[data-country]').forEach(b=>b.onclick=()=>{learnCountry=b.dataset.country;learnMode='geo';nav('learn');});
  app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>nav('topic',{id:b.dataset.topic}));
  app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>nav('learn'));
  app.querySelectorAll('[data-signout]').forEach(b=>b.onclick=async()=>{ if(SB){ _skipAuth=false; try{localStorage.removeItem('cellar.localonly');}catch(e){} await SB.auth.signOut(); } });
  app.querySelectorAll('[data-signin]').forEach(b=>b.onclick=()=>{ _skipAuth=false; try{localStorage.removeItem('cellar.localonly');}catch(e){} renderAccount(); });
  app.querySelectorAll('[data-lc]').forEach(b=>b.onclick=()=>{learnCountry=b.dataset.lc;render();});
  // learn: region/grape mode + grape cards
  app.querySelectorAll('[data-lmode]').forEach(b=>b.onclick=()=>{learnMode=b.dataset.lmode;render();});
  app.querySelectorAll('[data-gfilter]').forEach(b=>b.onclick=()=>{grapeFilter=b.dataset.gfilter;render();});
  app.querySelectorAll('[data-grape]').forEach(b=>b.onclick=()=>nav('grape',{id:b.dataset.grape}));
  app.querySelectorAll('[data-back-grape]').forEach(b=>b.onclick=()=>{learnMode='grape';nav('learn');});
  // topic LO accordion
  app.querySelectorAll('[data-lohead]').forEach(b=>b.onclick=()=>{const id=b.dataset.lohead;openLO[id]=!openLO[id];
    // mark all KKPs in this LO at least 'seen' when opened
    if(openLO[id]){const t=BY_ID[route.id];const lo=t.objectives.find(l=>l.id===id);lo.kkps.forEach(k=>bumpState(k.id,1));}
    render();});
  app.querySelectorAll('[data-revcb]').forEach(b=>b.onclick=()=>{const cb=app.querySelector(`[data-cb="${b.dataset.revcb}"]`);
    if(cb){cb.classList.toggle('show');b.textContent=cb.classList.contains('show')?'Hide check':'Show check';bumpState(b.dataset.revcb,1);}});
  app.querySelectorAll('[data-kpill]').forEach(p=>p.querySelectorAll('[data-set]').forEach(btn=>btn.onclick=()=>{
    const id=p.dataset.kpill;const v=+btn.dataset.set;setState(id,getState(id)===v?0:v);render();}));
  // study home
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{studyMode=b.dataset.mode;render();});
  app.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{studyScope=scopeObj(b.dataset.scope);render();});
  // run controls
  app.querySelectorAll('[data-flip]').forEach(b=>b.onclick=()=>{study.flipped=!study.flipped;render();});
  app.querySelectorAll('[data-flipreveal]').forEach(b=>b.onclick=()=>{study.flipped=true;render();});
  app.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>grade(+b.dataset.grade));
  app.querySelectorAll('[data-gradeblind]').forEach(b=>b.onclick=()=>gradeBlind(+b.dataset.gradeblind));
  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const it=study.queue[study.idx];const opts=mcqOptions(it.check);
    study.picked=opts[+b.dataset.pick];study.answered=true;bumpState(it.kp,study.picked===it.check.correctAnswer?3:1);render();});
  app.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{const it=study.queue[study.idx];
    if(study.picked===it.check.correctAnswer)study.results.m++;else study.results.s++;advance();});
  app.querySelectorAll('[data-endrun]').forEach(b=>b.onclick=()=>{study.idx=study.queue.length;render();});
  app.querySelectorAll('[data-again]').forEach(b=>b.onclick=()=>{startRun({mode:study.mode,scope:study.scope.type==='country'?'c:'+study.scope.name:(study.scope.type==='topic'?'topic':study.scope.type),topic:study.scope.topic});});
  app.querySelectorAll('[data-todash]').forEach(b=>b.onclick=()=>{study=null;nav('dash');});
  // map (multi-country, MapLibre) — chips are wired inside ensureMap so the live map isn't torn down
  if(route.view==='map') ensureMap();
}

/* ============================ BOOT ============================ */
function accountRow(){
  if(!SB) return '';
  if(USER) return `<div class="acctrow"><span class="acctdot ok"></span>Synced to your account · <span class="acctem">${esc(USER.email||'')}</span><button class="acctlink" data-signout>Sign out</button></div>`;
  return `<div class="acctrow"><span class="acctdot"></span>Saving on this device only<button class="acctlink" data-signin>Sign in to sync</button></div>`;
}
function authNeeded(){ return !!(SB && !USER && !_skipAuth); }
function renderAccount(){
  let ov=document.getElementById('authov');
  if(authNeeded()){
    if(!ov){ ov=document.createElement('div'); ov.id='authov'; document.body.appendChild(ov); }
    ov.className='authov';
    ov.innerHTML=`<div class="authbox"><div class="authwine">&#127863;</div><h2>DuoVino</h2>
      <p class="authsub">Sign in to sync your study progress across all your devices.</p>
      <input id="authemail" type="email" inputmode="email" placeholder="you@email.com" autocomplete="email">
      <button id="authsend" class="authbtn">Email me a login link</button>
      <div id="authmsg" class="authmsg"></div>
      <button id="authskip" class="authskip">Use on this device only</button></div>`;
    const email=ov.querySelector('#authemail'), msg=ov.querySelector('#authmsg'), send=ov.querySelector('#authsend');
    send.onclick=async()=>{ const e=(email.value||'').trim(); if(!/.+@.+\..+/.test(e)){ msg.textContent='Please enter a valid email.'; return; }
      msg.textContent='Sending…'; send.disabled=true;
      try{ const {error}=await SB.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname}});
        msg.textContent=error?('Error: '+error.message):'Check your email and tap the link to sign in.'; }
      catch(err){ msg.textContent='Error: '+(err.message||err); } send.disabled=false; };
    email.addEventListener('keydown',ev=>{ if(ev.key==='Enter') send.click(); });
    ov.querySelector('#authskip').onclick=()=>{ _skipAuth=true; try{localStorage.setItem('cellar.localonly','1');}catch(e){} renderAccount(); render(); };
  } else if(ov){ ov.remove(); }
}
async function boot(){
  initChrome();
  renderAccount(); render();
  if(SB){ try{
    const {data:{session}}=await SB.auth.getSession(); USER=session?session.user:null;
    if(USER){ await cloudLoadMerge(); }
    renderAccount(); render();
    SB.auth.onAuthStateChange(async(_evt,sess)=>{ USER=sess?sess.user:null; if(USER){ await cloudLoadMerge(); } renderAccount(); render(); });
  }catch(e){ renderAccount(); render(); } }
}
boot();
</script>
