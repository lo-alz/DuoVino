<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>DuoVino — WSET D3 Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161c; --bg2:#191c24; --panel:#20232c; --panel2:#272b36; --panel3:#2e323e;
  --ink:#ece3d2; --ink-dim:#c9c0ad; --muted:#928a78; --line:#333949; --line2:#3d4456;
  --gold:#caa64b; --gold-l:#e6d7a0; --gold-d:#b8923a;
  --garnet:#8a2540; --garnet-l:#a8324f; --rose:#c0566e; --azul:#3f82c4; --azul-l:#6aa6e0;
  --green:#7faa55; --green-l:#9bc471;
  --s0:#3a4150; --s1:#3f82c4; --s2:#caa64b; --s3:#7faa55;
  --disp:'Barlow Condensed',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --navh:64px;
}
/* ---------- light theme ---------- */
body.light{
  --bg:#f4efe5; --bg2:#ece4d4; --panel:#fbf8f1; --panel2:#f1ebdd; --panel3:#e6ddc8;
  --ink:#2a2620; --ink-dim:#544b3a; --muted:#8a7f67; --line:#ded3bc; --line2:#ccbf9f;
  --gold:#9c7c2c; --gold-l:#7a5e1c; --gold-d:#6a521a;
  --garnet:#8a2540; --garnet-l:#a8324f; --rose:#b0405c; --azul:#2f6cab; --azul-l:#2f6cab;
  --green:#5f8a3a; --green-l:#4d7a2c;
  --s0:#cbbfa6; --s1:#3f82c4; --s2:#a9842f; --s3:#6f9a47;
}
body.light .hero{background:radial-gradient(120% 140% at 80% 0%,#fffdf8 0%,var(--panel) 55%)}
body.light .nav{background:rgba(251,248,241,.92)}
body.light .authov{background:radial-gradient(circle at 50% 28%,#fffdf8,#ece4d4)}
body.light .maptab{background:#e6ddc8}
body.light .modeseg .mode.on,body.light .studybtn,body.light .actions .b-next,body.light .authbtn{color:#fbf8f1}
body.light ::selection{background:var(--garnet);color:#fbf8f1}
/* ---------- corner logo + theme toggle ---------- */
.corner{position:fixed;top:0;right:0;z-index:10000;display:flex;align-items:center;gap:9px;
  padding:calc(env(safe-area-inset-top) + 11px) 15px 8px;pointer-events:none}
.corner>*{pointer-events:auto}
.themebtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);
  color:var(--ink-dim);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 9px rgba(0,0,0,.22);transition:background .15s}
.themebtn:active{background:var(--panel3)}
.corner-logo{display:block;line-height:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.corner-logo svg{display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom))}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;margin:0;letter-spacing:.01em;line-height:1.06}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--garnet);color:var(--ink)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.app{max-width:720px;margin:0 auto;min-height:100vh}
.view{padding:18px 16px 28px;animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.top .brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:41px;flex:0 0 auto}
.brand h1{font-size:25px;letter-spacing:.06em;text-transform:uppercase}
.brand .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:2px}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel+.panel{margin-top:12px}
.hairline{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:14px 0;border:0}

/* ---------- dashboard hero ---------- */
.hero{background:radial-gradient(120% 140% at 80% 0%,#23262f 0%,var(--panel) 55%);border:1px solid var(--line2);
  border-radius:18px;padding:20px;display:flex;gap:18px;align-items:center}
.hero .glasswrap{flex:0 0 auto;width:104px;text-align:center}
.hero .pct{font-family:var(--disp);font-size:40px;font-weight:700;color:var(--gold-l);line-height:1}
.hero .pctl{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.hero .right{flex:1;min-width:0}
.hero h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.hero p{margin:6px 0 0;color:var(--ink-dim);font-size:13.5px}

/* mastery legend chips */
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 8px;text-align:center}
.stat .n{font-family:var(--disp);font-size:24px;font-weight:700;line-height:1}
.stat .l{font-family:var(--mono);font-size:8.7px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-top:5px;line-height:1.3}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

.quickrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.qbtn{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:13px 12px;text-align:left;
  display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s}
.qbtn:active{background:var(--panel3)}
.qbtn .qt{font-family:var(--disp);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.qbtn .qd{font-size:11.5px;color:var(--muted)}
.qbtn.accent{border-color:var(--garnet)}
.qbtn.accent .qt{color:var(--rose)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec-h h3{font-size:17px;text-transform:uppercase;letter-spacing:.05em}
.sec-h .link{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase}

/* country tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;gap:11px;align-items:center;min-width:0;
  transition:border-color .15s,transform .12s}
.tile:active{transform:scale(.98);border-color:var(--line2)}
.tile .flag{font-size:22px;line-height:1}
.tile .ti{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tile .tn{font-family:var(--disp);font-size:15.5px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;overflow-wrap:anywhere}
.tile .tm{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.tbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:7px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--garnet),var(--gold));border-radius:3px}

/* weakest list */
.wk{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.wk:last-child{border-bottom:0}
.wk .wktx{flex:1;min-width:0;font-size:13px;color:var(--ink-dim)}
.wk .wktx b{color:var(--ink);font-weight:600}
.wk .wkmeta{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

/* ---------- chips / scope ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
  font-family:var(--disp);font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);white-space:nowrap}
.chip.on{background:var(--gold);color:#1a1407;border-color:var(--gold)}

/* topic list cards */
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;
  display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .12s,border-color .15s}
.tcard:active{transform:scale(.985);border-color:var(--line2)}
.tctop{display:flex;gap:9px;align-items:center;min-width:0}
.tcard h3{font-size:15px;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;min-width:0}
.tcard .alt{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .meta{display:flex;gap:9px;flex-wrap:wrap}
.tcard .mb{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tcard .mb b{color:var(--gold-l)}
/* ---------- learn mode toggle + grape cards ---------- */
.modeseg{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px;margin:4px 0 12px}
.modeseg .mode{flex:1;font-family:var(--disp);font-size:14px;text-transform:uppercase;letter-spacing:.04em;padding:9px 0;border-radius:8px;color:var(--ink-dim);background:transparent;cursor:pointer;transition:.14s}
.modeseg .mode.on{background:var(--garnet);color:var(--ink);box-shadow:0 1px 6px rgba(138,37,64,.4)}
.gcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:transform .12s,border-color .15s}
.gcard:active{transform:scale(.985)}
.gcard.w{border-left:3px solid var(--gold)} .gcard.r{border-left:3px solid var(--garnet-l)}
.gctop{display:flex;align-items:center;gap:7px;min-width:0}
.gsw{flex:0 0 auto;width:13px;height:13px;border-radius:50%}
.gsw.w{background:linear-gradient(135deg,var(--gold-l),var(--gold-d))} .gsw.r{background:linear-gradient(135deg,var(--rose),var(--garnet))}
.gsw.big{width:26px;height:26px;border:2px solid var(--line2)}
.gci{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.gnm{font-family:var(--disp);font-size:14px;text-transform:uppercase;letter-spacing:.01em;color:var(--ink);line-height:1.05;min-width:0}
.gaka{font-family:var(--mono);font-size:8.5px;color:var(--muted);letter-spacing:.02em;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmini{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.gst{font-family:var(--mono);font-size:8.5px;color:var(--ink-dim);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 7px;letter-spacing:.02em}
.gst .gk{color:var(--muted);margin-right:4px;text-transform:uppercase}
.gchev{display:none}
/* grape detail */
.crumb{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;padding:4px 0;cursor:pointer}
.ghead{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.gstatgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.gstatgrid .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-align:left}
.gstk{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.gstv{font-family:var(--disp);font-size:15px;color:var(--gold-l);text-transform:uppercase;letter-spacing:.02em;line-height:1.08}
.gsec{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
.gsech{font-family:var(--disp);font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);margin-bottom:7px}
.gsecb{color:var(--ink-dim);font-size:14px;line-height:1.5}
.gbul{list-style:none;margin:2px 0 0;padding:0}
.gbul li{position:relative;padding:5px 0 5px 18px;color:var(--ink-dim);font-size:14px;line-height:1.45;border-bottom:1px solid rgba(61,68,86,.4)}
.gbul li:last-child{border-bottom:none}
.gbul li::before{content:'';position:absolute;left:2px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.gstatgrid .stat.span2{grid-column:1 / -1}
.gstatgrid .stat.lonecenter{grid-column:1 / -1;justify-self:center;width:calc(50% - 4px)}
.gsecsub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.03em;margin:-2px 0 10px;font-style:italic}
.rslist{display:flex;flex-direction:column;gap:2px}
.rsrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(61,68,86,.4)}
.rsrow:last-child{border-bottom:none}
.rsdot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px}
.rsdot.w{background:linear-gradient(135deg,var(--gold-l),var(--gold-d))} .rsdot.r{background:linear-gradient(135deg,var(--rose),var(--garnet))}
.rstx{flex:1;min-width:0}
.rsname{font-family:var(--disp);font-size:15px;text-transform:uppercase;letter-spacing:.02em;color:var(--gold-l);display:inline-block}
.rsname.link{background:none;border:none;padding:0;cursor:pointer;color:var(--azul-l)}
.rsnote{color:var(--ink-dim);font-size:13.5px;line-height:1.45;margin-top:3px}
.rgchip.link2{cursor:pointer;border-color:var(--azul);color:var(--azul-l);background:rgba(63,130,196,.1)}
.rgchip.static{color:var(--muted)}

/* ---------- topic detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:14px;padding:4px 0}
.thead h2{font-size:30px;text-transform:uppercase;letter-spacing:.02em;line-height:1.02}
.thead .country{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.thead .alt{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-top:6px}
.thead .blurb{color:var(--ink-dim);font-size:14.5px;margin-top:10px}
.src{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.04em;margin-top:9px;opacity:.8}

.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 10px;text-align:center}
.chartbox.full{grid-column:1/-1}
.chartbox .ct{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;justify-content:center;margin-top:9px}
.legend span{font-family:var(--mono);font-size:9.5px;color:var(--ink-dim);display:flex;align-items:center}

/* LO accordion */
.lo{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.lohead{display:flex;align-items:center;gap:12px;padding:15px 14px;width:100%;text-align:left}
.lohead .code{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--gold);border:1px solid var(--gold-d);
  border-radius:6px;padding:3px 7px;flex:0 0 auto}
.lohead .lt{flex:1;min-width:0}
.lohead .lt .h{font-family:var(--disp);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.lohead .lt .s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.lohead .chev{color:var(--muted);transition:transform .25s;flex:0 0 auto}
.lo.open .chev{transform:rotate(90deg)}
.lobody{display:none;padding:0 14px 14px}
.lo.open .lobody{display:block;animation:fade .25s ease}

.lomastery{display:flex;align-items:center;gap:8px;height:6px;margin:0 14px 12px}
.lomastery .track{flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden;display:flex}
.lomastery .track i{height:100%}

.narr{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin:4px 0 14px}
.narr .nt{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.narr ul{margin:0;padding-left:16px}
.narr li{font-size:13.5px;color:var(--ink-dim);margin-bottom:6px;line-height:1.45}
.narr li:last-child{margin-bottom:0}

/* KKP block */
.kkp{border:1px solid var(--line);border-left:3px solid var(--s0);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--panel2)}
.kkp.rel{border-left-color:var(--gold)}
.kkp.cmp{border-left-color:var(--azul)}
.kkp .ktop{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--muted)}
.tag.rel{color:var(--gold-l);border-color:var(--gold-d)}
.tag.cmp{color:var(--azul-l);border-color:var(--azul)}
.tag.fact{color:var(--ink-dim)}
.kkp .kid{font-family:var(--mono);font-size:8.5px;color:var(--muted);margin-left:auto;letter-spacing:.06em}
.kkp .kst{font-size:13.5px;color:var(--ink);line-height:1.45}

/* factor->effect chain table */
.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:8px;overflow:hidden;margin-top:10px}
.chain .cc{background:var(--bg2);padding:8px 7px}
.chain .cl{font-family:var(--mono);font-size:7.8px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.chain .cv{font-size:11px;color:var(--ink-dim);line-height:1.3}
.chain .cc.last .cv{color:var(--gold-l)}
@media(max-width:520px){.chain{grid-template-columns:1fr 1fr}}

.kfoot{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.reveal{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);
  border:1px solid var(--gold-d);border-radius:7px;padding:6px 10px}
.checkbox{display:none;margin-top:10px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:11px}
.checkbox.show{display:block;animation:fade .2s}
.checkbox .q{font-size:13px;color:var(--ink);font-weight:600;margin-bottom:8px}
.checkbox .rub{font-family:var(--mono);font-size:8.7px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:9px 0 5px}
.checkbox ul{margin:0;padding-left:15px}
.checkbox li{font-size:12.5px;color:var(--ink-dim);margin-bottom:4px}
.checkbox .ans{font-size:13px;color:var(--green-l);line-height:1.45}

/* state pills */
.spill{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.spill button{padding:5px 9px;font-family:var(--mono);font-size:8.7px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--line2)}
.spill button:last-child{border-right:0}
.spill button.on-1{background:var(--s1);color:#06121f}
.spill button.on-2{background:var(--s2);color:#1a1407}
.spill button.on-3{background:var(--s3);color:#0c1606}

.glossary .gt{padding:11px 0;border-bottom:1px solid var(--line)}
.glossary .gt:last-child{border-bottom:0}
.glossary .gterm{font-family:var(--disp);font-size:15px;font-weight:600;color:var(--gold-l);text-transform:uppercase;letter-spacing:.02em}
.glossary .gterm .lang{font-family:var(--mono);font-size:8px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 4px;margin-left:7px;letter-spacing:.05em;text-transform:uppercase}

":"La Chablisienne","def":"The major Chablis co-operative, which vinifies roughly one third of all Chablis."}],"crossref":[{"kp":"CHA-15","links":["cotedor-chardonnay","macon-chardonnay","champagne-chardonnay"],"note":"Chardonnay is defined once; Chablis is one of its canonical cool-climate homes."},{"kp":"CHA-06","links":["sancerre-soil"],"note":"Kimmeridgian/Terre Blanches limestone-marl is shared with parts of Sancerre ('a bit like Chablis')."},{"kp":"CHA-04","links":["champagne-frost","mosel-frost"],"note":"Spring-frost protection (aspersion, late pruning) recurs across cool regions."}],"flags":[{"kp":"CHA-16","issue":"Source states 40 Premier Cru climats. Some references group them under ~17–40 'umbrella' 1er names. Verified to source; SME to confirm the count convention used in teaching."},{"kp":"CHA-10","issue":"Hectare figures (5,500 ha total; 783 ha 1er; ~100 ha Grand Cru) are from the source notes and drift year to year — SME to confirm currency before publishing as fact."},{"kp":"CHA-10","issue":"Grand Cru parcel ranking (Les Clos finest, then Valmur, Vaudésir) is reputational opinion in the source, not a legal hierarchy — taught as 'widely regarded', not fact."}],"objectives":[{"id":"LO1","title":"Place & climate → style","statement":"By the end you can explain how Chablis's cool continental climate and northerly site produce dry, high-acid, lean Chardonnay, and why its vintages vary so much.","kkps":[{"id":"CHA-01","cat":"relationship","verified":true,"src":"§3.1 Climate/Style","statement":"Cool continental climate (cold winters, warm summers) at a northerly latitude → slow, late ripening that limits sugar and preserves acidity → dry Chardonnay of medium body and alcohol with zesty high acidity and green-apple/lemon fruit.","chain":{"factor":"Cool continental, northerly latitude","mechanism":"Slow ripening; limited sugar accumulation, retained malic acid","effect":"High acidity, moderate alcohol","style":"Lean, dry, steely Chardonnay — green apple & lemon"}},{"id":"CHA-02","cat":"relationship","verified":true,"src":"§3.1 Climate","statement":"A marginal, northerly location → ripening is uncertain → considerable vintage variation in ripeness, quality and price from year to year.","chain":{"factor":"Marginal climate at the ripening edge","mechanism":"Some years fail to fully ripen","effect":"Year-to-year swings in quality/volume","style":"Vintage matters greatly for Chablis"}},{"id":"CHA-03","cat":"region","verified":true,"src":"§3.1 location","statement":"Chablis lies in the valley of the River Serein, ~110 km north-west of Dijon, in the northernmost part of Burgundy — separated from the rest of Burgundy."},{"id":"CHA-04","cat":"relationship","verified":true,"src":"§3.1 Hazards/Spring frost","statement":"Spring frost (and growing-season hail) in this cool, low-lying valley → buds and crop can be destroyed (frost cut Chablis to ~500 ha in 1945) → growers fight it with sprinklers ('aspersion'), smudge pots and later pruning to delay bud-burst.","chain":{"factor":"Spring frost / hail risk","mechanism":"Frozen buds; crop loss","effect":"Reduced and variable yields","style":"Drives frost-protection viticulture & vintage variation"}},{"id":"CHA-05","cat":"relationship","verified":true,"src":"§3.1 rainfall ~670mm","statement":"~670 mm rain spread through the year and a generally moist climate → fungal-disease and grey-rot pressure, and a threat of rot at harvest.","chain":{"factor":"Moist climate, ~670 mm rain","mechanism":"Humidity favours fungal disease","effect":"Disease & harvest-rot risk","style":"Demands canopy/spray management; affects healthy yields"}}],"checks":[{"kp":"CHA-01","type":"explain","prompt":"Explain how Chablis's climate produces its characteristic style of Chardonnay.","requiredPoints":["Cool continental / northerly latitude","Slow ripening limits sugar and preserves (malic) acidity","Result: high acidity, moderate alcohol, medium body","Style: dry, lean, green-apple/lemon, 'steely'"]},{"kp":"CHA-02","type":"explain","prompt":"Why does Chablis show more vintage variation than warmer white-wine regions?","requiredPoints":["Marginal/northerly ripening edge","Some years fail to ripen fully","Year-to-year swings in ripeness, quality, volume and price"]},{"kp":"CHA-03","type":"mcq","question":"Where is Chablis located?","correctAnswer":"In the Serein valley, ~110 km NW of Dijon, in the northernmost part of Burgundy","distractors":["In the Côte de Nuits, just south of Dijon","In the Mâconnais, southern Burgundy","In the Yonne, adjacent to the Loire's Sancerre"]},{"kp":"CHA-04","type":"explain","prompt":"Identify the main weather hazard in Chablis and explain two ways growers manage it.","requiredPoints":["Spring frost (also hail)","Can destroy buds/crop and slash yields","Aspersion (sprinklers) / smudge pots","Later pruning to delay bud-burst"]},{"kp":"CHA-05","type":"explain","prompt":"Explain why fungal disease and harvest rot are a particular risk in Chablis.","requiredPoints":["Moist climate, ~670 mm rain spread through the year","Humidity favours fungal disease (e.g. grey rot)","Threat of rot at harvest","Reduces healthy yields / demands canopy & spray management"]}],"narrative":["Chablis lies in the valley of the River Serein, ~110 km north-west of Dijon, in the northernmost part of Burgundy — separated from the rest of Burgundy."]},{"id":"LO2","title":"Soil & site → the appellation ladder","statement":"By the end you can explain how Kimmeridgian vs Portlandian soils and slope/aspect drive quality, and map that to the four Chablis tiers.","kkps":[{"id":"CHA-06","cat":"soil","verified":true,"src":"§3.1 Soils","statement":"Kimmeridgian soil = limestone and clay marl containing fossilised seashells; it is the classic soil of Chablis, Premier Cru and Grand Cru."},{"id":"CHA-07","cat":"relationship","verified":true,"src":"§3.1 Soils/GC","statement":"Kimmeridgian marl combines good drainage with water-retentive clay → a balanced, steady vine water supply → riper, more concentrated, mineral wines on the better tiers.","chain":{"factor":"Kimmeridgian marl (drainage + clay water-holding)","mechanism":"Balanced vine water supply","effect":"Greater ripeness & concentration","style":"More intense, mineral, age-worthy wine"}},{"id":"CHA-08","cat":"comparison","verified":true,"src":"§3.1 Petit Chablis","statement":"Petit Chablis sits on higher, cooler Portlandian soil (harder limestone, less clay, fewer fossils) → lighter, leaner wine; Chablis/1er/Grand Cru sit on Kimmeridgian → more intensity and concentration."},{"id":"CHA-09","cat":"relationship","verified":true,"src":"§3.1 1er/GC slopes","statement":"Premier and Grand Cru sit on south/south-east-facing mid-slope sites → better light interception, drainage and shelter from frost and the cold north wind → riper fruit, greater concentration, body and ageing capacity.","chain":{"factor":"South/SE mid-slope aspect","mechanism":"More sun, better drainage, frost/wind shelter","effect":"Riper, more concentrated fruit","style":"Fuller, age-worthy 1er/Grand Cru"}},{"id":"CHA-10","cat":"region","verified":true,"src":"§3.1 Grand Cru","statement":"Chablis Grand Cru is a single AOC of 7 named climats (~100 ha, ~1% of production) on the right bank of the Serein, facing south-west and sheltered from the north wind by a belt of trees; Les Clos is widely regarded as the finest parcel."}],"checks":[{"kp":"CHA-06","type":"mcq","question":"What defines Kimmeridgian soil in Chablis?","correctAnswer":"Limestone and clay marl rich in fossilised seashells","distractors":["Decomposed granite over schist","Volcanic basalt with sandy loess","Galets (rounded stones) over clay"]},{"kp":"CHA-07","type":"explain","prompt":"Explain why Kimmeridgian marl is prized for quality Chablis.","requiredPoints":["Good drainage AND water-retentive clay","Balanced/steady vine water supply","Riper, more concentrated fruit","More mineral, age-worthy wine"]},{"kp":"CHA-08","type":"explain","prompt":"Contrast Petit Chablis and Chablis/Cru in terms of soil and resulting style.","requiredPoints":["Petit Chablis = Portlandian (harder limestone, less clay/fossils), higher & cooler","Lighter, leaner wine","Chablis/1er/GC = Kimmeridgian","More intensity & concentration"]},{"kp":"CHA-09","type":"explain","prompt":"Explain why Chablis Premier and Grand Cru sites give riper, more concentrated wine than generic Chablis.","requiredPoints":["South/south-east-facing mid-slope","Better light interception & drainage","Shelter from frost and cold north wind","Riper fruit → concentration, body, ageing capacity"]},{"kp":"CHA-10","type":"mcq","question":"How is Chablis Grand Cru structured?","correctAnswer":"A single AOC with 7 named climats on one south-west-facing slope by the Serein","distractors":["Seven separate Grand Cru AOCs, one per village","40 named climats across both banks","A single monopole owned by one domaine"]}],"narrative":["Kimmeridgian soil = limestone and clay marl containing fossilised seashells; it is the classic soil of Chablis, Premier Cru and Grand Cru.","Chablis Grand Cru is a single AOC of 7 named climats (~100 ha, ~1% of production) on the right bank of the Serein, facing south-west and sheltered from the north wind by a belt of trees; Les Clos is widely regarded as the finest parcel."]},{"id":"LO3","title":"Winemaking → style across the ladder","statement":"By the end you can explain how oak choice, malolactic conversion, lees and chaptalisation shape Chablis, and how treatment scales up the quality ladder.","kkps":[{"id":"CHA-11","cat":"relationship","verified":true,"src":"§3.1 Winemaking/Oak","statement":"Most Chablis is fermented and aged in stainless steel or concrete (little or no oak) → preserves pure citrus and green-apple fruit and high acidity → the signature crisp, 'steely', unoaked Chablis style.","chain":{"factor":"Inert vessels (steel/concrete), no oak","mechanism":"No oak flavour/oxidation; fruit & acid preserved","effect":"Pure citrus/green apple, high acidity","style":"Crisp, steely, mineral Chablis"}},{"id":"CHA-12","cat":"relationship","verified":true,"src":"§3.1 MLC/lees","statement":"Malolactic conversion is commonly carried out → softens the naturally high malic acidity, adds stability and a rounder mouthfeel; some lees ageing → added texture.","chain":{"factor":"Malolactic conversion (+ lees)","mechanism":"Malic→lactic acid; lees contact","effect":"Softer acidity, more stable, more textured","style":"Rounder, more approachable Chablis"}},{"id":"CHA-13","cat":"comparison","verified":true,"src":"§3.1 Oak/producers","statement":"Generic Chablis is typically unoaked and fruit-pure, while some Premier/Grand Cru is barrel-fermented and aged (often old oak or foudres) → adds texture, subtle spice and ageing potential; house styles differ (e.g. Dauvissat/Raveneau old oak vs unoaked styles)."},{"id":"CHA-14","cat":"relationship","verified":true,"src":"§3.1 Chaptalisation","statement":"Chaptalisation is permitted up to a legal limit and used in all but the warmest years → raises final alcohol to balance the wine when the cool climate leaves grapes low in sugar.","chain":{"factor":"Cool climate → low must sugar","mechanism":"Chaptalisation adds sugar pre-fermentation","effect":"Higher final alcohol/balance","style":"Balanced dry wine despite marginal ripeness"}}],"checks":[{"kp":"CHA-11","type":"explain","prompt":"Explain why most Chablis is made in stainless steel or concrete rather than new oak, and the stylistic result.","requiredPoints":["Inert vessels add no oak flavour/oxidation","Preserve citrus/green-apple fruit and high acidity","Signature crisp, steely, mineral style","Oak would mask the fruit/minerality prized in Chablis"]},{"kp":"CHA-12","type":"explain","prompt":"What does malolactic conversion do for Chablis and why is it commonly used?","requiredPoints":["Converts sharp malic acid to softer lactic acid","Softens naturally high acidity","Adds stability and rounder mouthfeel","(Lees ageing adds texture)"]},{"kp":"CHA-13","type":"mcq","question":"Which statement best captures oak use across the Chablis ladder?","correctAnswer":"Generic Chablis is usually unoaked; some 1er/Grand Cru sees barrel (often old oak/foudres)","distractors":["All Chablis is aged in 100% new barriques","Oak is banned by AOC law at every level","Only Petit Chablis is oak-aged"]},{"kp":"CHA-14","type":"explain","prompt":"Explain why and how chaptalisation is used in Chablis.","requiredPoints":["Cool, marginal climate leaves grapes low in sugar","Sugar added pre-fermentation to raise alcohol","Permitted up to a legal limit","Used in all but the warmest years for balance"]}],"narrative":[]},{"id":"LO4","title":"Classification, law & identity","statement":"By the end you can state Chablis's grape rule, four-tier classification, yield ladder, and what drives its global identity.","kkps":[{"id":"CHA-15","cat":"law","verified":true,"src":"§3.1 Wine Law","statement":"Only Chardonnay is permitted in all Chablis appellations."},{"id":"CHA-16","cat":"law","verified":true,"src":"§3.1 tiers","statement":"Chablis has a four-tier AOC ladder: Petit Chablis → Chablis → Chablis Premier Cru (40 named climats) → Chablis Grand Cru (one AOC, 7 climats)."},{"id":"CHA-17","cat":"law","verified":true,"src":"§3.1 yields","statement":"Maximum yields tighten up the ladder: 60 hL/ha (Petit Chablis & Chablis), 58 hL/ha (Premier Cru), 54 hL/ha (Grand Cru)."},{"id":"CHA-18","cat":"relationship","verified":true,"src":"§3.1 Wine Business","statement":"A historically co-operative-led trade (La Chablisienne vinifies ~1/3) plus heavy exporting (~60% exported; UK biggest, then USA and Japan) → Chablis is a globally recognised, export-driven appellation name.","chain":{"factor":"Co-op scale + export focus","mechanism":"Reliable volume; international distribution","effect":"Strong global brand recognition","style":"'Chablis' sells as a known dry-white category"}}],"checks":[{"kp":"CHA-15","type":"mcq","question":"Which grape is permitted in Chablis AOC?","correctAnswer":"Chardonnay only","distractors":["Chardonnay and Aligoté","Sauvignon Blanc","Chenin Blanc"]},{"kp":"CHA-16","type":"mcq","question":"What are the four Chablis tiers, lowest to highest?","correctAnswer":"Petit Chablis → Chablis → Chablis Premier Cru → Chablis Grand Cru","distractors":["Chablis → Village → Premier Cru → Grand Cru","Bourgogne → Chablis → 1er Cru → Grand Cru","Petit Chablis → Chablis → Grand Cru → Premier Cru"]},{"kp":"CHA-17","type":"mcq","question":"How do maximum yields change up the Chablis ladder?","correctAnswer":"They fall: 60 → 58 → 54 hL/ha from Chablis to 1er to Grand Cru","distractors":["They rise toward Grand Cru for ripeness","They are fixed at 50 hL/ha for all tiers","Only Grand Cru has a yield limit"]},{"kp":"CHA-18","type":"explain","prompt":"Explain why 'Chablis' is such a globally recognised name commercially.","requiredPoints":["Co-operative (La Chablisienne) supplies reliable volume","~60% is exported","Key markets UK, USA, Japan","Result: strong international brand for a dry-white category"]}],"narrative":["Only Chardonnay is permitted in all Chablis appellations.","Chablis has a four-tier AOC ladder: Petit Chablis → Chablis → Chablis Premier Cru (40 named climats) → Chablis Grand Cru (one AOC, 7 climats).","Maximum yields tighten up the ladder: 60 hL/ha (Petit Chablis & Chablis), 58 hL/ha (Premier Cru), 54 hL/ha (Grand Cru)."]}],"blind":[{"id":"CHA-BLIND-1","tastingProfile":"White wine. Pale lemon. Pronounced green apple, lemon, wet-stone/mineral, no oak. Dry, high acidity, medium alcohol, medium body, medium finish.","deduce":["Grape: Chardonnay","Climate: cool","Region: Chablis (Burgundy)"],"justifyWith":["No oak + high acid + green apple/citrus → cool-climate unoaked Chardonnay","Wet-stone minerality + leanness → Chablis on Kimmeridgian limestone","Medium body, no tropical fruit → not a warm-climate Chardonnay"]}],"grapes":[{"name":"Chardonnay","color":"w","pct":100}],"climate":{"label":"Cool continental","scores":{"warmth":2,"sun":2,"rain":3,"diurnal":3,"risk":5}},"style":{"white":100},"quiz":[{"id":"chablis-Q1","kp":"CHA-01","question":"What is the climate of Chablis?","correctAnswer":"Cool continental, with cold winters and warm summers at a northerly latitude","distractors":["Warm Mediterranean with mild winters","Hot, arid continental","Moderate maritime, strongly ocean-influenced"]},{"id":"chablis-Q2","kp":"CHA-04","question":"Which vineyard hazard most threatens Chablis and is fought with sprinklers ('aspersion')?","correctAnswer":"Spring frost","distractors":["Drought and water stress","Sunburn from excessive heat","Coastal salt-laden winds"]},{"id":"chablis-Q3","kp":"CHA-11","question":"How is most Chablis fermented and aged, giving its signature style?","correctAnswer":"In stainless steel or concrete, with little or no oak","distractors":["In new French oak barriques","In clay amphorae on the skins","Under a veil of flor yeast"]},{"id":"chablis-Q4","kp":"CHA-08","question":"On which soil does Petit Chablis sit, giving lighter, leaner wine?","correctAnswer":"Portlandian (harder limestone, less clay, fewer fossils)","distractors":["Kimmeridgian fossil-rich marl","Galets roulés (large rounded pebbles)","Red-black llicorella slate"]},{"id":"chablis-Q5","kp":"CHA-12","question":"Why is malolactic conversion commonly carried out in Chablis?","correctAnswer":"To soften the naturally high malic acidity and add a rounder mouthfeel","distractors":["To raise the final alcohol level","To deepen the wine's colour","To create a deliberately oxidative, nutty character"]}]},{"id":"bordeaux","title":"Bordeaux","alt":"Left Bank · Right Bank · Entre-Deux-Mers","country":"France","flag":"🇫🇷","blurb":"111,000 ha on the Atlantic, split by the Gironde. Maritime, blend-driven, and built on the 1855 classification and the en primeur trade.","source":"1_France20241004_final.pdf","climate":{"label":"Moderate maritime","scores":{"warmth":3,"sun":3,"rain":4,"diurnal":2,"risk":4}},"style":{"red":85,"white":10,"rose":4,"sweet":1},"grapes":[{"name":"Merlot","color":"r","pct":39},{"name":"Cabernet Sauvignon","color":"r","pct":20},{"name":"Cabernet Franc","color":"r","pct":9},{"name":"Sémillon","color":"w","pct":6},{"name":"Sauvignon Blanc","color":"w","pct":5},{"name":"Other reds (Petit Verdot, Malbec)","color":"r","pct":21}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["South-west France, traversed by the Garonne and Dordogne, which merge into the Gironde estuary.","Left Bank = west of the Garonne/Gironde; Right Bank = east of the Dordogne/Gironde; Entre-Deux-Mers between the two rivers.","Cool Atlantic moderates; the warm Gulf Stream adds heat. Landes pine forest shelters the Left Bank from storms.","Rainfall ~950 mm/yr — a threat at flowering (poor set), véraison and harvest (fungal disease, dilution).","Hazard: spring frost (1956, 1991, 2017 decimated crops — 2017 down ~33%)."],"kkps":[{"id":"BORDEAUX-F01","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Cabernet Sauvignon — late-ripening and thick-skinned, it needs the warm, well-drained gravel soils of the Left Bank to ripen fully and resist drought."},{"id":"BORDEAUX-F02","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Merlot — early-ripening; cooler clay soils retain water, giving large berries, body and higher alcohol."},{"id":"BORDEAUX-F03","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"~950 mm — risky at flowering (poor fruit set), véraison and harvest (fungal disease and dilution of flavour)."}],"checks":[{"kp":"BORDEAUX-F01","type":"flash","question":"What is the dominant black grape of the Bordeaux Left Bank, and why is it planted there?","answer":"Cabernet Sauvignon — late-ripening and thick-skinned, it needs the warm, well-drained gravel soils of the Left Bank to ripen fully and resist drought."},{"kp":"BORDEAUX-F02","type":"flash","question":"What grape dominates the Right Bank and what soil suits it?","answer":"Merlot — early-ripening; cooler clay soils retain water, giving large berries, body and higher alcohol."},{"kp":"BORDEAUX-F03","type":"flash","question":"Average annual rainfall in Bordeaux and why it matters?","answer":"~950 mm — risky at flowering (poor fruit set), véraison and harvest (fungal disease and dilution of flavour)."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Merlot: early budding (frost risk), mid ripening; large berries on clay give body + alcohol; prone to coulure & rot.","Cabernet Sauvignon: late budding/late ripening; small thick-skinned berries, high tannin; needs warm well-drained gravel.","Cabernet Franc: early budding; fragrance, red/black fruit, high acidity, medium tannin.","Petit Verdot & Malbec: minor; deep colour, spice, high tannin (Malbec largely replaced by Merlot after 1956 frost).","Whites: Sémillon (waxy, ages, prone to botrytis), Sauvignon Blanc (aromatic, high acid), Muscadelle (floral, grapey)."],"kkps":[{"id":"BORDEAUX-F04","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"≈85% red, 10% dry white, 4% rosé, 1% sweet."},{"id":"BORDEAUX-CG1","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Moderate maritime climate (Gulf Stream) on heat-radiating gravel soils → Cabernet Sauvignon and Merlot ripen steadily over a long season → structured, age-worthy reds of blackcurrant and plum with high tannin and medium-plus acidity.","chain":{"factor":"Moderate maritime, warm gravel soils","mechanism":"Steady long-season ripening","effect":"High tannin, medium-plus acidity","style":"Structured, age-worthy Bordeaux blends"}}],"checks":[{"kp":"BORDEAUX-F04","type":"flash","question":"Style breakdown of Bordeaux production?","answer":"≈85% red, 10% dry white, 4% rosé, 1% sweet."},{"kp":"BORDEAUX-CG1","type":"explain","prompt":"Explain how the climate of Bordeaux shapes the characteristics of its signature grape(s).","requiredPoints":["Moderate maritime, warm gravel soils","Steady long-season ripening","High tannin, medium-plus acidity","Structured, age-worthy Bordeaux blends"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Premium estates: 10,000 vines/ha on infertile soils for moderate vigour; basic Bordeaux AOC 3,000–4,000 vines/ha.","Training: head-trained, cane-pruned — Double Guyot (Left Bank), Single Guyot (Right Bank).","Damp climate → summer leaf removal to aerate and deter rot; remove late to avoid sunburn.","Eutypa/Esca managed with 'soft pruning'; flavescence dorée requires insecticide (complicates organics).","Yields have fallen to ~50 hL/ha; hand-picking at top estates, machine for high-volume wines.","Reds: temperature-controlled vats, pump-overs; short maceration (5–7 days) for early drinking, 14–30 days for ageing.","Press wine kept separately; winemaker decides blend %. MLF in tank or barrel; barriques (225 L), 18–24 months.","Micro-oxygenation softens tannin, stabilises colour, reduces herbaceous notes — an alternative to oak ageing.","Whites: cool ferment in steel for early drinking; lees ageing or barrel-ferment for premium; MLF usually avoided for freshness.","Sweet (Sauternes/Barsac): noble rot, multiple passes (up to 10–12), max 25 hL/ha, barrel-aged 18–36 months."],"kkps":[{"id":"BORDEAUX-F05","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"A futures system: classed-growth wine is sold 12–18 months before bottling. Barrel samples are tasted each April; châteaux release prices in tranches via négociants on La Place de Bordeaux."},{"id":"BORDEAUX-F06","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Sémillon (main, prone to botrytis) and Sauvignon Blanc, affected by noble rot (Botrytis cinerea); multiple selective passes, very low yields (max 25 hL/ha)."},{"id":"BORDEAUX-R07","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Damp climate → summer leaf removal to aerate and deter rot; remove late to avoid sunburn."}],"checks":[{"kp":"BORDEAUX-F05","type":"flash","question":"What is en primeur?","answer":"A futures system: classed-growth wine is sold 12–18 months before bottling. Barrel samples are tasted each April; châteaux release prices in tranches via négociants on La Place de Bordeaux."},{"kp":"BORDEAUX-F06","type":"flash","question":"Name two grapes used for sweet Bordeaux and the key process.","answer":"Sémillon (main, prone to botrytis) and Sauvignon Blanc, affected by noble rot (Botrytis cinerea); multiple selective passes, very low yields (max 25 hL/ha)."},{"kp":"BORDEAUX-R07","type":"explain","prompt":"Starting from “Damp climate”, explain what this leads to — through to the resulting wine style.","requiredPoints":["summer leaf removal to aerate and deter rot; remove late to avoid sunburn"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Bordeaux AOC & Bordeaux Supérieur ≈ 50% of production; generic, often higher yields.","1855 Classification (Médoc + Sauternes) ranks châteaux into growths — based on price at the time.","Left Bank communes: Saint-Estèphe, Pauillac, Saint-Julien, Margaux (CS-led); Right Bank: Saint-Émilion, Pomerol (Merlot-led).","En primeur: wine sold 12–18 months before bottling via négociants on La Place de Bordeaux; barrel samples tasted each April.","Côtes de Bordeaux groups several right-bank côtes appellations under one banner."],"kkps":[{"id":"BORDEAUX-F08","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"The 1855 Classification of the Médoc and Sauternes, ranking châteaux into growths — based on the market price of the wines at the time."}],"checks":[{"kp":"BORDEAUX-F08","type":"flash","question":"What classification is Bordeaux famous for and what was it based on?","answer":"The 1855 Classification of the Médoc and Sauternes, ranking châteaux into growths — based on the market price of the wines at the time."}]}],"blind":[{"id":"BORDEAUX-BLIND-1","tastingProfile":"Red wine. Medium ruby. Pronounced blackcurrant, plum, cedar, graphite and subtle vanilla/cedar oak with a leafy herbal edge. Dry, high acidity, high tannin (firm, fine-grained), medium alcohol, medium-full body, medium-plus finish.","deduce":["Grape: Cabernet Sauvignon / Merlot blend","Climate: moderate","Region: Bordeaux (France)"],"justifyWith":["Blackcurrant + cedar/graphite + high firm tannin → Cabernet Sauvignon-led blend","Medium-plus acidity and leafy herbal edge → moderate maritime climate, not warm","Plum and rounder mid-palate → Merlot component in a Left Bank-style blend"]}],"quiz":[{"id":"bordeaux-Q1","kp":"BORDEAUX-F01","question":"Why is Cabernet Sauvignon planted mainly on Bordeaux's Left Bank?","correctAnswer":"It is late-ripening and thick-skinned, so it needs the warm, well-drained gravel soils to ripen fully","distractors":["It is early-ripening and prefers the cooler clay soils of the Right Bank","Its thin skins need protection from the gravel's reflected heat","It is prone to botrytis, which the gravel soils encourage"]},{"id":"bordeaux-Q2","kp":"BORDEAUX-F02","question":"What effect do the cooler, water-retentive clay soils have on Merlot in Bordeaux?","correctAnswer":"They retain water, giving large berries, body and higher alcohol","distractors":["They restrict water, giving small berries and very high tannin","They delay ripening so much that Merlot rarely ripens","They give intensely herbaceous, low-alcohol wines"]},{"id":"bordeaux-Q3","kp":"BORDEAUX-F08","question":"On what basis were châteaux ranked in the 1855 Classification of the Médoc and Sauternes?","correctAnswer":"The market price of the wines at the time","distractors":["A blind tasting panel convened by the INAO","The size of each château's vineyard holdings","The age of the vines on each estate"]},{"id":"bordeaux-Q4","kp":"BORDEAUX-F05","question":"How does Bordeaux's en primeur (futures) system work?","correctAnswer":"Classed-growth wine is sold 12-18 months before bottling, with prices released in tranches via négociants on La Place de Bordeaux","distractors":["Finished bottled wine is auctioned directly by châteaux to consumers","Wine is sold only after ten years of cellar ageing at the château","Grapes are sold on futures before harvest to négociants"]},{"id":"bordeaux-Q5","kp":"BORDEAUX-F06","question":"How are Bordeaux's botrytis-affected sweet whites typically produced?","correctAnswer":"From Sémillon and Sauvignon Blanc affected by noble rot, with multiple selective passes and very low yields (max 25 hL/ha)","distractors":["From Muscadelle dried on straw mats after a single pass","From late-harvest Riesling at high yields","From freezing the grapes on the vine to make icewine"]}]},{"id":"burgundy","title":"Burgundy","alt":"Chablis · Côte d'Or · Côte Chalonnaise · Mâconnais","country":"France","flag":"🇫🇷","blurb":"Limestone, two grapes, and a mosaic of climats. 60% white, fragmented ownership, and the world's most terroir-obsessed hierarchy.","source":"1_France20241004_final.pdf","climate":{"label":"Cool–moderate continental","scores":{"warmth":2,"sun":2,"rain":3,"diurnal":3,"risk":5}},"style":{"red":29,"white":60,"sparkling":11},"grapes":[{"name":"Chardonnay","color":"w","pct":51},{"name":"Pinot Noir","color":"r","pct":29},{"name":"Aligoté","color":"w","pct":6},{"name":"Gamay (Mâcon/regional)","color":"r","pct":11},{"name":"Other","color":"w","pct":3}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Runs north–south from Chablis (Yonne) through the Côte d'Or, Côte Chalonnaise to the Mâconnais.","Base rock is all limestone; limestone+clay = marl. Cool continental, ~700 mm rain, dry early autumn ideal.","Hazards: spring frost, hail, La Bise (cold north wind harming flowering), and recent drought stress.","60% white / 29% red / 11% Crémant; only ~4% of France's vineyard but 4% of value (≈10× average price).","Ownership is fragmented: ~3,800 domaines (avg 8 ha), 250 négociants, co-ops dominant in Chablis & Mâconnais."],"kkps":[{"id":"BURGUNDY-F01","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Chardonnay (white) and Pinot Noir (red), grown on limestone (limestone + clay = marl)."},{"id":"BURGUNDY-F02","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Kimmeridgian — limestone and clay rich in fossilised seashells; gives high acidity and 'wet stone' character. Petit Chablis sits on harder Portlandian soils."},{"id":"BURGUNDY-F03","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Vineyards are small and steep, planted at high density with Guyot training, and parcels are shared — all of which make machine harvesting impractical."},{"id":"BURGUNDY-F04","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Côte de Nuits (more marl/limestone) favours Pinot Noir; Côte de Beaune (more clay, deeper soil) favours Chardonnay."}],"checks":[{"kp":"BURGUNDY-F01","type":"flash","question":"Which two grapes dominate Burgundy and what rock underlies the region?","answer":"Chardonnay (white) and Pinot Noir (red), grown on limestone (limestone + clay = marl)."},{"kp":"BURGUNDY-F02","type":"flash","question":"What soil is Chablis known for and what is it?","answer":"Kimmeridgian — limestone and clay rich in fossilised seashells; gives high acidity and 'wet stone' character. Petit Chablis sits on harder Portlandian soils."},{"kp":"BURGUNDY-F03","type":"flash","question":"Why is most of Burgundy hand-harvested?","answer":"Vineyards are small and steep, planted at high density with Guyot training, and parcels are shared — all of which make machine harvesting impractical."},{"kp":"BURGUNDY-F04","type":"flash","question":"Which part of the Côte d'Or favours Pinot Noir vs Chardonnay, and why?","answer":"Côte de Nuits (more marl/limestone) favours Pinot Noir; Côte de Beaune (more clay, deeper soil) favours Chardonnay."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Chardonnay: early budding/early ripening; versatile; cool → apple, lemon, wet-stone (Chablis); warm → citrus, stone fruit, melon.","Pinot Noir: early budding/ripening; thin-skinned, prone to rot and to 'shutting down' in heat; whole-bunch suits it.","Aligoté: high acidity, low alcohol, neutral, usually unoaked — suited to the coolest sites.","Côte de Nuits (more marl) favours Pinot Noir; Côte de Beaune (more clay, deeper soil) favours Chardonnay."],"kkps":[{"id":"BURGUNDY-F05","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"≈60% white, 29% red, 11% Crémant de Bourgogne."},{"id":"BURGUNDY-R06","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Chardonnay: early budding/early ripening; versatile; cool → apple, lemon, wet-stone (Chablis); warm → citrus, stone fruit, melon."}],"checks":[{"kp":"BURGUNDY-F05","type":"flash","question":"Style split of Burgundy production?","answer":"≈60% white, 29% red, 11% Crémant de Bourgogne."},{"kp":"BURGUNDY-R06","type":"explain","prompt":"Starting from “Chardonnay: early budding/early ripening; versatile; cool”, explain what this leads to — through to the resulting wine style.","requiredPoints":["apple, lemon, wet-stone (Chablis); warm","citrus, stone fruit, melon"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Mostly hand-picked: tiny vineyards, high density, slopes, Guyot training and shared parcels resist mechanisation.","Best sites are mid-slope: well-drained shallow soil, good sun, frost protection, central ripening.","Yield reduction by debudding (before flowering) and green harvest (assesses bunches but risks compensation/dilution).","Organics difficult: high-density monoculture spreads disease fast; rain ~700 mm; neighbouring parcels.","Yields fall by rank: regional ~69 (R)/75 (W) → village 40–47 → Grand Cru 35 (R)/40 (W) hL/ha.","Whites: whole-bunch press; hyperoxidation can stabilise must; ambient yeast common at top levels.","Cheaper whites ferment in steel 16–18°C for primary fruit; premium ferment in 228 L barrels (creamier).","New oak rises with rank: regional little → village 20–25% → 1er 30–50% → Grand Cru 50%+ (up to 100%).","Bâtonnage stirs lees for texture and to reduce reduction; whites are more filtered in Burgundy.","Reds: sorting essential; Pinot suits whole-bunch ferment; restrained new oak to protect delicate fruit."],"kkps":[{"id":"BURGUNDY-F07","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Regional: little or none; Village: 20–25%; Premier Cru: 30–50%; Grand Cru: 50%+ (sometimes 100%)."},{"id":"BURGUNDY-R08","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Yields fall by rank: regional ~69 (R)/75 (W) → village 40–47 → Grand Cru 35 (R)/40 (W) hL/ha."},{"id":"BURGUNDY-R09","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"New oak rises with rank: regional little → village 20–25% → 1er 30–50% → Grand Cru 50%+ (up to 100%)."}],"checks":[{"kp":"BURGUNDY-F07","type":"flash","question":"How does new-oak use change with quality level in white Burgundy?","answer":"Regional: little or none; Village: 20–25%; Premier Cru: 30–50%; Grand Cru: 50%+ (sometimes 100%)."},{"kp":"BURGUNDY-R08","type":"explain","prompt":"Starting from “Yields fall by rank: regional ~69 (R)/75 (W)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["village 40–47","Grand Cru 35 (R)/40 (W) hL/ha"]},{"kp":"BURGUNDY-R09","type":"explain","prompt":"Starting from “New oak rises with rank: regional little”, explain what this leads to — through to the resulting wine style.","requiredPoints":["village 20–25%","1er 30–50%","Grand Cru 50%+ (up to 100%)"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Four-tier hierarchy: Regional (Bourgogne) → Village → Premier Cru (named climat) → Grand Cru.","52% regional, 47% village (incl. 1er cru climats), ~1% Grand Cru.","Chablis: Chardonnay only; Petit Chablis & Chablis 60, 1er Cru 58, Grand Cru 54 hL/ha.","Côte d'Or Grand Crus are single vineyards (e.g. Montrachet, Corton); 1er Crus name the climat on the label.","Newer appellations: Bourgogne Côte d'Or, and Vézelay (2017)."],"kkps":[{"id":"BURGUNDY-F10","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Regional (Bourgogne) → Village → Premier Cru (a named climat) → Grand Cru (a named vineyard)."},{"id":"BURGUNDY-R11","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Four-tier hierarchy: Regional (Bourgogne) → Village → Premier Cru (named climat) → Grand Cru."}],"checks":[{"kp":"BURGUNDY-F10","type":"flash","question":"Name the four levels of the Burgundy appellation hierarchy.","answer":"Regional (Bourgogne) → Village → Premier Cru (a named climat) → Grand Cru (a named vineyard)."},{"kp":"BURGUNDY-R11","type":"explain","prompt":"Starting from “Four-tier hierarchy: Regional (Bourgogne)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Village","Premier Cru (named climat)","Grand Cru"]}]}],"blind":[{"id":"BUR-BLIND","tastingProfile":"Medium ruby. Pronounced red cherry, raspberry, rose, forest floor, subtle clove oak. Dry, high acidity, medium silky tannin, medium alcohol, medium body.","deduce":["Grape: Pinot Noir","Climate: cool continental","Region: Côte d'Or (Burgundy)"],"justifyWith":["Red cherry/rose + earthy forest floor + high acid → cool-climate Pinot Noir","Silky medium tannin, medium body, subtle oak → Côte d'Or","Not deeply coloured/jammy → Pinot from a cool climate"]}],"quiz":[{"id":"burgundy-Q1","kp":"BURGUNDY-F01","question":"Which two grapes dominate Burgundy's still wines?","correctAnswer":"Chardonnay (white) and Pinot Noir (red)","distractors":["Sauvignon Blanc and Cabernet Franc","Riesling and Gamay","Aligoté and Syrah"]},{"id":"burgundy-Q2","kp":"BURGUNDY-F04","question":"Which part of Burgundy is more associated with Pinot Noir?","correctAnswer":"Côte de Nuits, with more marl and limestone","distractors":["Côte de Beaune, with deeper clay soils","The Mâconnais in the far south","Chablis in the far north"]},{"id":"burgundy-Q3","kp":"BURGUNDY-F10","question":"What is the correct order of Burgundy's four-tier AOC hierarchy, lowest to highest?","correctAnswer":"Regional (Bourgogne) → Village → Premier Cru → Grand Cru","distractors":["Village → Regional → Grand Cru → Premier Cru","Grand Cru → Premier Cru → Village → Regional","Petit Chablis → Chablis → Premier Cru → Grand Cru"]},{"id":"burgundy-Q4","kp":"BURGUNDY-F05","question":"Roughly what share of Burgundy's production is white wine?","correctAnswer":"About 60%","distractors":["About 29%","About 11%","About 90%"]},{"id":"burgundy-Q5","kp":"BURGUNDY-R09","question":"How does new-oak use typically change as you move up Burgundy's quality ladder?","correctAnswer":"It rises with rank, from little at regional to 50%+ (up to 100%) at Grand Cru","distractors":["It falls with rank, highest at regional level","It stays fixed at 25% across all tiers","Oak is banned above village level"]}]},{"id":"beaujolais","title":"Beaujolais","alt":"Gamay on granite","country":"France","flag":"🇫🇷","blurb":"Granite hills, 98% Gamay, and semi-carbonic maceration. From Nouveau to age-worthy Crus.","source":"1_France20241004_final.pdf","climate":{"label":"Moderate continental","scores":{"warmth":3,"sun":3,"rain":3,"diurnal":2,"risk":3}},"style":{"red":98,"white":1,"rose":1},"grapes":[{"name":"Gamay","color":"r","pct":98},{"name":"Chardonnay","color":"w","pct":2}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Southern end of Burgundy; large-volume region producing roughly as much as the rest of Burgundy combined.","Northern Beaujolais (Crus & Villages) sits on granite, gneiss and schist; flatter south on clay-limestone.","98% Gamay — bright red fruit, high acidity, low–medium tannin.","Granite slopes in the north give the most structured, ageworthy wines."],"kkps":[{"id":"BEAUJOLAIS-F01","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Gamay (98% of plantings) on granite, gneiss and schist in the north — free-draining soils that warm quickly."}],"checks":[{"kp":"BEAUJOLAIS-F01","type":"flash","question":"What grape and soil define Beaujolais?","answer":"Gamay (98% of plantings) on granite, gneiss and schist in the north — free-draining soils that warm quickly."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Gamay: high acidity, abundant red fruit (cranberry, raspberry), low tannin; thrives on free-draining granite.","A little Chardonnay is grown, especially near the Mâconnais border to the north."],"kkps":[{"id":"BEAUJOLAIS-F02","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"The third Thursday of November; about 25% of the region's production."},{"id":"BEAUJOLAIS-CG1","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Moderate semi-continental climate on granite → Gamay ripens early to modest sugar while keeping high acidity → light-bodied, juicy reds of red cherry and raspberry with low tannin and high acidity.","chain":{"factor":"Moderate semi-continental, granite","mechanism":"Early ripening; acidity retained","effect":"Low tannin, high acidity","style":"Light, juicy, fruity Gamay"}}],"checks":[{"kp":"BEAUJOLAIS-F02","type":"flash","question":"When is Beaujolais Nouveau released and how much of production is it?","answer":"The third Thursday of November; about 25% of the region's production."},{"kp":"BEAUJOLAIS-CG1","type":"explain","prompt":"Explain how the climate of Beaujolais shapes the characteristics of its signature grape(s).","requiredPoints":["Moderate semi-continental, granite","Early ripening; acidity retained","Low tannin, high acidity","Light, juicy, fruity Gamay"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Traditionally bush-vine (gobelet) trained, now more wire-trained for mechanisation in flatter areas.","Granite soils warm quickly and drain freely, aiding ripening of Gamay.","Semi-carbonic maceration: whole bunches in a vat; intracellular fermentation gives kirsch, banana, bubblegum notes.","Beaujolais Nouveau (25% of production): very short maceration, released the 3rd Thursday of November.","Beaujolais-Villages: 6–9 days maceration for more concentration.","Cru Beaujolais: longer maceration, aged in old or large barrels with little/no new oak — capable of ageing."],"kkps":[{"id":"BEAUJOLAIS-F03","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Semi-carbonic maceration — whole bunches undergo intracellular fermentation, giving bright fruit and notes like kirsch, banana and bubblegum."}],"checks":[{"kp":"BEAUJOLAIS-F03","type":"flash","question":"What winemaking technique is characteristic of Beaujolais?","answer":"Semi-carbonic maceration — whole bunches undergo intracellular fermentation, giving bright fruit and notes like kirsch, banana and bubblegum."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Beaujolais AOC (base) → Beaujolais-Villages → 10 Crus (no 'Beaujolais' on the label).","The 10 Crus: Brouilly, Côte de Brouilly, Régnié, Morgon, Chiroubles, Fleurie, Moulin-à-Vent, Chénas, Juliénas, Saint-Amour.","Moulin-à-Vent and Morgon are the most structured/ageworthy; Fleurie the most perfumed.","Beaujolais Nouveau and Villages Nouveau are released as primeur wines."],"kkps":[{"id":"BEAUJOLAIS-F04","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Any of: Brouilly, Côte de Brouilly, Régnié, Morgon, Chiroubles, Fleurie, Moulin-à-Vent, Chénas, Juliénas, Saint-Amour."},{"id":"BEAUJOLAIS-F05","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Moulin-à-Vent and Morgon."},{"id":"BEAUJOLAIS-R06","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Beaujolais AOC (base) → Beaujolais-Villages → 10 Crus (no 'Beaujolais' on the label)."}],"checks":[{"kp":"BEAUJOLAIS-F04","type":"flash","question":"Name three of the ten Beaujolais Crus.","answer":"Any of: Brouilly, Côte de Brouilly, Régnié, Morgon, Chiroubles, Fleurie, Moulin-à-Vent, Chénas, Juliénas, Saint-Amour."},{"kp":"BEAUJOLAIS-F05","type":"flash","question":"Which Crus are the most structured and ageworthy?","answer":"Moulin-à-Vent and Morgon."},{"kp":"BEAUJOLAIS-R06","type":"explain","prompt":"Starting from “Beaujolais AOC (base)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Beaujolais-Villages","10 Crus (no 'Beaujolais' on the label)"]}]}],"blind":[{"id":"BEAUJOLAIS-BLIND-1","tastingProfile":"Red wine. Pale to medium ruby. Pronounced red cherry, raspberry and kirsch with a lift of banana and bubblegum. Dry, high acidity, low tannin, medium alcohol, light body, medium finish.","deduce":["Grape: Gamay","Climate: moderate","Region: Beaujolais (France)"],"justifyWith":["Light body + low tannin + high acid + juicy red cherry/raspberry → Gamay","Banana/bubblegum/kirsch → semi-carbonic maceration of Beaujolais","Medium alcohol and modest sugar ripeness → moderate semi-continental climate"]}],"quiz":[{"id":"beaujolais-Q1","kp":"BEAUJOLAIS-F01","question":"Which grape dominates Beaujolais, making up around 98% of plantings?","correctAnswer":"Gamay","distractors":["Pinot Noir","Syrah","Cabernet Franc"]},{"id":"beaujolais-Q2","kp":"BEAUJOLAIS-F03","question":"Which winemaking technique is characteristic of Beaujolais, giving notes of kirsch, banana and bubblegum?","correctAnswer":"Semi-carbonic maceration (whole-bunch intracellular fermentation)","distractors":["Extended barrel ageing in new oak","Appassimento (drying the grapes)","Solera fractional blending"]},{"id":"beaujolais-Q3","kp":"BEAUJOLAIS-F01","question":"What are the principal soils of the better northern Beaujolais vineyards?","correctAnswer":"Granite, gneiss and schist — free-draining and quick to warm","distractors":["Kimmeridgian limestone marl","Galets roulés over clay","Chalk over flint"]},{"id":"beaujolais-Q4","kp":"BEAUJOLAIS-R06","question":"How many Crus sit at the top of the Beaujolais quality hierarchy?","correctAnswer":"10","distractors":["3","7","40"]},{"id":"beaujolais-Q5","kp":"BEAUJOLAIS-F05","question":"Which two Beaujolais Crus are best known for producing the most structured, age-worthy wines?","correctAnswer":"Moulin-à-Vent and Morgon","distractors":["Brouilly and Régnié","Fleurie and Saint-Amour","Chiroubles and Chénas"]}]},{"id":"n-rhone","title":"Northern Rhône","alt":"Côte-Rôtie · Hermitage · Cornas · Condrieu","country":"France","flag":"🇫🇷","blurb":"Steep granite terraces, Syrah in its homeland, and aromatic whites from Viognier, Marsanne and Roussanne.","source":"1_France20241004_final.pdf","climate":{"label":"Moderate continental","scores":{"warmth":3,"sun":4,"rain":2,"diurnal":3,"risk":3}},"style":{"red":90,"white":10},"grapes":[{"name":"Syrah","color":"r","pct":88},{"name":"Viognier","color":"w","pct":6},{"name":"Marsanne","color":"w","pct":4},{"name":"Roussanne","color":"w","pct":2}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Narrow strip from Vienne to Valence; steep granite slopes along the Rhône, often terraced.","Continental climate, warm with strong sunlight; the mistral wind dries the canopy and reduces disease.","Only Syrah for reds; whites from Viognier, Marsanne, Roussanne. Reds dominate (~90%)."],"kkps":[{"id":"N-RHONE-F01","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"The vineyards are on steep granite terraces, often too vertical for machinery; vines are sometimes staked individually (échalas)."}],"checks":[{"kp":"N-RHONE-F01","type":"flash","question":"Why is hand-working essential in the Northern Rhône?","answer":"The vineyards are on steep granite terraces, often too vertical for machinery; vines are sometimes staked individually (échalas)."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Syrah: deeply coloured, black fruit, pepper, floral; medium–high tannin; needs warmth and good sites to ripen.","Viognier: low acidity, apricot/peach/blossom; ripens fully only in warm sites (Condrieu, Château-Grillet).","Marsanne (full, waxy) and Roussanne (perfumed, age-worthy) blend for white Hermitage/Crozes/Saint-Joseph."],"kkps":[{"id":"N-RHONE-F02","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Syrah — giving deeply coloured wines with black fruit, pepper and floral notes."},{"id":"N-RHONE-CG1","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Moderate continental climate on steep granite slopes → Syrah ripens fully yet keeps freshness → medium-to-full reds of black pepper, violet and blackberry with medium-plus acidity and firm tannins.","chain":{"factor":"Moderate continental, granite slopes","mechanism":"Full but fresh ripening","effect":"Medium-plus acidity, firm tannin","style":"Peppery, savoury Syrah"}}],"checks":[{"kp":"N-RHONE-F02","type":"flash","question":"What is the only red grape of the Northern Rhône?","answer":"Syrah — giving deeply coloured wines with black fruit, pepper and floral notes."},{"kp":"N-RHONE-CG1","type":"explain","prompt":"Explain how the climate of Northern Rhône shapes the characteristics of its signature grape(s).","requiredPoints":["Moderate continental, granite slopes","Full but fresh ripening","Medium-plus acidity, firm tannin","Peppery, savoury Syrah"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Steep terraces require hand-working; vines staked individually (échalas) on the most vertical slopes.","Aspect is critical — south/south-east facing slopes maximise ripening at this latitude.","Soils: granite (Côte-Rôtie, Cornas, Hermitage hill), with some loess at Condrieu.","Côte-Rôtie may co-ferment up to ~20% Viognier with Syrah to stabilise colour and add perfume.","Whole-bunch/stem inclusion is common for structure and aromatics.","Maturation in barrel or larger foudres; new oak varies by producer and prestige.","Hermitage and Cornas built for long ageing; Crozes-Hermitage/Saint-Joseph often fruitier, earlier-drinking."],"kkps":[{"id":"N-RHONE-F03","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Up to ~20% Viognier — it stabilises colour and adds floral, apricot perfume."},{"id":"N-RHONE-F04","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"The strong, dry northerly wind dries the canopy, reducing fungal disease pressure."}],"checks":[{"kp":"N-RHONE-F03","type":"flash","question":"What may be co-fermented with Syrah in Côte-Rôtie and why?","answer":"Up to ~20% Viognier — it stabilises colour and adds floral, apricot perfume."},{"kp":"N-RHONE-F04","type":"flash","question":"What role does the mistral play?","answer":"The strong, dry northerly wind dries the canopy, reducing fungal disease pressure."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Crus: Côte-Rôtie & Condrieu (north), Saint-Joseph, Crozes-Hermitage & Hermitage, Cornas & Saint-Péray.","Côte-Rôtie = Syrah (+ optional Viognier); Condrieu & Château-Grillet = 100% Viognier.","Cornas = 100% Syrah, no white permitted; Hermitage makes both red (Syrah) and white (Marsanne/Roussanne).","Crozes-Hermitage is the largest appellation, much on flatter land around the Hermitage hill."],"kkps":[{"id":"N-RHONE-F05","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Viognier (Condrieu), Marsanne and Roussanne (white Hermitage / Crozes-Hermitage / Saint-Joseph)."}],"checks":[{"kp":"N-RHONE-F05","type":"flash","question":"Name the three white grapes of the Northern Rhône and a key appellation for each.","answer":"Viognier (Condrieu), Marsanne and Roussanne (white Hermitage / Crozes-Hermitage / Saint-Joseph)."}]}],"blind":[{"id":"NRH-BLIND","tastingProfile":"Deep ruby. Pronounced black pepper, blackberry, violet, smoked meat/bacon, olive. Dry, high acidity, medium(+) grippy tannin, medium(+) alcohol, oak-aged.","deduce":["Grape: Syrah","Climate: moderate continental","Region: Northern Rhône"],"justifyWith":["Black pepper + violet + smoked meat → cool/moderate Syrah","High acid + savoury olive/bacon → Northern Rhône, not warm-climate Shiraz","Medium(+) tannin, structured, not jammy → Syrah from a moderate climate"]}],"quiz":[{"id":"n-rhone-Q1","kp":"N-RHONE-F01","question":"What is distinctive about the vineyard sites of the Northern Rhône?","correctAnswer":"Steep granite terraces, often too vertical for machinery, with vines sometimes staked individually (échalas)","distractors":["Flat, fertile alluvial plains worked entirely by machine","Gently rolling limestone hills at high altitude","Reclaimed coastal marshland behind sea dykes"]},{"id":"n-rhone-Q2","kp":"N-RHONE-F02","question":"Which grape is the dominant red variety of the Northern Rhône?","correctAnswer":"Syrah, giving deeply coloured wines with black fruit, pepper and floral notes","distractors":["Grenache, giving pale, high-alcohol strawberry-scented reds","Pinot Noir, giving light, red-cherry reds","Mourvèdre, giving gamey, tannic reds"]},{"id":"n-rhone-Q3","kp":"N-RHONE-F03","question":"Why may up to ~20% Viognier be co-fermented with Syrah in the Northern Rhône?","correctAnswer":"It stabilises colour and adds floral, apricot perfume","distractors":["It raises tannin levels for longer ageing","It increases acidity to balance the wine","It deepens the wine's earthy, savoury character"]},{"id":"n-rhone-Q4","kp":"N-RHONE-F04","question":"What benefit does the strong, dry northerly wind bring to Northern Rhône vineyards?","correctAnswer":"It dries the canopy, reducing fungal disease pressure","distractors":["It raises humidity, encouraging noble rot","It warms the vineyards to aid ripening","It carries cooling sea spray inland"]},{"id":"n-rhone-Q5","kp":"N-RHONE-F05","question":"Which white grapes are used for white Hermitage, Crozes-Hermitage and Saint-Joseph?","correctAnswer":"Marsanne and Roussanne (with Viognier in Condrieu)","distractors":["Chardonnay and Pinot Blanc","Sauvignon Blanc and Sémillon","Macabeo and Grenache Blanc"]}]},{"id":"s-rhone","title":"Southern Rhône","alt":"Châteauneuf-du-Pape · Gigondas · Côtes du Rhône","country":"France","flag":"🇫🇷","blurb":"Mediterranean heat, GSM blends, galets roulés, and the mistral. Big volume and the benchmark of southern French reds.","source":"1_France20241004_final.pdf","climate":{"label":"Warm Mediterranean","scores":{"warmth":4,"sun":5,"rain":2,"diurnal":2,"risk":2}},"style":{"red":86,"rose":9,"white":5},"grapes":[{"name":"Grenache","color":"r","pct":55},{"name":"Syrah","color":"r","pct":14},{"name":"Mourvèdre","color":"r","pct":9},{"name":"Carignan/Cinsault","color":"r","pct":14},{"name":"White (Grenache Blanc, Clairette, etc.)","color":"w","pct":8}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Broad, warm Mediterranean basin south of Montélimar; the bulk of the Rhône's volume.","The mistral (cold, dry north wind) reduces disease but can damage flowering and break shoots.","Famous galets roulés (rounded pebbles) at Châteauneuf retain daytime heat and release it at night."],"kkps":[{"id":"S-RHONE-F01","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"The mistral — cold and dry; it reduces fungal disease but can damage flowering and shoots."}],"checks":[{"kp":"S-RHONE-F01","type":"flash","question":"What wind shapes the Southern Rhône and what are its effects?","answer":"The mistral — cold and dry; it reduces fungal disease but can damage flowering and shoots."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Grenache: drought- and heat-tolerant, high alcohol, red fruit and spice; oxidative, needs blending partners.","Syrah adds colour, tannin and freshness; Mourvèdre adds structure, savouriness and ageing (needs warmth).","Cinsault and Carignan add fruit and acidity; whites include Grenache Blanc, Clairette, Roussanne, Bourboulenc."],"kkps":[{"id":"S-RHONE-CG1","cat":"relationship","verified":true,"src":"1_France20241004_final.pdf","statement":"Warm Mediterranean climate with the drying Mistral wind → Grenache-led GSM blends ripen to high sugar → full-bodied reds of red fruit and garrigue with high alcohol and soft tannins.","chain":{"factor":"Warm Mediterranean, Mistral","mechanism":"High sugar ripeness","effect":"High alcohol, soft tannins","style":"Ripe, full-bodied GSM blends"}}],"checks":[{"kp":"S-RHONE-CG1","type":"explain","prompt":"Explain how the climate of Southern Rhône shapes the characteristics of its signature grape(s).","requiredPoints":["Warm Mediterranean, Mistral","High sugar ripeness","High alcohol, soft tannins","Ripe, full-bodied GSM blends"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Bush-vine (gobelet) training is traditional for Grenache, protecting fruit from sun and wind.","Drought is managed by deep roots and low yields; irrigation generally limited.","Galets and free-draining soils suit heat-loving varieties.","Blending is central — GSM (Grenache-Syrah-Mourvèdre) is the signature.","Concrete and large foudres common to avoid overt oak on Grenache-based reds.","Châteauneuf permits up to 13 (now 18 sub-varieties) grapes; styles range from traditional to modern."],"kkps":[{"id":"S-RHONE-F02","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Grenache, Syrah, Mourvèdre — the signature red blend of the Southern Rhône."},{"id":"S-RHONE-F03","cat":"fact","verified":true,"src":"1_France20241004_final.pdf","statement":"Heat- and drought-tolerant with red fruit, spice and high alcohol, but oxidative and pale — so it is usually blended with Syrah and Mourvèdre."}],"checks":[{"kp":"S-RHONE-F02","type":"flash","question":"What does the blend 'GSM' stand for?","answer":"Grenache, Syrah, Mourvèdre — the signature
