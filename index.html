e and freshness"]},{"kp":"WALKER-BAY-R07","type":"explain","prompt":"Starting from “Lower, warmer Hemel-en-Aarde Valley”, explain what this leads to — through to the resulting wine style.","requiredPoints":["riper (up to ~14% abv); higher, cooler Ridge","fresher, brighter styles"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Clay soils retain water and cover crops reduce evaporation in the cool, breezy climate.","Producers experiment beyond the standard Cape varieties (Albariño, Viognier).","Nearby Bot River and Elgin sit on the cool end of the Cape's spectrum.","Pinot Noir and Chardonnay are made in a restrained, Burgundian style.","Quality reaches Q:3–4 for both grapes."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Walker Bay is a district; Hemel-en-Aarde is a collective ward name covering three wards.","The Cape South Coast Region is defined by its cooling Atlantic influence."],"kkps":[{"id":"WALKER-BAY-F08","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"In the cool climate they aid ripeness, ensuring the grapes ripen sufficiently."}],"checks":[{"kp":"WALKER-BAY-F08","type":"flash","question":"Why do north-facing aspects help here?","answer":"In the cool climate they aid ripeness, ensuring the grapes ripen sufficiently."}]}],"blind":[{"id":"WALKER-BLIND-1","tastingProfile":"Red wine. Pale to medium ruby. Pronounced red cherry, raspberry and red plum with earthy, savoury notes. Dry, high acidity, medium tannin, medium alcohol, medium body, medium-plus finish.","deduce":["Grape: Pinot Noir","Climate: cool","Region: Walker Bay / Hemel-en-Aarde (South Africa)"],"justifyWith":["Pale colour + red cherry/raspberry + medium tannin → Pinot Noir","High acidity and bright, elegant fruit → cool maritime climate","Fresh, restrained style cooled by sea winds → Walker Bay"]}],"quiz":[{"id":"walker-bay-Q1","kp":"WALKER-BAY-F01","question":"What gives Walker Bay (Hemel-en-Aarde) its cool climate and fresh, bright wines?","correctAnswer":"Cooling sea winds from the adjacent Atlantic Ocean that slow ripening and reduce vigour","distractors":["Very high altitude above 1,000 m","A mountain rain shadow","Persistent winter snow cover"]},{"id":"walker-bay-Q2","kp":"WALKER-BAY-F04","question":"Who pioneered Walker Bay by planting Chardonnay and Pinot Noir in 1975?","correctAnswer":"Tim Hamilton-Russell","distractors":["Miguel Torres","Alejandro Fernández","Marqués de Riscal"]},{"id":"walker-bay-Q3","kp":"WALKER-BAY-R07","question":"How do the lower Hemel-en-Aarde Valley and higher Ridge sub-zones differ?","correctAnswer":"The lower, warmer Valley gives riper wines (up to ~14% abv); the higher, cooler Ridge gives fresher, brighter styles","distractors":["The Valley is cooler and fresher; the Ridge is warmer and riper","Both produce identical wines with no climatic difference","The Valley makes only whites; the Ridge only reds"]},{"id":"walker-bay-Q4","kp":"WALKER-BAY-R03","question":"Within which broader South African wine region does Walker Bay sit?","correctAnswer":"The cool Cape South Coast Region","distractors":["Stellenbosch","The Breede River Valley","Swartland"]}]},{"id":"constantia","title":"Constantia","alt":"South Africa · historic sweet Muscat & cool whites","country":"South Africa","flag":"🇿🇦","blurb":"The Cape's oldest fine-wine ward — windy, cool Sauvignon Blanc and the legendary sweet Vin de Constance.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Cool maritime","scores":{"warmth":3,"sun":4,"rain":3,"diurnal":3,"risk":2}},"style":{"white":60,"red":40},"grapes":[{"name":"Sauvignon Blanc","color":"w","pct":36},{"name":"Chardonnay","color":"w","pct":16},{"name":"Cabernet Sauvignon","color":"r","pct":12},{"name":"Shiraz","color":"r","pct":12},{"name":"Muscat","color":"w","pct":10},{"name":"Other","color":"r","pct":14}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["History dates to 1685 and the famous Vin de Constance, a sweet dried-Muscat wine from Klein Constantia.","Relatively high rainfall (~1,000 mm/year); cooling winds from False Bay, ~10 km away, make it very windy.","Soils are granite over a layer of sandstone → low vigour and good drainage.","Vineyards face east on the slopes of the Constantiaberg."],"kkps":[{"id":"CONSTANTIA-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Cooling winds off nearby False Bay (~10 km) make it cool and very windy → high-acid, aromatic Sauvignon Blanc and Chardonnay."},{"id":"CONSTANTIA-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Granite over sandstone → low vigour and good drainage."},{"id":"CONSTANTIA-R03","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Soils are granite over a layer of sandstone → low vigour and good drainage."}],"checks":[{"kp":"CONSTANTIA-F01","type":"flash","question":"Why is Constantia cool and fresh despite a warm country?","answer":"Cooling winds off nearby False Bay (~10 km) make it cool and very windy → high-acid, aromatic Sauvignon Blanc and Chardonnay."},{"kp":"CONSTANTIA-F02","type":"flash","question":"What soils underpin Constantia?","answer":"Granite over sandstone → low vigour and good drainage."},{"kp":"CONSTANTIA-R03","type":"explain","prompt":"Starting from “Soils are granite over a layer of sandstone”, explain what this leads to — through to the resulting wine style.","requiredPoints":["low vigour and good drainage"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool, windy maritime climate → Sauvignon Blanc and Chardonnay ripen slowly with high acidity → fresh, aromatic whites.","Sauvignon Blanc is the leading grape; Cabernet Sauvignon and Shiraz also feature.","Persistent wind suppresses Pinot Noir (which struggles in the windy conditions).","The historic Vin de Constance is a luscious sweet Muscat made from late, shrivelled grapes."],"kkps":[{"id":"CONSTANTIA-F04","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Vin de Constance — a sweet dried-Muscat dessert wine from Klein Constantia, dating to 1685."},{"id":"CONSTANTIA-R05","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Cool, windy maritime climate → Sauvignon Blanc and Chardonnay ripen slowly with high acidity → fresh, aromatic whites."}],"checks":[{"kp":"CONSTANTIA-F04","type":"flash","question":"What is Constantia historically famous for?","answer":"Vin de Constance — a sweet dried-Muscat dessert wine from Klein Constantia, dating to 1685."},{"kp":"CONSTANTIA-R05","type":"explain","prompt":"Starting from “Cool, windy maritime climate”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Sauvignon Blanc and Chardonnay ripen slowly with high acidity","fresh, aromatic whites"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Granite-over-sandstone soils give low vigour and good drainage; east-facing slopes catch morning sun.","Wind off False Bay both cools and reduces disease pressure.","Leading estates include Klein Constantia and Steenberg.","Sauvignon Blanc and Chardonnay are made fresh and aromatic; Vin de Constance is the iconic sweet wine.","Quality is high across the ward."],"kkps":[{"id":"CONSTANTIA-F06","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"The persistent wind suppresses it; Sauvignon Blanc, Chardonnay, Cabernet and Shiraz do better."}],"checks":[{"kp":"CONSTANTIA-F06","type":"flash","question":"Why is Pinot Noir uncommon in Constantia?","answer":"The persistent wind suppresses it; Sauvignon Blanc, Chardonnay, Cabernet and Shiraz do better."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Constantia is a ward within the Cape Town district.","The Cape Town district (established 2017) groups several cool coastal wards (Constantia, Durbanville)."],"kkps":[],"checks":[]}],"blind":[{"id":"CONSTANTIA-BLIND-1","tastingProfile":"White wine. Pale lemon. Pronounced gooseberry, passion fruit, green capsicum/herbaceous notes with elderflower and citrus. Dry, high acidity, medium alcohol, medium body, medium-plus finish.","deduce":["Grape: Sauvignon Blanc","Climate: cool","Region: Constantia (South Africa)"],"justifyWith":["Pronounced gooseberry, passion fruit and herbaceous notes → Sauvignon Blanc","High acidity and green, aromatic intensity → cool, windy maritime climate","Restrained, mineral aromatic style → Constantia near False Bay rather than a warmer Cape ward"]}],"quiz":[{"id":"constantia-Q1","kp":"CONSTANTIA-F04","question":"What is Vin de Constance?","correctAnswer":"A sweet dried-Muscat dessert wine from Klein Constantia, dating to 1685","distractors":["A fortified Cabernet from Constantia","A traditional-method sparkling wine","A dry, oaked Chardonnay flagship"]},{"id":"constantia-Q2","kp":"CONSTANTIA-F01","question":"What makes Constantia cool and very windy, favouring aromatic whites?","correctAnswer":"Cooling winds off nearby False Bay, about 10 km away","distractors":["High altitude above 1,000 m","A cold inland desert plateau","Persistent Atlantic fog with no wind"]},{"id":"constantia-Q3","kp":"CONSTANTIA-F02","question":"What are Constantia's soils?","correctAnswer":"Granite over a layer of sandstone, giving low vigour and good drainage","distractors":["Deep fertile clay with high water retention","Kimmeridgian limestone marl","Decomposed schist (llicorella)"]},{"id":"constantia-Q4","kp":"CONSTANTIA-F06","question":"How does Constantia's persistent wind affect grape growing?","correctAnswer":"It suppresses vigour and disease; Sauvignon Blanc, Chardonnay, Cabernet and Shiraz do well","distractors":["It raises humidity, encouraging rot","It warms the vineyards, forcing early harvest","It prevents any red varieties from ripening"]}]},{"id":"paarl","title":"Paarl","alt":"South Africa · warm, full-bodied reds & Chenin","country":"South Africa","flag":"🇿🇦","blurb":"A warm district north of Stellenbosch — riper, fuller reds and Chenin, with Mediterranean varieties on the rise.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Warm Mediterranean","scores":{"warmth":5,"sun":5,"rain":1,"diurnal":3,"risk":2}},"style":{"red":58,"white":42},"grapes":[{"name":"Chenin Blanc","color":"w","pct":20},{"name":"Cabernet Sauvignon","color":"r","pct":18},{"name":"Shiraz","color":"r","pct":16},{"name":"Pinotage","color":"r","pct":10},{"name":"Chardonnay","color":"w","pct":10},{"name":"Other","color":"r","pct":26}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["North of Stellenbosch and warmer, with many mesoclimates, soils and aspects giving varied styles.","Rainfall of 800–900 mm; the Berg River flows through and supplies irrigation water.","Soils are Table Mountain sandstone and granite.","Warmer overall than neighbouring Stellenbosch."],"kkps":[{"id":"PAARL-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Mediterranean varieties such as Viognier and Mourvèdre."},{"id":"PAARL-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"The Berg River, which flows through the district."}],"checks":[{"kp":"PAARL-F01","type":"flash","question":"Which varieties are increasingly planted on Paarl's warm sites?","answer":"Mediterranean varieties such as Viognier and Mourvèdre."},{"kp":"PAARL-F02","type":"flash","question":"What supplies Paarl's irrigation?","answer":"The Berg River, which flows through the district."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Warmer climate than Stellenbosch → Chenin, Cabernet, Shiraz and Pinotage ripen more fully → wines of distinct ripeness and fuller body.","Warmer sites increasingly suit Mediterranean varieties (Viognier, Mourvèdre) → ripe, full styles.","The cooler, higher Simonsberg-Paarl ward (higher diurnal range, longer ripening) → Chardonnay with distinct freshness, plus Shiraz and red blends.","Chenin Blanc remains a mainstay white alongside Chardonnay."],"kkps":[{"id":"PAARL-R03","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Warmer climate than Stellenbosch → Chenin, Cabernet, Shiraz and Pinotage ripen more fully → wines of distinct ripeness and fuller body."},{"id":"PAARL-R04","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Warmer sites increasingly suit Mediterranean varieties (Viognier, Mourvèdre) → ripe, full styles."},{"id":"PAARL-R05","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"The cooler, higher Simonsberg-Paarl ward (higher diurnal range, longer ripening) → Chardonnay with distinct freshness, plus Shiraz and red blends."}],"checks":[{"kp":"PAARL-R03","type":"explain","prompt":"Starting from “Warmer climate than Stellenbosch”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Chenin, Cabernet, Shiraz and Pinotage ripen more fully","wines of distinct ripeness and fuller body"]},{"kp":"PAARL-R04","type":"explain","prompt":"Starting from “Warmer sites increasingly suit Mediterranean varieties (Viognier, Mourvèdre)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["ripe, full styles"]},{"kp":"PAARL-R05","type":"explain","prompt":"Starting from “The cooler, higher Simonsberg-Paarl ward (higher diurnal range, longer ripening)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Chardonnay with distinct freshness, plus Shiraz and red blends"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Irrigation from the Berg River supports the warm, drier sites.","Many mesoclimates and aspects allow a wide range of grapes and styles.","Higher-elevation wards give fresher styles than the warm valley floor.","Reds are oak-aged for ripe, full-bodied profiles; Mediterranean blends are increasing.","Nederburg and Vilafonté are among the producers here."],"kkps":[{"id":"PAARL-F06","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Higher elevation and diurnal range with a longer, cooler ripening season → Chardonnay with distinct freshness, plus Shiraz and red blends."}],"checks":[{"kp":"PAARL-F06","type":"flash","question":"What makes Simonsberg-Paarl distinctive within the district?","answer":"Higher elevation and diurnal range with a longer, cooler ripening season → Chardonnay with distinct freshness, plus Shiraz and red blends."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Paarl is a district within the Coastal Region, with wards such as Simonsberg-Paarl.","Many high-volume wines are simply labelled 'Coastal Region'."],"kkps":[{"id":"PAARL-F07","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Paarl is warmer → riper, fuller-bodied reds and Chenin with more overt ripeness."}],"checks":[{"kp":"PAARL-F07","type":"flash","question":"How do Paarl wines compare to Stellenbosch?","answer":"Paarl is warmer → riper, fuller-bodied reds and Chenin with more overt ripeness."}]}],"blind":[{"id":"PAARL-BLIND-1","tastingProfile":"White wine. Medium lemon-gold. Pronounced ripe yellow apple, quince, peach and honey with a subtle waxy, savoury note; may show oak. Dry, medium(+) acidity, medium(+) alcohol, medium(+) body, medium(+) finish.","deduce":["Grape: Chenin Blanc","Climate: warm","Region: Paarl (South Africa)"],"justifyWith":["Ripe apple/quince with a waxy, honeyed note and good acidity → Chenin Blanc","Riper fruit, fuller body and higher alcohol → warm climate ripening","Overt ripeness rather than lean, racy freshness → warm Paarl, warmer than Stellenbosch"]}],"quiz":[{"id":"paarl-Q1","kp":"PAARL-R03","question":"How does Paarl compare with neighbouring Stellenbosch?","correctAnswer":"Warmer, so grapes ripen more fully, giving riper, fuller-bodied wines","distractors":["Cooler, giving lighter, higher-acid wines","Wetter, giving reliable botrytis sweet wines","Higher, giving a much larger diurnal range throughout"]},{"id":"paarl-Q2","kp":"PAARL-F02","question":"Which river flows through the Paarl district?","correctAnswer":"The Berg River","distractors":["The Breede River","The Ebro","The Olifants River"]},{"id":"paarl-Q3","kp":"PAARL-F01","question":"Which Mediterranean varieties are increasingly planted in warm Paarl?","correctAnswer":"Viognier and Mourvèdre","distractors":["Riesling and Pinot Noir","Nebbiolo and Barbera","Sauvignon Blanc and Albariño"]},{"id":"paarl-Q4","kp":"PAARL-R05","question":"Why does the Simonsberg-Paarl ward give Chardonnay with distinct freshness?","correctAnswer":"Its higher elevation and diurnal range give a longer, cooler ripening season","distractors":["River humidity encourages noble rot","Hot, dry conditions concentrate sugar","Chalk soils reflect heat onto the canopy"]}]},{"id":"elgin","title":"Elgin","alt":"South Africa · cool-climate elegance","country":"South Africa","flag":"🇿🇦","blurb":"A high, cloud-cooled plateau — fresh, fragrant Sauvignon Blanc, Chardonnay, Riesling and Pinot Noir.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Cool maritime","scores":{"warmth":2,"sun":3,"rain":4,"diurnal":3,"risk":3}},"style":{"white":58,"red":42},"grapes":[{"name":"Sauvignon Blanc","color":"w","pct":28},{"name":"Chardonnay","color":"w","pct":18},{"name":"Pinot Noir","color":"r","pct":14},{"name":"Shiraz","color":"r","pct":10},{"name":"Riesling","color":"w","pct":8},{"name":"Other","color":"r","pct":22}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["One of the coolest parts of the South African wine lands, with cooling influence from the ocean.","Altitude (200–400 m), cloud cover and the cool ocean keep temperatures low → a long growing season.","High rainfall (>1,000 mm/year) and a lot of wind; abundant cloud reduces heat.","A high, enclosed plateau famous historically for apples."],"kkps":[{"id":"ELGIN-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Altitude (200–400 m), heavy cloud cover and cool ocean influence keep temperatures low with a long growing season → fresh, elegant wines."},{"id":"ELGIN-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"It is fresher and more elegant, reflecting the cool climate."},{"id":"ELGIN-R03","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Altitude (200–400 m), cloud cover and the cool ocean keep temperatures low → a long growing season."}],"checks":[{"kp":"ELGIN-F01","type":"flash","question":"Why is Elgin so cool for South Africa?","answer":"Altitude (200–400 m), heavy cloud cover and cool ocean influence keep temperatures low with a long growing season → fresh, elegant wines."},{"kp":"ELGIN-F02","type":"flash","question":"How does Elgin Shiraz differ from warm-district Shiraz?","answer":"It is fresher and more elegant, reflecting the cool climate."},{"kp":"ELGIN-R03","type":"explain","prompt":"Starting from “Altitude (200–400 m), cloud cover and the cool ocean keep temperatures low”, explain what this leads to — through to the resulting wine style.","requiredPoints":["a long growing season"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool climate, altitude and cloud → Sauvignon Blanc, Chardonnay, Riesling and Pinot Noir ripen slowly with high acidity → fresher, more elegant, fragrant wines.","Shiraz here is also fresher and more elegant than in warmer Cape districts.","The long, cool growing season favours aromatic precision and balance.","Some sweet botrytised wines are made in the cool, humid conditions."],"kkps":[{"id":"ELGIN-F04","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Sauvignon Blanc, Chardonnay, Riesling and Pinot Noir, made in a fresh, fragrant, high-acid style."},{"id":"ELGIN-R05","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Cool climate, altitude and cloud → Sauvignon Blanc, Chardonnay, Riesling and Pinot Noir ripen slowly with high acidity → fresher, more elegant, fragrant wines."}],"checks":[{"kp":"ELGIN-F04","type":"flash","question":"Which grapes define Elgin?","answer":"Sauvignon Blanc, Chardonnay, Riesling and Pinot Noir, made in a fresh, fragrant, high-acid style."},{"kp":"ELGIN-R05","type":"explain","prompt":"Starting from “Cool climate, altitude and cloud”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Sauvignon Blanc, Chardonnay, Riesling and Pinot Noir ripen slowly with high acidity","fresher, more elegant, fragrant wines"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["High rainfall and cloud reduce heat stress; wind aids ventilation but can be a hazard.","Cool, elevated sites give naturally lower ripeness and fresher fruit.","Paul Cluver is a leading Elgin producer.","Whites and Pinot Noir are made for freshness and fragrance; botrytis sweet wines appear in suitable years.","Quality is focused on elegant, cool-climate styles."],"kkps":[{"id":"ELGIN-F06","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Its cool, humid conditions favour noble rot."}],"checks":[{"kp":"ELGIN-F06","type":"flash","question":"Why are some sweet botrytised wines made in Elgin?","answer":"Its cool, humid conditions favour noble rot."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Elgin is a district known specifically for its cool climate.","It sits among the coolest Cape wards alongside Bot River and Hemel-en-Aarde."],"kkps":[],"checks":[]}],"blind":[{"id":"ELGIN-BLIND-1","tastingProfile":"White wine. Pale lemon-green. Pronounced gooseberry, green capsicum, elderflower and lime with a flinty edge; no oak. Dry, high acidity, medium alcohol, light-to-medium body, medium-plus finish.","deduce":["Grape: Sauvignon Blanc","Climate: cool","Region: Elgin (South Africa)"],"justifyWith":["Gooseberry + green capsicum + high acidity → cool-climate Sauvignon Blanc","Pronounced aromatics with herbaceous notes → slow ripening under cloud and ocean influence","Light body and fresh, elegant profile → cool Elgin rather than a warm coastal region"]}],"quiz":[{"id":"elgin-Q1","kp":"ELGIN-F01","question":"What keeps Elgin cool and gives it a long growing sea continental climate with under 200 mm of rainfall plus some monsoon rain → irrigation from the Yellow River is essential.","Very windy conditions exacerbate the dryness; the Helan Mountains shelter the vineyards from the worst north-west desert winds.","Most quality vineyards sit on the eastern foothills of the Helan Mountains on deep, sandy, flat soils.","Bitterly cold winters (below −15°C) mean vines must be buried each winter to survive."],"kkps":[{"id":"NINGXIA-R01","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"An arid continental climate with under 200 mm of rainfall plus some monsoon rain → irrigation from the Yellow River is essential."}],"checks":[{"kp":"NINGXIA-R01","type":"explain","prompt":"Starting from “An arid continental climate with under 200 mm of rainfall plus some monsoon rain”, explain what this leads to — through to the resulting wine style.","requiredPoints":["irrigation from the Yellow River is essential"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Sunny, dry continental climate with a wide diurnal range → Cabernet Sauvignon ripens fully while keeping acidity → deeply coloured, structured reds (with a risk of green flavours if not fully ripe).","Marselan (a Cabernet Sauvignon × Grenache crossing) is the rising star → deep colour, aromatic, full body and strong flavours with rustic, coarse tannins; China is second only to France for plantings.","Deep, sandy, flat soils suit Marselan; Italian Riesling (Welschriesling) is grown for its acidity retention and cold-hardiness.","Leaf-roll virus is a problem → it can leave Cabernet and Carmenère under-ripe and green."],"kkps":[{"id":"NINGXIA-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Winters fall below −15°C, which damages Vitis vinifera → vines are buried in November and unearthed in March–April (costly, skilled manual work)."},{"id":"NINGXIA-F03","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"A Cabernet Sauvignon × Grenache crossing that is disease- and drought-resistant → deep, aromatic, full-bodied reds; China is second only to France for plantings."},{"id":"NINGXIA-F04","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Leaf-roll virus and incomplete ripening → Cabernet and Carmenère can show under-ripe, green characters."},{"id":"NINGXIA-R05","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Sunny, dry continental climate with a wide diurnal range → Cabernet Sauvignon ripens fully while keeping acidity → deeply coloured, structured reds (with a risk of green flavours if not fully ripe)."},{"id":"NINGXIA-R06","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Marselan (a Cabernet Sauvignon × Grenache crossing) is the rising star → deep colour, aromatic, full body and strong flavours with rustic, coarse tannins; China is second only to France for plantings."},{"id":"NINGXIA-R07","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Leaf-roll virus is a problem → it can leave Cabernet and Carmenère under-ripe and green."}],"checks":[{"kp":"NINGXIA-F02","type":"flash","question":"Why must vines be buried each winter in Ningxia?","answer":"Winters fall below −15°C, which damages Vitis vinifera → vines are buried in November and unearthed in March–April (costly, skilled manual work)."},{"kp":"NINGXIA-F03","type":"flash","question":"What is Marselan and why does it matter to China?","answer":"A Cabernet Sauvignon × Grenache crossing that is disease- and drought-resistant → deep, aromatic, full-bodied reds; China is second only to France for plantings."},{"kp":"NINGXIA-F04","type":"flash","question":"Why can green flavours be a problem in Ningxia reds?","answer":"L killed manual labour and raising costs."}],"checks":[{"kp":"NINGXIA-R08","type":"explain","prompt":"Starting from “Winter burial is essential below −15°C”, explain what this leads to — through to the resulting wine style.","requiredPoints":["vines are buried in November and dug out in March–April, requiring skilled manual labour and raising costs"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Ningxia is one of China's leading quality regions, centred on the Helan Mountains' Eastern Foothills.","China's most important wine grapes are black varieties; ~90% of total vine area is table/raisin grapes."],"kkps":[{"id":"NINGXIA-F09","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"They shelter the vineyards from the worst north-west desert winds in this very windy, arid climate."}],"checks":[{"kp":"NINGXIA-F09","type":"flash","question":"How do the Helan Mountains help Ningxia?","answer":"They shelter the vineyards from the worst north-west desert winds in this very windy, arid climate."}]}],"blind":[{"id":"NINGXIA-BLIND-1","tastingProfile":"Red wine. Deep ruby. Pronounced ripe blackcurrant and blackberry with cedar and vanilla oak, sometimes a faint green/herbaceous edge. Dry, medium-plus acidity, high tannins, medium-plus to high alcohol, full body, structured dark fruit, medium-plus finish.","deduce":["Grape: Cabernet Sauvignon","Climate: warm (arid continental)","Region: Ningxia (China)"],"justifyWith":["Blackcurrant + high tannin + full body → Cabernet Sauvignon","High tannin with retained acidity from a wide diurnal range → sunny, dry continental climate","A faint under-ripe/green note alongside structure → Ningxia, where incomplete ripening and leaf-roll virus can show"]}],"quiz":[{"id":"ningxia-Q1","kp":"NINGXIA-F02","question":"Why are vines buried in November and unearthed in March-April in Ningxia?","correctAnswer":"Winters fall below -15°C, which would damage Vitis vinifera","distractors":["To protect the roots from summer drought","To force a longer dormancy for higher yields","To shield buds from spring frost only"]},{"id":"ningxia-Q2","kp":"NINGXIA-F03","question":"What is Marselan, the rising star of Ningxia?","correctAnswer":"A Cabernet Sauvignon x Grenache crossing that is disease- and drought-resistant","distractors":["A white grape native to the Helan Mountains","A clone of Carmenère","A Cabernet Sauvignon x Merlot crossing"]},{"id":"ningxia-Q3","kp":"NINGXIA-R01","question":"Why is irrigation from the Yellow River essential in Ningxia?","correctAnswer":"It has an arid continental climate with under 200 mm of rainfall","distractors":["The soils are too sandy to hold any rain","Constant fog blocks the sun, slowing ripening","Heavy monsoon flooding must be drained off"]},{"id":"ningxia-Q4","kp":"NINGXIA-F04","question":"What can leave Ningxia Cabernet and Carmenère under-ripe and green?","correctAnswer":"Leaf-roll virus and incomplete ripening","distractors":["Excessive heat and sunburn","Botrytis infection at harvest","Salt-laden coastal winds"]},{"id":"ningxia-Q5","kp":"NINGXIA-F09","question":"What is the role of the Helan Mountains for Ningxia's vineyards?","correctAnswer":"They shelter the vineyards from the worst north-west desert winds","distractors":["They provide cooling ocean fog","They supply meltwater for all irrigation","They block monsoon rain from the south"]}]},{"id":"shandong","title":"Shandong","alt":"China · warm, humid maritime","country":"China","flag":"🇨🇳","blurb":"China's historic coastal region around Yantai — warm and humid, where rot and ripening are the central challenges.","source":"6__AustraliaNZSouthAfricaChina.pdf","climate":{"label":"Warm humid maritime","scores":{"warmth":4,"sun":3,"rain":4,"diurnal":2,"risk":4}},"style":{"red":60,"white":40},"grapes":[{"name":"Cabernet Sauvignon","color":"r","pct":30},{"name":"Cabernet Franc","color":"r","pct":16},{"name":"Chardonnay","color":"w","pct":14},{"name":"Petit Manseng","color":"w","pct":10},{"name":"Other","color":"r","pct":30}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A warm maritime climate with a warm monsoonal influence — China's longest-established quality area (Changyu at Yantai).","Wetter than China's interior, with rainfall at the worst point of the season (August–September) → rot is a persistent problem.","Hills to the north-west give a little protection; winds are quite strong.","No winter vine burial is needed, so old vines are possible."],"kkps":[{"id":"SHANDONG-F01","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"The humid, cloudy maritime climate is too marginal to ripen Cabernet Sauvignon consistently → earlier-ripening Cabernet Franc and Petit Manseng suit it better."},{"id":"SHANDONG-F02","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Its maritime climate is mild enough in winter → old vines can be established without burial."},{"id":"SHANDONG-R03","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Wetter than China's interior, with rainfall at the worst point of the season (August–September) → rot is a persistent problem."}],"checks":[{"kp":"SHANDONG-F01","type":"flash","question":"Why is Cabernet Franc favoured over Cabernet Sauvignon in Shandong?","answer":"The humid, cloudy maritime climate is too marginal to ripen Cabernet Sauvignon consistently → earlier-ripening Cabernet Franc and Petit Manseng suit it better."},{"kp":"SHANDONG-F02","type":"flash","question":"Why is winter burial unnecessary in Shandong?","answer":"Its maritime climate is mild enough in winter → old vines can be established without burial."},{"kp":"SHANDONG-R03","type":"explain","prompt":"Starting from “Wetter than China's interior, with rainfall at the worst point of the season (August–September)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["rot is a persistent problem"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Warm, humid, monsoonal climate with cloud → ripening is a challenge → Cabernet Franc, Cabernet and Petit Manseng are favoured over varieties that struggle here.","It is too wet for Pinot Noir and too cool/marginal for Cabernet Sauvignon to ripen consistently.","Strong winds and cloud cover affect ripening and fungal pressure.","Petit Manseng and Cabernet Franc suit the humid maritime conditions."],"kkps":[{"id":"SHANDONG-F04","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Changyu, China's oldest winery, at Yantai."},{"id":"SHANDONG-R05","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Warm, humid, monsoonal climate with cloud → ripening is a challenge → Cabernet Franc, Cabernet and Petit Manseng are favoured over varieties that struggle here."}],"checks":[{"kp":"SHANDONG-F04","type":"flash","question":"Which historic winery is based in Shandong?","answer":"Changyu, China's oldest winery, at Yantai."},{"kp":"SHANDONG-R05","type":"explain","prompt":"Starting from “Warm, humid, monsoonal climate with cloud”, explain what this leads to — through to the resulting wine style.","requiredPoints":["ripening is a challenge","Cabernet Franc, Cabernet and Petit Manseng are favoured over varieties that struggle here"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["High humidity and rain at harvest → rot is the central viticultural challenge (spraying, canopy work).","No vine burial is required → older vines can be established.","Newer vineyards target better-drained sites to combat humidity.","Producers manage fungal pressure carefully in the warm, wet climate.","Changyu, China's oldest winery, is based at Yantai."],"kkps":[{"id":"SHANDONG-F06","cat":"fact","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"Its warm, humid, monsoonal climate brings rainfall at the worst point of the season (August–September) → persistent rot pressure."},{"id":"SHANDONG-R07","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"High humidity and rain at harvest → rot is the central viticultural challenge (spraying, canopy work)."},{"id":"SHANDONG-R08","cat":"relationship","verified":true,"src":"6__AustraliaNZSouthAfricaChina.pdf","statement":"No vine burial is required → older vines can be established."}],"checks":[{"kp":"SHANDONG-F06","type":"flash","question":"Why is rot the main problem in Shandong?","answer":"Its warm, humid, monsoonal climate brings rainfall at the worst point of the season (August–September) → persistent rot pressure."},{"kp":"SHANDONG-R07","type":"explain","prompt":"Starting from “High humidity and rain at harvest”, explain what this leads to — through to the resulting wine style.","requiredPoints":["rot is the central viticultural challenge (spraying, canopy work)"]},{"kp":"SHANDONG-R08","type":"explain","prompt":"Starting from “No vine burial is required”, explain what this leads to — through to the resulting wine style.","requiredPoints":["older vines can be established"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Shandong is climatically likened to Hunter Valley or Long Island — warm and humid.","China's most important wine grapes are black varieties."],"kkps":[],"checks":[]}],"blind":[{"id":"SHANDONG-BLIND-1","tastingProfile":"Red wine. Medium ruby. Medium-intensity red plum, raspberry, leafy/green-herbal notes and cedar oak. Dry, medium-plus acidity, medium tannin, medium alcohol, medium body, medium finish.","deduce":["Grape: Cabernet Franc","Climate: warm but humid/marginal (moderate)","Region: Shandong / Yantai (China)"],"justifyWith":["Red fruit + leafy herbal character + medium tannin → Cabernet Franc rather than fully ripe Cabernet Sauvignon","Medium ripeness and restrained body → marginal, cloudy, humid maritime ripening","Earlier-ripening variety chosen → coastal Shandong where Cabernet Sauvignon struggles"]}],"quiz":[{"id":"shandong-Q1","kp":"SHANDONG-F01","question":"Why do Cabernet Franc and Petit Manseng suit Shandong better than Cabernet Sauvignon?","correctAnswer":"The humid, cloudy maritime climate is too marginal to ripen Cabernet Sauvignon consistently, so earlier-ripening varieties suit it better","distractors":["Cabernet Sauvignon is banned by Chinese wine law there","The soils are too fertile for thick-skinned varieties","The climate is too cold in winter for Cabernet Sauvignon to survive"]},{"id":"shandong-Q2","kp":"SHANDONG-R03","question":"Why is rot a persistent problem in Shandong?","correctAnswer":"It is wetter than China's interior, with rainfall at the worst point of the season (August-September)","distractors":["Its dense fog never lifts, keeping the canopy permanently wet","Irrigation water is sprayed over the canopy through summer","Snowmelt floods the vineyards just before harvest"]},{"id":"shandong-Q3","kp":"SHANDONG-F02","question":"What advantage does Shandong's mild winter give over much of China?","correctAnswer":"It is mild enough that vines do not need winter burial, so old vines can be established","distractors":["It allows a second harvest each year","It removes all frost risk so no protection is ever needed","It lets growers dry-farm without any irrigation"]},{"id":"shandong-Q4","kp":"SHANDONG-F04","question":"Which historic winery is based at Yantai in Shandong?","correctAnswer": redPoints":["it is slow to warm in spring and slow to cool in autumn, extending the season"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool continental climate → Riesling and Cabernet Franc ripen slowly with high acidity → racy, fresh whites and light-to-medium, red-fruited Cabernet Franc.","Frozen grapes left on the vine in the bitterly cold winters → Icewine, intensely sweet with high acidity (Vidal and Riesling).","Cold-hardy hybrids (and Vidal) are widely grown for reliability and Icewine; Riesling and Cabernet Franc lead the vinifera.","The lakes' moderation is what allows vinifera to ripen and survive here at all."],"kkps":[{"id":"NIAGARA-PENINSULA-F02","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Icewine — made from grapes frozen on the vine in the bitterly cold winters (especially Vidal and Riesling)."},{"id":"NIAGARA-PENINSULA-F03","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"They reliably survive harsh winters and are ideal for Icewine; Vidal in particular withstands the cold."},{"id":"NIAGARA-PENINSULA-R04","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Cool continental climate → Riesling and Cabernet Franc ripen slowly with high acidity → racy, fresh whites and light-to-medium, red-fruited Cabernet Franc."},{"id":"NIAGARA-PENINSULA-R05","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Frozen grapes left on the vine in the bitterly cold winters → Icewine, intensely sweet with high acidity (Vidal and Riesling)."}],"checks":[{"kp":"NIAGARA-PENINSULA-F02","type":"flash","question":"What is Niagara most famous for globally?","answer":"Icewine — made from grapes frozen on the vine in the bitterly cold winters (especially Vidal and Riesling)."},{"kp":"NIAGARA-PENINSULA-F03","type":"flash","question":"Why are cold-hardy hybrids and Vidal so important in Niagara?","answer":"They reliably survive harsh winters and are ideal for Icewine; Vidal in particular withstands the cold."},{"kp":"NIAGARA-PENINSULA-R04","type":"explain","prompt":"Starting from “Cool continental climate”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Riesling and Cabernet Franc ripen slowly with high acidity","racy, fresh whites and light-to-medium, red-fruited Cabernet Franc"]},{"kp":"NIAGARA-PENINSULA-R05","type":"explain","prompt":"Starting from “Frozen grapes left on the vine in the bitterly cold winters”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Icewine, intensely sweet with high acidity (Vidal and Riesling)"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Winter freeze is the key hazard → lake moderation and air drainage on the escarpment are vital.","Hybrid varieties remain a significant share (around 40% in Ontario in 2019).","Vineyards near the lakes benefit most from the moderating water.","Icewine is made from grapes that freeze naturally on the vine, then are pressed while frozen for concentrated, sweet juice.","Cabernet Franc sees restrained oak; Riesling is made dry to sweet."],"kkps":[{"id":"NIAGARA-PENINSULA-R06","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Winter freeze is the key hazard → lake moderation and air drainage on the escarpment are vital."}],"checks":[{"kp":"NIAGARA-PENINSULA-R06","type":"explain","prompt":"Starting from “Winter freeze is the key hazard”, explain what this leads to — through to the resulting wine style.","requiredPoints":["lake moderation and air drainage on the escarpment are vital"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Ontario introduced VQA legislation in 1988 → a labelled appellation requires ≥85% of grapes from it (rest from elsewhere in Ontario).","VQA Icewine must be made exclusively from grapes grown in Canada (vinifera or Vidal); wine partly from imported must is labelled 'International'."],"kkps":[{"id":"NIAGARA-PENINSULA-F07","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"They moderate the extreme continental climate — deep Lake Ontario is slow to warm and cool → it extends the season and tempers winter, allowing vinifera to ripen and survive."},{"id":"NIAGARA-PENINSULA-F08","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"≥85% of grapes from that appellation (the rest from elsewhere in Ontario); VQA Icewine must be 100% Canadian-grown."},{"id":"NIAGARA-PENINSULA-R09","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Ontario introduced VQA legislation in 1988 → a labelled appellation requires ≥85% of grapes from it (rest from elsewhere in Ontario)."}],"checks":[{"kp":"NIAGARA-PENINSULA-F07","type":"flash","question":"How do the Great Lakes make viticulture viable in Niagara?","answer":"They moderate the extreme continental climate — deep Lake Ontario is slow to warm and cool → it extends the season and tempers winter, allowing vinifera to ripen and survive."},{"kp":"NIAGARA-PENINSULA-F08","type":"flash","question":"What does Ontario VQA require for a stated appellation?","answer":"≥85% of grapes from that appellation (the rest from elsewhere in Ontario); VQA Icewine must be 100% Canadian-grown."},{"kp":"NIAGARA-PENINSULA-R09","type":"explain","prompt":"Starting from “Ontario introduced VQA legislation in 1988”, explain what this leads to — through to the resulting wine style.","requiredPoints":["a labelled appellation requires ≥85% of grapes from it (rest from elsewhere in Ontario)"]}]}],"blind":[{"id":"NIAGARA-BLIND-1","tastingProfile":"White wine. Medium gold. Pronounced apricot, peach, honey, mango and orange marmalade. Sweet, high acidity, medium alcohol, full body, long finish.","deduce":["Grape: Vidal (or Riesling)","Climate: cool","Region: Niagara Peninsula (Canada)"],"justifyWith":["Intense sweetness + dried-stone-fruit/marmalade concentration → grapes frozen on the vine (Icewine)","Very high acidity balancing the sweetness → cool continental climate","Cold-hardy Vidal/Riesling with searing acidity → Niagara Peninsula Icewine"]}],"quiz":[{"id":"niagara-peninsula-Q1","kp":"NIAGARA-PENINSULA-F02","question":"What is Niagara Peninsula's most famous wine style?","correctAnswer":"Icewine, made from grapes frozen on the vine in the bitterly cold winters","distractors":["Fortified Vin Doux Naturel","Botrytised late-harvest Semillon","Appassimento dried-grape reds"]},{"id":"niagara-peninsula-Q2","kp":"NIAGARA-PENINSULA-R01","question":"How does deep Lake Ontario moderate the Niagara Peninsula's climate?","correctAnswer":"It is slow to warm in spring and slow to cool in autumn, extending the season","distractors":["It radiates intense summer heat onto the vines","It causes a permanent rain shadow over the vineyards","It cools the region only during the harvest"]},{"id":"niagara-peninsula-Q3","kp":"NIAGARA-PENINSULA-R04","question":"What style results from the Niagara Peninsula's cool continental climate?","correctAnswer":"Racy, fresh whites and light-to-medium, red-fruited Cabernet Franc","distractors":["Full-bodied, high-alcohol Cabernet Sauvignon","Soft, jammy Grenache blends","Oxidative, nutty whites"]},{"id":"niagara-peninsula-Q4","kp":"NIAGARA-PENINSULA-F08","question":"Under Ontario's VQA rules, how much of an appellation wine's grapes must come from that appellation?","correctAnswer":"At least 85% (the rest from elsewhere in Ontario); VQA Icewine must be 100% Canadian-grown","distractors":["At least 50%, with no further requirement","100% for all VQA wines without exception","At least 75%, with the rest from anywhere in Canada"]}]},{"id":"okanagan-valley","title":"Okanagan Valley","alt":"Canada · British Columbia · full-bodied reds","country":"Canada","flag":"🇨🇦","blurb":"British Columbia's sun-drenched, lake-moderated valley — riper, fuller reds and stone-fruited whites in a near-desert.","source":"5__NorthSouthAmerica.pdf","climate":{"label":"Continental, semi-desert (lake-moderated)","scores":{"warmth":4,"sun":5,"rain":1,"diurnal":4,"risk":4}},"style":{"red":52,"white":48},"grapes":[{"name":"Merlot","color":"r","pct":18},{"name":"Pinot Gris","color":"w","pct":14},{"name":"Chardonnay","color":"w","pct":12},{"name":"Cabernet Sauvignon","color":"r","pct":10},{"name":"Pinot Noir","color":"r","pct":10},{"name":"Other","color":"r","pct":36}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["On the opposite side of the country to Ontario, at 48–51°N → very long summer daylight hours.","The deep Okanagan Lake moderates the northern half of the valley (smaller than the Great Lakes, but enough to temper extremes).","It lies in the rain shadow of two mountain ranges → a dry, near-desert climate with drought in hotter years.","The extreme southern end is semi-desert; drip irrigation is common where drought occurs."],"kkps":[{"id":"OKANAGAN-VALLEY-F01","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Its warm, sunny, dry (rain-shadow) climate, moderated by Okanagan Lake, ripens Merlot and Cabernet more fully → higher tannin, higher alcohol and riper fruit."},{"id":"OKANAGAN-VALLEY-F02","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"The deep lake moderates the northern half, tempering the continental extremes enough for quality viticulture."},{"id":"OKANAGAN-VALLEY-F03","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"It sits in the rain shadow of two mountain ranges → a dry, near-desert climate with drought in hot years; drip irrigation is common."},{"id":"OKANAGAN-VALLEY-R04","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"On the opposite side of the country to Ontario, at 48–51°N → very long summer daylight hours."},{"id":"OKANAGAN-VALLEY-R05","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"It lies in the rain shadow of two mountain ranges → a dry, near-desert climate with drought in hotter years."}],"checks":[{"kp":"OKANAGAN-VALLEY-F01","type":"flash","question":"Why are Okanagan reds fuller-bodied than Ontario's?","answer":"Its warm, sunny, dry (rain-shadow) climate, moderated by Okanagan Lake, ripens Merlot and Cabernet more fully → higher tannin, higher alcohol and riper fruit."},{"kp":"OKANAGAN-VALLEY-F02","type":"flash","question":"How does Okanagan Lake help the valley?","answer":"The deep lake moderates the northern half, tempering the continental extremes enough for quality viticulture."},{"kp":"OKANAGAN-VALLEY-F03","type":"flash","question":"Why is irrigation essential in the Okanagan?","answer":"It sits in the rain shadow of two mountain ranges → a dry, near-desert climate with drought in hot years; drip irrigation is common."},{"kp":"OKANAGAN-VALLEY-R04","type":"explain","prompt":"Starting from “On the opposite side of the country to Ontario, at 48–51°N”, explain what this leads to — through to the resulting wine style.","requiredPoints":["very long summer daylight hours"]},{"kp":"OKANAGAN-VALLEY-R05","type":"explain","prompt":"Starting from “It lies in the rain shadow of two mountain ranges”, explain what this leads to — through to the resulting wine style.","requiredPoints":["a dry, near-desert climate with drought in hotter years"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Warm, sunny, dry climate (lake-moderated) → Merlot and Cabernet ripen more fully than in Ontario → fuller-bodied reds with higher tannin, higher alcohol and riper fruit.","The long daylight hours and warmth give Chardonnay riper, stone-fruited styles with more body than Ontario.","The cooler northern half (lake-moderated) suits Pinot Gris, Pinot Noir and Chardonnay; the warm south suits Bordeaux reds.","The rain-shadow dryness keeps disease pressure low but makes irrigation essential."],"kkps":[{"id":"OKANAGAN-VALLEY-R06","cat":"relationship","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"Warm, sunny, dry climate (lake-moderated) → Merlot and Cabernet ripen more fully than in Ontario → fuller-bodied reds with higher tannin, higher alcohol and riper fruit."}],"checks":[{"kp":"OKANAGAN-VALLEY-R06","type":"explain","prompt":"Starting from “Warm, sunny, dry climate (lake-moderated)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Merlot and Cabernet ripen more fully than in Ontario","fuller-bodied reds with higher tannin, higher alcohol and riper fruit"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Drip irrigation is common in the dry, drought-prone climate (Okanagan Lake and rivers).","Vineyards range across a long, narrow valley with varied aspects and altitudes.","Winter cold remains a hazard at the margins.","Reds are oak-aged for ripe, full-bodied profiles; whites are made fresh and fruit-forward.","British Columbia followed Ontario with VQA legislation in the 1990s."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["BC VQA requires 100% of grapes from the region of appellation.","Grapes grown in Canada that don't qualify for VQA are labelled 'Product of Canada'."],"kkps":[{"id":"OKANAGAN-VALLEY-F07","cat":"fact","verified":true,"src":"5__NorthSouthAmerica.pdf","statement":"BC VQA requires 100% of grapes from the appellation (Ontario requires ≥85%)."}],"checks":[{"kp":"OKANAGAN-VALLEY-F07","type":"flash","question":"What does BC VQA require, versus Ontario VQA?","answer":"BC VQA requires 100% of grapes from the appellation (Ontario requires ≥85%)."}]}],"blind":[{"id":"OKANAGAN-BLIND-1","tastingProfile":"Red wine. Deep ruby. Pronounced ripe black plum, blackberry and black cherry with subtle oak spice. Dry, medium-plus acidity, medium-plus to high tannin, high alcohol, full body, medium-plus finish.","deduce":["Grape: Merlot (with Cabernet Sauvignon)","Climate: warm","Region: Okanagan Valley (Canada)"],"justifyWith":["Ripe black plum/blackberry + full body + high alcohol → warm-climate ripening","Retained medium-plus acidity → large diurnal range and northern latitude","Fuller, riper Bordeaux-variety reds in Canada → lake-moderated, rain-shadow Okanagan"]}],"quiz":[{"id":"okanagan-valley-Q1","kp":"OKANAGAN-VALLEY-F01","question":"How does Okanagan Valley's warm, sunny, dry climate shape its Merlot and Cabernet?","correctAnswer":"They ripen more fully, giving higher tannin, higher alcohol and riper fruit","distractors":["They stay lean with low alcohol and herbaceous fruit","They are used only for rosé","They never ripen and are unsuitable"]},{"id":"okanagan-valley-Q2","kp":"OKANAGAN-VALLEY-F02","question":"What moderates the continental extremes in the northern half of the Okanagan Valley?","correctAnswer":"The deep Okanagan Lake","distractors":["A cooling Pacific sea breeze","Persistent fog from the coast","The Gulf Stream"]},{"id":"okanagan-valley-Q3","kp":"OKANAGAN-VALLEY-F03","question":"Why is the Okanagan Valley a dry, near-desert climate where drip irrigation is common?","correctAnswer":"It sits in the rain shadow of two mountain ranges","distractors":["It lies far inland with no water source","It has very sandy, free-draining soils","It experiences year-round drying winds"]},{"id":"okanagan-valley-Q4","kp":"OKANAGAN-VALLEY-F07","question":"What percentage of grapes must come from the appellation under BC VQA rules?","correctAnswer":"100%","distractors":["85%","75%","95%"]}]},{"id":"barolo","title":"Barolo","alt":"Italy · Piemonte · 100% Nebbiolo","country":"Italy","flag":"🇮🇹","blurb":"Italy's most prized red — powerful, perfumed, long-lived Nebbiolo from the Langhe hills.","source":"4__ItalyGreece.pdf","climate":{"label":"Moderate continental","scores":{"warmth":3,"sun":4,"rain":3,"diurnal":4,"risk":3}},"style":{"red":100},"grapes":[{"name":"Nebbiolo","color":"r","pct":100}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A cluster of villages south-west of Alba in the Langhe (Piemonte); the Alps shelter it from cold north winds and the Apennines from Mediterranean weather.","Vineyards face south to south-west, typically 200–400 m → good sunlight interception with cooling influences for a long growing season.","A moderate continental climate (cold winters, hot summers) with late-September/October rain a threat to late-ripening Nebbiolo.","Two soil types split the zone: north-west blue-grey marl and south-east compacted yellow-grey sand and clay."],"kkps":[{"id":"BAROLO-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"It is early budding (frost-prone) and very late ripening → it needs maximum sunlight and a long season on calcareous marl to ripen fully into perfumed, high-acid, high-tannin wines."},{"id":"BAROLO-R02","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Vineyards face south to south-west, typically 200–400 m → good sunlight interception with cooling influences for a long growing season."}],"checks":[{"kp":"BAROLO-F01","type":"flash","question":"Why does Nebbiolo need the best south-facing Langhe sites?","answer":"It is early budding (frost-prone) and very late ripening → it needs maximum sunlight and a long season on calcareous marl to ripen fully into perfumed, high-acid, high-tannin wines."},{"kp":"BAROLO-R02","type":"explain","prompt":"Starting from “Vineyards face south to south-west, typically 200–400 m”, explain what this leads to — through to the resulting wine style.","requiredPoints":["good sunlight interception with cooling influences for a long growing season"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cool, late-ripening conditions on calcareous marl → Nebbiolo keeps very high acidity and high tannins → pale, perfumed reds (rose, red cherry, tar) that are full-bodied and built to age.","North-west blue-grey marl → lighter, more aromatic wines drinkable in a few years.","South-east sand and clay → closed, more tannic wines that need cellaring for 10–15 years.","Nebbiolo is early budding (frost risk) and very late ripening, so only the best south-facing Langhe sites ripen it fully."],"kkps":[{"id":"BAROLO-R03","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Cool, late-ripening conditions on calcareous marl → Nebbiolo keeps very high acidity and high tannins → pale, perfumed reds (rose, red cherry, tar) that are full-bodied and built to age."},{"id":"BAROLO-R04","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"North-west blue-grey marl → lighter, more aromatic wines drinkable in a few years."},{"id":"BAROLO-R05","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"South-east sand and clay → closed, more tannic wines that need cellaring for 10–15 years."}],"checks":[{"kp":"BAROLO-R03","type":"explain","prompt":"Starting from “Cool, late-ripening conditions on calcareous marl”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Nebbiolo keeps very high acidity and high tannins","pale, perfumed reds (rose, red cherry, tar) that are full-bodied and built to age"]},{"kp":"BAROLO-R04","type":"explain","prompt":"Starting from “North-west blue-grey marl”, explain what this leads to — through to the resulting wine style.","requiredPoints":["lighter, more aromatic wines drinkable in a few years"]},{"kp":"BAROLO-R05","type":"explain","prompt":"Starting from “South-east sand and clay”, explain what this leads to — through to the resulting wine style.","requiredPoints":["closed, more tannic wines that need cellaring for 10–15 years"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Vines are pruned high as the first buds are infertile; single Guyot is most common.","Cluster thinning and mass selection (low vigour, open bunches, small berries) raise quality and colour.","Excess sun exposure is a problem, so canopy management is careful.","Traditional: very long maceration (3–4 months) and 5–8 years in large old casks → softer tannins, less overt fruit.","Modern: shorter maceration, some new French oak → deeper colour, softer tannins (e.g. Elio Altare, Gaja).","Most producers now use large oak (only a small % new) so oak doesn't mask Nebbiolo's delicate aromas."],"kkps":[{"id":"BAROLO-R06","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Traditional: very long maceration (3–4 months) and 5–8 years in large old casks → softer tannins, less overt fruit."},{"id":"BAROLO-R07","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Modern: shorter maceration, some new French oak → deeper colour, softer tannins (e.g. Elio Altare, Gaja)."}],"checks":[{"kp":"BAROLO-R06","type":"explain","prompt":"Starting from “Traditional: very long maceration (3–4 months) and 5–8 years in large old casks”, explain what this leads to — through to the resulting wine style.","requiredPoints":["softer tannins, less overt fruit"]},{"kp":"BAROLO-R07","type":"explain","prompt":"Starting from “Modern: shorter maceration, some new French oak”, explain what this leads to — through to the resulting wine style.","requiredPoints":["deeper colour, softer tannins (e.g. Elio Altare, Gaja)"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Barolo DOCG is 100% Nebbiolo; aged 3 years + 2 months (18 months in wood); Riserva 5 years + 2 months.","Since 2010 an official MGA system (170 named sub-zones, e.g. Cannubi, Bussia) may appear on labels; ~90% of producers use at least one MGA."],"kkps":[{"id":"BAROLO-F08","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"100% Nebbiolo, aged a minimum of 3 years + 2 months (18 months in wood); Riserva 5 years + 2 months."},{"id":"BAROLO-F09","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"North-west blue-grey marl → lighter, more aromatic, earlier-drinking; south-east sand and clay → more closed and tannic, needing 10–15 years."},{"id":"BAROLO-F10","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Officially delimited named sub-zones (e.g. Cannubi, Bussia) — 170 in Barolo — that may be stated on the label."}],"checks":[{"kp":"BAROLO-F08","type":"flash","question":"What is the grape and ageing requirement for Barolo DOCG?","answer":"100% Nebbiolo, aged a minimum of 3 years + 2 months (18 months in wood); Riserva 5 years + 2 months."},{"kp":"BAROLO-F09","type":"flash","question":"How do Barolo's two main soils differ in style?","answer":"North-west blue-grey marl → lighter, more aromatic, earlier-drinking; south-east sand and clay → more closed and tannic, needing 10–15 years."},{"kp":"BAROLO-F10","type":"flash","question":"What does the MGA system denote in Barolo?","answer":"Officially delimited named sub-zones (e.g. Cannubi, Bussia) — 170 in Barolo — that may be stated on the label."}]}],"blind":[{"id":"BAROLO-BLIND-1","tastingProfile":"Red wine. Pale-to-medium ruby, garnet at the rim. Pronounced red cherry, dried rose, tar, leather and truffle aromas. Dry, high acidity, high firm tannins, high alcohol, full body, very long finish.","deduce":["Grape: Nebbiolo","Climate: moderate","Region: Barolo (Piedmont, Italy)"],"justifyWith":["Pale colour but high acid and high firm tannin → Nebbiolo","Rose, tar, leather and truffle aromatics → classic Barolo Nebbiolo","Full body and ageing potential with cool-edged structure → late-ripening Nebbiolo on Langhe calcareous marl"]}],"quiz":[{"id":"barolo-Q1","kp":"BAROLO-F08","question":"What are the legal requirements for Barolo DOCG?","correctAnswer":"100% Nebbiolo, aged a minimum of 3 years + 2 months (18 months in wood); Riserva 5 years + 2 months","distractors":["100% Sangiovese, aged 2 years minimum","A Nebbiolo–Barbera blend, aged 1 year","100% Nebbiolo, aged 6 years minimum in steel"]},{"id":"barolo-Q2","kp":"BAROLO-F01","question":"Why does Nebbiolo need maximum sunlight and a long season in Barolo?","correctAnswer":"It is early budding (frost-prone) and very late ripening","distractors":["It is late budding and very early ripening","It is highly disease-prone in humidity","It needs heat to develop deep colour and high tannin"]},{"id":"barolo-Q3","kp":"BAROLO-R03","question":"Which describes the typical profile of Barolo?","correctAnswer":"Pale, perfumed (rose, red cherry, tar), full-bodied, with very high acidity and high tannin, built to age","distractors":["Deeply coloured, low-acid, soft and fruity for early drinking","Pale, light-bodied with low tannin and low acidity","Deep, jammy, high-alcohol with low acidity"]},{"id":"barolo-Q4","kp":"BAROLO-F10","question":"What are Barolo's MGAs (e.g. Cannubi, Bussia)?","correctAnswer":"Officially delimited named sub-zones — 170 in Barolo — that may be stated on the label","distractors":["Producer brand names with no legal status","Mandatory ageing categories","Permitted grape varieties in the blend"]},{"id":"barolo-Q5","kp":"BAROLO-R06","question":"What characterises the traditional approach to making Barolo?","correctAnswer":"Very long maceration (3–4 months) and 5–8 years in large old casks, giving softer tannins and less overt fruit","distractors":["Carbonic maceration and early bottling for fruity wines","Short maceration with abundant new French oak","Stainless-steel ageing only, with no oak contact"]}]},{"id":"barbaresco","title":"Barbaresco","alt":"Italy · Piemonte · 100% Nebbiolo","country":"Italy","flag":"🇮🇹","blurb":"Barolo's slightly softer, earlier-ripening sibling — perfumed, age-worthy Nebbiolo from villages east of Alba.","source":"4__ItalyGreece.pdf","climate":{"label":"Moderate continental","scores":{"warmth":4,"sun":4,"rain":3,"diurnal":4,"risk":3}},"style":{"red":100},"grapes":[{"name":"Nebbiolo","color":"r","pct":100}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A cluster of villages east of Alba in the Langhe, about a third the size of Barolo and sharing many of its characteristics.","Slightly lower average altitude (~300 m) and a marginally warmer climate than Barolo.","Calcareous marl dominates in the north; compacted sand and clay in the south.","A moderate continental climate, sheltered by the Alps and Apennines."],"kkps":[{"id":"BARBARESCO-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Slightly lower and warmer → Nebbiolo ripens about a week earlier → subtly riper and marginally more approachable, with shorter minimum ageing, while keeping high acid and tannin."}],"checks":[{"kp":"BARBARESCO-F01","type":"flash","question":"How does Barbaresco differ from Barolo in climate and style?","answer":"Slightly lower and warmer → Nebbiolo ripens about a week earlier → subtly riper and marginally more approachable, with shorter minimum ageing, while keeping high acid and tannin."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Slightly warmer, lower sites → Nebbiolo ripens a touch earlier (harvest ~a week before Barolo) → subtly riper, marginally more approachable wines, still high in acid and tannin.","Calcareous marl in the north → the most perfumed, elegant wines.","Nebbiolo here keeps its hallmark pale colour turning to garnet, with rose, tar and red-cherry aromatics.","The wines remain full-bodied and age-worthy, just a shade softer than Barolo."],"kkps":[{"id":"BARBARESCO-F02","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"2 years + 2 months (9 months in wood); Riserva 4 years + 2 months — shorter than Barolo."},{"id":"BARBARESCO-F03","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"100% Nebbiolo."},{"id":"BARBARESCO-R04","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Slightly warmer, lower sites → Nebbiolo ripens a touch earlier (harvest ~a week before Barolo) → subtly riper, marginally more approachable wines, still high in acid and tannin."},{"id":"BARBARESCO-R05","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Calcareous marl in the north → the most perfumed, elegant wines."}],"checks":[{"kp":"BARBARESCO-F02","type":"flash","question":"What are Barbaresco's ageing requirements?","answer":"2 years + 2 months (9 months in wood); Riserva 4 years + 2 months — shorter than Barolo."},{"kp":"BARBARESCO-F03","type":"flash","question":"What grape must Barbaresco be made from?","answer":"100% Nebbiolo."},{"kp":"BARBARESCO-R04","type":"explain","prompt":"Starting from “Slightly warmer, lower sites”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Nebbiolo ripens a touch earlier (harvest ~a week before Barolo)","subtly riper, marginally more approachable wines, still high in acid and tannin"]},{"kp":"BARBARESCO-R05","type":"explain","prompt":"Starting from “Calcareous marl in the north”, explain what this leads to — through to the resulting wine style.","requiredPoints":["the most perfumed, elegant wines"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["As in Barolo: high pruning (infertile basal buds), Guyot training, cluster thinning for quality.","Top sites are the named crus (MGAs) on the best aspects.","Careful canopy management balances ripeness against excess sun.","Top wines: pick only ripe skins and seeds, 3–4 weeks maceration, age in large oak (small % new).","Modernists (e.g. Angelo Gaja) sought deeper colour and softer tannins with new oak.","Overt new-oak vanilla is avoided so it doesn't mask Nebbiolo's aromas."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Barbaresco DOCG is 100% Nebbiolo; aged 2 years + 2 months (9 months in wood), shorter than Barolo; Riserva 4 years + 2 months.","An MGA system (66 named sub-zones, e.g. Rabajà) operates here too; max yield 56 hL/ha, same as Barolo."],"kkps":[],"checks":[]}],"blind":[{"id":"BARBARESCO-BLIND-1","tastingProfile":"Red wine. Pale-to-medium garnet. Pronounced red cherry, dried rose, tar, leather and a savoury, earthy note with subtle oak. Dry, high acidity, high (firm, drying) tannin, medium(+) alcohol, medium(+) body, long finish.","deduce":["Grape: Nebbiolo","Climate: moderate","Region: Barbaresco (Piedmont, Italy)"],"justifyWith":["Pale garnet colour with rose, tar and high acid and high tannin → Nebbiolo","Savoury, structured profile that is subtly riper and approachable → Barbaresco rather than Barolo","Firm tannin and high acidity → moderate continental climate, not a hot region"]}],"quiz":[{"id":"barbaresco-Q1","kp":"BARBARESCO-F03","question":"Which grape is Barbaresco made from?","correctAnswer":"100% Nebbiolo","distractors":["100% Barbera","A Nebbiolo-Barbera blend","100% Sangiovese"]},{"id":"barbaresco-Q2","kp":"BARBARESCO-F01","question":"Why does Barbaresco tend to be subtly riper and more approachable than Barolo?","correctAnswer":"Its slightly lower, warmer sites ripen Nebbiolo about a week earlier","distractors":["It is blended with softer grapes","It is grown at much higher, cooler altitude","It uses carbonic maceration"]},{"id":"barbaresco-Q3","kp":"BARBARESCO-F02","question":"What is Barbaresco's minimum ageing requirement?","correctAnswer":"2 years + 2 months (9 months in wood); Riserva 4 years + 2 months","distractors":["5 years total, all in oak","Crianza, Reserva and Gran Reserva tiers","1 year minimum with no wood requirement"]},{"id":"barbaresco-Q4","kp":"BARBARESCO-R05","question":"What style do the calcareous-marl soils in Barbaresco's north tend to give?","correctAnswer":"The most perfumed, elegant wines","distractors":["The most robust, tannic, slow-ageing wines","Soft, fruity wines for early drinking","Deeply coloured, jammy wines"]}]},{"id":"chianti-classico","title":"Chianti Classico","alt":"Italy · Tuscany · Sangiovese","country":"Italy","flag":"🇮🇹","blurb":"Tuscany's historic heartland — savoury, sour-cherry Sangiovese from the hills between Florence and Siena.","source":"4__ItalyGreece.pdf","climate":{"label":"Warm Mediterranean (hilly)","scores":{"warmth":4,"sun":4,"rain":2,"diurnal":3,"risk":2}},"style":{"red":100},"grapes":[{"name":"Sangiovese","color":"r","pct":90},{"name":"Other (Canaiolo, Merlot, Cabernet)","color":"r","pct":10}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["The hilly historic zone between Florence and Siena; the best wines come from 200–500 m.","A warm Mediterranean climate with cool nights and a lengthening growing season at altitude.","Rainfall is adequate (autumn/winter), with summer drought and heat a hazard.","Soils include crumbly galestro (marl) and alberese (limestone-clay), plus sandstone."],"kkps":[{"id":"CHIANTI-CLASSICO-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Its warm hills are cooled by altitude and cool nights → Sangiovese ripens slowly, keeping high acidity and tannin → sour-cherry, savoury, age-worthy reds."}],"checks":[{"kp":"CHIANTI-CLASSICO-F01","type":"flash","question":"Why is Chianti Classico Sangiovese savoury and high in acid rather than jammy?","answer":"Its warm hills are cooled by altitude and cool nights → Sangiovese ripens slowly, keeping high acidity and tannin → sour-cherry, savoury, age-worthy reds."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Warm but altitude-cooled hills with cool nights → Sangiovese ripens slowly while keeping high acidity and high tannins → savoury, sour-cherry reds of medium-to-full body that age well.","Galestro and alberese soils → aromatic wines with the potential to age.","Sangiovese is thin-skinned and late-ripening, doing best on sunny south/south-east slopes.","Warming climate is pushing growers to higher, less sunny sites to retain freshness."],"kkps":[{"id":"CHIANTI-CLASSICO-F02","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"The top tier: ≥90% Sangiovese, single estate/vineyard fruit, ≥30 months ageing, and may name one of 11 UGA."},{"id":"CHIANTI-CLASSICO-R03","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Warm but altitude-cooled hills with cool nights → Sangiovese ripens slowly while keeping high acidity and high tannins → savoury, sour-cherry reds of medium-to-full body that age well."},{"id":"CHIANTI-CLASSICO-R04","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Galestro and alberese soils → aromatic wines with the potential to age."}],"checks":[{"kp":"CHIANTI-CLASSICO-F02","type":"flash","question":"What defines Chianti Classico Gran Selezione?","answer":"The top tier: ≥90% Sangiovese, single estate/vineyard fruit, ≥30 months ageing, and may name one of 11 UGA."},{"kp":"CHIANTI-CLASSICO-R03","type":"explain","prompt":"Starting from “Warm but altitude-cooled hills with cool nights”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Sangiovese ripens slowly while keeping high acidity and high tannins","savoury, sour-cherry reds of medium-to-full body that age well"]},{"kp":"CHIANTI-CLASSICO-R04","type":"explain","prompt":"Starting from “Galestro and alberese soils”, explain what this leads to — through to the resulting wine style.","requiredPoints":["aromatic wines with the potential to age"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Cordon or Guyot with VSP; the Chianti Classico 2000 clones (smaller berries, thicker skins, open bunches) give deeper colour and more intensity.","Esca and wild boar are managed (avoid large pruning cuts; fencing).","Yield can be reduced to raise quality from a naturally vigorous variety.","1980s–90s 'Super Tuscan' international style: deeper colour, plummy Merlot fruit, new-oak vanilla.","Recent trend back to tradition: pale colour, sour cherry, Sangiovese-dominant, restrained new oak (large botti).","Maceration of 7–10 days for early drinking, 15–25 days for age-worthy wines."],"kkps":[{"id":"CHIANTI-CLASSICO-F05","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"≥80% Sangiovese (in practice ~90%), with no white grapes permitted in the blend."}],"checks":[{"kp":"CHIANTI-CLASSICO-F05","type":"flash","question":"What is the grape requirement for Chianti Classico DOCG?","answer":"≥80% Sangiovese (in practice ~90%), with no white grapes permitted in the blend."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Chianti Classico DOCG requires ≥80% Sangiovese (in practice ~90%), no white grapes; max yield 52.5 hL/ha.","Gran Selezione (top tier) must be ≥90% Sangiovese from a single estate/vineyard, aged ≥30 months, and may name 1 of 11 UGA."],"kkps":[{"id":"CHIANTI-CLASSICO-F06","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Galestro (crumbly marl) and alberese (limestone-clay) → aromatic wines with ageing potential."}],"checks":[{"kp":"CHIANTI-CLASSICO-F06","type":"flash","question":"Name two key Chianti Classico soils and their effect.","answer":"Galestro (crumbly marl) and alberese (limestone-clay) → aromatic wines with ageing potential."}]}],"blind":[{"id":"CHIANTI-BLIND-1","tastingProfile":"Red wine. Medium ruby with garnet at the rim. Pronounced sour red cherry, dried herbs, leather and savoury earth with subtle oak. Dry, high acidity, high grippy tannins, medium-plus alcohol, medium-to-full body, long finish.","deduce":["Grape: Sangiovese","Climate: moderate","Region: Chianti Classico (Italy/Tuscany)"],"justifyWith":["Sour cherry + high acidity + high tannin → Sangiovese","Savoury, leathery, herbal character → classic central-Italian Sangiovese","Medium body with retained freshness → warm hills cooled by altitude and cool nights"]}],"quiz":[{"id":"chianti-classico-Q1","kp":"CHIANTI-CLASSICO-F05","question":"What is the minimum Sangiovese requirement for Chianti Classico, and may white grapes be used?","correctAnswer":"At least 80% Sangiovese, with no white grapes permitted","distractors":["At least 50% Sangiovese, white grapes allowed","100% Sangiovese required","At least 70% Sangiovese, white grapes required"]},{"id":"chianti-classico-
