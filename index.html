Q2","kp":"CHIANTI-CLASSICO-F02","question":"What defines the top Gran Selezione tier of Chianti Classico?","correctAnswer":"≥90% Sangiovese, single estate/vineyard fruit, ≥30 months ageing, may name a UGA","distractors":["≥60% Sangiovese with 12 months ageing","Any blend with no minimum Sangiovese","100% international varieties from a single estate"]},{"id":"chianti-classico-Q3","kp":"CHIANTI-CLASSICO-F06","question":"Which soils are associated with Chianti Classico's aromatic, age-worthy wines?","correctAnswer":"Galestro (crumbly marl) and alberese (limestone-clay)","distractors":["Llicorella slate and quartzite","Volcanic ash and lava","Kimmeridgian fossil limestone"]},{"id":"chianti-classico-Q4","kp":"CHIANTI-CLASSICO-R03","question":"How does Chianti Classico's warm but altitude-cooled climate shape Sangiovese?","correctAnswer":"Slow ripening keeps high acidity and tannin, giving savoury, sour-cherry reds that age well","distractors":["Fast ripening gives soft, low-acid jammy reds","Cool maritime air gives pale, light wines","Heat raisins the fruit for sweet wines"]}]},{"id":"brunello-di-montalcino","title":"Brunello di Montalcino","alt":"Italy · Tuscany · 100% Sangiovese","country":"Italy","flag":"🇮🇹","blurb":"Tuscany's most powerful Sangiovese — ripe, structured, long-aged wine from the warm, dry hills of Montalcino.","source":"4__ItalyGreece.pdf","climate":{"label":"Warm Mediterranean (warmest/driest in Tuscany)","scores":{"warmth":5,"sun":5,"rain":1,"diurnal":3,"risk":2}},"style":{"red":100},"grapes":[{"name":"Sangiovese","color":"r","pct":100}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["South of Siena in southern Tuscany; the warmest and driest of all Tuscany's DOCG zones.","Monte Amiata to the south shelters it from rain, yet rainfall stays adequate.","Largely hilly, with cooling night breezes off the Mediterranean (40 km away) that preserve acidity.","Northern sites are higher (>500 m) on aromatic galestro; southern sites are lower, warmer, on more clay."],"kkps":[],"checks":[]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Warm, dry, sunny conditions with cooling sea breezes at night → Sangiovese ripens fully while keeping high acidity → intense, ripe sour-cherry reds, full-bodied with high tannins and great ageing potential.","Higher northern galestro soils → more aromatic wines; lower southern clay → fuller-bodied.","The single-variety rule (100% Sangiovese) makes site and ripeness expression especially clear.","Long ageing develops complex tertiary notes."],"kkps":[{"id":"BRUNELLO-DI-MONTALCINO-R01","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Warm, dry, sunny conditions with cooling sea breezes at night → Sangiovese ripens fully while keeping high acidity → intense, ripe sour-cherry reds, full-bodied with high tannins and great ageing potential."},{"id":"BRUNELLO-DI-MONTALCINO-R02","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Higher northern galestro soils → more aromatic wines; lower southern clay → fuller-bodied."}],"checks":[{"kp":"BRUNELLO-DI-MONTALCINO-R01","type":"explain","prompt":"Starting from “Warm, dry, sunny conditions with cooling sea breezes at night”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Sangiovese ripens fully while keeping high acidity","intense, ripe sour-cherry reds, full-bodied with high tannins and great ageing potential"]},{"kp":"BRUNELLO-DI-MONTALCINO-R02","type":"explain","prompt":"Starting from “Higher northern galestro soils”, explain what this leads to — through to the resulting wine style.","requiredPoints":["more aromatic wines; lower southern clay","fuller-bodied"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["A long, warm season allows full skin and seed ripeness for structured wines.","Cooling night breezes are essential to retain freshness in this hot zone.","Massive expansion since the 1970s (from 65 ha to ~2,100 ha).","Extended maturation in (mostly) large-format oak, with some new French oak experimentation.","Powerful, age-worthy style with intense ripe fruit and firm tannins (e.g. Casanova di Neri, Soldera).","Rosso di Montalcino DOC is the earlier-drinking, declassified counterpart."],"kkps":[{"id":"BRUNELLO-DI-MONTALCINO-F03","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"100% Sangiovese, aged until 1 January 4 years after harvest with ≥2 years in oak (Riserva 5 years, ≥2 in oak)."}],"checks":[{"kp":"BRUNELLO-DI-MONTALCINO-F03","type":"flash","question":"What are Brunello di Montalcino's grape and ageing rules?","answer":"100% Sangiovese, aged until 1 January 4 years after harvest with ≥2 years in oak (Riserva 5 years, ≥2 in oak)."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Brunello di Montalcino DOCG is 100% Sangiovese; aged until 1 January 4 years after harvest, with ≥2 years in oak; Riserva 5 years (≥2 in oak).","Rosso di Montalcino DOC (same area, 100% Sangiovese) can be sold after 1 year and allows declassification in difficult vintages."],"kkps":[{"id":"BRUNELLO-DI-MONTALCINO-F04","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"It is the warmest, driest Tuscan DOCG, but cooling night breezes off the Mediterranean preserve acidity → intense, ripe Sangiovese with high tannins and ageing potential."},{"id":"BRUNELLO-DI-MONTALCINO-F05","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Same area and grape (100% Sangiovese) but shorter ageing (sellable after 1 year), from younger vines/lesser sites, and a declassification outlet in poor vintages."}],"checks":[{"kp":"BRUNELLO-DI-MONTALCINO-F04","type":"flash","question":"Why is Brunello so ripe yet still fresh?","answer":"It is the warmest, driest Tuscan DOCG, but cooling night breezes off the Mediterranean preserve acidity → intense, ripe Sangiovese with high tannins and ageing potential."},{"kp":"BRUNELLO-DI-MONTALCINO-F05","type":"flash","question":"How does Rosso di Montalcino relate to Brunello?","answer":"Same area and grape (100% Sangiovese) but shorter ageing (sellable after 1 year), from younger vines/lesser sites, and a declassification outlet in poor vintages."}]}],"blind":[{"id":"BRUNELLO-BLIND-1","tastingProfile":"Red wine. Medium-to-deep ruby, garnet at rim. Pronounced ripe sour cherry, red plum, dried herbs, leather and savoury earth with cedar oak. Dry, high acidity, high tannins, medium-plus alcohol, full body, intense ripe red fruit, long finish.","deduce":["Grape: Sangiovese","Climate: warm (warm Mediterranean, with cooling night breezes)","Region: Brunello di Montalcino (Tuscany, Italy)"],"justifyWith":["High acid + high tannin + sour cherry + savoury earth/leather → Sangiovese","Ripe, intense fruit and full body while keeping high acidity → warm, dry Montalcino cooled by night breezes","Garnet rim with dried-herb/leather development → the long oak/bottle ageing required for Brunello"]}],"quiz":[{"id":"brunello-di-montalcino-Q1","kp":"BRUNELLO-DI-MONTALCINO-F03","question":"What are the grape and ageing requirements for Brunello di Montalcino?","correctAnswer":"100% Sangiovese, aged until 1 January 4 years after harvest with at least 2 years in oak","distractors":["A Bordeaux blend aged 18 months in oak","85% Sangiovese aged 1 year total","100% Aglianico aged 3 years"]},{"id":"brunello-di-montalcino-Q2","kp":"BRUNELLO-DI-MONTALCINO-F04","question":"How is Montalcino characterised within Tuscany?","correctAnswer":"The warmest, driest Tuscan DOCG, with cooling night breezes preserving acidity","distractors":["The coolest, wettest Tuscan zone","A high alpine region too cold for Sangiovese","A coastal Bordeaux-blend appellation"]},{"id":"brunello-di-montalcino-Q3","kp":"BRUNELLO-DI-MONTALCINO-F05","question":"How does Rosso di Montalcino differ from Brunello?","correctAnswer":"Same area and 100% Sangiovese but shorter ageing (sellable after 1 year), from younger vines/lesser sites","distractors":["A different grape (Cabernet) aged longer","A sweet, fortified version of Brunello","A sparkling wine from the same zone"]},{"id":"brunello-di-montalcino-Q4","kp":"BRUNELLO-DI-MONTALCINO-R02","question":"How do Montalcino's soils affect wine style?","correctAnswer":"Higher northern galestro gives more aromatic wines; lower southern clay gives fuller-bodied wines","distractors":["Sandy soils give pale, light wines everywhere","Volcanic soils give oxidative, nutty wines","Limestone gives sweet botrytised wines"]}]},{"id":"bolgheri","title":"Bolgheri","alt":"Italy · Tuscany · Bordeaux blends","country":"Italy","flag":"🇮🇹","blurb":"The home of the 'Super Tuscans' — ripe, structured Cabernet/Merlot blends on the Tuscan coast.","source":"4__ItalyGreece.pdf","climate":{"label":"Warm Mediterranean (maritime)","scores":{"warmth":4,"sun":4,"rain":2,"diurnal":3,"risk":2}},"style":{"red":90,"white":10},"grapes":[{"name":"Cabernet Sauvignon","color":"r","pct":45},{"name":"Merlot","color":"r","pct":30},{"name":"Cabernet Franc","color":"r","pct":10},{"name":"Syrah & others","color":"r","pct":15}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["On the Tuscan coast; a warm Mediterranean climate with a strong maritime influence.","Sea wind blows through the year; rainfall is sufficient and even, with little at harvest (irrigation is allowed).","Varied soils — alluvial with round pebbles, plus limestone, clay and sand.","Only recognised as a DOC since 1983, after the success of estate 'Super Tuscans'."],"kkps":[],"checks":[]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Warm, sunny, maritime conditions → Bordeaux varieties ripen fully → deeply coloured, ripe blackberry/red-plum reds, full-bodied with high tannins, sometimes a green bell-pepper note in cooler years.","The sea wind and even rainfall give healthy, consistent ripening.","Cabernet Sauvignon leads, filled out by Merlot and Cabernet Franc, with oak adding vanilla and sweet spice.","Wines are built for structure and ageing rather than local tradition."],"kkps":[{"id":"BOLGHERI-R01","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Warm, sunny, maritime conditions → Bordeaux varieties ripen fully → deeply coloured, ripe blackberry/red-plum reds, full-bodied with high tannins, sometimes a green bell-pepper note in cooler years."}],"checks":[{"kp":"BOLGHERI-R01","type":"explain","prompt":"Starting from “Warm, sunny, maritime conditions”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Bordeaux varieties ripen fully","deeply coloured, ripe blackberry/red-plum reds, full-bodied with high tannins, sometimes a green bell-pepper note in cooler years"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Cordon-trained, spur-pruned with VSP at high density (~6,000 vines/ha) for high-quality fruit.","Irrigation is permitted to manage the dry, warm season.","Ten largest producers hold ~70% of the vineyards.","Matured in French oak with a high % of new oak (especially the Superiore).","Bolgheri Rosso released after 1 year; Superiore aged 2 years (1 in oak).","Sassicaia has its own DOC (≥80% Cabernet Sauvignon) for the single estate Tenuta San Guido."],"kkps":[{"id":"BOLGHERI-F02","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Its warm, sunny, maritime climate ripens Cabernet and Merlot fully → deeply coloured, full-bodied, age-worthy Bordeaux-style blends."},{"id":"BOLGHERI-F03","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Bordeaux blends — Cabernet Sauvignon (up to 100%), Cabernet Franc, Merlot, plus <50% Syrah/Sangiovese."}],"checks":[{"kp":"BOLGHERI-F02","type":"flash","question":"Why does Bolgheri suit Bordeaux varieties?","answer":"Its warm, sunny, maritime climate ripens Cabernet and Merlot fully → deeply coloured, full-bodied, age-worthy Bordeaux-style blends."},{"kp":"BOLGHERI-F03","type":"flash","question":"What grapes define Bolgheri DOC reds?","answer":"Bordeaux blends — Cabernet Sauvignon (up to 100%), Cabernet Franc, Merlot, plus <50% Syrah/Sangiovese."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Bolgheri DOC reds are Bordeaux blends (up to 100% Cabernet Sauvignon; Cabernet Franc, Merlot; <50% Syrah/Sangiovese).","Many top wines are bottled instead as Toscana IGT (e.g. Masseto, Solaia)."],"kkps":[{"id":"BOLGHERI-F04","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"It has its own DOC for the single estate Tenuta San Guido, requiring ≥80% Cabernet Sauvignon."}],"checks":[{"kp":"BOLGHERI-F04","type":"flash","question":"What is special about Bolgheri Sassicaia?","answer":"It has its own DOC for the single estate Tenuta San Guido, requiring ≥80% Cabernet Sauvignon."}]}],"blind":[{"id":"BOLGHERI-BLIND-1","tastingProfile":"Red wine. Deep ruby. Pronounced ripe blackberry, black plum, blackcurrant with cedar, sweet spice and vanilla oak. Dry, medium-plus acidity, high ripe tannin, medium-plus to high alcohol, full body, long finish.","deduce":["Grape: Cabernet Sauvignon (-Merlot/Franc blend)","Climate: warm (Mediterranean maritime)","Region: Bolgheri (Tuscany, Italy)"],"justifyWith":["Ripe black fruit + cedar + high tannin → Cabernet-led Bordeaux blend","Full body, ripe fruit and higher alcohol → warm, sunny Mediterranean coast","Polished, deeply coloured 'Super Tuscan' style with new oak → Bolgheri rather than Bordeaux"]}],"quiz":[{"id":"bolgheri-Q1","kp":"BOLGHERI-F03","question":"What grapes make a typical Bolgheri red?","correctAnswer":"Bordeaux blends — Cabernet Sauvignon, Cabernet Franc and Merlot (plus <50% Syrah/Sangiovese)","distractors":["Sangiovese with Canaiolo and Colorino","Nebbiolo with Barbera","Grenache, Syrah and Mourvèdre"]},{"id":"bolgheri-Q2","kp":"BOLGHERI-F02","question":"How does Bolgheri's warm, maritime climate shape its wines?","correctAnswer":"It ripens Cabernet and Merlot fully, giving deeply coloured, full-bodied, age-worthy Bordeaux-style blends","distractors":["It under-ripens the grapes, giving lean, herbaceous wines","It gives pale, high-acid wines suited to rosé","It forces early picking to avoid jammy over-ripeness"]},{"id":"bolgheri-Q3","kp":"BOLGHERI-F04","question":"What is distinctive about the Sassicaia DOC?","correctAnswer":"It is a DOC for the single estate Tenuta San Guido, requiring at least 80% Cabernet Sauvignon","distractors":["It is a region-wide DOCG requiring 100% Sangiovese","It is a DOC reserved for white wines only","It bans all Cabernet Sauvignon in favour of Merlot"]},{"id":"bolgheri-Q4","kp":"BOLGHERI-R01","question":"Which flavour note can appear in Bolgheri reds in cooler years?","correctAnswer":"A green bell-pepper (pyrazine) note","distractors":["A nutty, oxidative flor character","A petrol/kerosene note","A botrytis honey-and-marmalade note"]}]},{"id":"soave","title":"Soave","alt":"Italy · Veneto · Garganega","country":"Italy","flag":"🇮🇹","blurb":"Veneto's benchmark white — fresh, almond-and-apple Garganega, from high-volume plains to age-worthy hills.","source":"4__ItalyGreece.pdf","climate":{"label":"Moderate continental","scores":{"warmth":3,"sun":3,"rain":3,"diurnal":3,"risk":3}},"style":{"white":100},"grapes":[{"name":"Garganega","color":"w","pct":80},{"name":"Trebbiano di Soave / Chardonnay","color":"w","pct":20}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["East of Verona in the Veneto, split between flat plains in the south (near the Adige) and hills to the north.","A moderate continental climate; fog on the plain raises rot risk.","Plain soils are fertile, sandy and alluvial; hill soils are less fertile limestone and volcanic.","Cool soils and altitude on the hills slow ripening."],"kkps":[{"id":"SOAVE-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"The cooler, less fertile hills ripen Garganega slowly with high acidity and concentration → more intense whites that can age, versus simpler, early-drinking plain wines."}],"checks":[{"kp":"SOAVE-F01","type":"flash","question":"Why are hillside Soave wines more intense and age-worthy than plain Soave?","answer":"The cooler, less fertile hills ripen Garganega slowly with high acidity and concentration → more intense whites that can age, versus simpler, early-drinking plain wines."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cooler, less fertile hillsides → Garganega ripens slowly with high acidity and concentration → more intense, age-worthy whites (lemon, apple/pear, white pepper, almond).","Fertile plains → simpler, medium-acid wines for early drinking.","Garganega is late-ripening, vigorous and high-yielding, but can give full-flavoured wines even at fair yields.","Best hill examples age to almond and honey."],"kkps":[{"id":"SOAVE-R02","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Cooler, less fertile hillsides → Garganega ripens slowly with high acidity and concentration → more intense, age-worthy whites (lemon, apple/pear, white pepper, almond)."},{"id":"SOAVE-R03","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Fertile plains → simpler, medium-acid wines for early drinking."}],"checks":[{"kp":"SOAVE-R02","type":"explain","prompt":"Starting from “Cooler, less fertile hillsides”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Garganega ripens slowly with high acidity and concentration","more intense, age-worthy whites (lemon, apple/pear, white pepper, almond)"]},{"kp":"SOAVE-R03","type":"explain","prompt":"Starting from “Fertile plains”, explain what this leads to — through to the resulting wine style.","requiredPoints":["simpler, medium-acid wines for early drinking"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Garganega has very thick skins but is not disease-resistant (mildew, BBR) and is cold-sensitive.","Historically on pergola, now mostly trellised.","Yield control on the hills is key to quality.","Plain Soave: cool stainless-steel fermentation, brief lees ageing, released young.","Hill/Superiore: warmer fermentation, natural yeast, foudre, longer lees ageing (6–9 months).","Recioto di Soave DOCG is the sweet, appassimento (semi-dried-grape) version."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Soave DOC requires ≥70% Garganega (up to 30% Trebbiano di Soave/Chardonnay); Classico comes from the historic hills.","Soave Superiore DOCG has lower yields (70 hL/ha) and longer lees ageing; 33 named single vineyards (MGAs) approved in 2020."],"kkps":[{"id":"SOAVE-F04","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"≥70% Garganega, with up to 30% Trebbiano di Soave (Verdicchio) or Chardonnay."},{"id":"SOAVE-F05","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"The sweet appassimento (semi-dried-grape) version of Soave (DOCG)."},{"id":"SOAVE-F06","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"The wine comes from the original hilly historic zone."}],"checks":[{"kp":"SOAVE-F04","type":"flash","question":"What is the grape requirement for Soave DOC?","answer":"≥70% Garganega, with up to 30% Trebbiano di Soave (Verdicchio) or Chardonnay."},{"kp":"SOAVE-F05","type":"flash","question":"What is Recioto di Soave?","answer":"The sweet appassimento (semi-dried-grape) version of Soave (DOCG)."},{"kp":"SOAVE-F06","type":"flash","question":"What does 'Classico' mean on a Soave label?","answer":"The wine comes from the original hilly historic zone."}]}],"blind":[{"id":"SOAVE-BLIND-1","tastingProfile":"White wine. Pale lemon. Medium-intensity lemon, green apple, pear and a distinctive bitter-almond note with a touch of white pepper, no oak. Dry, medium-plus acidity, medium alcohol, medium body, medium finish.","deduce":["Grape: Garganega","Climate: moderate","Region: Soave (Veneto, Italy)"],"justifyWith":["Lemon/apple/pear with a signature bitter-almond note → Garganega","Medium-plus acidity and medium body, unoaked → moderate continental hillside Soave","Restrained, fresh profile → Veneto white rather than a richer warm-climate style"]}],"quiz":[{"id":"soave-Q1","kp":"SOAVE-F04","question":"What is the minimum proportion of Garganega required in Soave?","correctAnswer":"At least 70% Garganega, with up to 30% Trebbiano di Soave or Chardonnay","distractors":["At least 85% Garganega","100% Garganega","At least 50% Garganega"]},{"id":"soave-Q2","kp":"SOAVE-R02","question":"Why do the cooler hillside sites produce more intense, age-worthy Soave?","correctAnswer":"Garganega ripens slowly there with high acidity and concentration","distractors":["The fertile soils boost yields and sugar levels","The warm plains speed up ripening","Irrigation increases berry size"]},{"id":"soave-Q3","kp":"SOAVE-F05","question":"What is Recioto di Soave?","correctAnswer":"The sweet appassimento (semi-dried-grape) version of Soave","distractors":["A fortified version of Soave","A traditional-method sparkling Soave","A rosé made from Garganega"]},{"id":"soave-Q4","kp":"SOAVE-F06","question":"What does the Soave Classico designation indicate?","correctAnswer":"The wine comes from the original hilly historic zone","distractors":["The wine is aged a minimum of five years","The wine is made by appassimento","The wine is 100% Garganega"]}]},{"id":"valpolicella","title":"Valpolicella & Amarone","alt":"Italy · Veneto · Corvina blends","country":"Italy","flag":"🇮🇹","blurb":"Veneto's red signature — from light, cherry Valpolicella to powerful, dried-grape Amarone.","source":"4__ItalyGreece.pdf","climate":{"label":"Warm-moderate continental","scores":{"warmth":4,"sun":3,"rain":3,"diurnal":3,"risk":3}},"style":{"red":100},"grapes":[{"name":"Corvina & Corvinone","color":"r","pct":70},{"name":"Rondinella","color":"r","pct":20},{"name":"Other (Molinara, etc.)","color":"r","pct":10}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["North of Verona between the mountains and (to the east) the sea; hazard is rain, as across the Veneto.","Northern foothills are cooler with limestone/volcanic soils; the flatter south is warmer with alluvial soils.","A warm-to-moderate continental climate.","Topography drives style: hills give concentration, plains give lighter, fruitier wines."],"kkps":[],"checks":[]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Cooler northern hills → Corvina keeps high acidity and structure → more concentrated wines; warmer alluvial south → fruitier, lower-acid, less concentrated wines.","Corvina (the lead grape) gives violet, red-cherry and red-plum fruit with low-to-medium tannin and high acidity, and its thick skins suit drying.","Appassimento (drying the grapes) → higher sugar, alcohol, colour, tannin and concentration → the powerful Amarone and sweet Recioto styles.","Corvinone and Rondinella add tannin, colour and sugar; Rondinella accumulates sugar fast (useful for Recioto)."],"kkps":[{"id":"VALPOLICELLA-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Drying the grapes concentrates sugar, colour, tannin and flavour and raises potential alcohol → the powerful dry Amarone and sweet Recioto styles."},{"id":"VALPOLICELLA-F02","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Both use semi-dried grapes; Amarone is dry/off-dry (≥14%, often 15%+), Recioto is sweet (~50 g/L residual sugar)."},{"id":"VALPOLICELLA-R03","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Cooler northern hills → Corvina keeps high acidity and structure → more concentrated wines; warmer alluvial south → fruitier, lower-acid, less concentrated wines."},{"id":"VALPOLICELLA-R04","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Appassimento (drying the grapes) → higher sugar, alcohol, colour, tannin and concentration → the powerful Amarone and sweet Recioto styles."}],"checks":[{"kp":"VALPOLICELLA-F01","type":"flash","question":"How does appassimento change the wine?","answer":"Drying the grapes concentrates sugar, colour, tannin and flavour and raises potential alcohol → the powerful dry Amarone and sweet Recioto styles."},{"kp":"VALPOLICELLA-F02","type":"flash","question":"What is the difference between Amarone and Recioto?","answer":"Both use semi-dried grapes; Amarone is dry/off-dry (≥14%, often 15%+), Recioto is sweet (~50 g/L residual sugar)."},{"kp":"VALPOLICELLA-R03","type":"explain","prompt":"Starting from “Cooler northern hills”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Corvina keeps high acidity and structure","more concentrated wines; warmer alluvial south","fruitier, lower-acid, less concentrated wines"]},{"kp":"VALPOLICELLA-R04","type":"explain","prompt":"Starting from “Appassimento (drying the grapes)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["higher sugar, alcohol, colour, tannin and concentration","the powerful Amarone and sweet Recioto styles"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Corvina suits the pergola system (shade prevents sunburn, good air circulation reduces disease).","Grapes for drying are picked healthy with open bunches, sometimes early (~11% potential) to keep acidity.","Drying lofts are carefully controlled for humidity, temperature and air movement over 3–4 months.","Basic Valpolicella: warm fermentation (20–25°C), short maceration, 6–8 months in steel/neutral oak for fresh, fruity wine.","Amarone: ~100 days drying, dry/off-dry, ≥14% (often 15%+), aged ≥2 years in oak (4 for Riserva).","Ripasso: new Valpolicella re-fermented on Amarone/Recioto skins → more colour, body, tannin and alcohol."],"kkps":[{"id":"VALPOLICELLA-F05","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"New Valpolicella re-fermented on the leftover skins of Amarone/Recioto → extra colour, body, tannin and alcohol."},{"id":"VALPOLICELLA-F06","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Corvina and/or Corvinone 45–95% of the blend, with Rondinella 5–30%."},{"id":"VALPOLICELLA-R07","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Ripasso: new Valpolicella re-fermented on Amarone/Recioto skins → more colour, body, tannin and alcohol."}],"checks":[{"kp":"VALPOLICELLA-F05","type":"flash","question":"What is Valpolicella Ripasso?","answer":"New Valpolicella re-fermented on the leftover skins of Amarone/Recioto → extra colour, body, tannin and alcohol."},{"kp":"VALPOLICELLA-F06","type":"flash","question":"What is the main grape requirement for Valpolicella?","answer":"Corvina and/or Corvinone 45–95% of the blend, with Rondinella 5–30%."},{"kp":"VALPOLICELLA-R07","type":"explain","prompt":"Starting from “Ripasso: new Valpolicella re-fermented on Amarone/Recioto skins”, explain what this leads to — through to the resulting wine style.","requiredPoints":["more colour, body, tannin and alcohol"]}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["The wines are Corvina/Corvinone-dominant (45–95%) with Rondinella (5–30%); Recioto, Amarone and Ripasso are styles, not separate appellations.","Amarone della Valpolicella DOCG: dry/off-dry semi-dried-grape wine (Molinara forbidden); Recioto della Valpolicella DOCG: the sweet version (~50 g/L RS)."],"kkps":[],"checks":[]}],"blind":[{"id":"VALPOLICELLA-BLIND-1","tastingProfile":"Red wine. Deep ruby with garnet. Pronounced dried cherry, fig, raisin and dark chocolate with a warming, bittersweet edge. Off-dry to dry, medium-plus acidity, medium-plus tannin, very high alcohol (15%+), full body, long finish.","deduce":["Grape: Corvina (with Corvinone/Rondinella)","Climate: moderate","Region: Valpolicella / Amarone (Veneto, Italy)"],"justifyWith":["Dried cherry/raisin + very high alcohol + concentration → appassimento (Amarone)","Retained high acidity and sour-cherry character → Corvina","Powerful dried-fruit style → Valpolicella appassimento, not a hot-climate dry red"]}],"quiz":[{"id":"valpolicella-Q1","kp":"VALPOLICELLA-F06","question":"Which grapes form the basis of the Valpolicella blend?","correctAnswer":"Corvina and/or Corvinone (45–95%) with Rondinella (5–30%)","distractors":["Sangiovese with Canaiolo","Nebbiolo with Barbera","Montepulciano with Sangiovese"]},{"id":"valpolicella-Q2","kp":"VALPOLICELLA-R04","question":"What is appassimento, the process behind Amarone and Recioto?","correctAnswer":"Drying the grapes to concentrate sugar, colour, tannin and flavour and raise potential alcohol","distractors":["Ageing under a veil of flor yeast","Fortifying the must with grape spirit","Fermenting whole bunches by carbonic maceration"]},{"id":"valpolicella-Q3","kp":"VALPOLICELLA-F02","question":"How do Amarone and Recioto differ, despite both using semi-dried grapes?","correctAnswer":"Amarone is dry/off-dry (≥14%, often 15%+); Recioto is sweet (~50 g/L residual sugar)","distractors":["Amarone is sweet; Recioto is dry","Both are sweet but differ only in colour","Amarone is fortified; Recioto is not"]},{"id":"valpolicella-Q4","kp":"VALPOLICELLA-R07","question":"How is Ripasso Valpolicella made?","correctAnswer":"New Valpolicella is re-fermented on the leftover skins of Amarone/Recioto for more colour, body, tannin and alcohol","distractors":["Grapes are dried before fermentation","The wine is aged in a solera system","Grape spirit is added to stop fermentation"]}]},{"id":"alto-adige","title":"Alto Adige","alt":"Italy · alpine whites & Pinot Noir","country":"Italy","flag":"🇮🇹","blurb":"A high-altitude alpine zone — crisp, varietally pure whites and elegant Pinot Noir, with German-speaking heritage.","source":"4__ItalyGreece.pdf","climate":{"label":"Mild alpine continental","scores":{"warmth":2,"sun":4,"rain":3,"diurnal":5,"risk":3}},"style":{"white":60,"red":40},"grapes":[{"name":"Pinot Grigio","color":"w","pct":18},{"name":"Gewürztraminer","color":"w","pct":14},{"name":"Chardonnay","color":"w","pct":13},{"name":"Pinot Bianco","color":"w","pct":12},{"name":"Schiava","color":"r","pct":13},{"name":"Lagrein & Pinot Noir","color":"r","pct":30}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["A mild alpine continental zone in the far north, with Austrian/German-speaking heritage; most vineyards are terraced and protected from cold winds by mountains.","Abundant sunshine (300 days) with a large diurnal range from cold mountain night air.","A wide variety of soils (volcanic porphyry, quartz/mica, dolomitic limestone).","Two main zones: warmer Bassa Atesina in the south, and Oltradige around Lake Caldaro."],"kkps":[{"id":"ALTO-ADIGE-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Its large diurnal range (warm days, cold mountain nights) lets grapes ripen while keeping high acidity and intensifying aromatics → fresh, precise varietal whites."},{"id":"ALTO-ADIGE-F02","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Higher altitude → Pinot Bianco, Müller-Thurgau, Pinot Noir; warmer valley floors → Schiava, Merlot, Cabernet."}],"checks":[{"kp":"ALTO-ADIGE-F01","type":"flash","question":"Why are Alto Adige's whites so crisp and aromatic?","answer":"Its large diurnal range (warm days, cold mountain nights) lets grapes ripen while keeping high acidity and intensifying aromatics → fresh, precise varietal whites."},{"kp":"ALTO-ADIGE-F02","type":"flash","question":"Which grapes suit the higher versus warmer sites in Alto Adige?","answer":"Higher altitude → Pinot Bianco, Müller-Thurgau, Pinot Noir; warmer valley floors → Schiava, Merlot, Cabernet."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["A large diurnal range (warm days, cold nights) → grapes ripen while retaining acidity and intensifying aromatics → crisp, aromatic, varietally precise whites and elegant reds.","High-altitude sites suit Pinot Bianco, Müller-Thurgau and Pinot Noir; warmer valley floors suit Schiava, Merlot and Cabernet.","Schiava gives pale, perfumed, light-bodied reds (violet, strawberry) with high acidity and low tannin; Lagrein is the tannic, acidic second red.","Whites are made fresh and aromatic to preserve fruit."],"kkps":[{"id":"ALTO-ADIGE-F03","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Pale, perfumed, light-bodied reds with violet and strawberry, high acidity and low tannin."},{"id":"ALTO-ADIGE-R04","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"A large diurnal range (warm days, cold nights) → grapes ripen while retaining acidity and intensifying aromatics → crisp, aromatic, varietally precise whites and elegant reds."}],"checks":[{"kp":"ALTO-ADIGE-F03","type":"flash","question":"Describe the Schiava style.","answer":"Pale, perfumed, light-bodied reds with violet and strawberry, high acidity and low tannin."},{"kp":"ALTO-ADIGE-R04","type":"explain","prompt":"Starting from “A large diurnal range (warm days, cold nights)”, explain what this leads to — through to the resulting wine style.","requiredPoints":["grapes ripen while retaining acidity and intensifying aromatics","crisp, aromatic, varietally precise whites and elegant reds"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Traditional pergola or Guyot; rising temperatures mean careful leaf management to avoid sunburn.","Steep, high sites require hand working including harvest.","Yields are slightly lower than neighbouring Trentino (~90 hL/ha).","Whites: low-temperature fermentation (12–15°C), selected yeast, stainless steel; lees ageing 4–6 months (mid) to 1 year (premium).","Top whites and reds (Lagrein, Pinot Noir) may see French barriques.","98% of production is DOC."],"kkps":[],"checks":[]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Alto Adige DOC Bianco needs ≥75% from Chardonnay/Pinot Bianco/Pinot Grigio (at least 2 varieties, none over 70%); single-variety wines ≥85%.","Wines carry the Südtirol logo; the Lago di Caldaro DOC is for Schiava."],"kkps":[],"checks":[]}],"blind":[{"id":"ALTO-BLIND-1","tastingProfile":"White wine. Pale lemon. Pronounced lychee, rose, ginger and exotic stone-fruit aromas. Dry to off-dry, medium acidity, medium-plus to high alcohol, medium-plus body, long finish.","deduce":["Grape: Gewürztraminer","Climate: cool","Region: Alto Adige (Italy)"],"justifyWith":["Pronounced lychee, rose and ginger → Gewürztraminer","Intense, precise aromatics with fresh acidity → large alpine diurnal range","Crisp, varietally pure expression → cool, high-altitude Alto Adige"]}],"quiz":[{"id":"alto-adige-Q1","kp":"ALTO-ADIGE-F01","question":"How does Alto Adige's large diurnal range shape its white wines?","correctAnswer":"Warm days ripen grapes while cold mountain nights keep high acidity and intensify aromatics, giving fresh, precise varietal whites","distractors":["Constant warmth gives soft, low-acid whites","Cool, foggy days give neutral, dilute whites","Heavy rainfall gives high-yield, simple whites"]},{"id":"alto-adige-Q2","kp":"ALTO-ADIGE-F03","question":"What style does the red grape Schiava produce in Alto Adige?","correctAnswer":"Pale, perfumed, light-bodied reds with violet and strawberry, high acidity and low tannin","distractors":["Deep, full-bodied, high-tannin reds for long ageing","Sweet, fortified dessert reds","Jammy, high-alcohol reds with low acidity"]},{"id":"alto-adige-Q3","kp":"ALTO-ADIGE-F02","question":"Which varieties suit Alto Adige's warmer valley floors?","correctAnswer":"Schiava, Merlot and Cabernet","distractors":["Pinot Bianco, Müller-Thurgau and Pinot Noir","Riesling, Grüner Veltliner and Savagnin","Nebbiolo, Barbera and Dolcetto"]},{"id":"alto-adige-Q4","kp":"ALTO-ADIGE-F02","question":"Which varieties are favoured at Alto Adige's higher altitudes?","correctAnswer":"Pinot Bianco, Müller-Thurgau and Pinot Noir","distractors":["Schiava, Merlot and Cabernet","Primitivo and Negroamaro","Garganega and Trebbiano"]}]},{"id":"collio","title":"Collio (Friuli)","alt":"Italy · premium whites & orange wine","country":"Italy","flag":"🇮🇹","blurb":"Friuli's premium white hills — textured single-variety whites and pioneering skin-contact orange wines.","source":"4__ItalyGreece.pdf","climate":{"label":"Warm maritime","scores":{"warmth":3,"sun":3,"rain":5,"diurnal":3,"risk":4}},"style":{"white":85,"red":15},"grapes":[{"name":"Pinot Grigio","color":"w","pct":24},{"name":"Sauvignon Blanc","color":"w","pct":16},{"name":"Friulano","color":"w","pct":15},{"name":"Ribolla Gialla","color":"w","pct":12},{"name":"Chardonnay","color":"w","pct":10},{"name":"Merlot & others","color":"r","pct":23}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["Hilly Collio in Friuli-Venezia Giulia, on the Slovenian border; a warm maritime climate where Adriatic warmth meets cooler Alpine air.","High rainfall (~1,400 mm) and humidity → disease pressure (organics are challenging); spring frost is a risk inland.","Premium fruit comes from hillside vineyards at 200–300 m with airflow and limestone 'ponca' (marl) soils.","Lower, more fertile plains nearby make higher-volume wine."],"kkps":[{"id":"COLLIO-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Hillside vineyards with airflow and free-draining ponca marl give lower yields and slow ripening → concentrated, fresh single-variety whites."},{"id":"COLLIO-F02","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"It has good disease resistance, important in the region's high rainfall (~1,400 mm)."},{"id":"COLLIO-R03","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"High rainfall (~1,400 mm) and humidity → disease pressure (organics are challenging); spring frost is a risk inland."}],"checks":[{"kp":"COLLIO-F01","type":"flash","question":"Why does Collio make concentrated, textured whites?","answer":"Hillside vineyards with airflow and free-draining ponca marl give lower yields and slow ripening → concentrated, fresh single-variety whites."},{"kp":"COLLIO-F02","type":"flash","question":"Why is Friulano favoured in Collio's humid climate?","answer":"It has good disease resistance, important in the region's high rainfall (~1,400 mm)."},{"kp":"COLLIO-R03","type":"explain","prompt":"Starting from “High rainfall (~1,400 mm) and humidity”, explain what this leads to — through to the resulting wine style.","requiredPoints":["disease pressure (organics are challenging); spring frost is a risk inland"]}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["Hillside sites with airflow and free-draining ponca marl → lower yields and slow ripening → concentrated, textured single-variety whites with freshness.","Friulano gives floral, apple-scented whites with medium-to-high alcohol and medium-plus acidity; Ribolla Gialla gives high-acid citrus/pepper.","The cooler north and lower pH → stable, hygienic conditions favouring orange (skin-contact) wines.","Most whites are made in stainless steel to preserve aromatics, sometimes lightly oaked."],"kkps":[{"id":"COLLIO-R04","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Hillside sites with airflow and free-draining ponca marl → lower yields and slow ripening → concentrated, textured single-variety whites with freshness."},{"id":"COLLIO-R05","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"The cooler north and lower pH → stable, hygienic conditions favouring orange (skin-contact) wines."}],"checks":[{"kp":"COLLIO-R04","type":"explain","prompt":"Starting from “Hillside sites with airflow and free-draining ponca marl”, explain what this leads to — through to the resulting wine style.","requiredPoints":["lower yields and slow ripening","concentrated, textured single-variety whites with freshness"]},{"kp":"COLLIO-R05","type":"explain","prompt":"Starting from “The cooler north and lower pH”, explain what this leads to — through to the resulting wine style.","requiredPoints":["stable, hygienic conditions favouring orange (skin-contact) wines"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Open canopy, Guyot VSP; good disease resistance matters in the high rainfall (Friulano is favoured for it).","Ribolla Gialla is grown on hillsides to curb its vigour.","Hand labour on the slopes.","From the 1960s: clean, unoaked whites in stainless steel.","Recent decades: experimentation with skin maceration, lees stirring and oak.","Orange wines: long skin maceration (8 days to many months) and long ageing in large oak (Gravner, Radikon)."],"kkps":[{"id":"COLLIO-F06","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Pioneering orange (skin-contact) wines — long maceration on white grape skins and long ageing in large oak (e.g. Gravner, Radikon)."}],"checks":[{"kp":"COLLIO-F06","type":"flash","question":"What is Collio known for besides varietal whites?","answer":"Pioneering orange (skin-contact) wines — long maceration on white grape skins and long ageing in large oak (e.g. Gravner, Radikon)."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Collio DOC is for single-variety whites (Friulano, Ribolla Gialla, Sauvignon, Chardonnay), max 77 hL/ha, moving toward DOCG.","Friuli Colli Orientali DOC permits >30% black varieties (esp. Merlot, Refosco)."],"kkps":[],"checks":[]}],"blind":[{"id":"COLLIO-BLIND-1","tastingProfile":"White wine. Medium lemon. Pronounced pear, white peach, almond and a savoury, herbal/textural note; little or no obvious oak. Dry, medium(+) acidity, medium alcohol, medium(+) body with a textured palate, medium(+) finish.","deduce":["Grape: Friulano","Climate: moderate","Region: Collio (Friuli, Italy)"],"justifyWith":["Pear, almond and a savoury, textured palate → Friulano","Concentration and freshness with medium(+) body → low-yield hillside ponca-marl sites","Fresh, textured single-variety white rather than aromatic or oaky → Collio's premium white hills"]}],"quiz":[{"id":"collio-Q1","kp":"COLLIO-F01","question":"How do Collio's hillside ponca-marl sites shape its whites?","correctAnswer":"Airflow and free-draining marl give lower yields and slow ripening, concentrating fresh single-variety whites","distractors":["Fertile valley soils give high yields of dilute wine","Chalk soils give neutral base wine for fortification","Lake humidity encourages botrytis sweet wines"]},{"id":"collio-Q2","kp":"COLLIO-F06","question":"What pioneering wine style is Collio known for?","correctAnswer":"Orange (skin-contact) wines with long maceration on white skins and ageing in large oak","distractors":["Botrytis sweet wines from noble rot","Fortified wines aged under flor","Sparkling wines made by the traditional method"]},{"id":"collio-Q3","kp":"COLLIO-R03","question":"What is the main viticultural challenge in Collio?","correctAnswer":"High rainfall (~1,400 mm) and humidity create disease pressure","distractors":["Severe summer drought stresses the vines","Extreme winter cold kills vinifera","Constant heat causes raisining"]},{"id":"collio-Q4","kp":"COLLIO-F02","question":"Why is good disease resistance valuable for grapes in Collio?","correctAnswer":"The region's high rainfall (~1,400 mm) brings significant disease pressure","distractors":["The hot, dry climate stresses thin-skinned grapes","The high altitude exposes vines to frost","The chalky soils encourage rot"]}]},{"id":"etna","title":"Etna","alt":"Italy · Sicily · volcanic Nerello Mascalese","country":"Italy","flag":"🇮🇹","blurb":"Sicily's high-altitude volcano — pale, perfumed, mineral Nerello Mascalese reds and racy Carricante whites.","source":"4__ItalyGreece.pdf","climate":{"label":"Mediterranean (high-altitude volcanic)","scores":{"warmth":3,"sun":4,"rain":3,"diurnal":5,"risk":3}},"style":{"red":70,"white":30},"grapes":[{"name":"Nerello Mascalese","color":"r","pct":60},{"name":"Carricante","color":"w","pct":22},{"name":"Nerello Cappuccio","color":"r","pct":10},{"name":"Catarratto","color":"w","pct":8}],"glossary":[],"crossref":[],"flags":[],"objectives":[{"id":"LO1","title":"Place & climate","statement":"By the end you can explain how location, climate and soils shape the wines here, and why.","narrative":["The slopes of Mount Etna in Sicily, with vineyards at 400–1,000 m on volcanic lava and ash soils (often 20–70% stones).","Altitude gives a very long growing season and a large diurnal range despite the Mediterranean latitude.","Most vineyards are on moderate-to-steep slopes worked by hand.","Some of the best wines come from very old vines (60–100 years)."],"kkps":[{"id":"ETNA-F01","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"High-altitude volcanic slopes with a large diurnal range ripen Nerello Mascalese slowly → pale, perfumed reds with high acidity and firm tannins."}],"checks":[{"kp":"ETNA-F01","type":"flash","question":"Why is Etna Rosso pale and high in acid like Nebbiolo or Pinot Noir?","answer":"High-altitude volcanic slopes with a large diurnal range ripen Nerello Mascalese slowly → pale, perfumed reds with high acidity and firm tannins."}]},{"id":"LO2","title":"Signature grapes","statement":"By the end you can identify the signature grapes and the styles and characters they give.","narrative":["High-altitude volcanic slopes with a large diurnal range → Nerello Mascalese ripens slowly with high acidity → pale, perfumed reds (red cherry, violet, herbal/earthy) with high acidity and firm tannins, akin to Nebbiolo or Pinot Noir.","Old vines and low yields at altitude → concentration and minerality.","Carricante grows successfully up to 1,000 m → racy, high-acid, lemon/green-apple whites (usually with malolactic to soften the acid).","Nerello Mascalese is early budding (frost risk) and late ripening (autumn-rain risk), so site selection is crucial."],"kkps":[{"id":"ETNA-F02","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"Etna Rosso ≥80% Nerello Mascalese (with Nerello Cappuccio); Etna Bianco ≥60% Carricante (with Catarratto)."},{"id":"ETNA-R03","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"High-altitude volcanic slopes with a large diurnal range → Nerello Mascalese ripens slowly with high acidity → pale, perfumed reds (red cherry, violet, herbal/earthy) with high acidity and firm tannins, akin to Nebbiolo or Pinot Noir."},{"id":"ETNA-R04","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Old vines and low yields at altitude → concentration and minerality."},{"id":"ETNA-R05","cat":"relationship","verified":true,"src":"4__ItalyGreece.pdf","statement":"Carricante grows successfully up to 1,000 m → racy, high-acid, lemon/green-apple whites (usually with malolactic to soften the acid)."}],"checks":[{"kp":"ETNA-F02","type":"flash","question":"What grapes define Etna Rosso and Etna Bianco?","answer":"Etna Rosso ≥80% Nerello Mascalese (with Nerello Cappuccio); Etna Bianco ≥60% Carricante (with Catarratto)."},{"kp":"ETNA-R03","type":"explain","prompt":"Starting from “High-altitude volcanic slopes with a large diurnal range”, explain what this leads to — through to the resulting wine style.","requiredPoints":["Nerello Mascalese ripens slowly with high acidity","pale, perfumed reds (red cherry, violet, herbal/earthy) with high acidity and firm tannins, akin to Nebbiolo or Pinot Noir"]},{"kp":"ETNA-R04","type":"explain","prompt":"Starting from “Old vines and low yields at altitude”, explain what this leads to — through to the resulting wine style.","requiredPoints":["concentration and minerality"]},{"kp":"ETNA-R05","type":"explain","prompt":"Starting from “Carricante grows successfully up to 1,000 m”, explain what this leads to — through to the resulting wine style.","requiredPoints":["racy, high-acid, lemon/green-apple whites (usually with malolactic to soften the acid)"]}]},{"id":"LO3","title":"Vineyard & winemaking","statement":"By the end you can explain how vineyard and cellar choices shape style and quality.","narrative":["Steep terraced sites demand hand work; de-leafing is timed to avoid sunburn or under-ripeness.","Coulure makes yields vary year to year.","Very old, ungrafted bush vines survive on the volcanic soils.","Reds: moderate maceration (10–15 days; some go much longer for smoother tannins), aged in large neutral oak or 500–600 L barrels rather than new small oak.","Carricante is often given malolactic and old oak for texture.","Quality reaches Q:3–4."],"kkps":[{"id":"ETNA-F06","cat":"fact","verified":true,"src":"4__ItalyGreece.pdf","statement":"It ripens successfully up to ~1,000 m, giving racy, high-acid lemon/green-apple whites (usually softened by malolactic)."}],"checks":[{"kp":"ETNA-F06","type":"flash","question":"Why is Carricante notable on Etna?","answer":"It ripens successfully up to ~1,000 m, giving racy, high-acid lemon/green-apple whites (usually softened by malolactic)."}]},{"id":"LO4","title":"Law, classification & style","statement":"By the end you can state the rules, classification tiers and resulting style/quality.","narrative":["Etna Rosso DOC requires ≥80% Nerello Mascalese (rest Nerello Cappuccio); Riserva 4 years (1 in wood).","Etna Bianco DOC requires ≥60% Carricante (blended with Catarratto)."],"kkps":[],"checks":[]}],"blind":[{"id":"ETNA-BLIND-1","tastingProfile":"Red wine. Pale-to-medium ruby. Pronounced red cherry, dried herbs, violet and earthy/smoky minerality with subtle oak. Dry, high acidity, high firm tannins, medium alcohol, medium body, long finish.","deduce":["Grape: Nerello Mascalese","Climate: moderate","Region: Etna (Italy/Sicily)"],"justifyWith":["Pale colour + perfumed red cherry + high acid + firm tannin → Nerello Mascalese (Nebbiolo/Pinot-like)","Earthy/smoky minerality → high-altitude volcanic slopes","Medium body with bright freshness → large diurnal range slowing ripening"]}],"quiz":[{"id":"etna-Q1","kp":"ETNA-F02","question":"What is the minimum Nerello Mascalese requirement for Etna Rosso?","correctAnswer":"At least 80% Nerello Mascalese (with Nerello Cappuccio)","distractors":["At least 60% Nerello Mascalese","100% Nerello Mascalese","At least 90% Carricante"]},{"id":"etna-Q2","kp":"ETNA-R03","question":"Which two grapes is Etna Rosso most often compared to in style?","correctAnswer":"Nebbiolo or Pinot Noir","distractors":["Syrah or Mourvèdre","Cabernet Sauvignon or Merlot","Tempranillo or Garnacha"]},{"id":"etna-Q3","kp":"ETNA-F06","question":"What style does Carricante give when grown up to ~1,000 m on Etna?","correctAnswer":"Racy, high-acid lemon/green-apple whites, usually softened by malolactic","distractors":["Rich, oaky, low-acid whites","Oxidative, nutty fortified whites","Sweet botrytised dessert whites"]},{"id":"etna-Q4","kp":"ETNA-R03","question":"What style of red does Etna's high-altitude volcanic slopes and large diurnal range produce?","correctAnswer":"Pale, perfumed reds (red cherry, violet, herbal) with high acidity and firm tannins","distractors":["Deep, jammy reds with soft tannins and high alcohol","Sweet, fortified reds","Light, low-tannin everyday reds"]}]},{"id":"taurasi","title":"Taurasi (Campania)","alt":"Italy · southern Italy · Aglianico","country":"Italy","flag":"🇮🇹","blurb":"Southern Italy's 'Barolo' — powerful, age-worthy Aglianico from the cool hills of Campania.","source":"4__ItalyGreece.pdf","climate":{"label":"Warm
